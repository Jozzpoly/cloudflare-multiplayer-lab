name: A2R Forecast Lab

on:
  push:
    branches: [world-slice-0-a2r-timeline-rebuild]

permissions:
  contents: read

jobs:
  forecast-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify browser Box3D dependency
        run: node scripts/a2r-browser-dependency-smoke.mjs

      - name: Verify browser fixed-step clock
        run: node scripts/a2r-fixed-step-clock-smoke.mjs

      - name: Probe browser input event timestamps
        run: node scripts/a2r-browser-event-timestamp-smoke.mjs

      - name: Run real local browser runtime smoke
        run: node scripts/a2r-browser-runtime-smoke.mjs

      - name: Run browser contact proxy smoke
        run: node scripts/a2r-browser-contact-smoke.mjs

      - name: Run temporal truth gate
        run: node scripts/a2r-temporal-truth-lab.mjs

      - name: Run stall/input-transition falsifier
        run: node scripts/a2r-stall-input-lab.mjs

      - name: Run owner prediction lab
        run: node scripts/a2r-owner-lab.mjs

      - name: Run full-world hybrid stress lab
        run: node scripts/a2r-hybrid-lab.mjs

      - name: Validate branch
        run: npm run check
