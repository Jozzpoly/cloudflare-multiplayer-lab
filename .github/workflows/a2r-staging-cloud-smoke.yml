name: A2R Staging Cloud Smoke

on:
  push:
    branches: [world-slice-0-a2r-timeline-rebuild]

permissions:
  contents: read

jobs:
  staging-cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify staging HTTP, WebSocket, ACK and prop contact
        run: node scripts/a2r-staging-cloud-smoke.mjs

      - name: Verify real Chrome against staging A2R
        run: node scripts/a2r-staging-browser-smoke.mjs
