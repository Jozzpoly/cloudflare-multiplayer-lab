name: A2R Two-Client Browser Probe

on:
  pull_request:
    paths:
      - "src/world-slice-0-two-client.ts"
      - "src/world-slice-entry.ts"
      - "public/world0-two-client/**"
      - "public/world0-a2r/fixed-step-clock.js"
      - "scripts/a2r-two-client-browser-smoke.mjs"
      - "package.json"
      - ".github/workflows/a2r-two-client-browser-smoke.yml"

permissions:
  contents: read

jobs:
  two-client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run real two-browser local causality smoke
        run: node scripts/a2r-two-client-browser-smoke.mjs
