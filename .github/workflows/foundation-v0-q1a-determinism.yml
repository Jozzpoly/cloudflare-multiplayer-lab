name: Foundation v0 Q1a Determinism

on:
  push:
    branches:
      - foundation-v0-q1-determinism-envelope
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1a-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run first-divergent-tick lab
        run: node scripts/foundation-v0-q1a-determinism.mjs
      - name: Upload Q1a evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-v0-q1a-determinism
          path: foundation-v0-q1a-determinism.json
          if-no-files-found: warn
          retention-days: 14
