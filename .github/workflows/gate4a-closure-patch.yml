name: Gate 4A closure patch

on:
  push:
    branches:
      - gate-4-shared-simulation-lab

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-4-shared-simulation-lab
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact closure fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/index.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    const input = normalizeVector(message.x, message.y);\n    player.inputX = input.x;\n    player.inputY = input.y;\n    player.lastInputAt = Date.now();\n    player.lastInputSeq = Math.max(player.lastInputSeq, message.seq);\n    player.dashQueued ||= message.dash;''',
                  '''    if (message.seq <= player.lastInputSeq) return;\n\n    const input = normalizeVector(message.x, message.y);\n    player.inputX = input.x;\n    player.inputY = input.y;\n    player.lastInputAt = Date.now();\n    player.lastInputSeq = message.seq;\n    player.dashQueued ||= message.dash;''',
              ),
              (
                  '''      const stepStartedAt = performance.now();\n      this.simulateStep(SIMULATION_STEP_MS / 1000, Date.now());\n      this.tick += 1;''',
                  '''      const stepStartedAt = performance.now();\n      this.tick += 1;\n      this.simulateStep(SIMULATION_STEP_MS / 1000, Date.now());''',
              ),
              (
                  '''    this.rates = { inputsPerSec: 0, snapshotsPerSec: 0, inboundBytesPerSec: 0, outboundBytesPerSec: 0 };\n    this.lastPumpAt = performance.now();''',
                  '''    this.rates = { inputsPerSec: 0, snapshotsPerSec: 0, inboundBytesPerSec: 0, outboundBytesPerSec: 0 };\n    this.activeRunStartedAt = Date.now();\n    this.lastPumpAt = performance.now();''',
              ),
              (
                  '''        this.runSeed = normalizeSeed(restored.runSeed);\n        this.runId = restored.runId || this.runId;\n        this.rngState = this.runSeed;''',
                  '''        this.runSeed = normalizeSeed(restored.runSeed);\n        this.runId = restored.runId || this.runId;\n        const restoredSerial = Number(this.runId.split("-").at(-1));\n        if (Number.isInteger(restoredSerial) && restoredSerial > 0) this.runSerial = restoredSerial;\n        this.rngState = this.runSeed;''',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"expected exactly one closure replacement, found {count}")
              text = text.replace(before, after, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/gate4a-closure-patch.yml

      - name: Validate patched source
        run: |
          npm install
          npm run check

      - name: Commit closure hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts .github/workflows/gate4a-closure-patch.yml
          git diff --cached --check
          git commit -m "fix: close Gate 4A simulation semantics"
          git push origin HEAD:gate-4-shared-simulation-lab
