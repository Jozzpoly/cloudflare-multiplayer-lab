name: MF6 input lead bootstrap diagnostic

on:
  push:
    branches:
      - research/multiplayer-foundation-v2-v28-dynamic-composition
    paths:
      - .github/workflows/mf6-input-lead-bootstrap-diagnostic.yml
      - scripts/mf6-input-lead-bootstrap-diagnostic.mjs

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lead: [8, 10, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start isolated Workerd authority
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9288 > mf6-bootstrap-workerd.log 2>&1 &
          echo $! > mf6-bootstrap-workerd.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "MF6_BOOTSTRAP_WORKER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat mf6-bootstrap-workerd.log
          exit 1
      - name: Diagnose cold browser bootstrap
        env:
          MF6_BOOTSTRAP_LEADS: "${{ matrix.lead }}"
          MF6_BOOTSTRAP_OUTPUT: "mf6-bootstrap-diagnostic-${{ matrix.lead }}.json"
        run: node scripts/mf6-input-lead-bootstrap-diagnostic.mjs | tee "mf6-bootstrap-diagnostic-${{ matrix.lead }}.log"
      - name: Stop isolated authority
        if: always()
        shell: bash
        run: |
          if [ -f mf6-bootstrap-workerd.pid ]; then
            pid="$(cat mf6-bootstrap-workerd.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mf6-input-lead-bootstrap-${{ matrix.lead }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            mf6-bootstrap-diagnostic-*.json
            mf6-bootstrap-diagnostic-*.log
            mf6-bootstrap-workerd.log
