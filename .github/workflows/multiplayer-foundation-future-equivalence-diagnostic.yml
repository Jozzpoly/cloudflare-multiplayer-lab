name: Multiplayer Foundation Future Equivalence Diagnostic

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-future-equivalence-diagnostic.yml
      - scripts/fixtures/multiplayer-foundation-future-diagnostic-worker.ts
      - scripts/multiplayer-foundation-future-equivalence-control.mjs
      - scripts/multiplayer-foundation-future-equivalence-midprogress.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect-control-future:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/multiplayer-foundation-future-equivalence-control.mjs

  midprogress-future:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node --experimental-strip-types scripts/multiplayer-foundation-future-equivalence-midprogress.mjs
