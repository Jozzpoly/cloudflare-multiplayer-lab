name: Multiplayer Foundation Mid-progress Oracle Diagnostic

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-midprogress-oracle-diagnostic.yml

permissions:
  contents: read

jobs:
  reconnect-control-future:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Add CI-only future-physics diagnostic endpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/multiplayer-foundation/replication-physics-test-worker.ts')
          text = path.read_text()
          needle = '''    if (this.worldId === null) {
      this.worldId = requestedWorldId;
      this.mode = modeForRun(run);
    }
    if (request.headers.get("Upgrade")?.toLowerCase() !== "websocket") return json(this.status());
'''
          replacement = '''    if (this.worldId === null) {
      this.worldId = requestedWorldId;
      this.mode = modeForRun(run);
    }
    if (url.searchParams.get("diagnosticFuture") === "1") {
      const roster = this.roster.snapshot();
      const topology = this.topology.snapshot();
      if (roster.currentTick !== 63 || this.completedContinuationTicks !== 60 || this.finalGuardPacked === null) {
        return json({ ok: false, error: "future_diagnostic_not_ready", status: this.status() }, 409);
      }
      const patterns: Record<string, ReadonlyArray<readonly [number, number]>> = {
        "actor:0": [[0.6, -0.8], [-1, 0], [0, 1], [0.8, 0.6]],
        "actor:1": [[-0.6, -0.8], [1, 0], [0, -1], [-0.8, 0.6]],
        "actor:2": [[1, 0], [0, 1], [-1, 0], [0, -1]],
      };
      const initialGuardPacked = this.physics.captureGuard(topology).packed;
      for (let diagnosticTick = 0; diagnosticTick < 60; diagnosticTick += 1) {
        const phase = Math.floor(diagnosticTick / 15);
        this.physics.step(roster.actors.map((actor) => {
          const vector = patterns[actor.actorId]?.[phase];
          if (!vector) throw new Error(`future diagnostic pattern missing ${actor.actorId}/${phase}`);
          return { actorId: actor.actorId, x: vector[0], z: vector[1] };
        }));
      }
      const futureGuardPacked = this.physics.captureGuard(topology).packed;
      const futureSeed = this.physics.captureSeed(WORLD_EPOCH, 123, topology);
      return json({
        ok: true,
        diagnosticRevision: "midprogress-future-physics-v1",
        sourceBoundaryTick: 63,
        futurePhysicsSteps: 60,
        initialGuardPacked,
        futureGuardPacked,
        futureSeedBytes: futureSeed.byteLength,
        futureSeedFnv1a32: futureSeed.fnv1a32,
      });
    }
    if (request.headers.get("Upgrade")?.toLowerCase() !== "websocket") return json(this.status());
'''
          assert needle in text
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Instrument passing reconnect control in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs')
          text = path.read_text()
          needle = '  console.log("MULTIPLAYER_FOUNDATION_HIBERNATION_RECOVERY_RECONNECT_PASS", JSON.stringify({\n'
          marker = '''  const futureResponse = await fetch(`${AUTHORITY_ORIGIN}/foundation-physics/status?run=${encodeURIComponent(RUN)}&diagnosticFuture=1`, { signal: AbortSignal.timeout(10_000) });
  const futureDiagnostic = await futureResponse.json();
  assert.equal(futureResponse.status, 200, JSON.stringify(futureDiagnostic));
  assert.equal(futureDiagnostic.ok, true);
  assert.equal(futureDiagnostic.initialGuardPacked, finalAuthority.finalGuardPacked);
  console.log("CONTROL_FUTURE_DIAGNOSTIC", JSON.stringify(futureDiagnostic));

'''
          assert needle in text
          path.write_text(text.replace(needle, marker + needle, 1))
          PY
      - name: Run control and hash future evidence
        shell: bash
        run: |
          node scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs 2>&1 | tee control-future.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prefix = 'CONTROL_FUTURE_DIAGNOSTIC '
          line = next(line for line in Path('control-future.log').read_text().splitlines() if line.startswith(prefix))
          value = json.loads(line[len(prefix):])
          print('CONTROL_INITIAL_GUARD_SHA256=' + hashlib.sha256(value['initialGuardPacked'].encode()).hexdigest())
          print('CONTROL_FUTURE_GUARD_SHA256=' + hashlib.sha256(value['futureGuardPacked'].encode()).hexdigest())
          print('CONTROL_FUTURE_SEED=' + str(value['futureSeedBytes']) + '/' + value['futureSeedFnv1a32'])
          PY

  midprogress-future:
