name: Multiplayer Foundation Mid-progress Oracle Diagnostic

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-midprogress-oracle-diagnostic.yml

permissions:
  contents: read

jobs:
  reconnect-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Instrument passing reconnect control in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs')
          text = path.read_text()
          needle = '    finalSeedBytes: finalAuthority.finalSeedBytes,\n'
          replacement = '    finalGuardPacked: finalAuthority.finalGuardPacked,\n' + needle
          assert needle in text
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Run passing hibernation reconnect control
        shell: bash
        run: |
          node scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs 2>&1 | tee reconnect-control.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prefix = 'MULTIPLAYER_FOUNDATION_HIBERNATION_RECOVERY_RECONNECT_PASS '
          line = next(line for line in Path('reconnect-control.log').read_text().splitlines() if line.startswith(prefix))
          value = json.loads(line[len(prefix):])
          print('CONTROL_GUARD_SHA256=' + hashlib.sha256(value['finalGuardPacked'].encode()).hexdigest())
          print('CONTROL_SEED=' + str(value['finalSeedBytes']) + '/' + value['finalSeedFnv1a32'])
          PY

  midprogress-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Instrument red mid-progress falsifier in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/multiplayer-foundation-midprogress-hibernation-probe.ts')
          text = path.read_text()
          needle = '  assert.equal(final.finalSeedBytes, EXPECTED_FINAL_SEED_BYTES);\n'
          marker = '''  console.log("MIDPROGRESS_ORACLE_DIAGNOSTIC", JSON.stringify({\n    finalGuardPacked: final.finalGuardPacked,\n    finalSeedBytes: final.finalSeedBytes,\n    finalSeedFnv1a32: final.finalSeedFnv1a32,\n  }));\n'''
          assert needle in text
          path.write_text(text.replace(needle, marker + needle, 1))
          PY
      - name: Observe existing mid-progress mismatch without promoting it to PASS
        shell: bash
        run: |
          set +e
          node --experimental-strip-types scripts/multiplayer-foundation-midprogress-hibernation-probe.ts 2>&1 | tee midprogress-oracle.log
          status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prefix = 'MIDPROGRESS_ORACLE_DIAGNOSTIC '
          line = next(line for line in Path('midprogress-oracle.log').read_text().splitlines() if line.startswith(prefix))
          value = json.loads(line[len(prefix):])
          print('MIDPROGRESS_GUARD_SHA256=' + hashlib.sha256(value['finalGuardPacked'].encode()).hexdigest())
          print('MIDPROGRESS_SEED=' + str(value['finalSeedBytes']) + '/' + value['finalSeedFnv1a32'])
          PY
          echo "MIDPROGRESS_EXISTING_RESULT_STATUS=$status"
          if [ "$status" -eq 0 ]; then
            echo "Historical red path unexpectedly passed; treat this as a finding, not as an assumed failure."
          fi
