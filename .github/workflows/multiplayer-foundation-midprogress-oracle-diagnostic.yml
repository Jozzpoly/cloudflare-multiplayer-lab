      - name: Instrument mid-progress path without changing its runtime history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/multiplayer-foundation-midprogress-hibernation-probe.ts')
          text = path.read_text()
          old_assert = '  assert.equal(final.finalSeedFnv1a32, EXPECTED_FINAL_SEED_FNV1A32);\n'
          replacement_assert = '  console.log("MIDPROGRESS_SEED_DIVERGENCE", JSON.stringify({ expected: EXPECTED_FINAL_SEED_FNV1A32, actual: final.finalSeedFnv1a32 }));\n'
          assert old_assert in text
          text = text.replace(old_assert, replacement_assert, 1)
          needle = '  console.log("MULTIPLAYER_FOUNDATION_MIDPROGRESS_HIBERNATION_RECOVERY_PASS", JSON.stringify({\n'
          marker = '''  const futureResponse = await fetch(`${ORIGIN}/foundation-physics/status?run=${encodeURIComponent(RUN)}&diagnosticFuture=1`, { signal: AbortSignal.timeout(10_000) });
  const futureDiagnostic: any = await futureResponse.json();
  assert.equal(futureResponse.status, 200, JSON.stringify(futureDiagnostic));
  assert.equal(futureDiagnostic.ok, true);
  assert.equal(futureDiagnostic.initialGuardPacked, final.finalGuardPacked);
  console.log("MIDPROGRESS_FUTURE_DIAGNOSTIC", JSON.stringify(futureDiagnostic));

