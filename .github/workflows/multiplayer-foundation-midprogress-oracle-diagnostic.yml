          assert needle in text
          path.write_text(text.replace(needle, marker + needle, 1))
          PY
      - name: Run mid-progress path and hash future evidence
        shell: bash
        run: |
          node --experimental-strip-types scripts/multiplayer-foundation-midprogress-hibernation-probe.ts 2>&1 | tee midprogress-future.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prefix = 'MIDPROGRESS_FUTURE_DIAGNOSTIC '
          line = next(line for line in Path('midprogress-future.log').read_text().splitlines() if line.startswith(prefix))
          value = json.loads(line[len(prefix):])
          print('MIDPROGRESS_INITIAL_GUARD_SHA256=' + hashlib.sha256(value['initialGuardPacked'].encode()).hexdigest())
          print('MIDPROGRESS_FUTURE_GUARD_SHA256=' + hashlib.sha256(value['futureGuardPacked'].encode()).hexdigest())
          print('MIDPROGRESS_FUTURE_SEED=' + str(value['futureSeedBytes']) + '/' + value['futureSeedFnv1a32'])
          PY
