name: Multiplayer foundation mid-progress hibernation recovery

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-*-physics-transport-probe.yml
      - package.json
      - package-lock.json
      - scripts/multiplayer-foundation-midprogress-hibernation-probe.ts
      - public/world-v0/box3d-i4/**
      - src/box3d-runtime.ts
      - src/world-v0-contract.ts
      - src/multiplayer-foundation/**
      - wrangler.foundation-replication-physics-test.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midprogress-hibernation-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Qualify arbitrary-progress hibernation and final checkpoint rehydration
        run: node --experimental-strip-types scripts/multiplayer-foundation-midprogress-hibernation-probe.ts
