name: Multiplayer foundation progress overlay probe

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-progress-overlay-probe.yml
      - scripts/multiplayer-foundation-progress-overlay-smoke.ts
      - src/multiplayer-foundation/replication-progress-overlay.ts
      - src/multiplayer-foundation/actor-input-registry.ts
      - src/multiplayer-foundation/replication-live-checkpoint.ts
      - src/multiplayer-foundation/replication-protocol.ts
      - src/multiplayer-foundation/roster-machine.ts
      - src/multiplayer-foundation/entity-topology.ts
      - src/multiplayer-foundation/checkpoint-digest.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run bounded progress overlay falsifier
        run: node --experimental-strip-types scripts/multiplayer-foundation-progress-overlay-smoke.ts
