name: Multiplayer foundation reconnect physics transport probe

on:
  push:
    branches:
      - research/multiplayer-foundation-v1-2026-09-13
    paths:
      - .github/workflows/multiplayer-foundation-reconnect-physics-transport-probe.yml
      - scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs
      - scripts/fixtures/multiplayer-foundation-browser-reconnect-physics-client.mjs
      - src/box3d-runtime.ts
      - src/world-v0-contract.ts
      - src/multiplayer-foundation/replication-physics-runtime.ts
      - src/multiplayer-foundation/replication-physics-test-worker.ts
      - src/multiplayer-foundation/replication-protocol.ts
      - src/multiplayer-foundation/client-bootstrap.ts
      - src/multiplayer-foundation/client-runtime-bootstrap.ts
      - src/multiplayer-foundation/client-box3d-runtime.ts
      - src/multiplayer-foundation/client-input-ledger.ts
      - src/multiplayer-foundation/client-replica-model.ts
      - src/multiplayer-foundation/entity-topology.ts
      - src/multiplayer-foundation/roster-machine.ts
      - src/multiplayer-foundation/actor-input-registry.ts
      - src/multiplayer-foundation/state-guard.ts
      - tsconfig.multiplayer-foundation-browser.json
      - wrangler.foundation-replication-physics-test.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect-physics-transport-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run controlled ActorSession reconnect + shared Box3D convergence specimen
        run: node scripts/multiplayer-foundation-local-reconnect-physics-transport-smoke.mjs
