name: Multiplayer Foundation V2 adaptive input lead discriminator

concurrency:
  group: multiplayer-foundation-v2-adaptive-input-lead-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/multiplayer-foundation-v2-v28-dynamic-composition
    paths:
      - public/world-v0/app.js
      - scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs
      - scripts/multiplayer-foundation-v2-v28-adaptive-input-lead.mjs
      - .github/workflows/multiplayer-foundation-v2-adaptive-input-lead.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  specimen:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        replicate: [a, b, c, d]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start isolated Workerd authority
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9288 > mf6-adaptive-workerd.log 2>&1 &
          echo $! > mf6-adaptive-workerd.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "MF6_ADAPTIVE_WORKER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat mf6-adaptive-workerd.log
          exit 1
      - name: Run adaptive L8 to L14 specimen
        env:
          REP: ${{ matrix.replicate }}
          MW_MF6_LATENCY_BASE: http://127.0.0.1:8787
          MW_MF6_ADAPTIVE_INPUT_LEAD_PROBE: "1"
          MW_MF6_INPUT_ESTIMATE_CEILING_PROBE: "1"
        shell: bash
        run: |
          set -euo pipefail
          run_key="mad$REP-${{ github.run_id }}"
          output="mf6-adaptive-$REP.json"
          if [ "${#run_key}" -gt 20 ]; then
            echo "MF6_SPECIMEN_RUN_KEY_INVALID length=${#run_key} key=$run_key"
            exit 1
          fi
          set +e
          MW_MF6_LATENCY_RUN="$run_key" \
          MW_MF6_LATENCY_OUTPUT="$output" \
          MW_MF6_LATENCY_PROXY_PORT=8792 \
          timeout 210s node scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs \
            | tee "mf6-adaptive-$REP.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "MF6_ADAPTIVE_SPECIMEN-$REP-STATUS=$status"
          test -f "$output"
      - name: Stop isolated authority
        if: always()
        shell: bash
        run: |
          if [ -f mf6-adaptive-workerd.pid ]; then
            pid="$(cat mf6-adaptive-workerd.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mf6-adaptive-${{ matrix.replicate }}
          if-no-files-found: error
          path: |
            mf6-adaptive-*.json
            mf6-adaptive-*.log
            mf6-adaptive-workerd.log

  aggregate:
    needs: specimen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: mf6-adaptive-*
          merge-multiple: true
      - name: Aggregate adaptive discriminator
        run: |
          node scripts/multiplayer-foundation-v2-v28-adaptive-input-lead.mjs \
            mf6-adaptive-a.json mf6-adaptive-b.json mf6-adaptive-c.json mf6-adaptive-d.json \
            mf6-adaptive-discriminator.json | tee mf6-adaptive-discriminator.log
      - uses: actions/upload-artifact@v6
        with:
          name: multiplayer-foundation-v2-adaptive-input-lead-${{ github.run_id }}
          path: |
            mf6-adaptive-discriminator.json
            mf6-adaptive-discriminator.log
