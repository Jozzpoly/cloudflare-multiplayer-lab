name: Multiplayer Foundation V2 dynamic composition

concurrency:
  group: multiplayer-foundation-v2-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/multiplayer-foundation-v2-v28-dynamic-composition
    paths:
      - src/world-v0-shared-yard.ts
      - public/world-v0/app.js
      - scripts/multiplayer-foundation-v2-v28-dynamic-authority-smoke.mjs
      - scripts/multiplayer-foundation-v2-v28-browser-composition.mjs
      - scripts/multiplayer-foundation-v2-v28-browser-n-input-composition.mjs
      - scripts/multiplayer-foundation-v2-v28-browser-active-churn-composition.mjs
      - scripts/multiplayer-foundation-v2-v28-browser-active-impairment.mjs
      - scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs
      - scripts/multiplayer-foundation-v2-v28-input-lead-discriminator.mjs
      - scripts/multiplayer-foundation-v2-blocking-tcp-proxy.mjs
      - scripts/multiplayer-foundation-v2-shaped-tcp-proxy.mjs
      - scripts/multiplayer-foundation-v2-transport-proxy.mjs
      - .github/workflows/multiplayer-foundation-v2-dynamic-composition.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Repository regression gate
        run: npm run check

      - name: Start isolated Workerd authority
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9288 > mf6-workerd.log 2>&1 &
          echo $! > mf6-workerd.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "MF6_WORKER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat mf6-workerd.log
          exit 1

      - name: Current V28 x dynamic 1-to-6 composition gate
        env:
          MW_MF6_BASE: http://127.0.0.1:8787
          MW_MF6_RUN: mf6-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s node scripts/multiplayer-foundation-v2-v28-dynamic-authority-smoke.mjs | tee mf6-v28.log
          grep -q MF6_V28_DYNAMIC_AUTHORITY_PASS mf6-v28.log

      - name: Real Chromium self plus N composition gate
        env:
          MW_MF6_BROWSER_BASE: http://127.0.0.1:8787
          MW_MF6_BROWSER_RUN: m6b${{ github.run_id }}
          MW_MF6_BROWSER_OUTPUT: mf6-browser-composition.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/multiplayer-foundation-v2-v28-browser-composition.mjs | tee mf6-browser.log
          grep -q MF6_V28_BROWSER_COMPOSITION_PASS mf6-browser.log

      - name: Qualify browser self plus N input composition
        env:
          MW_MF6_N_INPUT_BASE: http://127.0.0.1:8787
          MW_MF6_N_INPUT_RUN: m6n${{ github.run_id }}
          MW_MF6_N_INPUT_OUTPUT: mf6-browser-n-input-composition.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s node scripts/multiplayer-foundation-v2-v28-browser-n-input-composition.mjs | tee mf6-browser-n-input.log
          grep -q MF6_V28_BROWSER_N_INPUT_COMPOSITION_PASS mf6-browser-n-input.log

      - name: Compose active N-peer inputs with same-epoch churn
        env:
          MW_MF6_N_INPUT_BASE: http://127.0.0.1:8787
          MW_MF6_N_INPUT_RUN: m6c${{ github.run_id }}
          MW_MF6_N_INPUT_OUTPUT: mf6-browser-active-churn-composition.json
          MW_MF6_ACTIVE_CHURN_BASE: http://127.0.0.1:8787
          MW_MF6_ACTIVE_CHURN_RUN: m6c${{ github.run_id }}
          MW_MF6_ACTIVE_CHURN_OUTPUT: mf6-browser-active-churn-composition.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/multiplayer-foundation-v2-v28-browser-active-churn-composition.mjs | tee mf6-browser-active-churn.log
          grep -q MF6_V28_BROWSER_ACTIVE_CHURN_COMPOSITION_PASS mf6-browser-active-churn.log

      - name: Qualify active N-peer hard-outage recovery
        env:
          MW_MF6_IMPAIRMENT_BASE: http://127.0.0.1:8787
          MW_MF6_IMPAIRMENT_RUN: m6i${{ github.run_id }}
          MW_MF6_IMPAIRMENT_OUTPUT: mf6-browser-active-impairment.json
          MW_MF6_IMPAIRMENT_OFFLINE_MS: 8000
          MW_MF6_IMPAIRMENT_PROXY_PORT: 8791
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node scripts/multiplayer-foundation-v2-v28-browser-active-impairment.mjs | tee mf6-browser-active-impairment.log
          grep -q MF6_V28_BROWSER_ACTIVE_IMPAIRMENT_PASS mf6-browser-active-impairment.log

      - name: Discriminate active N-peer input-authorship horizon under latency jitter
        env:
          MW_MF6_LATENCY_BASE: http://127.0.0.1:8787
        shell: bash
        run: |
          set -euo pipefail
          set +e
          MW_MF6_LATENCY_RUN=m6l8${{ github.run_id }} \
          MW_MF6_LATENCY_OUTPUT=mf6-browser-latency-jitter-l8.json \
          MW_MF6_LATENCY_PROXY_PORT=8792 \
          MW_MF6_INPUT_LEAD_PROBE=8 \
          MW_MF6_INPUT_ESTIMATE_CEILING_PROBE=0 \
            timeout 210s node scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs \
            | tee mf6-browser-latency-jitter-l8.log
          l8_status=${PIPESTATUS[0]}

          MW_MF6_LATENCY_RUN=m6l10${{ github.run_id }} \
          MW_MF6_LATENCY_OUTPUT=mf6-browser-latency-jitter-l10.json \
          MW_MF6_LATENCY_PROXY_PORT=8792 \
          MW_MF6_INPUT_LEAD_PROBE=10 \
          MW_MF6_INPUT_ESTIMATE_CEILING_PROBE=0 \
            timeout 210s node scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs \
            | tee mf6-browser-latency-jitter-l10.log
          l10_status=${PIPESTATUS[0]}

          MW_MF6_LATENCY_RUN=m6l12${{ github.run_id }} \
          MW_MF6_LATENCY_OUTPUT=mf6-browser-latency-jitter-l12.json \
          MW_MF6_LATENCY_PROXY_PORT=8792 \
          MW_MF6_INPUT_LEAD_PROBE=12 \
          MW_MF6_INPUT_ESTIMATE_CEILING_PROBE=0 \
            timeout 210s node scripts/multiplayer-foundation-v2-v28-browser-latency-jitter.mjs \
            | tee mf6-browser-latency-jitter-l12.log
          l12_status=${PIPESTATUS[0]}
          set -e

          echo "L8_SCRIPT_STATUS=${l8_status}"
          echo "L10_SCRIPT_STATUS=${l10_status}"
          echo "L12_SCRIPT_STATUS=${l12_status}"
          node scripts/multiplayer-foundation-v2-v28-input-lead-discriminator.mjs \
            mf6-browser-latency-jitter-l8.json \
            mf6-browser-latency-jitter-l10.json \
            mf6-browser-latency-jitter-l12.json \
            mf6-input-lead-discriminator.json \
            | tee mf6-input-lead-discriminator.log

      - name: Stop isolated authority
        if: always()
        shell: bash
        run: |
          if [ -f mf6-workerd.pid ]; then
            pid="$(cat mf6-workerd.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: multiplayer-foundation-v2-dynamic-composition-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            mf6-v28.log
            mf6-browser.log
            mf6-browser-composition.json
            mf6-browser-n-input.log
            mf6-browser-n-input-composition.json
            mf6-browser-active-churn.log
            mf6-browser-active-churn-composition.json
            mf6-browser-active-impairment.log
            mf6-browser-active-impairment.json
            mf6-browser-latency-jitter-l8.log
            mf6-browser-latency-jitter-l8.json
            mf6-browser-latency-jitter-l10.log
            mf6-browser-latency-jitter-l10.json
            mf6-browser-latency-jitter-l12.log
            mf6-browser-latency-jitter-l12.json
            mf6-input-lead-discriminator.log
            mf6-input-lead-discriminator.json
            mf6-workerd.log
