name: Multiplayer Foundation V2 F6 scheduler attribution

concurrency:
  group: multiplayer-foundation-v2-f6-scheduler-attribution-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/multiplayer-foundation-v2-v28-dynamic-composition
    paths:
      - scripts/multiplayer-foundation-v2-v28-f6-scheduler-attribution.mjs
      - scripts/multiplayer-foundation-v2-v28-f6-scheduler-attribution-aggregate.mjs
      - .github/workflows/multiplayer-foundation-v2-f6-scheduler-attribution.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  specimen:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        mode: [authority-only, browser-hostile]
        replicate: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start isolated Workerd authority
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9288 > mf6-f6-workerd.log 2>&1 &
          echo $! > mf6-f6-workerd.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "MF6_F6_WORKER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat mf6-f6-workerd.log
          exit 1
      - name: Run scheduler attribution specimen
        env:
          MODE: ${{ matrix.mode }}
          REP: ${{ matrix.replicate }}
          MW_F6_BASE: http://127.0.0.1:8787
        shell: bash
        run: |
          set -euo pipefail
          mode_id="${MODE//-/_}"
          run_key="f6${REP}${mode_id:0:2}-${{ github.run_id }}"
          output="mf6-f6-${MODE}-${REP}.json"
          MW_F6_MODE="$MODE" \
          MW_F6_RUN="$run_key" \
          MW_F6_OUTPUT="$output" \
          MW_F6_PROXY_PORT=8792 \
            timeout 260s node scripts/multiplayer-foundation-v2-v28-f6-scheduler-attribution.mjs \
            | tee "mf6-f6-${MODE}-${REP}.log"
          grep -q MF6_F6_SCHEDULER_ATTRIBUTION_SPECIMEN_COMPLETE "mf6-f6-${MODE}-${REP}.log"
      - name: Stop isolated authority
        if: always()
        shell: bash
        run: |
          if [ -f mf6-f6-workerd.pid ]; then
            pid="$(cat mf6-f6-workerd.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mf6-f6-${{ matrix.mode }}-${{ matrix.replicate }}
          if-no-files-found: error
          path: |
            mf6-f6-*.json
            mf6-f6-*.log
            mf6-f6-workerd.log

  aggregate:
    needs: specimen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: mf6-f6-*
          merge-multiple: true
      - name: Aggregate scheduler attribution
        shell: bash
        run: |
          set -euo pipefail
          node scripts/multiplayer-foundation-v2-v28-f6-scheduler-attribution-aggregate.mjs \
            mf6-f6-authority-only-a.json mf6-f6-authority-only-b.json \
            mf6-f6-browser-hostile-a.json mf6-f6-browser-hostile-b.json \
            mf6-f6-scheduler-attribution.json | tee mf6-f6-scheduler-attribution.log
      - uses: actions/upload-artifact@v6
        with:
          name: multiplayer-foundation-v2-f6-scheduler-attribution-${{ github.run_id }}
          path: |
            mf6-f6-scheduler-attribution.json
            mf6-f6-scheduler-attribution.log
