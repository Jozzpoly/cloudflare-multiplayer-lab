name: Box3D F1 Local Workerd Benchmark

on:
  push:
    branches: [probe/box3d-do-feasibility]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Start local workerd
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --ip 127.0.0.1 --port 8787 > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/api/ping > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat wrangler-dev.log
          exit 1

      - name: Run F1 benchmark matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const presets = [
            'raw-16-60x4',
            'raw-32-60x4',
            'raw-64-60x4',
            'raw-128-60x4',
            'actors-1-props-16-60x4',
            'actors-2-props-32-60x4',
            'actors-6-props-32-60x4',
            'actors-6-props-64-60x4',
            'actors-6-props-64-60x2',
            'actors-6-props-64-30x4',
            'actors-6-props-64-30x2',
          ];
          const samplesPerPreset = 7;

          function percentile(values, p) {
            const sorted = [...values].sort((a, b) => a - b);
            const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * p) - 1));
            return sorted[index];
          }

          async function sample(preset) {
            const response = await fetch(`http://127.0.0.1:8787/api/box3d-benchmark?preset=${encodeURIComponent(preset)}`);
            const payload = await response.json();
            if (!response.ok || payload.ok !== true || payload.checks?.finite !== true) {
              throw new Error(`${preset} failed: ${JSON.stringify(payload)}`);
            }
            if (!(payload.stepDurationMs > 0) || !(payload.averageStepDurationMs > 0)) {
              throw new Error(`${preset} did not expose a usable local CPU timer: ${JSON.stringify(payload)}`);
            }
            return payload;
          }

          const summaries = [];
          for (const preset of presets) {
            await sample(preset); // warm-up, intentionally discarded
            const samples = [];
            for (let run = 0; run < samplesPerPreset; run += 1) samples.push(await sample(preset));
            const averageSteps = samples.map((sample) => sample.averageStepDurationMs);
            const setups = samples.map((sample) => sample.setupDurationMs);
            const first = samples[0];
            summaries.push({
              preset,
              scenario: first.preset.scenario,
              actors: first.preset.actors,
              props: first.preset.props,
              hz: first.preset.hz,
              substeps: first.preset.substeps,
              steps: first.preset.steps,
              avgStepMsP50: percentile(averageSteps, 0.5),
              avgStepMsP95: percentile(averageSteps, 0.95),
              setupMsP50: percentile(setups, 0.5),
              setupMsP95: percentile(setups, 0.95),
              checksum: first.finalChecksum,
            });
          }

          console.log('F1_BENCHMARK_RESULTS');
          console.log(JSON.stringify(summaries, null, 2));
          NODE

      - name: Show workerd log on failure
        if: failure()
        run: cat wrangler-dev.log || true

      - name: Stop local workerd
        if: always()
        shell: bash
        run: |
          if [[ -f wrangler-dev.pid ]]; then
            kill "$(cat wrangler-dev.pid)" || true
          fi
