name: Box3D F2 Public Durable Object Soak

on:
  push:
    branches: [probe/box3d-do-feasibility]

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact F2 public runtime and soak representative presets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://cloudflare-multiplayer-lab.jozzpoly.workers.dev/api/box3d-soak';
          const revision = 'box3d-f2-soak-v1';
          const presets = [
            'actors-6-props-64-60x4',
            'actors-6-props-64-30x2',
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(params) {
            const url = new URL(base);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            const response = await fetch(url);
            let payload;
            try { payload = await response.json(); }
            catch { payload = { parseError: true, status: response.status, text: await response.text().catch(() => '') }; }
            return { response, payload };
          }

          let ready = false;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const { response, payload } = await request({ action: 'status' });
            console.log(`deploy-wait attempt=${attempt} http=${response.status} revision=${payload.revision ?? 'none'}`);
            if (response.ok && payload.revision === revision) {
              ready = true;
              break;
            }
            await sleep(5000);
          }
          if (!ready) throw new Error('F2 public runtime did not deploy within retry window');

          const summaries = [];
          for (const preset of presets) {
            await request({ action: 'stop' });
            const started = await request({ action: 'start', preset });
            if (!started.response.ok || started.payload.ok !== true || started.payload.active !== true) {
              throw new Error(`start failed for ${preset}: ${JSON.stringify(started.payload)}`);
            }
            const runId = started.payload.runId;
            const observations = [];
            for (let poll = 0; poll < 12; poll += 1) {
              await sleep(5000);
              const status = await request({ action: 'status' });
              if (!status.response.ok || status.payload.ok !== true || status.payload.runId !== runId) {
                throw new Error(`status failed for ${preset}: ${JSON.stringify(status.payload)}`);
              }
              if (status.payload.failure !== null || status.payload.checks?.finite !== true) {
                throw new Error(`runtime failure for ${preset}: ${JSON.stringify(status.payload)}`);
              }
              observations.push(status.payload);
              console.log(`${preset} poll=${poll + 1} ticks=${status.payload.ticks} expected=${status.payload.expectedTicks.toFixed(1)} ratio=${status.payload.tickRatio.toFixed(4)} dropped=${status.payload.droppedTicks} catchup=${status.payload.catchupSteps} p95=${status.payload.pumpIntervalMsP95}`);
            }
            const stopped = await request({ action: 'stop' });
            if (!stopped.response.ok || stopped.payload.ok !== true || stopped.payload.runId !== runId) {
              throw new Error(`stop failed for ${preset}: ${JSON.stringify(stopped.payload)}`);
            }
            const final = observations.at(-1);
            if (!(final.ticks > 0) || !(final.durationMs >= 50000)) {
              throw new Error(`insufficient soak for ${preset}: ${JSON.stringify(final)}`);
            }
            summaries.push({
              preset,
              runId,
              durationMs: final.durationMs,
              ticks: final.ticks,
              expectedTicks: final.expectedTicks,
              tickRatio: final.tickRatio,
              callbacks: final.callbacks,
              droppedTicks: final.droppedTicks,
              catchupSteps: final.catchupSteps,
              pumpIntervalMsP50: final.pumpIntervalMsP50,
              pumpIntervalMsP95: final.pumpIntervalMsP95,
              pumpIntervalMsMax: final.pumpIntervalMsMax,
              checksum: final.finalChecksum,
            });
          }

          console.log('F2_SOAK_RESULTS');
          console.log(JSON.stringify(summaries, null, 2));
          NODE
