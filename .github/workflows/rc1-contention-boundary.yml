name: RC1 Contention Boundary

on:
  pull_request:
    paths:
      - "public/world0-rc1/**"
      - "scripts/rc1-contention-boundary.mjs"
      - "src/world-slice-entry.ts"
      - "src/world-slice-0-two-client.ts"
      - ".github/workflows/rc1-contention-boundary.yml"

permissions:
  contents: read

jobs:
  contention-boundary:
    strategy:
      fail-fast: false
      matrix:
        delay: [40, 50, 60, 70, 80, 90, 100]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax-check boundary probe
        run: node --check scripts/rc1-contention-boundary.mjs

      - name: Run fresh-world boundary cell
        env:
          RC1_BOUNDARY_DELAYS: ${{ matrix.delay }}
          RC1_BOUNDARY_REPEATS: 2
          RC1_BOUNDARY_OUTPUT: rc1-contention-boundary-${{ matrix.delay }}ms.json
        run: node scripts/rc1-contention-boundary.mjs

      - name: Preserve boundary cell evidence
        if: always() && hashFiles('rc1-contention-boundary-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rc1-contention-boundary-${{ matrix.delay }}ms
          path: rc1-contention-boundary-${{ matrix.delay }}ms.json
          if-no-files-found: error
