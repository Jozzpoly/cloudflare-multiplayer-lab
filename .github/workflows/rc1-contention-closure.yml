name: RC1 Contention Closure

on:
  pull_request:
    paths:
      - "public/world0-rc1/**"
      - "scripts/rc1-contention-closure.mjs"
      - "src/world-slice-entry.ts"
      - "src/world-slice-0-two-client.ts"
      - ".github/workflows/rc1-contention-closure.yml"

permissions:
  contents: read

jobs:
  contention-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax-check closure probe
        run: node --check scripts/rc1-contention-closure.mjs

      - name: Run long-rest contention closure probe
        run: node scripts/rc1-contention-closure.mjs

      - name: Preserve closure evidence
        if: always() && hashFiles('rc1-contention-closure.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rc1-contention-closure
          path: rc1-contention-closure.json
          if-no-files-found: error
