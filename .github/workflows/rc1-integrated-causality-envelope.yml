name: RC1 Integrated Temporal Causality Envelope

on:
  pull_request:
    paths:
      - "public/world0-rc1/**"
      - "scripts/rc1-integrated-causality-envelope.mjs"
      - "src/world-slice-0-two-client.ts"
      - "src/world-slice-entry.ts"
      - ".github/workflows/rc1-integrated-causality-envelope.yml"

permissions:
  contents: read

jobs:
  rc1-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax-check RC1 browser runner
        run: node --check public/world0-rc1/runner.js

      - name: Run integrated temporal causality envelope
        run: node scripts/rc1-integrated-causality-envelope.mjs

      - name: Preserve RC1 evidence
        if: always() && hashFiles('rc1-envelope.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rc1-integrated-temporal-causality-envelope
          path: rc1-envelope.json
          if-no-files-found: error
