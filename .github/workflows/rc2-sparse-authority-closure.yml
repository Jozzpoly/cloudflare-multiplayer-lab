name: RC2 Sparse Authority Closure

on:
  pull_request:
    paths:
      - "public/world0-rc2/**"
      - "scripts/rc2-sparse-authority-closure.mjs"
      - "src/world-slice-entry.ts"
      - "src/world-slice-0-two-client.ts"
      - "package.json"
      - ".github/workflows/rc2-sparse-authority-closure.yml"

permissions:
  contents: read

jobs:
  moving-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RC2_MODE: moving
      RC2_REPEAT: 1
      RC2_OUTPUT: rc2-moving-r1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/rc2-sparse-authority-closure.mjs
      - name: Run qualified moving closure reference
        run: node scripts/rc2-sparse-authority-closure.mjs
      - name: Preserve moving evidence
        if: always() && hashFiles('rc2-moving-r1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rc2-moving-r1
          path: rc2-moving-r1.json
          if-no-files-found: error

  quiescent-qualified:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RC2_MODE: quiescent
      RC2_REPEAT: ${{ matrix.repeat }}
      RC2_OUTPUT: rc2-quiescent-r${{ matrix.repeat }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/rc2-sparse-authority-closure.mjs
      - name: Run qualified quiescent closure probe
        run: node scripts/rc2-sparse-authority-closure.mjs
      - name: Preserve quiescent evidence
        if: always() && hashFiles(format('rc2-quiescent-r{0}.json', matrix.repeat)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: rc2-quiescent-r${{ matrix.repeat }}
          path: rc2-quiescent-r${{ matrix.repeat }}.json
          if-no-files-found: error
