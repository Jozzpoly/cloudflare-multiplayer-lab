name: Remove aborted coop-push experiment branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-aborted-coop-push-2026-09-18.yml

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: experiment/world-v0-coop-push-r0
      EXPECTED_SHA: 7e3fbf40ed23ba8836d0acb6a770c86b1dd5d437
    steps:
      - name: Fail-closed exact ref deletion
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$live" = "$EXPECTED_SHA"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TARGET_BRANCH"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "branch still exists" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          archive_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/archive/multi-world-history-2026-09-18" --jq '.object.sha')"
          test -n "$main_sha"
          test -n "$archive_sha"
          echo "ABORTED_COOP_PUSH_BRANCH_REMOVED"
