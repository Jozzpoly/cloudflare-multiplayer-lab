name: Repository cleanup v3 guarded atomic apply v2

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-cleanup-v3-atomic-apply-runner-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct qualified Cleanup Kit v3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repo-cleanup/runtime-kit cleanup-evidence
          cat .repo-cleanup/kit-payload/part-* > /tmp/kit.b64
          base64 -d /tmp/kit.b64 > /tmp/kit.tgz
          echo 'cb763dcbf6811bd0bcca6f62b474785831d6469050f4a1aada2aac10e156041c  /tmp/kit.tgz' | sha256sum -c -
          tar -xzf /tmp/kit.tgz -C .repo-cleanup/runtime-kit
          echo '8605e24a6e9764affbc2efb4c078bc7aa9f3514bb1e269c3c4ef2f6347a8c7e7  .repo-cleanup/runtime-kit/src/cli.mjs' | sha256sum -c -
          echo '2c4a21211a535a142b0d2eb99def24def51e3497d971f261158b95788685d988  .repo-cleanup/runtime-kit/src/github.mjs' | sha256sum -c -
          echo 'b6c9042a8d2d30652e4a72578cedf59fd86108d8c4eaad9ed66e5ae9cd828c37  .repo-cleanup/runtime-kit/src/core.mjs' | sha256sum -c -

      - name: Recover immutable prepared evidence
        uses: actions/download-artifact@v4
        with:
          name: repository-cleanup-v3-prepared-34511799800
          path: /tmp/prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34511799800

      - name: Verify frozen authority and archive witnesses
        shell: bash
        run: |
          set -euo pipefail
          assert_ref() { test "$(git ls-remote origin "$1" | cut -f1)" = "$2"; }
          assert_ref refs/heads/main 7974e3d1eb8ed3a7236db11b0b772bc73ff3cea6
          assert_ref refs/heads/maintenance/repository-cleanup-v3-2026-09-10 feb2cea533dc227d078b01e13113a32634ca9f78
          assert_ref refs/heads/archive/repository-cleanup-v3-2026-09-10 61f202289f0dcbde26cb5d72de67e7a46397c159
          assert_ref refs/heads/archive/world-v0-qualified-2p-baseline-2026-09-10 7755a668d7488f04ecbf42a00fbc96fcb978d544
          assert_ref refs/heads/archive/world-v0-final-delivery-2026-09-10 fa5e45594f0c39ba4e96c13b4ef783bbaae1ba65
          assert_ref refs/heads/archive/pre-safe-stop-main-2026-09-10 829deef82c71780d2d661e7a7e82685739d7b23d
          assert_ref 'refs/tags/repository-cleanup-v3-pre-prune-2026-09-10^{}' 61f202289f0dcbde26cb5d72de67e7a46397c159

      - name: Regenerate and constrain exact live transaction
        shell: bash
        run: |
          set -euo pipefail
          node .repo-cleanup/runtime-kit/src/cli.mjs plan --config=.repo-cleanup/config.json --freeze=/tmp/prepared/freeze.json --out=cleanup-evidence/transaction.json | tee cleanup-evidence/plan.log
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('cleanup-evidence/transaction.json', 'utf8'));
          const runnerRef = `refs/heads/${process.env.GITHUB_REF_NAME}`;
          const deletes = p.updates.filter(x => x.kind === 'DELETE');
          const retains = p.updates.filter(x => x.kind === 'RETAIN_ASSERT');
          if (deletes.length !== 167) throw new Error(`DELETE cardinality drift: ${deletes.length}`);
          if (retains.length !== 6) throw new Error(`RETAIN cardinality drift: ${retains.length}`);
          if (JSON.stringify(p.unknownRefsAtPlan) !== JSON.stringify([runnerRef])) throw new Error(`Unexpected post-freeze refs: ${JSON.stringify(p.unknownRefsAtPlan)}`);
          const token = `REPO_CLEANUP_APPLY:${p.repository}:${p.transactionSha256}`;
          writeFileSync('cleanup-evidence/OWNER_STOP.txt', token + '\n');
          writeFileSync('cleanup-evidence/runner-binding.json', JSON.stringify({ runnerRef, runnerSha: process.env.GITHUB_SHA, transactionSha256: p.transactionSha256, deleteCount: deletes.length, retainAssertCount: retains.length, unknownRefsAtPlan: p.unknownRefsAtPlan }, null, 2) + '\n');
          console.log(`OWNER_STOP=${token}`);
          NODE

      - name: Resolve exact Owner authorization from issue 41
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const expected = readFileSync('cleanup-evidence/OWNER_STOP.txt', 'utf8').trim();
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/41/comments?per_page=100`;
          const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' } });
          if (!r.ok) throw new Error(`Authorization evidence read failed: HTTP ${r.status}`);
          const comments = await r.json();
          const matches = comments.filter(c => c?.user?.login === owner && String(c.body ?? '').split(/\r?\n/).map(s => s.trim()).includes(expected));
          const authorized = matches.length === 1;
          if (matches.length > 1) throw new Error('Multiple matching authorization comments; refuse ambiguous destructive execution');
          writeFileSync('cleanup-evidence/authorization-check.json', JSON.stringify({ authorized, owner, matchingCommentIds: matches.map(c => c.id), expected }, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${authorized ? 'true' : 'false'}\n`);
          console.log(authorized ? `EXACT_OWNER_AUTHORIZATION_PASS comment=${matches[0].id}` : 'OWNER_STOP_NO_AUTHORIZATION');
          NODE

      - name: Apply exact GitHub-atomic cleanup transaction
        if: steps.owner.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export REPO_CLEANUP_AUTHORIZATION="$(cat cleanup-evidence/OWNER_STOP.txt)"
          node .repo-cleanup/runtime-kit/src/cli.mjs apply --config=.repo-cleanup/config.json --plan=cleanup-evidence/transaction.json --transport=github-graphql --execute | tee cleanup-evidence/apply.log

      - name: Independent namespace postflight
        if: steps.owner.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p = JSON.parse(readFileSync('cleanup-evidence/transaction.json', 'utf8'));
          const text = execFileSync('git', ['ls-remote', '--heads', 'origin'], { encoding: 'utf8' }).trim();
          const live = new Map(text ? text.split('\n').map(line => { const [sha, ref] = line.split(/\s+/); return [ref, sha]; }) : []);
          for (const u of p.updates) {
            if (u.kind === 'DELETE' && live.has(u.name)) throw new Error(`DELETE survived: ${u.name}`);
            if (u.kind === 'RETAIN_ASSERT' && live.get(u.name) !== u.beforeOid) throw new Error(`RETAIN drift: ${u.name}`);
          }
          const runnerRef = `refs/heads/${process.env.GITHUB_REF_NAME}`;
          if (live.get(runnerRef) !== process.env.GITHUB_SHA) throw new Error('Runner ref moved during apply');
          if (live.size !== 7) throw new Error(`Unexpected post-apply live branch count: ${live.size}`);
          console.log('INDEPENDENT_NAMESPACE_POSTFLIGHT_PASS liveHeads=7');
          NODE

      - name: Preserve guarded runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v3-guarded-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanup-evidence/
          if-no-files-found: warn
          retention-days: 30
