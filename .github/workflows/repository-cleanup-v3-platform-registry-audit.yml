name: Repository cleanup v3 post-prune Actions registry audit

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-cleanup-v3-platform-registry-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact live branch and Actions registry state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-audit
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const [owner,repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'};
          async function get(url){const r=await fetch(url,{headers}); if(!r.ok) throw new Error(`${url} HTTP ${r.status}`); return r.json();}
          const workflows=[];
          for(let page=1;;page++){
            const body=await get(`https://api.github.com/repos/${owner}/${repo}/actions/workflows?per_page=100&page=${page}`);
            workflows.push(...(body.workflows||[]));
            if((body.workflows||[]).length<100) break;
          }
          const branches=[];
          for(let page=1;;page++){
            const body=await get(`https://api.github.com/repos/${owner}/${repo}/branches?per_page=100&page=${page}`);
            branches.push(...body);
            if(body.length<100) break;
          }
          const mainDir=await get(`https://api.github.com/repos/${owner}/${repo}/contents/.github/workflows?ref=main`);
          const mainPaths=mainDir.filter(x=>x.type==='file').map(x=>x.path).sort();
          const normalized=workflows.map(w=>({id:w.id,name:w.name,path:w.path,state:w.state,created_at:w.created_at,updated_at:w.updated_at})).sort((a,b)=>a.id-b.id);
          const active=normalized.filter(w=>w.state==='active');
          const activeNotOnMain=active.filter(w=>!mainPaths.includes(w.path));
          const mainWorkflowNames=new Set(mainPaths);
          const result={capturedAt:new Date().toISOString(),branchCount:branches.length,branches:branches.map(b=>({name:b.name,sha:b.commit.sha})).sort((a,b)=>a.name.localeCompare(b.name)),mainWorkflowPaths:mainPaths,registryCount:normalized.length,activeWorkflowCount:active.length,activeWorkflows:active,activeNotOnMain,registry:normalized};
          writeFileSync('platform-audit/actions-registry.json',JSON.stringify(result,null,2)+'\n');
          console.log(`BRANCH_COUNT=${result.branchCount}`);
          console.log(`MAIN_WORKFLOW_FILES=${mainPaths.length}`);
          console.log(`WORKFLOW_REGISTRY=${normalized.length}`);
          console.log(`ACTIVE_WORKFLOWS=${active.length}`);
          console.log(`ACTIVE_NOT_ON_MAIN=${activeNotOnMain.length}`);
          for(const w of active) console.log(`ACTIVE ${w.id} ${w.path}`);
          for(const w of activeNotOnMain) console.log(`ACTIVE_HELPER_OR_STALE ${w.id} ${w.path}`);
          NODE

      - name: Preserve registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v3-platform-registry-audit-${{ github.run_id }}
          path: platform-audit/
          if-no-files-found: error
          retention-days: 30
