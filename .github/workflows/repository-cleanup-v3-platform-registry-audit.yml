name: Repository cleanup v3 post-prune Actions registry audit

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-cleanup-v3-platform-registry-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify live Actions registry and post-prune activity
        env:
          GH_TOKEN: ${{ github.token }}
          BULK_PRUNE_CUTOFF: '2026-09-10T18:36:00Z'
          EXPECTED_MAIN: ddc66a97f61640e25e86f3240ac7753c08f82fe7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-audit
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const [owner,repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'};
          async function get(url){const r=await fetch(url,{headers}); if(!r.ok) throw new Error(`${url} HTTP ${r.status}`); return r.json();}
          async function pages(base,key){
            const out=[];
            for(let page=1;;page++){
              const sep=base.includes('?')?'&':'?';
              const body=await get(`${base}${sep}per_page=100&page=${page}`);
              const rows=key?body[key]:body;
              out.push(...rows);
              if(rows.length<100) break;
            }
            return out;
          }
          const workflows=await pages(`https://api.github.com/repos/${owner}/${repo}/actions/workflows`,'workflows');
          const branches=await pages(`https://api.github.com/repos/${owner}/${repo}/branches`);
          const mainDir=await get(`https://api.github.com/repos/${owner}/${repo}/contents/.github/workflows?ref=main`);
          const mainPaths=mainDir.filter(x=>x.type==='file').map(x=>x.path).sort();
          const main=branches.find(b=>b.name==='main');
          if(main?.commit?.sha!==process.env.EXPECTED_MAIN) throw new Error(`main drift ${main?.commit?.sha}`);
          const cutoff=encodeURIComponent(`>=${process.env.BULK_PRUNE_CUTOFF}`);
          const recentRuns=await pages(`https://api.github.com/repos/${owner}/${repo}/actions/runs?created=${cutoff}`,'workflow_runs');
          const normalized=workflows.map(w=>({id:w.id,name:w.name,path:w.path,state:w.state,created_at:w.created_at,updated_at:w.updated_at})).sort((a,b)=>a.id-b.id);
          const active=normalized.filter(w=>w.state==='active');
          const activeNotOnMain=active.filter(w=>!mainPaths.includes(w.path));
          const cleanupTransient=activeNotOnMain.filter(w=>w.path.includes('repository-cleanup-v3-'));
          const historicalResidue=activeNotOnMain.filter(w=>!w.path.includes('repository-cleanup-v3-'));
          const recentByWorkflow=new Map();
          for(const run of recentRuns){
            const row={id:run.id,workflow_id:run.workflow_id,name:run.name,path:run.path,head_branch:run.head_branch,head_sha:run.head_sha,event:run.event,status:run.status,conclusion:run.conclusion,created_at:run.created_at};
            if(!recentByWorkflow.has(run.workflow_id)) recentByWorkflow.set(run.workflow_id,[]);
            recentByWorkflow.get(run.workflow_id).push(row);
          }
          const historicalIds=new Set(historicalResidue.map(w=>w.id));
          const historicalPostPrune=recentRuns.filter(r=>historicalIds.has(r.workflow_id)).map(r=>({id:r.id,workflow_id:r.workflow_id,name:r.name,path:r.path,head_branch:r.head_branch,head_sha:r.head_sha,event:r.event,status:r.status,conclusion:r.conclusion,created_at:r.created_at}));
          const cleanupPostPrune=recentRuns.filter(r=>cleanupTransient.some(w=>w.id===r.workflow_id)).map(r=>({id:r.id,workflow_id:r.workflow_id,name:r.name,path:r.path,head_branch:r.head_branch,head_sha:r.head_sha,event:r.event,status:r.status,conclusion:r.conclusion,created_at:r.created_at}));
          const result={
            capturedAt:new Date().toISOString(),cutoff:process.env.BULK_PRUNE_CUTOFF,
            branchCount:branches.length,branches:branches.map(b=>({name:b.name,sha:b.commit.sha})).sort((a,b)=>a.name.localeCompare(b.name)),
            mainWorkflowPaths:mainPaths,registryCount:normalized.length,activeWorkflowCount:active.length,
            activeNotOnMainCount:activeNotOnMain.length,historicalResidueCount:historicalResidue.length,cleanupTransientCount:cleanupTransient.length,
            historicalResidue,cleanupTransient,recentRunCount:recentRuns.length,historicalPostPrune,cleanupPostPrune,
            proposedPolicy:{retainActivePaths:mainPaths,disableNowCandidateIds:historicalResidue.map(w=>w.id),disableAtFinalHelperClosureIds:cleanupTransient.map(w=>w.id),deleteRuns:false,deleteArtifacts:false}
          };
          writeFileSync('platform-audit/actions-registry-classification.json',JSON.stringify(result,null,2)+'\n');
          console.log(`BRANCH_COUNT=${result.branchCount}`);
          console.log(`MAIN_WORKFLOW_FILES=${mainPaths.length}`);
          console.log(`REGISTRY=${result.registryCount} ACTIVE=${result.activeWorkflowCount}`);
          console.log(`ACTIVE_NOT_ON_MAIN=${result.activeNotOnMainCount}`);
          console.log(`HISTORICAL_RESIDUE=${result.historicalResidueCount}`);
          console.log(`CLEANUP_TRANSIENT=${result.cleanupTransientCount}`);
          console.log(`POST_PRUNE_RUNS=${result.recentRunCount}`);
          console.log(`HISTORICAL_POST_PRUNE_RUNS=${historicalPostPrune.length}`);
          console.log(`CLEANUP_POST_PRUNE_RUNS=${cleanupPostPrune.length}`);
          if(historicalPostPrune.length) console.log(JSON.stringify(historicalPostPrune,null,2));
          if(historicalPostPrune.length!==0) throw new Error('historical registry entries executed after bulk-prune cutoff');
          NODE

      - name: Preserve registry classification evidence
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v3-platform-registry-classification-${{ github.run_id }}
          path: platform-audit/
          if-no-files-found: error
          retention-days: 30
