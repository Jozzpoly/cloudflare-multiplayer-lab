name: Repository cleanup v3 retrospective embedded-payload audit

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-cleanup-v3-retrospective-package-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact embedded tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/kit qualification/logs
          cat .repo-cleanup/kit-payload/part-* > qualification/kit.b64
          base64 -d qualification/kit.b64 > qualification/kit.tgz
          actual="$(sha256sum qualification/kit.tgz | cut -d' ' -f1)"
          expected='cb763dcbf6811bd0bcca6f62b474785831d6469050f4a1aada2aac10e156041c'
          test "$actual" = "$expected"
          tar -xzf qualification/kit.tgz -C qualification/kit
          printf 'embeddedTarballSha256=%s\nrunnerSha=%s\n' "$actual" "$GITHUB_SHA" | tee qualification/logs/identity.txt

      - name: Inventory payload and classify release-wrapper coverage
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/kit
          find . -type f -print | sort | tee ../logs/inventory.txt
          for f in CHECKSUMS.sha256 package.json package-manifest.json FINAL_QUALIFICATION.md FRESH_AGENT_TAKEOVER.md; do
            if test -f "$f"; then echo "PRESENT $f"; else echo "ABSENT $f"; fi
          done | tee ../logs/release-wrapper-coverage.txt
          if test -f CHECKSUMS.sha256 && test -f package.json && test -f package-manifest.json && test -f FINAL_QUALIFICATION.md; then
            echo FULL_RELEASE_WRAPPER_PRESENT | tee ../logs/payload-classification.txt
          else
            echo RUNTIME_SOURCE_PAYLOAD_NOT_FULL_RELEASE_PACKAGE | tee ../logs/payload-classification.txt
          fi

      - name: Verify exact runtime source identities used by campaign
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/kit
          echo '8605e24a6e9764affbc2efb4c078bc7aa9f3514bb1e269c3c4ef2f6347a8c7e7  src/cli.mjs' | sha256sum -c -
          echo '7748d1f6707eb25ec529cad8fed30e83e497a3636bcbf08f5ba9eb5012fcb92e  src/closure.mjs' | sha256sum -c -
          echo 'b6c9042a8d2d30652e4a72578cedf59fd86108d8c4eaad9ed66e5ae9cd828c37  src/core.mjs' | sha256sum -c -
          echo '09c84e96ebf7bcc7daba514fca289bf7a4ec5d724e426e21bed9b0088b27b1a2  src/git.mjs' | sha256sum -c -
          echo '2c4a21211a535a142b0d2eb99def24def51e3497d971f261158b95788685d988  src/github.mjs' | sha256sum -c -
          echo '496b26d284011e9dcd4c34c447a86863d66d8d41a44fc8a798cba9c24217f8b3  src/rehearsal.mjs' | sha256sum -c -
          for f in src/*.mjs; do node --check "$f"; done
          echo EMBEDDED_RUNTIME_SOURCE_IDENTITY_AND_SYNTAX_PASS | tee ../logs/runtime-source-validation.txt

      - name: Execute full package qualification only if actually present
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/kit
          if test -f CHECKSUMS.sha256 && test -f package.json && test -f package-manifest.json && test -f FINAL_QUALIFICATION.md; then
            sha256sum -c CHECKSUMS.sha256 | tee ../logs/checksums.log
            npm test | tee ../logs/npm-test.log
            npm run audit:product | tee ../logs/product-audit.log
            for f in tests/*.mjs; do node --check "$f"; done
            mapfile -t yamls < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
            ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "YAML_PARSE_PASS #{f}" }' "${yamls[@]}" | tee ../logs/yaml-parse.log
            echo FULL_EMBEDDED_PACKAGE_QUALIFICATION_PASS | tee ../logs/full-package-result.txt
          else
            echo FULL_PACKAGE_QUALIFICATION_NOT_EXECUTABLE_FROM_EMBEDDED_PAYLOAD | tee ../logs/full-package-result.txt
          fi

      - name: State exact evidentiary boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > qualification/logs/boundary.txt <<'EOF'
          Proven: exact SHA-256 and source identities of the embedded runtime payload actually used by Multi_World cleanup; source syntax revalidated.
          Conditionally proven only if release wrapper exists: full package checksum/test/product-audit qualification.
          Not proven without Owner-supplied distribution ZIP: byte identity with that external ZIP and its external ZIP SHA-256.
          Cleanup transaction correctness remains separately evidenced by freeze/archive/rehearsal/atomic apply/postflight/seal artifacts.
          EOF
          cat qualification/logs/boundary.txt

      - name: Preserve retrospective payload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v3-retrospective-payload-audit-${{ github.run_id }}
          path: qualification/logs/
          if-no-files-found: error
          retention-days: 30
