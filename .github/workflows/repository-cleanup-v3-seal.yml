name: Repository cleanup v3 post-prune seal

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-cleanup-v3-seal.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_SHA: 5224bea2d26fc0686f453a44c5143b05eb0fc537
      QUALIFIED_PRODUCT_SHA: 7755a668d7488f04ecbf42a00fbc96fcb978d544
      RUNNER_REF: maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify qualified Cleanup Kit v3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repo-cleanup/runtime-kit cleanup-evidence
          cat .repo-cleanup/kit-payload/part-* > /tmp/kit.b64
          base64 -d /tmp/kit.b64 > /tmp/kit.tgz
          echo 'cb763dcbf6811bd0bcca6f62b474785831d6469050f4a1aada2aac10e156041c  /tmp/kit.tgz' | sha256sum -c -
          tar -xzf /tmp/kit.tgz -C .repo-cleanup/runtime-kit
          echo '8605e24a6e9764affbc2efb4c078bc7aa9f3514bb1e269c3c4ef2f6347a8c7e7  .repo-cleanup/runtime-kit/src/cli.mjs' | sha256sum -c -
          echo '7748d1f6707eb25ec529cad8fed30e83e497a3636bcbf08f5ba9eb5012fcb92e  .repo-cleanup/runtime-kit/src/closure.mjs' | sha256sum -c -
          echo 'b6c9042a8d2d30652e4a72578cedf59fd86108d8c4eaad9ed66e5ae9cd828c37  .repo-cleanup/runtime-kit/src/core.mjs' | sha256sum -c -
          echo '09c84e96ebf7bcc7daba514fca289bf7a4ec5d724e426e21bed9b0088b27b1a2  .repo-cleanup/runtime-kit/src/git.mjs' | sha256sum -c -
          echo '2c4a21211a535a142b0d2eb99def24def51e3497d971f261158b95788685d988  .repo-cleanup/runtime-kit/src/github.mjs' | sha256sum -c -

      - name: Recover immutable preparation evidence
        uses: actions/download-artifact@v4
        with:
          name: repository-cleanup-v3-prepared-34511799800
          path: /tmp/prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34511799800

      - name: Validate exact canonical closure head independently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_SHA"
          git fetch --no-tags origin "$CANONICAL_SHA"
          git cat-file -e "$QUALIFIED_PRODUCT_SHA^{commit}"
          git diff --quiet "$QUALIFIED_PRODUCT_SHA" "$CANONICAL_SHA" -- public/world-v0 src package.json package-lock.json || {
            echo CANONICAL_RUNTIME_DRIFT
            git diff --name-status "$QUALIFIED_PRODUCT_SHA" "$CANONICAL_SHA" -- public/world-v0 src package.json package-lock.json
            exit 1
          }
          git worktree add --detach /tmp/canonical "$CANONICAL_SHA"
          (
            cd /tmp/canonical
            test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
            npm ci
            npm run check
          )
          echo CANONICAL_EXACT_REPOSITORY_VALIDATION_PASS
          echo CANONICAL_RUNTIME_BYTES_MATCH_QUALIFIED_PRODUCT

      - name: Assert exact post-prune namespace inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin | wc -l)" -eq 7
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_SHA"
          test "$(git ls-remote origin refs/heads/archive/repository-cleanup-v3-2026-09-10 | cut -f1)" = '61f202289f0dcbde26cb5d72de67e7a46397c159'
          test "$(git ls-remote origin refs/heads/archive/world-v0-qualified-2p-baseline-2026-09-10 | cut -f1)" = "$QUALIFIED_PRODUCT_SHA"
          test "$(git ls-remote origin refs/heads/archive/world-v0-final-delivery-2026-09-10 | cut -f1)" = 'fa5e45594f0c39ba4e96c13b4ef783bbaae1ba65'
          test "$(git ls-remote origin refs/heads/archive/pre-safe-stop-main-2026-09-10 | cut -f1)" = '829deef82c71780d2d661e7a7e82685739d7b23d'
          test "$(git ls-remote origin refs/heads/maintenance/repository-cleanup-v3-2026-09-10 | cut -f1)" = 'feb2cea533dc227d078b01e13113a32634ca9f78'
          test "$(git ls-remote origin refs/heads/$RUNNER_REF | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin 'refs/tags/repository-cleanup-v3-pre-prune-2026-09-10^{}' | cut -f1)" = '61f202289f0dcbde26cb5d72de67e7a46397c159'

      - name: Create Cleanup Kit v3 closure seal
        shell: bash
        run: |
          set -euo pipefail
          node .repo-cleanup/runtime-kit/src/cli.mjs seal \
            --config=.repo-cleanup/config.json \
            --freeze=/tmp/prepared/freeze.json \
            --archive=/tmp/prepared/archive.json \
            --allow-live="$RUNNER_REF" \
            --docs-out=cleanup-evidence/seal-docs \
            --out=cleanup-evidence/closure-seal.json | tee cleanup-evidence/seal.log

      - name: Publish seal by exact leased archive fast-forward
        shell: bash
        run: |
          set -euo pipefail
          node .repo-cleanup/runtime-kit/src/cli.mjs publish-seal \
            --config=.repo-cleanup/config.json \
            --freeze=/tmp/prepared/freeze.json \
            --archive=/tmp/prepared/archive.json \
            --seal=cleanup-evidence/closure-seal.json \
            --execute | tee cleanup-evidence/publish-seal.log

      - name: Final Cleanup Kit v3 verification
        shell: bash
        run: |
          set -euo pipefail
          node .repo-cleanup/runtime-kit/src/cli.mjs verify \
            --config=.repo-cleanup/config.json \
            --freeze=/tmp/prepared/freeze.json \
            --archive=/tmp/prepared/archive.json \
            --seal=cleanup-evidence/closure-seal.json \
            --out=cleanup-evidence/final-verification.json | tee cleanup-evidence/verify.log
          grep -q '"status": "PASS"' cleanup-evidence/final-verification.json

      - name: Preserve closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v3-seal-${{ github.run_id }}
          path: cleanup-evidence/
          if-no-files-found: warn
          retention-days: 30
