name: Repository terminal tag identity diagnostic

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-terminal-tag-identity-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact frozen runtime around transaction and terminal verification
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/terminal/repository-terminal-closure-vnext.py.gz > /tmp/terminal.py
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/terminal.py').read_text().splitlines()
          for lo,hi in [(326,430),(475,610)]:
              print(f'=== SOURCE {lo}-{hi} ===')
              for n in range(lo-1,min(hi,len(lines))): print(f'{n+1:04d}: {lines[n]}')
          PY
