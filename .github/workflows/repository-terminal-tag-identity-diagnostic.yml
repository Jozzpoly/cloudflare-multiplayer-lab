name: Repository terminal tag identity diagnostic

on:
  push:
    branches: [maintenance/repository-cleanup-v3-atomic-apply-runner-2026-09-10]
    paths:
      - .github/workflows/repository-terminal-tag-identity-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact frozen runtime around tag object creation
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/terminal/repository-terminal-closure-vnext.py.gz > /tmp/terminal.py
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/terminal.py').read_text()
          needles=['GitHub annotated tag object identity mismatch','remote-annotated-tag-objects.json','/git/tags','mktag']
          lines=text.splitlines(); printed=set()
          for needle in needles:
              hits=[i for i,l in enumerate(lines) if needle in l]
              print(f'=== NEEDLE {needle!r} HITS {hits} ===')
              for i in hits:
                  lo=max(0,i-18); hi=min(len(lines),i+19); key=(lo,hi)
                  if key in printed: continue
                  printed.add(key)
                  for n in range(lo,hi): print(f'{n+1:04d}: {lines[n]}')
          PY
