name: Restore canonical staging after aborted experiment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-canonical-staging-2026-09-18.yml

permissions:
  contents: read

concurrency:
  group: restore-canonical-staging-2026-09-18
  cancel-in-progress: false

env:
  EXPECTED_STAGING_WORKER: cloudflare-multiplayer-lab-staging
  STAGING_BASE_URL: https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "RESTORE_EXACT_HEAD=$GITHUB_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Repository and staging target gate
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const staging = config.env?.staging;
          if (!staging) throw new Error("staging env missing");
          if (staging.name !== process.env.EXPECTED_STAGING_WORKER) throw new Error(`staging worker drift: ${staging.name}`);
          if (config.name === staging.name) throw new Error("staging aliases root worker");
          if (staging.workers_dev !== true) throw new Error("staging workers_dev disabled");
          console.log("CANONICAL_STAGING_TARGET_PASS", staging.name);
          NODE

      - name: Dry-run canonical main
        run: npx wrangler deploy --dry-run --env staging --outdir .wrangler/canonical-staging-restore

      - name: Require deploy credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Restore isolated staging Worker from canonical main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:staging | tee restore-staging.log

      - name: Prove public runtime byte identity
        env:
          MW_STAGING_BASE: ${{ env.STAGING_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const files = ["app.js","entry.js","build-contract.js"];
          const base = process.env.MW_STAGING_BASE.replace(/\/$/, "");
          const deadline = Date.now() + 120000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const result = {};
              let all = true;
              for (const file of files) {
                const local = readFileSync(`public/world-v0/${file}`);
                const localSha = createHash("sha256").update(local).digest("hex");
                const response = await fetch(`${base}/world-v0/${file}?restore=${process.env.GITHUB_SHA}&t=${Date.now()}`, {
                  cache: "no-store",
                  signal: AbortSignal.timeout(8000),
                });
                const remote = Buffer.from(await response.arrayBuffer());
                const remoteSha = createHash("sha256").update(remote).digest("hex");
                result[file] = { status: response.status, localSha, remoteSha, equal: response.ok && localSha === remoteSha };
                all &&= result[file].equal;
              }
              last = result;
              if (all) {
                writeFileSync("canonical-staging-restore.json", JSON.stringify({
                  head: process.env.GITHUB_SHA,
                  files: result,
                  verdict: "CANONICAL_STAGING_RESTORE_PASS",
                }, null, 2));
                console.log("CANONICAL_STAGING_RESTORE_PASS", JSON.stringify(result));
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`canonical staging restore byte identity failed: ${JSON.stringify(last)}`);
          NODE

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: canonical-staging-restore-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            restore-staging.log
            canonical-staging-restore.json
            .wrangler/canonical-staging-restore
