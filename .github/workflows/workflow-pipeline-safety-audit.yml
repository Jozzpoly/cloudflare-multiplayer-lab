name: Workflow pipeline false-green audit

on:
  push:
    branches:
      - main
      - world-v0-post-owner-v28-closeout
    paths:
      - .github/workflows/**
      - scripts/workflow-pipeline-safety-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit tee pipelines for exit-code masking
        shell: bash
        env:
          MW_WORKFLOW_PIPELINE_AUDIT_OUTPUT: workflow-pipeline-safety-audit.json
        run: |
          set -euo pipefail
          node scripts/workflow-pipeline-safety-audit.mjs | tee workflow-pipeline-safety-audit.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workflow-pipeline-safety-${{ github.run_id }}
          path: |
            workflow-pipeline-safety-audit.json
            workflow-pipeline-safety-audit.log
