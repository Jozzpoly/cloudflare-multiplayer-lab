name: World V0 Apply Interaction Harness Fix

on:
  push:
    branches: [world-v0-two-phone-readiness-qualification]
    paths: [.github/workflows/world-v0-apply-interaction-harness-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only the causally validated CDP button correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/world-v0-playable-interaction-smoke.mjs')
          s = p.read_text()
          old = ', "none", 1, 0);'
          new = ', "left", 1, 0);'
          matches = [line for line in s.splitlines() if '"mouseMoved"' in line and old in line]
          assert len(matches) == 2, f'expected exactly two held-left mouseMoved calls, got {len(matches)}: {matches}'
          s2 = '\n'.join(line.replace(old, new) if '"mouseMoved"' in line and old in line else line for line in s.splitlines()) + ('\n' if s.endswith('\n') else '')
          p.write_text(s2)
          PY
          node --check scripts/world-v0-playable-interaction-smoke.mjs
          git diff --check
          test "$(git diff --name-only)" = "scripts/world-v0-playable-interaction-smoke.mjs"
          git diff -- scripts/world-v0-playable-interaction-smoke.mjs

      - name: Commit exact harness correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-playable-interaction-smoke.mjs
          git commit -m "fix(world-v0): correct held-button CDP interaction smoke"
          git push origin HEAD:world-v0-two-phone-readiness-qualification
