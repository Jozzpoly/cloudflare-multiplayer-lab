name: World V0 Authority Epoch Loss Candidate Regression

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-authority-epoch-loss-candidate-regression.yml
      - scripts/apply-world-v0-authority-epoch-loss-recovery.mjs
      - scripts/world-v0-authority-epoch-loss-classifier-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-current-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize ephemeral candidate
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-authority-epoch-loss-recovery.mjs
          node --check public/world-v0/app.js
          node --check public/world-v0/authority-epoch-loss.js
          node scripts/world-v0-authority-epoch-loss-classifier-smoke.mjs
          git diff -- public/world-v0/app.js public/world-v0/authority-epoch-loss.js | tee world-v0-candidate-historical.diff
      - name: Canonical repository checks
        run: |
          set -euo pipefail
          npm run check | tee world-v0-candidate-current-check.log
          grep -q 'const ACTOR_RESUME_MAX_ATTEMPTS = 12;' public/world-v0/app.js
          grep -q 'allDisconnectedGraceTicks: 20 \* 60' src/world-v0-contract.ts
          grep -q 'preStartAmbiguityGraceTicks: 20 \* 60' src/world-v0-contract.ts
          grep -q 'activeActorTransportRecoverable' public/world-v0/app.js
          grep -q 'committedStartWindowRecoverable' public/world-v0/app.js
          grep -q 'schedulePreStartAmbiguityRetirement' src/world-v0-shared-yard.ts
          grep -q 'connectedPlayerCount() !== MAX_PLAYERS' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_SESSION_CONTINUITY_REVISION' public/world-v0/session-continuity.js
          grep -q 'takeWorldV0ResumeIntent' public/world-v0/app.js
          grep -q 'live-protected-reserved' src/world-slice-entry.ts
          grep -q 'live-soft-reserved' src/world-slice-entry.ts
          grep -q 'softReservedPlayers' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_AUTHORITY_EPOCH_LOSS_REVISION' public/world-v0/app.js
          grep -q 'authority_epoch_lost_recovery' public/world-v0/app.js
      - name: Start candidate Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-candidate-current-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-candidate-current.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0
            sleep 1
          done
          cat world-v0-candidate-current-wrangler.log
          exit 1
      - name: I1 ActorSession lifecycle
        env:
          MW_WORLD_V0_I1_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I1_RUN: candidate-i1-${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-candidate-i1.log
          grep -q 'WORLD_V0_INTEGRATION_I1_SERVER_SESSION_PASS' world-v0-candidate-i1.log
          grep -q '"oldEpochPreservedAt1800msAllDisconnected": true' world-v0-candidate-i1.log
          grep -q '"oldEpochRetiredAfterGrace": true' world-v0-candidate-i1.log
      - name: Waiting-room fail-closed boundary
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-candidate-waiting-room.json
        run: |
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-candidate-waiting-room.log
          grep -q WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS world-v0-candidate-waiting-room.log
      - name: Uncommitted-ready ambiguity recovery
        env:
          MW_WORLD_V0_UNCOMMITTED_READY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_UNCOMMITTED_READY_OUTPUT: world-v0-candidate-uncommitted-ready.json
        run: |
          timeout 90s node scripts/world-v0-closure-uncommitted-ready-audit.mjs | tee world-v0-candidate-uncommitted-ready.log
          grep -q WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS world-v0-candidate-uncommitted-ready.log
      - name: Partial prestart resume live-start
        env:
          MW_WORLD_V0_PRESTART_PARTIAL_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_PARTIAL_OUTPUT: world-v0-candidate-prestart-partial.json
        run: |
          timeout 45s node scripts/world-v0-closure-prestart-partial-resume-audit.mjs | tee world-v0-candidate-prestart-partial.log
          grep -q WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_GATE_PASS world-v0-candidate-prestart-partial.log
      - name: Bounded two-player prestart ambiguity grace
        env:
          MW_WORLD_V0_PRESTART_GRACE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_GRACE_OUTPUT: world-v0-candidate-prestart-grace.json
        run: |
          timeout 45s node scripts/world-v0-closure-prestart-grace-probe.mjs | tee world-v0-candidate-prestart-grace.log
          grep -q WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS world-v0-candidate-prestart-grace.log
      - name: Committed-start ActorSession recovery window
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-candidate-start-window.json
        run: |
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-candidate-start-window.log
          grep -q WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS world-v0-candidate-start-window.log
      - name: Cross-page ActorSession resume and truthful presence
        env:
          MW_WORLD_V0_CROSS_PAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_CROSS_PAGE_ROOM: yard-3
          MW_WORLD_V0_CROSS_PAGE_OUTPUT: world-v0-candidate-cross-page.json
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-cross-page-resume-browser-audit.mjs | tee world-v0-candidate-cross-page.log
          grep -q WORLD_V0_CROSS_PAGE_RESUME_PASS world-v0-candidate-cross-page.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e=JSON.parse(readFileSync("world-v0-candidate-cross-page.json","utf8"));
          if(e.original?.worldEpoch!==e.peerAfter?.worldEpoch||e.original?.actorSessionId!==e.peerAfter?.actorSessionId||e.original?.netEntityId!==e.peerAfter?.netEntityId) throw new Error("cross-page identity regression");
          if(e.reservedRoom?.connected!==1||e.reservedRoom?.reserved!==1||e.restoredRoom?.connected!==2||e.restoredRoom?.reserved!==0) throw new Error("cross-page presence regression");
          if(e.peerAfter?.guardMismatches!==0||e.ownerAfter?.guardMismatches!==0) throw new Error("cross-page guard regression");
          NODE
      - name: Bounded all-transport-loss window
        env:
          MW_WORLD_V0_ALL_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ALL_DROP_DELAYS: 500,1500,5000,11000,14500,19000,21000
        run: |
          set -euo pipefail
          node scripts/world-v0-closure-all-drop-window-probe.mjs | tee world-v0-candidate-all-drop.log
          grep -q WORLD_V0_CLOSURE_ALL_DROP_WINDOW_MAPPED world-v0-candidate-all-drop.log
          for delay in 500 1500 5000 11000 14500 19000; do
            grep -E "WORLD_V0_ALL_DROP_CASE .*\"delayMs\":${delay}.*\"classification\":\"preserved\"" world-v0-candidate-all-drop.log >/dev/null
          done
          grep -E 'WORLD_V0_ALL_DROP_CASE .*"delayMs":21000.*"classification":"retired"' world-v0-candidate-all-drop.log >/dev/null
      - name: Automatic ActorSession exact-rebase 14s
        env:
          MW_WORLD_V0_I4B_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I4B_OFFLINE_MS: "14000"
          MW_WORLD_V0_I4B_OUTPUT: world-v0-candidate-i4b.json
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-integration-i4b-authority-probe.mjs | tee world-v0-candidate-i4b-authority.log
          node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-candidate-i4b.log
          grep -q WORLD_V0_INTEGRATION_I4B_AUTHORITY_EXACT_REBASE_PASS world-v0-candidate-i4b-authority.log
          grep -q WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS world-v0-candidate-i4b.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e=JSON.parse(readFileSync("world-v0-candidate-i4b.json","utf8"));
          if(e.offlineMs!==14000||!e.actorSession?.preserved||!e.actorSession?.netEntityPreserved||e.exactness?.guardMismatches!==0) throw new Error("14s exact resume regression");
          NODE
      - name: Dual-browser hard-drop 14.5s prior failing edge
        env:
          MW_WORLD_V0_DUAL_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DUAL_BROWSER_OFFLINE_MS: "14500"
          MW_WORLD_V0_DUAL_BROWSER_OUTPUT: world-v0-candidate-dual-browser.json
        run: |
          set -euo pipefail
          timeout 90s node --experimental-strip-types scripts/world-v0-closure-dual-browser-grace-audit.mjs | tee world-v0-candidate-dual-browser.log
          grep -q WORLD_V0_CLOSURE_DUAL_BROWSER_GRACE_PASS world-v0-candidate-dual-browser.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e=JSON.parse(readFileSync("world-v0-candidate-dual-browser.json","utf8"));
          if(e.offlineMs!==14500||e.proxy?.drop?.activeBeforeDrop<2||e.proxy?.drop?.hardDrops<2||e.proxy?.beforeRestore?.blockedAccepts<1) throw new Error("dual hard-drop apparatus invalid");
          if(!Array.isArray(e.clients)||e.clients.length!==2||e.clients.some(c=>c.guardMismatches!==0)) throw new Error("dual recovery regression");
          NODE
      - name: Human-entry and foreign-profile reopen truth
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-candidate-human-entry.json
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-human-entry-browser-smoke.mjs | tee world-v0-candidate-human-entry.log
          grep -q WORLD_V0_HUMAN_ENTRY_PASS world-v0-candidate-human-entry.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e=JSON.parse(readFileSync("world-v0-candidate-human-entry.json","utf8"));
          if(!e.peerTabCloseFreshReopenRejectedTruthfully||!e.healthyOwnerWorldEpochPreservedAcrossPeerReopen) throw new Error("human-entry truth regression");
          NODE
      - name: Stop candidate Workerd
        if: always()
        run: if [ -f /tmp/world-v0-candidate-current.pid ]; then kill "$(cat /tmp/world-v0-candidate-current.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-authority-loss-candidate-historical-${{ github.run_id }}
          path: |
            world-v0-candidate-historical.diff
            world-v0-candidate-*.log
            world-v0-candidate-*.json
          if-no-files-found: warn
          retention-days: 30

  adversarial-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize ephemeral candidate and static checks
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-authority-epoch-loss-recovery.mjs
          node --check public/world-v0/app.js
          node --check public/world-v0/authority-epoch-loss.js
          node scripts/world-v0-authority-epoch-loss-classifier-smoke.mjs
          node --check scripts/world-v0-live-rebind-browser-audit.mjs
          node --check scripts/world-v0-keyboard-real-input-browser-audit.mjs
          node --check scripts/world-v0-soft-preemption-browser-audit.mjs
          node --check scripts/world-v0-prestart-vacant-capacity-probe.mjs
          node --check scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs
          npm run check
          git diff -- public/world-v0/app.js public/world-v0/authority-epoch-loss.js | tee world-v0-candidate-adversarial.diff
      - name: Start isolated candidate Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-candidate-adversarial-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-candidate-adversarial.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 1; done
          cat world-v0-candidate-adversarial-wrangler.log
          exit 1
      - name: Same-owner live takeover
        env:
          MW_WORLD_V0_LIVE_REBIND_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_LIVE_REBIND_ROOM: yard-1
          MW_WORLD_V0_LIVE_REBIND_OUTPUT: world-v0-candidate-live-rebind.json
        run: |
          timeout 120s node scripts/world-v0-live-rebind-browser-audit.mjs | tee world-v0-candidate-live-rebind.log
          grep -q WORLD_V0_LIVE_REBIND_PASS world-v0-candidate-live-rebind.log
      - name: Physical WASD remains text input
        env:
          MW_WORLD_V0_KEYBOARD_REAL_BASE: http://127.0.0.1:8787
        run: |
          timeout 90s node scripts/world-v0-keyboard-real-input-browser-audit.mjs | tee world-v0-candidate-keyboard.log
          grep -q WORLD_V0_KEYBOARD_REAL_INPUT_PASS world-v0-candidate-keyboard.log
      - name: Soft-preemption automatic recovery
        env:
          MW_WORLD_V0_SOFT_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_SOFT_BROWSER_ROOM: yard-3
          MW_WORLD_V0_SOFT_BROWSER_OUTPUT: world-v0-candidate-soft-browser.json
        run: |
          timeout 150s node scripts/world-v0-soft-preemption-browser-audit.mjs | tee world-v0-candidate-soft-browser.log
          grep -q WORLD_V0_SOFT_PREEMPTION_BROWSER_PASS world-v0-candidate-soft-browser.log
      - name: Zero-online prestart capacity
        env:
          MW_WORLD_V0_PRESTART_VACANT_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_VACANT_ROOM: yard-2
        run: |
          timeout 60s node scripts/world-v0-prestart-vacant-capacity-probe.mjs | tee world-v0-candidate-prestart-vacant.log
          grep -q WORLD_V0_PRESTART_VACANT_CAPACITY_PASS world-v0-candidate-prestart-vacant.log
      - name: Exact Owner-shape resumed-stayer handoff
        env:
          MW_WORLD_V0_RSH_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RSH_ROOM: yard-2
          MW_WORLD_V0_RSH_OBSERVE_MS: "10000"
          MW_WORLD_V0_RSH_OUTPUT: world-v0-candidate-resumed-stayer.json
        run: |
          timeout 150s node scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs | tee world-v0-candidate-resumed-stayer.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_PASS world-v0-candidate-resumed-stayer.log
      - name: Stop isolated candidate Workerd
        if: always()
        run: if [ -f /tmp/world-v0-candidate-adversarial.pid ]; then kill "$(cat /tmp/world-v0-candidate-adversarial.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-authority-loss-candidate-adversarial-${{ github.run_id }}
          path: |
            world-v0-candidate-adversarial.diff
            world-v0-candidate-adversarial-wrangler.log
            world-v0-candidate-live-rebind.json
            world-v0-candidate-live-rebind.log
            world-v0-candidate-keyboard.log
            world-v0-candidate-soft-browser.json
            world-v0-candidate-soft-browser.log
            world-v0-candidate-prestart-vacant.log
            world-v0-candidate-resumed-stayer.json
            world-v0-candidate-resumed-stayer.log
          if-no-files-found: warn
          retention-days: 30
