name: World V0 Authority Reset Browser Baseline

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-authority-reset-browser-baseline.yml
      - scripts/world-v0-authority-reset-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-failure-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Confirm current browser client fails after authority epoch loss
        env:
          MW_WORLD_V0_AUTHORITY_RESET_EXPECT: fatal
          MW_WORLD_V0_AUTHORITY_RESET_BROWSER_OUTPUT: world-v0-authority-reset-browser-baseline.json
        run: |
          set -euo pipefail
          node --check scripts/world-v0-authority-reset-browser-audit.mjs
          timeout 150s node scripts/world-v0-authority-reset-browser-audit.mjs | tee world-v0-authority-reset-browser-baseline.log
          grep -q WORLD_V0_AUTHORITY_RESET_BROWSER_FATAL_CONFIRMED world-v0-authority-reset-browser-baseline.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-authority-reset-browser-baseline-${{ github.run_id }}
          path: |
            world-v0-authority-reset-browser-baseline.json
            world-v0-authority-reset-browser-baseline.log
          if-no-files-found: warn
          retention-days: 30
