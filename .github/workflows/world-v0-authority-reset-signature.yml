name: World V0 Authority Reset Signature

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-authority-reset-signature.yml
      - scripts/world-v0-authority-reset-signature.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Reproduce process-reset transport signature
        run: |
          set -euo pipefail
          node --check scripts/world-v0-authority-reset-signature.mjs
          timeout 120s node scripts/world-v0-authority-reset-signature.mjs | tee world-v0-authority-reset-signature.log
          grep -q WORLD_V0_AUTHORITY_RESET_SIGNATURE_PASS world-v0-authority-reset-signature.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-authority-reset-signature-${{ github.run_id }}
          path: world-v0-authority-reset-signature.log
          if-no-files-found: warn
          retention-days: 30
