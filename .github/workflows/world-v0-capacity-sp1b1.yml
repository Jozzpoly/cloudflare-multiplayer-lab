name: World V0 Capacity SP1B1 Preallocation A-B

on:
  push:
    branches: [world-v0-capacity-sp1b1-preallocation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-capacity-sp1b1-preallocation
  cancel-in-progress: true

jobs:
  preallocation-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax-check SP1B1 apparatus
        run: |
          node --check public/world-v0-stress/phenomenon-manifest.js
          node --check scripts/world-v0-recording-preallocation-ab.mjs

      - name: Run production-shaped preallocation A-B
        run: node scripts/world-v0-recording-preallocation-ab.mjs | tee world-v0-recording-preallocation-ab.json

      - name: Upload SP1B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-capacity-sp1b1-preallocation-attempt-${{ github.run_attempt }}
          path: world-v0-recording-preallocation-ab.json
          if-no-files-found: error
          retention-days: 14
