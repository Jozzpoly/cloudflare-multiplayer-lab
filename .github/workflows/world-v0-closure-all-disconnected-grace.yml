name: World V0 Closure All-Disconnected Grace

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - scripts/materialize-world-v0-all-disconnected-grace.mjs
      - .github/workflows/world-v0-closure-all-disconnected-grace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-closure-all-disconnected-grace
  cancel-in-progress: false

env:
  BASE_SHA: f28748f459bb0ea5d6ae6291ebca5e7fff059244

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: world-v0-closure-stabilization

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove bounded pre-materialization surface
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          pre="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$pre"
          bad="$(printf '%s\n' "$pre" | grep -Ev '^(scripts/materialize-world-v0-all-disconnected-grace\.mjs|\.github/workflows/world-v0-closure-all-disconnected-grace\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected pre-grace diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          node --check scripts/materialize-world-v0-all-disconnected-grace.mjs

      - name: Materialize bounded all-disconnected grace
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/materialize-world-v0-all-disconnected-grace.mjs | tee world-v0-all-disconnected-materialize.log
          grep -q 'WORLD_V0_ALL_DISCONNECTED_GRACE_MATERIALIZED' world-v0-all-disconnected-materialize.log
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/world-v0-contract\.ts|src/world-v0-shared-yard\.ts|public/world-v0/build-contract\.js|scripts/world-v0-integration-i1-lifecycle-probe\.mjs)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected materialized grace file:" >&2
            echo "$bad" >&2
            exit 1
          fi
          for expected in src/world-v0-contract.ts src/world-v0-shared-yard.ts public/world-v0/build-contract.js scripts/world-v0-integration-i1-lifecycle-probe.mjs; do
            printf '%s\n' "$changed" | grep -qx "$expected" || { echo "Missing expected grace file $expected" >&2; exit 1; }
          done

      - name: Current repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-grace-check.log

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-grace-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-grace-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "grace Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-grace-wrangler.log
          exit 1

      - name: Map repaired all-transport-loss window
        env:
          MW_WORLD_V0_ALL_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ALL_DROP_DELAYS: 500,750,1500,5000,11000,16000
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-closure-all-drop-window-probe.mjs | tee world-v0-grace-window.log
          grep -q 'WORLD_V0_CLOSURE_ALL_DROP_WINDOW_MAPPED' world-v0-grace-window.log
          for delay in 500 750 1500 5000 11000; do
            grep -E "WORLD_V0_ALL_DROP_CASE .*\"delayMs\":${delay}.*\"classification\":\"preserved\"" world-v0-grace-window.log >/dev/null
          done
          grep -E 'WORLD_V0_ALL_DROP_CASE .*"delayMs":16000.*"classification":"retired"' world-v0-grace-window.log >/dev/null
          echo WORLD_V0_ALL_DISCONNECTED_GRACE_WINDOW_PASS

      - name: Requalify current I1 lifecycle semantics
        env:
          MW_WORLD_V0_I1_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I1_RUN: closure-i1-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-grace-i1.log
          grep -q 'WORLD_V0_INTEGRATION_I1_SERVER_SESSION_PASS' world-v0-grace-i1.log
          grep -q '"oldEpochPreservedAt1800msAllDisconnected": true' world-v0-grace-i1.log
          grep -q '"oldEpochRetiredAfterGrace": true' world-v0-grace-i1.log

      - name: Requalify human-entry / close-reopen boundary
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-grace-human-entry.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-human-entry-browser-smoke.mjs | tee world-v0-grace-human-entry.log
          grep -q 'WORLD_V0_HUMAN_ENTRY_PASS' world-v0-grace-human-entry.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-grace-human-entry.json", "utf8"));
          if (evidence.peerTabCloseFreshReopenRejectedTruthfully !== true) throw new Error("fresh reopen truth regression");
          if (evidence.healthyOwnerWorldEpochPreservedAcrossPeerReopen !== true) throw new Error("healthy owner continuity regression");
          console.log("WORLD_V0_ALL_DISCONNECTED_GRACE_HUMAN_ENTRY_PASS", evidence.worldEpoch);
          NODE

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-grace-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-grace-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-closure-all-disconnected-grace-${{ github.run_attempt }}
          path: |
            world-v0-all-disconnected-materialize.log
            world-v0-grace-check.log
            world-v0-grace-wrangler.log
            world-v0-grace-window.log
            world-v0-grace-i1.log
            world-v0-grace-human-entry.log
            world-v0-grace-human-entry.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit exact qualified grace bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world-v0-contract.ts src/world-v0-shared-yard.ts public/world-v0/build-contract.js scripts/world-v0-integration-i1-lifecycle-probe.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No grace bytes to commit"; exit 0; }
          git commit -m "fix(world-v0): add bounded all-disconnected grace"
          git push origin HEAD:world-v0-closure-stabilization
