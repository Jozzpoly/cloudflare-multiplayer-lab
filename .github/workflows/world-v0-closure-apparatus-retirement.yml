name: World V0 Closure Apparatus Retirement

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - scripts/materialize-world-v0-apparatus-retirement.mjs
      - .github/workflows/world-v0-closure-apparatus-retirement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-closure-apparatus-retirement
  cancel-in-progress: false

env:
  BASE_SHA: 2385e4bae446100431cdcdd680acc0b252213a8b

jobs:
  retire-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: world-v0-closure-stabilization

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove bounded pre-materialization surface
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          pre="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$pre"
          bad="$(printf '%s\n' "$pre" | grep -Ev '^(scripts/materialize-world-v0-apparatus-retirement\.mjs|\.github/workflows/world-v0-closure-apparatus-retirement\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected apparatus-retirement pre-diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          node --check scripts/materialize-world-v0-apparatus-retirement.mjs

      - name: Materialize fail-closed historical guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-world-v0-apparatus-retirement.mjs | tee world-v0-apparatus-retirement.log
          grep -q 'WORLD_V0_STALE_APPARATUS_RETIRED' world-v0-apparatus-retirement.log
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^scripts/world-v0-(session-friction-smoke|authority-runtime-smoke)\.mjs$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected retired-apparatus file:" >&2
            echo "$bad" >&2
            exit 1
          fi
          for expected in scripts/world-v0-session-friction-smoke.mjs scripts/world-v0-authority-runtime-smoke.mjs; do
            printf '%s\n' "$changed" | grep -qx "$expected" || { echo "Missing retired apparatus $expected" >&2; exit 1; }
          done

      - name: Prove stale apparatus refuses accidental current execution
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/world-v0-session-friction-smoke.mjs scripts/world-v0-authority-runtime-smoke.mjs; do
            set +e
            output="$(node "$script" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            test "$status" -ne 0 || { echo "$script unexpectedly executed as a current gate" >&2; exit 1; }
            printf '%s\n' "$output" | grep -q 'HISTORICAL APPARATUS ONLY' || { echo "$script did not fail with historical-apparatus guard" >&2; exit 1; }
          done
          echo WORLD_V0_STALE_APPARATUS_FAIL_CLOSED_PASS

      - name: Current repository checks remain green
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-apparatus-current-check.log

      - name: Commit exact retirement guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-session-friction-smoke.mjs scripts/world-v0-authority-runtime-smoke.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No apparatus retirement bytes to commit"; exit 0; }
          git commit -m "test(world-v0): retire pre-I1 lifecycle apparatus"
          git push origin HEAD:world-v0-closure-stabilization
