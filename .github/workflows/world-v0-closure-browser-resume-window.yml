name: World V0 Closure Browser Resume Window

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-browser-resume-window.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-closure-browser-resume-window
  cancel-in-progress: false

jobs:
  qualify-and-materialize-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "world-v0-closure-stabilization"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Materialize bounded client repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-world-v0-browser-resume-window.mjs | tee world-v0-closure-browser-resume-materialize.log
          grep -q 'WORLD_V0_CLOSURE_BROWSER_RESUME_WINDOW_MATERIALIZED' world-v0-closure-browser-resume-materialize.log
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "public/world-v0/app.js"
            "public/world-v0/build-contract.js"
          )
          printf '%s\n' "${changed[@]}" > world-v0-closure-browser-resume-changed-files.txt
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          grep -q 'const ACTOR_RESUME_MAX_ATTEMPTS = 12;' public/world-v0/app.js
          grep -q 'shared-yard-v0-browser-ui-v11-resume-window' public/world-v0/build-contract.js

      - name: Full repository checks on materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-closure-browser-resume-check.log

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-closure-browser-resume-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-closure-browser-resume-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "browser resume repair Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-closure-browser-resume-wrangler.log
          exit 1

      - name: Require real Chromium exact rebase after 14 second outage
        env:
          MW_WORLD_V0_I4B_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I4B_OFFLINE_MS: 14000
          MW_WORLD_V0_I4B_OUTPUT: world-v0-closure-browser-resume-14s.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-closure-browser-resume-14s.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' world-v0-closure-browser-resume-14s.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-closure-browser-resume-14s.json", "utf8"));
          if (evidence.offlineMs !== 14000) throw new Error(`unexpected outage ${evidence.offlineMs}`);
          if (evidence.actorSession?.preserved !== true) throw new Error("ActorSession was not preserved");
          if (evidence.actorSession?.netEntityPreserved !== true) throw new Error("NetEntity was not preserved");
          if (evidence.exactness?.guardMismatches !== 0) throw new Error("exact-state guard mismatch");
          if (!(evidence.gap?.gapTicks > evidence.gap?.inputLeaseMissingTicks)) throw new Error("outage did not cross input lease");
          console.log("WORLD_V0_CLOSURE_BROWSER_RESUME_14S_REPAIR_PASS", evidence.gap.gapTicks);
          NODE

      - name: Requalify browser human-entry and fresh-reopen truth
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-closure-browser-resume-human-entry.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-human-entry-browser-smoke.mjs | tee world-v0-closure-browser-resume-human-entry.log
          grep -q 'WORLD_V0_HUMAN_ENTRY_PASS' world-v0-closure-browser-resume-human-entry.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-closure-browser-resume-human-entry.json", "utf8"));
          if (evidence.peerTabCloseFreshReopenRejectedTruthfully !== true) throw new Error("fresh reopen truth regression");
          if (evidence.healthyOwnerWorldEpochPreservedAcrossPeerReopen !== true) throw new Error("healthy Owner continuity regression");
          console.log("WORLD_V0_CLOSURE_BROWSER_RESUME_HUMAN_ENTRY_PASS", evidence.worldEpoch);
          NODE

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-closure-browser-resume-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-closure-browser-resume-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Commit exact qualified runtime repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "public/world-v0/app.js"
            "public/world-v0/build-contract.js"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${staged[$i]}" = "${expected[$i]}"
          done
          git commit -m "fix(world-v0): extend actor resume window"
          git push origin HEAD:world-v0-closure-stabilization

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-closure-browser-resume-repair-${{ github.run_attempt }}
          path: |
            world-v0-closure-browser-resume-materialize.log
            world-v0-closure-browser-resume-changed-files.txt
            world-v0-closure-browser-resume-check.log
            world-v0-closure-browser-resume-wrangler.log
            world-v0-closure-browser-resume-14s.log
            world-v0-closure-browser-resume-14s.json
            world-v0-closure-browser-resume-human-entry.log
            world-v0-closure-browser-resume-human-entry.json
          if-no-files-found: warn
          retention-days: 14
