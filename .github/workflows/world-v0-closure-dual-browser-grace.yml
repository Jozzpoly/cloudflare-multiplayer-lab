name: World V0 Closure Dual Browser Grace

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-dual-browser-grace.yml
      - scripts/world-v0-closure-dual-browser-grace-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-closure-dual-browser-grace
  cancel-in-progress: false

jobs:
  dual-browser-grace:
    strategy:
      fail-fast: false
      matrix:
        offline_ms: [14000, 14500]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-closure-dual-browser-${{ matrix.offline_ms }}-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-closure-dual-browser-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "dual-browser grace Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-closure-dual-browser-${{ matrix.offline_ms }}-wrangler.log
          exit 1

      - name: Require dual-browser same-world recovery after bidirectional hard drop
        env:
          MW_WORLD_V0_DUAL_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DUAL_BROWSER_OFFLINE_MS: ${{ matrix.offline_ms }}
          MW_WORLD_V0_DUAL_BROWSER_OUTPUT: world-v0-closure-dual-browser-${{ matrix.offline_ms }}.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-closure-dual-browser-grace-audit.mjs | tee world-v0-closure-dual-browser-${{ matrix.offline_ms }}.log
          grep -q 'WORLD_V0_CLOSURE_DUAL_BROWSER_GRACE_PASS' world-v0-closure-dual-browser-${{ matrix.offline_ms }}.log

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-closure-dual-browser-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-closure-dual-browser-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload dual-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-closure-dual-browser-${{ matrix.offline_ms }}-${{ github.run_attempt }}
          path: |
            world-v0-closure-dual-browser-${{ matrix.offline_ms }}-wrangler.log
            world-v0-closure-dual-browser-${{ matrix.offline_ms }}.log
            world-v0-closure-dual-browser-${{ matrix.offline_ms }}.json
          if-no-files-found: warn
          retention-days: 14
