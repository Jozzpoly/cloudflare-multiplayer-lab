name: World V0 Closure Prestart Ambiguity Repair

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-prestart-ambiguity-repair.yml

permissions:
  contents: write

concurrency:
  group: world-v0-closure-prestart-ambiguity-repair
  cancel-in-progress: false

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Guard exact live branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"

      - name: Materialize bounded prestart ambiguity candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, before, after, label):
              if text.count(before) != 1:
                  raise SystemExit(f"{label}: expected one marker, got {text.count(before)}")
              return text.replace(before, after)

          contract_path = Path('src/world-v0-contract.ts')
          contract = contract_path.read_text()
          contract = replace_once(contract,
              'export const WORLD_V0_CONTRACT_REVISION = "shared-yard-v0-contract-v10-retry-aligned-grace";\nexport const WORLD_V0_SERVER_REVISION = "shared-yard-v0-authority-v7-retry-aligned-grace";',
              'export const WORLD_V0_CONTRACT_REVISION = "shared-yard-v0-contract-v11-prestart-ambiguity-grace";\nexport const WORLD_V0_SERVER_REVISION = "shared-yard-v0-authority-v8-prestart-ambiguity-grace";',
              'revision')
          contract = replace_once(contract,
              '// Actor input still fails neutral after the 36-tick lease. WorldEpoch lifetime is\n// separate and must outlive the browser\'s current 12-attempt (~18.25 s nominal)\n// ActorSession resume schedule with bounded handshake/detection margin.\nexport const WORLD_V0_LIFECYCLE = {\n  allDisconnectedGraceTicks: 20 * 60,\n} as const;',
              '// Actor input still fails neutral after the 36-tick lease. WorldEpoch lifetime is\n// separate and must outlive the browser\'s current 12-attempt (~18.25 s nominal)\n// ActorSession resume schedule with bounded handshake/detection margin. A fully\n// assembled two-player pre-start room gets the same bounded window because the\n// authority cannot distinguish a lost final ready frame from a browser that never\n// sent it. A one-player waiting room remains fail-closed on disconnect.\nexport const WORLD_V0_LIFECYCLE = {\n  allDisconnectedGraceTicks: 20 * 60,\n  preStartAmbiguityGraceTicks: 20 * 60,\n} as const;',
              'lifecycle')
          contract_path.write_text(contract)

          server_path = Path('src/world-v0-shared-yard.ts')
          server = server_path.read_text()
          server = replace_once(server,
              '  private allDisconnectedSinceTick: number | null = null;\n  private supportContacts:',
              '  private allDisconnectedSinceTick: number | null = null;\n  private preStartAmbiguityTimer: ReturnType<typeof setTimeout> | null = null;\n  private supportContacts:',
              'timer-field')
          server = replace_once(server,
              '    player.socket = server;\n    if (resumed) player.resumeCount += 1;\n    this.sessionBySocket.set(server, player.sessionId);\n    const rebaseSeed = resumed && this.protocolStartTick !== null',
              '    player.socket = server;\n    if (resumed) player.resumeCount += 1;\n    this.sessionBySocket.set(server, player.sessionId);\n    if (this.protocolStartTick === null && this.connectedPlayerCount() === MAX_PLAYERS) {\n      this.clearPreStartAmbiguityTimer();\n    }\n    const rebaseSeed = resumed && this.protocolStartTick !== null',
              'resume-clears-grace')
          server = replace_once(server,
              '    if ([...this.players.values()].some((player) => !player.ready)) return;\n\n    this.protocolStartTick = this.tick + WORLD_V0_TIMING.protocolStartDelayTicks;',
              '    if ([...this.players.values()].some((player) => !player.ready)) return;\n\n    this.clearPreStartAmbiguityTimer();\n    this.protocolStartTick = this.tick + WORLD_V0_TIMING.protocolStartDelayTicks;',
              'start-clears-grace')
          old_detach = '''  private detachSocket(ws: WebSocket): void {
    const sessionId = this.sessionBySocket.get(ws);
    this.sessionBySocket.delete(ws);
    if (!sessionId) return;
    const player = this.players.get(sessionId);
    if (!player || player.socket !== ws) return;
    player.socket = null;

    // Before canonical play starts there is no ticking input lease and no earned
    // same-epoch run continuity yet. Preserve the old fail-closed waiting-room
    // behavior so a vanished peer cannot strand an occupied ActorSession slot.
    if (this.protocolStartTick === null) {
      this.endEpoch("peer_disconnected_before_start");
    }
  }
'''
          new_detach = '''  private clearPreStartAmbiguityTimer(): void {
    if (this.preStartAmbiguityTimer) clearTimeout(this.preStartAmbiguityTimer);
    this.preStartAmbiguityTimer = null;
  }

  private schedulePreStartAmbiguityRetirement(): void {
    if (this.preStartAmbiguityTimer || this.protocolStartTick !== null || this.players.size !== MAX_PLAYERS) return;
    const graceMs = WORLD_V0_LIFECYCLE.preStartAmbiguityGraceTicks * STEP_MS;
    this.preStartAmbiguityTimer = setTimeout(() => {
      this.preStartAmbiguityTimer = null;
      if (this.protocolStartTick !== null || this.players.size !== MAX_PLAYERS) return;
      if (this.connectedPlayerCount() === MAX_PLAYERS) return;
      this.endEpoch("peer_disconnected_before_start_grace_expired");
    }, graceMs);
  }

  private detachSocket(ws: WebSocket): void {
    const sessionId = this.sessionBySocket.get(ws);
    this.sessionBySocket.delete(ws);
    if (!sessionId) return;
    const player = this.players.get(sessionId);
    if (!player || player.socket !== ws) return;
    player.socket = null;

    // A one-player waiting room has no ambiguous start commitment and remains
    // fail-closed. Once two actors have been assembled, however, a browser may
    // have sent its final ready frame without the authority receiving it. Preserve
    // that exact pre-start ambiguity for one bounded ActorSession retry horizon.
    if (this.protocolStartTick === null) {
      if (this.players.size === MAX_PLAYERS) this.schedulePreStartAmbiguityRetirement();
      else this.endEpoch("peer_disconnected_before_start");
    }
  }
'''
          server = replace_once(server, old_detach, new_detach, 'detach-policy')
          server = replace_once(server,
              '  private endEpoch(reason: string): void {\n    if (this.resetting) return;\n    this.resetting = true;\n    const identity = this.identityPayloadSafe();',
              '  private endEpoch(reason: string): void {\n    if (this.resetting) return;\n    this.resetting = true;\n    this.clearPreStartAmbiguityTimer();\n    const identity = this.identityPayloadSafe();',
              'end-clears-grace')
          server = replace_once(server,
              '  private destroyWorld(): void {\n    if (this.world) {',
              '  private destroyWorld(): void {\n    this.clearPreStartAmbiguityTimer();\n    if (this.world) {',
              'destroy-clears-grace')
          server_path.write_text(server)

          audit_path = Path('scripts/world-v0-closure-uncommitted-ready-audit.mjs')
          audit = audit_path.read_text()
          audit = replace_once(audit,
              '      if (message?.type === "world_v0_ready") {\n        window.__mwHeldReadyCount = (window.__mwHeldReadyCount || 0) + 1;\n        window.__mwHeldReady = String(data);\n        return;\n      }',
              '      if (message?.type === "world_v0_ready" && (window.__mwHeldReadyCount || 0) === 0) {\n        window.__mwHeldReadyCount = 1;\n        window.__mwHeldReady = String(data);\n        return;\n      }',
              'hold-first-ready-only')
          audit = replace_once(audit,
              '  rawA.ws.send(JSON.stringify({ type: "world_v0_ping", id: 771 }));\n  const pong = await waitRaw(rawA, (m) => m?.type === "world_v0_pong" && m.id === 771, "A pre-drop pong");',
              '  rawA.ws.send(JSON.stringify({ type: "world_v0_ping", id: "pre-drop-771" }));\n  const pong = await waitRaw(rawA, (m) => m?.type === "world_v0_pong" && m.id === "pre-drop-771", "A pre-drop pong");',
              'valid-ping')
          start = audit.index('  await waitBrowser(browser,\n    \'(() => { const e=window.__sharedYardV0Evidence?.(); return e?.session?.actorResume?.pending === true')
          end = audit.index('  writeFileSync(OUTPUT, JSON.stringify(result, null, 2));', start)
          replacement = '''  await waitBrowser(browser,
    '(() => { const e=window.__sharedYardV0Evidence?.(); return (e?.lifecycleEvents || []).some((event) => event.type === "actor-resume-attempt"); })()',
    "B automatic ambiguity recovery attempt", 8000);
  const afterDrop = await evidence(browser);

  await waitBrowser(browser,
    '(() => { const e=window.__sharedYardV0Evidence?.(); return !e?.runtimeFailed && (e?.lifecycleEvents || []).some((event) => event.type === "actor-resume-prestart-complete"); })()',
    "B prestart ActorSession resume complete", 8000);
  const resumedPreStart = await evidence(browser);
  assert(resumedPreStart.identity?.worldEpoch === aw.worldEpoch, "B prestart resume rotated WorldEpoch");
  assert(resumedPreStart.session?.actorSessionId === captured.selfSessionId, "B prestart resume changed ActorSession");
  assert(!rawA.messages.some((m) => m?.type === "world_v0_epoch_ended"), "authority ended ambiguity epoch during successful resume");

  const startA = await waitRaw(rawA, (m) => m?.type === "world_v0_start", "A start after B resumed ready", 8000);
  await waitBrowser(browser,
    '(() => { const e=window.__sharedYardV0Evidence?.(); return !e?.runtimeFailed && Number.isInteger(e?.protocolStartTick) && Number.isInteger(e?.localBoundaryTick); })()',
    "B active after ambiguity recovery", 8000);
  const activeB = await evidence(browser);
  assert(startA.worldEpoch === aw.worldEpoch, "authority rotated epoch before recovered start");
  assert(activeB.identity?.worldEpoch === aw.worldEpoch, "B active world rotated after ambiguity recovery");
  assert(activeB.session?.actorSessionId === captured.selfSessionId, "B active ActorSession changed after ambiguity recovery");
  assert(activeB.metrics?.guardMismatches === 0, "B exact-state guard mismatch after ambiguity recovery");
  assert(!rawA.messages.some((m) => m?.type === "world_v0_epoch_ended"), "authority ended recovered ambiguity epoch");

  result = {
    revision: "world-v0-closure-uncommitted-ready-v2-recovered",
    chromeVersion: version,
    run,
    authorityBeforeDrop: {
      worldEpoch: aw.worldEpoch,
      rosterPlayers: rosterA.players.length,
      protocolStartTick: pong.protocolStartTick,
      startObserved: false,
    },
    browserBeforeDrop: {
      networkState: before.networkState,
      protocolStartTick: before.protocolStartTick,
      localBoundaryTick: before.localBoundaryTick,
      heldReadyCount: await browser.cdp.evaluate(browser.sessionId, "window.__mwHeldReadyCount || 0"),
      actorSessionId: captured.selfSessionId,
    },
    recovery: {
      attemptObserved: (afterDrop.lifecycleEvents || []).some((event) => event.type === "actor-resume-attempt"),
      prestartResumeObserved: (resumedPreStart.lifecycleEvents || []).some((event) => event.type === "actor-resume-prestart-complete"),
      sameWorldEpoch: activeB.identity?.worldEpoch === aw.worldEpoch,
      sameActorSession: activeB.session?.actorSessionId === captured.selfSessionId,
      protocolStartTick: activeB.protocolStartTick,
      localBoundaryTick: activeB.localBoundaryTick,
      guardMismatches: activeB.metrics?.guardMismatches,
    },
    proxy: { drop, current: proxy.snapshot() },
    verdict: "WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS",
    interpretation: "A two-player pre-start room remains resumable across the unavoidable ready-delivery ambiguity: the browser's first ready never reached authority, authority remained unscheduled, transport dropped, the same ActorSession resumed inside bounded grace, the browser re-sent ready, and the original WorldEpoch then started normally.",
    nonClaim: "This is a bounded local Chromium/Workerd causal proof. It does not provide persistence, process-loss recovery, cross-tab token persistence, or a guarantee beyond the configured pre-start ambiguity grace.",
  };
'''
          audit = audit[:start] + replacement + audit[end:]
          audit_path.write_text(audit)

          probe_path = Path('scripts/world-v0-closure-prestart-grace-probe.mjs')
          probe_path.write_text(r'''import { writeFileSync } from "node:fs";

const BASE = (process.env.MW_WORLD_V0_PRESTART_GRACE_BASE || "http://127.0.0.1:8787").replace(/\/$/, "");
const OUTPUT = process.env.MW_WORLD_V0_PRESTART_GRACE_OUTPUT || "world-v0-prestart-grace.json";
const TIMEOUT_MS = 28_000;
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const assert = (condition, message) => { if (!condition) throw new Error(message); };

function connect(run, player, resume = null) {
  const wsBase = BASE.replace(/^http/, "ws");
  const params = new URLSearchParams({ run, player });
  if (resume) params.set("resume", resume);
  const ws = new WebSocket(`${wsBase}/world-v0/ws?${params}`);
  const messages = [];
  ws.addEventListener("message", async (event) => {
    const raw = typeof event.data === "string" ? event.data : await event.data.text();
    try { messages.push(JSON.parse(raw)); } catch {}
  });
  return { ws, messages };
}

async function waitMessage(client, predicate, label, timeoutMs = TIMEOUT_MS) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    const found = client.messages.find(predicate);
    if (found) return found;
    await sleep(25);
  }
  throw new Error(`${label} timeout · ${JSON.stringify(client.messages.slice(-6))}`);
}

const suffix = Date.now().toString(36).slice(-7);
const run = `pg-${suffix}`;
const a = connect(run, `GraceA-${suffix}`);
const aw = await waitMessage(a, (m) => m?.type === "world_v0_welcome", "A welcome");
const b = connect(run, `GraceB-${suffix}`);
const bw = await waitMessage(b, (m) => m?.type === "world_v0_welcome", "B welcome");
assert(aw.worldEpoch === bw.worldEpoch, "initial epoch mismatch");
assert(bw.protocolStartTick === null, "pre-start probe unexpectedly scheduled");

b.ws.close(1000, "prestart-grace-first-drop");
await sleep(500);
const resumed = connect(run, `GraceB-${suffix}`, bw.resumeToken);
const rw = await waitMessage(resumed, (m) => m?.type === "world_v0_welcome", "B resume inside grace", 8000);
assert(rw.resumed === true, "B resume inside grace rejected");
assert(rw.worldEpoch === bw.worldEpoch, "B resume rotated epoch");
assert(rw.selfSessionId === bw.selfSessionId, "B resume changed ActorSession");
assert(rw.protocolStartTick === null, "B resume unexpectedly entered active run");

await sleep(250);
const expiryStartedAt = Date.now();
resumed.ws.close(1000, "prestart-grace-expiry-drop");
const ended = await waitMessage(a, (m) => m?.type === "world_v0_epoch_ended", "prestart ambiguity expiry", TIMEOUT_MS);
const expiryMs = Date.now() - expiryStartedAt;
assert(ended.reason === "peer_disconnected_before_start_grace_expired", `unexpected expiry reason ${ended.reason}`);
assert(expiryMs >= 18_000 && expiryMs <= 26_000, `prestart grace outside bounded window: ${expiryMs}ms`);

const fresh = connect(run, `Fresh-${suffix}`);
const fw = await waitMessage(fresh, (m) => m?.type === "world_v0_welcome", "fresh epoch after expiry", 8000);
assert(fw.resumed === false, "fresh actor unexpectedly resumed");
assert(fw.worldEpoch !== aw.worldEpoch, "expired prestart epoch was reused");

const result = {
  revision: "world-v0-closure-prestart-grace-v1",
  run,
  initialEpoch: aw.worldEpoch,
  initialActorSession: bw.selfSessionId,
  resumedInsideGrace: {
    sameEpoch: rw.worldEpoch === bw.worldEpoch,
    sameActorSession: rw.selfSessionId === bw.selfSessionId,
    protocolStartTick: rw.protocolStartTick,
  },
  expiry: { reason: ended.reason, elapsedMs: expiryMs },
  freshAfterExpiry: { worldEpoch: fw.worldEpoch, rotated: fw.worldEpoch !== aw.worldEpoch },
  verdict: "WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS",
};
writeFileSync(OUTPUT, JSON.stringify(result, null, 2));
console.log("WORLD_V0_CLOSURE_PRESTART_GRACE", JSON.stringify(result, null, 2));
console.log(result.verdict);

for (const client of [a, b, resumed, fresh]) {
  try { client.ws.close(1000, "prestart-grace-probe-done"); } catch {}
}
''')
          PY

          SIM_BUILD_ID=$(node --experimental-strip-types --input-type=module -e 'import("./src/world-v0-contract.ts").then((m) => console.log(m.WORLD_V0_SIM_BUILD_ID))')
          export SIM_BUILD_ID
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('public/world-v0/build-contract.js')
          s = p.read_text()
          pairs = [
              ('shared-yard-v0-browser-ui-v13-bounded-start-window-resume', 'shared-yard-v0-browser-ui-v14-prestart-ambiguity-grace'),
              ('shared-yard-v0-authority-v7-retry-aligned-grace', 'shared-yard-v0-authority-v8-prestart-ambiguity-grace'),
              ('shared-yard-v0-sim-9c308539ccf305cc', os.environ['SIM_BUILD_ID']),
          ]
          for before, after in pairs:
              if s.count(before) != 1:
                  raise SystemExit(f'build contract marker mismatch: {before}')
              s = s.replace(before, after)
          p.write_text(s)
          print('WORLD_V0_PRESTART_AMBIGUITY_CANDIDATE', os.environ['SIM_BUILD_ID'])
          PY

          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-closure-uncommitted-ready-audit.mjs
          node --check scripts/world-v0-closure-prestart-grace-probe.mjs
          grep -q 'preStartAmbiguityGraceTicks: 20 \* 60' src/world-v0-contract.ts
          grep -q 'schedulePreStartAmbiguityRetirement' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS' scripts/world-v0-closure-uncommitted-ready-audit.mjs

      - name: Full repository checks on candidate
        run: npm run check

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-prestart-ambiguity-repair-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-prestart-ambiguity-repair.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-prestart-ambiguity-repair-wrangler.log
          exit 1

      - name: Qualify uncommitted-ready automatic recovery
        env:
          MW_WORLD_V0_UNCOMMITTED_READY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_UNCOMMITTED_READY_OUTPUT: world-v0-prestart-ambiguity-browser.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-uncommitted-ready-audit.mjs | tee world-v0-prestart-ambiguity-browser.log
          grep -q 'WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS' world-v0-prestart-ambiguity-browser.log

      - name: Qualify bounded prestart ambiguity grace and expiry
        env:
          MW_WORLD_V0_PRESTART_GRACE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_GRACE_OUTPUT: world-v0-prestart-grace.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-grace-probe.mjs | tee world-v0-prestart-grace.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS' world-v0-prestart-grace.log

      - name: Requalify one-player waiting-room fail-closed
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-prestart-waiting-room.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-prestart-waiting-room.log
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' world-v0-prestart-waiting-room.log

      - name: Requalify committed-start recovery
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-prestart-committed-start.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-prestart-committed-start.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-prestart-committed-start.log

      - name: Stop Workerd
        if: always()
        run: if [ -f /tmp/world-v0-prestart-ambiguity-repair.pid ]; then kill "$(cat /tmp/world-v0-prestart-ambiguity-repair.pid)" 2>/dev/null || true; fi

      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/prestart-files.txt
          cat > /tmp/prestart-expected.txt <<'EOF'
          public/world-v0/build-contract.js
          scripts/world-v0-closure-prestart-grace-probe.mjs
          scripts/world-v0-closure-uncommitted-ready-audit.mjs
          src/world-v0-contract.ts
          src/world-v0-shared-yard.ts
          EOF
          sort -o /tmp/prestart-expected.txt /tmp/prestart-expected.txt
          diff -u /tmp/prestart-expected.txt /tmp/prestart-files.txt

      - name: Commit qualified runtime and retained probes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/build-contract.js scripts/world-v0-closure-prestart-grace-probe.mjs scripts/world-v0-closure-uncommitted-ready-audit.mjs src/world-v0-contract.ts src/world-v0-shared-yard.ts
          git commit -m "fix(world-v0): preserve bounded prestart ready ambiguity"
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"
          git push origin HEAD:world-v0-closure-stabilization

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-prestart-ambiguity-repair-${{ github.run_attempt }}
          path: |
            world-v0-prestart-ambiguity-browser.log
            world-v0-prestart-ambiguity-browser.json
            world-v0-prestart-grace.log
            world-v0-prestart-grace.json
            world-v0-prestart-waiting-room.log
            world-v0-prestart-waiting-room.json
            world-v0-prestart-committed-start.log
            world-v0-prestart-committed-start.json
            world-v0-prestart-ambiguity-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 14
