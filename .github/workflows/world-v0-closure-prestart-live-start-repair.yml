name: World V0 Closure Prestart Live Start Repair

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-prestart-live-start-repair.yml

permissions:
  contents: write

concurrency:
  group: world-v0-closure-prestart-live-start-repair
  cancel-in-progress: false

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Guard exact live branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"

      - name: Materialize bounded live-start candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize-world-v0-prestart-live-start-gate.py
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-closure-prestart-partial-resume-audit.mjs
          grep -q 'connectedPlayerCount() !== MAX_PLAYERS' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_GATE_PASS' scripts/world-v0-closure-prestart-partial-resume-audit.mjs

      - name: Full repository checks on candidate
        run: npm run check

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-prestart-live-start-repair-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-prestart-live-start-repair.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-prestart-live-start-repair-wrangler.log
          exit 1

      - name: Qualify partial-resume live-start gate
        env:
          MW_WORLD_V0_PRESTART_PARTIAL_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_PARTIAL_OUTPUT: world-v0-prestart-live-start-partial.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-partial-resume-audit.mjs | tee world-v0-prestart-live-start-partial.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_GATE_PASS' world-v0-prestart-live-start-partial.log

      - name: Requalify uncommitted-ready ambiguity recovery
        env:
          MW_WORLD_V0_UNCOMMITTED_READY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_UNCOMMITTED_READY_OUTPUT: world-v0-prestart-live-start-uncommitted.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-uncommitted-ready-audit.mjs | tee world-v0-prestart-live-start-uncommitted.log
          grep -q 'WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS' world-v0-prestart-live-start-uncommitted.log

      - name: Requalify bounded prestart ambiguity grace
        env:
          MW_WORLD_V0_PRESTART_GRACE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_GRACE_OUTPUT: world-v0-prestart-live-start-grace.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-grace-probe.mjs | tee world-v0-prestart-live-start-grace.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS' world-v0-prestart-live-start-grace.log

      - name: Requalify one-player waiting-room fail-closed
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-prestart-live-start-waiting.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-prestart-live-start-waiting.log
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' world-v0-prestart-live-start-waiting.log

      - name: Requalify committed-start recovery
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-prestart-live-start-committed.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-prestart-live-start-committed.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-prestart-live-start-committed.log

      - name: Stop Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-prestart-live-start-repair.pid ]; then
            kill "$(cat /tmp/world-v0-prestart-live-start-repair.pid)" 2>/dev/null || true
          fi

      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/live-start-files.txt
          cat > /tmp/live-start-expected.txt <<'EOF'
          public/world-v0/build-contract.js
          src/world-v0-contract.ts
          src/world-v0-shared-yard.ts
          EOF
          sort -o /tmp/live-start-expected.txt /tmp/live-start-expected.txt
          diff -u /tmp/live-start-expected.txt /tmp/live-start-files.txt

      - name: Commit qualified live-start gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/build-contract.js src/world-v0-contract.ts src/world-v0-shared-yard.ts
          git commit -m "fix(world-v0): require both live peers before start"
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"
          git push origin HEAD:world-v0-closure-stabilization

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-prestart-live-start-repair-${{ github.run_attempt }}
          path: |
            world-v0-prestart-live-start-partial.log
            world-v0-prestart-live-start-partial.json
            world-v0-prestart-live-start-uncommitted.log
            world-v0-prestart-live-start-uncommitted.json
            world-v0-prestart-live-start-grace.log
            world-v0-prestart-live-start-grace.json
            world-v0-prestart-live-start-waiting.log
            world-v0-prestart-live-start-waiting.json
            world-v0-prestart-live-start-committed.log
            world-v0-prestart-live-start-committed.json
            world-v0-prestart-live-start-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 14
