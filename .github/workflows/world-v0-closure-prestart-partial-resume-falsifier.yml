name: World V0 Closure Prestart Partial Resume Falsifier

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-prestart-partial-resume-falsifier.yml

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Static checks
        run: |
          node --check scripts/world-v0-closure-prestart-partial-resume-audit.mjs
          npm run check
      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-prestart-partial-resume-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-prestart-partial-resume.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-prestart-partial-resume-wrangler.log
          exit 1
      - name: Reproduce start with only one live peer
        env:
          MW_WORLD_V0_PRESTART_PARTIAL_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_PARTIAL_OUTPUT: world-v0-prestart-partial-resume.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-partial-resume-audit.mjs | tee world-v0-prestart-partial-resume.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_START_REPRODUCED' world-v0-prestart-partial-resume.log
      - name: Stop Workerd
        if: always()
        run: if [ -f /tmp/world-v0-prestart-partial-resume.pid ]; then kill "$(cat /tmp/world-v0-prestart-partial-resume.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-prestart-partial-resume-${{ github.run_attempt }}
          path: |
            world-v0-prestart-partial-resume.log
            world-v0-prestart-partial-resume.json
            world-v0-prestart-partial-resume-wrangler.log
          if-no-files-found: warn
          retention-days: 14
