name: World V0 Closure Start Window Falsifier

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-start-window-falsifier.yml
      - scripts/world-v0-closure-start-window-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-closure-start-window-falsifier
  cancel-in-progress: true

jobs:
  falsify-start-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Validate falsifier syntax
        run: node --check scripts/world-v0-closure-start-window-audit.mjs

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-closure-start-window-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-start-window-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "start-window Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-closure-start-window-wrangler.log
          exit 1

      - name: Reproduce browser pre-start ActorSession recovery gap
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-closure-start-window.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-closure-start-window.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_GAP_REPRODUCED' world-v0-closure-start-window.log

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-start-window-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-start-window-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload falsifier evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-closure-start-window-${{ github.run_attempt }}
          path: |
            world-v0-closure-start-window.log
            world-v0-closure-start-window.json
            world-v0-closure-start-window-wrangler.log
          if-no-files-found: warn
          retention-days: 14
