name: World V0 Closure Start Window Repair

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-start-window-repair.yml
      - scripts/materialize-world-v0-start-window-recovery.mjs

permissions:
  contents: write

concurrency:
  group: world-v0-closure-start-window-repair
  cancel-in-progress: false

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Guard live branch head before qualification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"

      - name: Materialize bounded repair candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-world-v0-start-window-recovery.mjs
          node scripts/materialize-world-v0-start-window-recovery.mjs
          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-closure-start-window-audit.mjs
          grep -q 'shared-yard-v0-browser-ui-v12-start-window-resume' public/world-v0/build-contract.js
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' scripts/world-v0-closure-start-window-audit.mjs

      - name: Full repository checks on candidate
        run: npm run check

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-start-window-repair-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-start-window-repair-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "repair Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-start-window-repair-wrangler.log
          exit 1

      - name: Qualify repaired committed-start recovery
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-start-window-repair.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-start-window-repair.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-start-window-repair.log

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-start-window-repair-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-start-window-repair-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/world-v0-start-window-repair-files.txt
          cat > /tmp/world-v0-start-window-repair-expected.txt <<'EOF'
          .github/workflows/world-v0-closure-current-validation.yml
          .github/workflows/world-v0-closure-start-window-falsifier.yml
          public/world-v0/app.js
          public/world-v0/build-contract.js
          scripts/world-v0-closure-start-window-audit.mjs
          EOF
          sort -o /tmp/world-v0-start-window-repair-expected.txt /tmp/world-v0-start-window-repair-expected.txt
          diff -u /tmp/world-v0-start-window-repair-expected.txt /tmp/world-v0-start-window-repair-files.txt

      - name: Commit qualified repair to closure branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/world-v0/app.js \
            public/world-v0/build-contract.js \
            scripts/world-v0-closure-start-window-audit.mjs \
            .github/workflows/world-v0-closure-current-validation.yml \
            .github/workflows/world-v0-closure-start-window-falsifier.yml
          git commit -m "fix(world-v0): recover admitted actor across start window"
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"
          git push origin HEAD:world-v0-closure-stabilization

      - name: Upload repair qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-start-window-repair-${{ github.run_attempt }}
          path: |
            world-v0-start-window-repair.log
            world-v0-start-window-repair.json
            world-v0-start-window-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 14
