name: World V0 Closure Waiting Room Repair

on:
  push:
    branches: [world-v0-closure-stabilization]
    paths:
      - .github/workflows/world-v0-closure-waiting-room-repair.yml
      - scripts/materialize-world-v0-waiting-room-recovery-guard.mjs

permissions:
  contents: write

concurrency:
  group: world-v0-closure-waiting-room-repair
  cancel-in-progress: true

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Guard exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"
      - name: Materialize bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-world-v0-waiting-room-recovery-guard.mjs
          node scripts/materialize-world-v0-waiting-room-recovery-guard.mjs
          node --check public/world-v0/app.js
          node --check scripts/world-v0-closure-waiting-room-drop-audit.mjs
          grep -q 'activeActorTransportRecoverable' public/world-v0/app.js
          grep -q 'committedStartWindowRecoverable' public/world-v0/app.js
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' scripts/world-v0-closure-waiting-room-drop-audit.mjs
      - name: Full repository checks
        run: npm run check
      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-waiting-room-repair-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-waiting-room-repair.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-waiting-room-repair-wrangler.log
          exit 1
      - name: Qualify waiting-room fail-closed behavior
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-waiting-room-repair.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-waiting-room-repair.log
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' world-v0-waiting-room-repair.log
      - name: Requalify committed-start recovery remains enabled
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-start-window-after-waiting-guard.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-start-window-after-waiting-guard.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-start-window-after-waiting-guard.log
      - name: Stop Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-waiting-room-repair.pid ]; then kill "$(cat /tmp/world-v0-waiting-room-repair.pid)" 2>/dev/null || true; fi
      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/waiting-room-files.txt
          cat > /tmp/waiting-room-expected.txt <<'EOF'
          public/world-v0/app.js
          scripts/world-v0-closure-waiting-room-drop-audit.mjs
          EOF
          sort -o /tmp/waiting-room-expected.txt /tmp/waiting-room-expected.txt
          diff -u /tmp/waiting-room-expected.txt /tmp/waiting-room-files.txt
      - name: Commit qualified guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/app.js scripts/world-v0-closure-waiting-room-drop-audit.mjs
          git commit -m "fix(world-v0): bound actor recovery to active start states"
          git fetch origin world-v0-closure-stabilization
          test "$(git rev-parse origin/world-v0-closure-stabilization)" = "$GITHUB_SHA"
          git push origin HEAD:world-v0-closure-stabilization
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-waiting-room-repair-${{ github.run_attempt }}
          path: |
            world-v0-waiting-room-repair.log
            world-v0-waiting-room-repair.json
            world-v0-start-window-after-waiting-guard.log
            world-v0-start-window-after-waiting-guard.json
            world-v0-waiting-room-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 14
