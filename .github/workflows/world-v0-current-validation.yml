name: World V0 Current Validation

on:
  push:
    branches: [main, world-v0-session-continuity-r1-exec, world-v0-foundation-stabilization-closure, world-v0-foundation-polish-closure]
    paths:
      - .github/workflows/world-v0-current-validation.yml
      - .github/workflows/world-v0-closure-current-validation.yml
      - .github/workflows/world-v0-session-continuity-r1-qualification.yml
      - package.json
      - public/world-v0/app.js
      - public/world-v0/build-contract.js
      - public/world-v0/friend-ready.js
      - public/world-v0/public-room-entry.js
      - public/world-v0/session-continuity.js
      - public/world-v0/authority-epoch-loss.js
      - public/world-v0/join-failure-clarity.js
      - src/world-slice-entry.ts
      - src/world-v0-contract.ts
      - src/world-v0-shared-yard.ts
      - scripts/world-v0-session-continuity-smoke.mjs
      - scripts/world-v0-authority-epoch-loss-classifier-smoke.mjs
      - scripts/world-v0-join-failure-clarity-smoke.mjs
      - scripts/world-v0-cross-page-resume-browser-audit.mjs
      - scripts/world-v0-integration-i1-lifecycle-probe.mjs
      - scripts/world-v0-closure-all-drop-window-probe.mjs
      - scripts/world-v0-integration-i4b-authority-probe.mjs
      - scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs
      - scripts/world-v0-closure-dual-browser-grace-audit.mjs
      - scripts/world-v0-closure-start-window-audit.mjs
      - scripts/world-v0-closure-waiting-room-drop-audit.mjs
      - scripts/world-v0-closure-uncommitted-ready-audit.mjs
      - scripts/world-v0-closure-prestart-grace-probe.mjs
      - scripts/world-v0-closure-prestart-partial-resume-audit.mjs
      - scripts/world-v0-human-entry-browser-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-current-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Current repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-current-check.log
          grep -q 'const ACTOR_RESUME_MAX_ATTEMPTS = 12;' public/world-v0/app.js
          grep -q 'allDisconnectedGraceTicks: 20 \* 60' src/world-v0-contract.ts
          grep -q 'preStartAmbiguityGraceTicks: 20 \* 60' src/world-v0-contract.ts
          grep -q 'activeActorTransportRecoverable' public/world-v0/app.js
          grep -q 'committedStartWindowRecoverable' public/world-v0/app.js
          grep -q 'schedulePreStartAmbiguityRetirement' src/world-v0-shared-yard.ts
          grep -q 'connectedPlayerCount() !== MAX_PLAYERS' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_SESSION_CONTINUITY_REVISION' public/world-v0/session-continuity.js
          grep -q 'world-v0-authority-epoch-loss-v1' public/world-v0/authority-epoch-loss.js
          grep -q 'authority_epoch_lost_recovery' public/world-v0/app.js
          grep -q 'world-v0-join-failure-clarity-v1' public/world-v0/join-failure-clarity.js
          grep -q 'takeWorldV0ResumeIntent' public/world-v0/app.js
          grep -q 'live-protected-reserved' src/world-slice-entry.ts
          grep -q 'live-soft-reserved' src/world-slice-entry.ts
          grep -q 'softReservedPlayers' src/world-v0-shared-yard.ts
          grep -q 'WORLD_V0_AUTHORITY_EPOCH_LOSS_CLASSIFIER_PASS' world-v0-current-check.log
          grep -q 'WORLD_V0_JOIN_FAILURE_CLARITY_SMOKE_PASS' world-v0-current-check.log
          test ! -e .github/workflows/world-v0-closure-prestart-ambiguity-repair.yml
          test ! -e .github/workflows/world-v0-closure-prestart-live-start-repair.yml
          test ! -e .github/workflows/world-v0-closure-prestart-partial-resume-falsifier.yml
          test ! -e scripts/materialize-world-v0-prestart-ambiguity-repair.py
          test ! -e scripts/materialize-world-v0-prestart-live-start-gate.py
          test ! -e .github/workflows/world-v0-session-continuity-r1-materialize.yml
          test ! -e scripts/materialize-world-v0-session-continuity-app.mjs
          echo WORLD_V0_CURRENT_CONSUMED_APPARATUS_CLEAN_PASS
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { WORLD_V0_SERVER_REVISION, WORLD_V0_SIM_BUILD_ID } from "./src/world-v0-contract.ts";
          const build = readFileSync("public/world-v0/build-contract.js", "utf8");
          if (!build.includes(`WORLD_V0_EXPECTED_SERVER_REVISION = "${WORLD_V0_SERVER_REVISION}"`)) {
            throw new Error(`browser/server revision drift: ${WORLD_V0_SERVER_REVISION}`);
          }
          if (!build.includes(`WORLD_V0_EXPECTED_SIM_BUILD_ID = "${WORLD_V0_SIM_BUILD_ID}"`)) {
            throw new Error(`browser/sim build drift: ${WORLD_V0_SIM_BUILD_ID}`);
          }
          console.log("WORLD_V0_CURRENT_BUILD_PROVENANCE_PASS", WORLD_V0_SERVER_REVISION, WORLD_V0_SIM_BUILD_ID);
          NODE

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-current-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-current-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "World V0 current Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-current-wrangler.log
          exit 1

      - name: Requalify I1 ActorSession lifecycle
        env:
          MW_WORLD_V0_I1_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I1_RUN: current-i1-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-current-i1.log
          grep -q 'WORLD_V0_INTEGRATION_I1_SERVER_SESSION_PASS' world-v0-current-i1.log
          grep -q '"oldEpochPreservedAt1800msAllDisconnected": true' world-v0-current-i1.log
          grep -q '"oldEpochRetiredAfterGrace": true' world-v0-current-i1.log

      - name: Requalify one-player waiting-room fail-closed boundary
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-current-waiting-room.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-current-waiting-room.log
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' world-v0-current-waiting-room.log

      - name: Requalify uncommitted-ready ambiguity recovery
        env:
          MW_WORLD_V0_UNCOMMITTED_READY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_UNCOMMITTED_READY_OUTPUT: world-v0-current-uncommitted-ready.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-uncommitted-ready-audit.mjs | tee world-v0-current-uncommitted-ready.log
          grep -q 'WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS' world-v0-current-uncommitted-ready.log

      - name: Requalify partial prestart resume live-start gate
        env:
          MW_WORLD_V0_PRESTART_PARTIAL_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_PARTIAL_OUTPUT: world-v0-current-prestart-partial-resume.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-partial-resume-audit.mjs | tee world-v0-current-prestart-partial-resume.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_GATE_PASS' world-v0-current-prestart-partial-resume.log

      - name: Requalify bounded two-player prestart ambiguity grace
        env:
          MW_WORLD_V0_PRESTART_GRACE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_GRACE_OUTPUT: world-v0-current-prestart-grace.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-grace-probe.mjs | tee world-v0-current-prestart-grace.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS' world-v0-current-prestart-grace.log

      - name: Requalify committed-start ActorSession recovery window
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-current-start-window.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-current-start-window.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-current-start-window.log

      - name: Requalify cross-page ActorSession resume and truthful presence
        env:
          MW_WORLD_V0_CROSS_PAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_CROSS_PAGE_ROOM: yard-3
          MW_WORLD_V0_CROSS_PAGE_OUTPUT: world-v0-current-cross-page.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-cross-page-resume-browser-audit.mjs | tee world-v0-current-cross-page.log
          grep -q 'WORLD_V0_CROSS_PAGE_RESUME_PASS' world-v0-current-cross-page.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-current-cross-page.json", "utf8"));
          if (evidence.original?.worldEpoch !== evidence.peerAfter?.worldEpoch) throw new Error("cross-page WorldEpoch drift");
          if (evidence.original?.actorSessionId !== evidence.peerAfter?.actorSessionId) throw new Error("cross-page ActorSession drift");
          if (evidence.original?.netEntityId !== evidence.peerAfter?.netEntityId) throw new Error("cross-page NetEntity drift");
          if (evidence.reservedRoom?.connected !== 1 || evidence.reservedRoom?.reserved !== 1) throw new Error("reserved presence regression");
          if (evidence.restoredRoom?.connected !== 2 || evidence.restoredRoom?.reserved !== 0) throw new Error("restored presence regression");
          if (evidence.peerAfter?.guardMismatches !== 0 || evidence.ownerAfter?.guardMismatches !== 0) throw new Error("cross-page exact-state regression");
          console.log("WORLD_V0_CURRENT_CROSS_PAGE_PASS", evidence.original.actorSessionId);
          NODE

      - name: Requalify bounded all-transport-loss window
        env:
          MW_WORLD_V0_ALL_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ALL_DROP_DELAYS: 500,1500,5000,11000,14500,19000,21000
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-closure-all-drop-window-probe.mjs | tee world-v0-current-all-drop.log
          grep -q 'WORLD_V0_CLOSURE_ALL_DROP_WINDOW_MAPPED' world-v0-current-all-drop.log
          for delay in 500 1500 5000 11000 14500 19000; do
            grep -E "WORLD_V0_ALL_DROP_CASE .*\"delayMs\":${delay}.*\"classification\":\"preserved\"" world-v0-current-all-drop.log >/dev/null
          done
          grep -E 'WORLD_V0_ALL_DROP_CASE .*"delayMs":21000.*"classification":"retired"' world-v0-current-all-drop.log >/dev/null
          echo WORLD_V0_CURRENT_ALL_DISCONNECTED_PASS

      - name: Requalify automatic ActorSession exact-rebase recovery
        env:
          MW_WORLD_V0_I4B_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I4B_OFFLINE_MS: 14000
          MW_WORLD_V0_I4B_OUTPUT: world-v0-current-i4b-chromium.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-integration-i4b-authority-probe.mjs | tee world-v0-current-i4b-authority.log
          node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-current-i4b-chromium.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_AUTHORITY_EXACT_REBASE_PASS' world-v0-current-i4b-authority.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' world-v0-current-i4b-chromium.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-current-i4b-chromium.json", "utf8"));
          if (evidence.offlineMs !== 14000) throw new Error(`unexpected outage ${evidence.offlineMs}`);
          if (evidence.actorSession?.preserved !== true || evidence.actorSession?.netEntityPreserved !== true) throw new Error("ActorSession identity regression");
          if (evidence.exactness?.guardMismatches !== 0) throw new Error("exact-state guard regression");
          console.log("WORLD_V0_CURRENT_14S_ACTOR_RESUME_PASS", evidence.gap?.gapTicks);
          NODE

      - name: Requalify dual-browser hard-drop recovery at prior failing edge
        env:
          MW_WORLD_V0_DUAL_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DUAL_BROWSER_OFFLINE_MS: 14500
          MW_WORLD_V0_DUAL_BROWSER_OUTPUT: world-v0-current-dual-browser.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node --experimental-strip-types scripts/world-v0-closure-dual-browser-grace-audit.mjs | tee world-v0-current-dual-browser.log
          grep -q 'WORLD_V0_CLOSURE_DUAL_BROWSER_GRACE_PASS' world-v0-current-dual-browser.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-current-dual-browser.json", "utf8"));
          if (evidence.offlineMs !== 14500) throw new Error(`unexpected dual outage ${evidence.offlineMs}`);
          if (evidence.proxy?.drop?.activeBeforeDrop < 2 || evidence.proxy?.drop?.hardDrops < 2) throw new Error("dual hard-drop apparatus did not sever both live transports");
          if (evidence.proxy?.beforeRestore?.blockedAccepts < 1) throw new Error("dual hard-drop apparatus did not block reconnect attempts");
          if (!Array.isArray(evidence.clients) || evidence.clients.length !== 2) throw new Error("dual recovery missing clients");
          if (evidence.clients.some((client) => client.guardMismatches !== 0)) throw new Error("dual recovery exact-state guard regression");
          console.log("WORLD_V0_CURRENT_DUAL_BROWSER_14500MS_PASS", evidence.clients.map((client) => client.gapTicks).join(","));
          NODE

      - name: Requalify real Chromium human-entry and foreign-profile reopen truth
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-current-human-entry.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-human-entry-browser-smoke.mjs | tee world-v0-current-human-entry.log
          grep -q 'WORLD_V0_HUMAN_ENTRY_PASS' world-v0-current-human-entry.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-current-human-entry.json", "utf8"));
          if (evidence.peerTabCloseFreshReopenRejectedTruthfully !== true) throw new Error("foreign fresh-profile reopen truth regression");
          if (evidence.healthyOwnerWorldEpochPreservedAcrossPeerReopen !== true) throw new Error("healthy owner continuity regression");
          console.log("WORLD_V0_CURRENT_HUMAN_ENTRY_PASS", evidence.worldEpoch);
          NODE

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-current-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-current-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload current-head validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-current-validation-${{ github.run_attempt }}
          path: |
            world-v0-current-check.log
            world-v0-current-wrangler.log
            world-v0-current-i1.log
            world-v0-current-waiting-room.log
            world-v0-current-waiting-room.json
            world-v0-current-uncommitted-ready.log
            world-v0-current-uncommitted-ready.json
            world-v0-current-prestart-partial-resume.log
            world-v0-current-prestart-partial-resume.json
            world-v0-current-prestart-grace.log
            world-v0-current-prestart-grace.json
            world-v0-current-start-window.log
            world-v0-current-start-window.json
            world-v0-current-cross-page.log
            world-v0-current-cross-page.json
            world-v0-current-all-drop.log
            world-v0-current-i4b-authority.log
            world-v0-current-i4b-chromium.log
            world-v0-current-i4b-chromium.json
            world-v0-current-dual-browser.log
            world-v0-current-dual-browser.json
            world-v0-current-human-entry.log
            world-v0-current-human-entry.json
          if-no-files-found: warn
          retention-days: 14
