name: World V0 Current Validation

on:
  push:
    branches:
      - main
      - world-v0-post-owner-v28-closeout
    paths:
      - .github/workflows/world-v0-current-validation.yml
      - package.json
      - package-lock.json
      - public/world-v0/**
      - src/world-slice-entry.ts
      - src/world-v0-contract.ts
      - src/world-v0-protocol.ts
      - src/world-v0-shared-yard.ts
      - scripts/world-v0-ongoing-yard-product-chromium.mjs
      - scripts/world-v0-private-refresh-continuity-browser-audit.mjs
      - scripts/world-v0-private-profile-rebind-browser-audit.mjs
      - scripts/world-v0-diagnostic-space-gameplay-browser-audit.mjs
      - scripts/world-v0-mobile-input-browser-audit.mjs
      - scripts/world-v0-ongoing-cross-page-resume-browser-audit.mjs
      - scripts/world-v0-direct-link-resume-browser-audit.mjs
      - scripts/world-v0-live-rebind-browser-audit.mjs
      - scripts/world-v0-direct-resume-directory-outage-browser-audit.mjs
      - scripts/world-v0-soft-reservation-browser-handoff-audit.mjs
      - scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs
      - scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs
      - scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs
      - scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs
      - scripts/world-v0-join-failure-clarity-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-current-validation
  cancel-in-progress: true

jobs:
  repository-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check

  product-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9270 > current-product-wrangler.log 2>&1 &
          echo $! > current-product.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-product-wrangler.log; exit 1
      - name: Ongoing Yard product
        run: |
          set -euo pipefail
          MW_WORLD_V0_ONGOING_BASE=http://127.0.0.1:8787 MW_WORLD_V0_ONGOING_OUTPUT=current-product.json timeout 120s node scripts/world-v0-ongoing-yard-product-chromium.mjs | tee current-product.log
          grep -q WORLD_V0_ONGOING_YARD_PUBLIC_FLOW_PASS current-product.log
      - name: Diagnostics and actual mobile input
        run: |
          set -euo pipefail
          MW_WORLD_V0_DIAGNOSTIC_SPACE_BASE=http://127.0.0.1:8787 MW_WORLD_V0_DIAGNOSTIC_SPACE_OUTPUT=current-diagnostic.json timeout 120s node scripts/world-v0-diagnostic-space-gameplay-browser-audit.mjs | tee current-diagnostic.log
          grep -q WORLD_V0_DIAGNOSTIC_SPACE_GAMEPLAY_PASS current-diagnostic.log
          MW_WORLD_V0_MOBILE_INPUT_BASE=http://127.0.0.1:8787 MW_WORLD_V0_MOBILE_INPUT_OUTPUT=current-mobile.json timeout 120s node scripts/world-v0-mobile-input-browser-audit.mjs | tee current-mobile.log
          grep -q WORLD_V0_MOBILE_INPUT_PASS current-mobile.log
      - if: always()
        run: |
          if [ -f current-product.pid ]; then pid="$(cat current-product.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  private-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9271 > current-private-wrangler.log 2>&1 &
          echo $! > current-private.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-private-wrangler.log; exit 1
      - name: Private refresh and same-profile rebound
        run: |
          set -euo pipefail
          MW_WORLD_V0_PRIVATE_REFRESH_BASE=http://127.0.0.1:8787 MW_WORLD_V0_PRIVATE_REFRESH_OUTPUT=current-private-refresh.json timeout 120s node scripts/world-v0-private-refresh-continuity-browser-audit.mjs | tee current-private-refresh.log
          grep -q WORLD_V0_PRIVATE_REFRESH_CONTINUITY_PASS current-private-refresh.log
          MW_WORLD_V0_PRIVATE_REBIND_BASE=http://127.0.0.1:8787 MW_WORLD_V0_PRIVATE_REBIND_OUTPUT=current-private-rebind.json timeout 150s node scripts/world-v0-private-profile-rebind-browser-audit.mjs | tee current-private-rebind.log
          grep -q WORLD_V0_PRIVATE_PROFILE_REBIND_PASS current-private-rebind.log
      - if: always()
        run: |
          if [ -f current-private.pid ]; then pid="$(cat current-private.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  public-resume-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9272 > current-rebind-wrangler.log 2>&1 &
          echo $! > current-rebind.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-rebind-wrangler.log; exit 1
      - name: Direct Resume and live rebound truth
        run: |
          set -euo pipefail
          MW_WORLD_V0_DIRECT_RESUME_BASE=http://127.0.0.1:8787 MW_WORLD_V0_DIRECT_RESUME_ROOM=yard-2 MW_WORLD_V0_DIRECT_RESUME_OUTPUT=current-direct.json timeout 150s node scripts/world-v0-direct-link-resume-browser-audit.mjs | tee current-direct.log
          grep -q WORLD_V0_DIRECT_LINK_RESUME_PASS current-direct.log
          MW_WORLD_V0_LIVE_REBIND_BASE=http://127.0.0.1:8787 MW_WORLD_V0_LIVE_REBIND_ROOM=yard-3 MW_WORLD_V0_LIVE_REBIND_OUTPUT=current-live-rebind.json timeout 150s node scripts/world-v0-live-rebind-browser-audit.mjs | tee current-live-rebind.log
          grep -q WORLD_V0_LIVE_REBIND_PASS current-live-rebind.log
      - if: always()
        run: |
          if [ -f current-rebind.pid ]; then pid="$(cat current-rebind.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  cross-page-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9273 > current-cross-wrangler.log 2>&1 &
          echo $! > current-cross.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-cross-wrangler.log; exit 1
      - name: Ongoing cross-page Resume and directory uncertainty
        run: |
          set -euo pipefail
          MW_WORLD_V0_ONGOING_CROSS_PAGE_BASE=http://127.0.0.1:8787 MW_WORLD_V0_ONGOING_CROSS_PAGE_ROOM=yard-1 MW_WORLD_V0_ONGOING_CROSS_PAGE_OUTPUT=current-cross.json timeout 150s node scripts/world-v0-ongoing-cross-page-resume-browser-audit.mjs | tee current-cross.log
          grep -q WORLD_V0_ONGOING_CROSS_PAGE_RESUME_PASS current-cross.log
          MW_WORLD_V0_DIRECT_OUTAGE_BASE=http://127.0.0.1:8787 MW_WORLD_V0_DIRECT_OUTAGE_ROOM=yard-2 timeout 150s node scripts/world-v0-direct-resume-directory-outage-browser-audit.mjs | tee current-outage.log
          grep -q WORLD_V0_DIRECT_RESUME_DIRECTORY_OUTAGE_PASS current-outage.log
      - if: always()
        run: |
          if [ -f current-cross.pid ]; then pid="$(cat current-cross.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  handoff-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9274 > current-handoff-wrangler.log 2>&1 &
          echo $! > current-handoff.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-handoff-wrangler.log; exit 1
      - name: Soft capacity handoff
        run: |
          set -euo pipefail
          MW_WORLD_V0_SOFT_BROWSER_BASE=http://127.0.0.1:8787 MW_WORLD_V0_SOFT_BROWSER_ROOM=yard-3 MW_WORLD_V0_SOFT_BROWSER_OUTPUT=current-soft.json timeout 180s node scripts/world-v0-soft-reservation-browser-handoff-audit.mjs | tee current-soft.log
          grep -q WORLD_V0_SOFT_RESERVATION_BROWSER_HANDOFF_PASS current-soft.log
      - name: Resumed stayer handoff
        run: |
          set -euo pipefail
          MW_WORLD_V0_RSH_BASE=http://127.0.0.1:8787 MW_WORLD_V0_RSH_ROOM=yard-2 MW_WORLD_V0_RSH_OUTPUT=current-stayer.json timeout 180s node scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs | tee current-stayer.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_PASS current-stayer.log
      - if: always()
        run: |
          if [ -f current-handoff.pid ]; then pid="$(cat current-handoff.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  causal-exact-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9275 > current-rebase-wrangler.log 2>&1 &
          echo $! > current-rebase.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-rebase-wrangler.log; exit 1
      - name: Pending causal Resume, peer parity and real Chromium exact rebase
        run: |
          set -euo pipefail
          MW_WORLD_V0_PENDING_RESUME_BASE=http://127.0.0.1:8787 MW_WORLD_V0_PENDING_RESUME_OUTPUT=current-pending-resume.json timeout 90s node scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs | tee current-pending-resume.log
          grep -q WORLD_V0_JUMP_PENDING_RESUME_HIGHWATER_V28_PASS current-pending-resume.log
          MW_WORLD_V0_V28_PARITY_BASE=http://127.0.0.1:8787 MW_WORLD_V0_V28_PARITY_OUTPUT=current-peer-rebase.json timeout 90s node scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs | tee current-peer-rebase.log
          grep -q WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS current-peer-rebase.log
          MW_WORLD_V0_I4B_BASE=http://127.0.0.1:8787 MW_WORLD_V0_I4B_PROXY_PORT=8797 MW_WORLD_V0_I4B_OUTPUT=current-i4b.json timeout 150s node scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee current-i4b.log
          grep -q WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS current-i4b.log
      - if: always()
        run: |
          if [ -f current-rebase.pid ]; then pid="$(cat current-rebase.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi

  join-failure-clarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start isolated runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9276 > current-join-wrangler.log 2>&1 &
          echo $! > current-join.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat current-join-wrangler.log; exit 1
      - name: Capacity must remain distinct from handshake failure
        run: |
          set -euo pipefail
          MW_WORLD_V0_JOIN_CLARITY_BASE=http://127.0.0.1:8787 timeout 120s node scripts/world-v0-join-failure-clarity-browser-audit.mjs | tee current-join.log
          grep -q WORLD_V0_JOIN_FAILURE_CLARITY_BROWSER_PASS current-join.log
      - if: always()
        run: |
          if [ -f current-join.pid ]; then pid="$(cat current-join.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
