name: World V0 Direct Resume Fail-Closed Repair

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-direct-resume-fail-closed-repair.yml
      - scripts/apply-world-v0-direct-resume-fail-closed-repair.mjs
      - scripts/world-v0-direct-link-resume-browser-audit.mjs
      - scripts/world-v0-direct-resume-directory-outage-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Apply exact browser repair
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-direct-resume-fail-closed-repair.mjs
          git diff --check
          node --check public/world-v0/friend-ready.js
          node --check scripts/world-v0-direct-link-resume-browser-audit.mjs
          npm run check
      - name: Start isolated local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > direct-resume-repair-wrangler.log 2>&1 &
          echo $! > /tmp/direct-resume-repair.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat direct-resume-repair-wrangler.log
          exit 1
      - name: Prove normal direct-link resume remains exact
        env:
          MW_WORLD_V0_DIRECT_RESUME_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DIRECT_RESUME_ROOM: yard-3
          MW_WORLD_V0_DIRECT_RESUME_OUTPUT: direct-resume-normal.json
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-direct-link-resume-browser-audit.mjs | tee direct-resume-normal.log
          grep -q WORLD_V0_DIRECT_LINK_RESUME_PASS direct-resume-normal.log
      - name: Prove directory outage cannot downgrade private Resume
        env:
          MW_WORLD_V0_DIRECT_OUTAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DIRECT_OUTAGE_ROOM: yard-2
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-direct-resume-directory-outage-browser-audit.mjs | tee direct-resume-outage.log
          grep -q WORLD_V0_DIRECT_RESUME_DIRECTORY_OUTAGE_PASS direct-resume-outage.log
      - name: Commit qualified browser repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/friend-ready.js scripts/world-v0-direct-link-resume-browser-audit.mjs
          git diff --cached --quiet && { echo "No qualified change"; exit 1; }
          git commit -m "Keep direct Resume fail-closed without directory"
          git push origin HEAD:world-v0-foundation-stabilization-closure
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-direct-resume-repair-${{ github.run_id }}
          path: |
            direct-resume-normal.json
            direct-resume-normal.log
            direct-resume-outage.log
            direct-resume-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Workerd
        if: always()
        run: |
          if [ -f /tmp/direct-resume-repair.pid ]; then kill "$(cat /tmp/direct-resume-repair.pid)" 2>/dev/null || true; fi
