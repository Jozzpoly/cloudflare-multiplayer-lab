name: World V0 Foundation Stabilization Causal Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-foundation-stabilization-causal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Static and contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node scripts/world-v0-keyboard-focus-guard-smoke.mjs
          node scripts/world-v0-session-continuity-r3-smoke.mjs
          node --check scripts/world-v0-live-rebind-browser-audit.mjs
          node --check scripts/world-v0-soft-reservation-authority-probe.mjs
          node --check scripts/world-v0-soft-reservation-browser-handoff-audit.mjs

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-stabilization-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-stabilization-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo WORLD_V0_STABILIZATION_LOCAL_WORKER_READY
              exit 0
            fi
            sleep 1
          done
          cat world-v0-stabilization-wrangler.log
          exit 1

      - name: Prove live same-owner ActorSession rebound
        env:
          MW_WORLD_V0_LIVE_REBIND_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_LIVE_REBIND_ROOM: yard-2
          MW_WORLD_V0_LIVE_REBIND_OUTPUT: world-v0-stabilization-live-rebind.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-live-rebind-browser-audit.mjs | tee world-v0-stabilization-live-rebind.log
          grep -q 'WORLD_V0_LIVE_REBIND_PASS' world-v0-stabilization-live-rebind.log

      - name: Prove protected to soft admission and epoch handoff
        env:
          MW_WORLD_V0_SOFT_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_SOFT_ROOM: yard-1
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-soft-reservation-authority-probe.mjs | tee world-v0-stabilization-soft-reservation.log
          grep -q 'WORLD_V0_SOFT_RESERVATION_AUTHORITY_PASS' world-v0-stabilization-soft-reservation.log

      - name: Prove browser automatic recovery across soft handoff
        env:
          MW_WORLD_V0_SOFT_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_SOFT_BROWSER_ROOM: yard-3
          MW_WORLD_V0_SOFT_BROWSER_OUTPUT: world-v0-stabilization-soft-browser-handoff.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-soft-reservation-browser-handoff-audit.mjs | tee world-v0-stabilization-soft-browser-handoff.log
          grep -q 'WORLD_V0_SOFT_RESERVATION_BROWSER_HANDOFF_PASS' world-v0-stabilization-soft-browser-handoff.log

      - name: Preserve local-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-foundation-stabilization-causal-${{ github.run_id }}
          path: |
            world-v0-stabilization-*.log
            world-v0-stabilization-*.json
          if-no-files-found: ignore

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-stabilization-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-stabilization-wrangler.pid)" 2>/dev/null || true
          fi
