name: World V0 Foundation Stabilization Delivery

on:
  push:
    branches: [world-v0-foundation-stabilization-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-foundation-stabilization-delivery
  cancel-in-progress: false

env:
  VALIDATED_PRODUCT_SHA: 67dc5d2044827dc4ea1cee7b6f1b60805b062c4c
  QUALIFIED_ENV: qualified_play
  EXPECTED_WORKER: cloudflare-multiplayer-lab-qualified-play
  QUALIFIED_BASE_URL: https://cloudflare-multiplayer-lab-qualified-play.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deploy-stabilization-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact delivery head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact delivery identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          git cat-file -e "$VALIDATED_PRODUCT_SHA^{commit}"
          echo "STABILIZATION_DELIVERY_HEAD=$actual"

      - name: Prove runtime product bytes match validated stabilization source
        shell: bash
        run: |
          set -euo pipefail
          protected_paths=(
            public/world-v0
            src
            package.json
            package-lock.json
          )
          if ! git diff --quiet "$VALIDATED_PRODUCT_SHA" "$GITHUB_SHA" -- "${protected_paths[@]}"; then
            echo "Delivery runtime drift from validated stabilization source $VALIDATED_PRODUCT_SHA"
            git diff --stat "$VALIDATED_PRODUCT_SHA" "$GITHUB_SHA" -- "${protected_paths[@]}"
            git diff --name-status "$VALIDATED_PRODUCT_SHA" "$GITHUB_SHA" -- "${protected_paths[@]}"
            exit 1
          fi
          echo "STABILIZATION_RUNTIME_BYTES_MATCH validated=$VALIDATED_PRODUCT_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Run repository validation
        run: npm run check

      - name: Guard existing isolated qualified-play target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const env = config.env?.qualified_play;
          if (!env) throw new Error("wrangler env.qualified_play missing");
          if (env.name !== process.env.EXPECTED_WORKER) throw new Error(`qualified worker drift ${env.name}`);
          if (env.workers_dev !== true) throw new Error("qualified_play workers_dev must stay enabled");
          const bindings = env.durable_objects?.bindings || [];
          const yard = bindings.find((binding) => binding.name === "SHARED_YARD_V0");
          if (!yard || yard.class_name !== "SharedYardV0") throw new Error("qualified_play SharedYardV0 binding missing");
          if (yard.script_name) throw new Error("qualified_play must own its isolated Durable Object namespace");
          const workerFirst = env.assets?.run_worker_first || [];
          if (!workerFirst.includes("/world-v0/ws")) throw new Error("qualified_play /world-v0/ws worker-first route missing");
          console.log(`STABILIZATION_TARGET_GUARD_PASS worker=${env.name}`);
          NODE

      - name: Generate deployment provenance asset
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import {
            WORLD_V0_BROWSER_UI_REVISION,
            WORLD_V0_CLIENT_SIM_REVISION,
            WORLD_V0_EXPECTED_SERVER_REVISION,
            WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
          } from "./public/world-v0/build-contract.js";
          import {
            WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION,
            WORLD_V0_PUBLIC_ROOM_DIRECTORY_REVISION,
          } from "./public/world-v0/public-room-entry.js";
          import { WORLD_V0_SESSION_CONTINUITY_REVISION } from "./public/world-v0/session-continuity.js";

          const provenance = {
            purpose: "world-v0-foundation-stabilization-owner-candidate",
            validatedProductSha: process.env.VALIDATED_PRODUCT_SHA,
            deliveryBranch: process.env.GITHUB_REF_NAME,
            deliverySha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0),
            worker: process.env.EXPECTED_WORKER,
            environment: process.env.QUALIFIED_ENV,
            placementMode: "reuse-owner-placed-qualified-play-namespace",
            workflowTouchesHumanDurableObjects: false,
            uiRevision: WORLD_V0_BROWSER_UI_REVISION,
            clientSimRevision: WORLD_V0_CLIENT_SIM_REVISION,
            serverRevision: WORLD_V0_EXPECTED_SERVER_REVISION,
            protocolRevision: WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            stateGuardRevision: WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
            simBuildId: WORLD_V0_EXPECTED_SIM_BUILD_ID,
            publicRoomEntryRevision: WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION,
            publicRoomDirectoryRevision: WORLD_V0_PUBLIC_ROOM_DIRECTORY_REVISION,
            sessionContinuityRevision: WORLD_V0_SESSION_CONTINUITY_REVISION,
          };

          writeFileSync("public/world-v0/deploy-provenance.json", `${JSON.stringify(provenance, null, 2)}\n`);
          console.log("STABILIZATION_PROVENANCE_PREPARED", JSON.stringify(provenance));
          NODE

      - name: Dry-run isolated stabilization deployment
        run: npx wrangler deploy --dry-run --env "$QUALIFIED_ENV" --outdir .wrangler/stabilization-dry-run

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare deployment credential is available."

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy isolated qualified-play environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env "$QUALIFIED_ENV"

      - name: Wait for static candidate identity without touching human Durable Objects
        run: |
          node --input-type=module <<'NODE'
          import {
            WORLD_V0_BROWSER_UI_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
          } from "./public/world-v0/build-contract.js";
          import {
            WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION,
            WORLD_V0_PUBLIC_ROOM_DIRECTORY_REVISION,
          } from "./public/world-v0/public-room-entry.js";
          import { WORLD_V0_SESSION_CONTINUITY_REVISION } from "./public/world-v0/session-continuity.js";

          const base = process.env.QUALIFIED_BASE_URL.replace(/\/$/, "");
          const deadline = Date.now() + 90_000;
          let last = null;

          while (Date.now() < deadline) {
            const cacheBust = `${process.env.GITHUB_SHA}-${Date.now()}`;
            try {
              const [contractResponse, roomResponse, sessionResponse, provenanceResponse] = await Promise.all([
                fetch(`${base}/world-v0/build-contract.js?candidate=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${base}/world-v0/public-room-entry.js?candidate=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${base}/world-v0/session-continuity.js?candidate=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${base}/world-v0/deploy-provenance.json?candidate=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
              ]);

              const contractBody = await contractResponse.text();
              const roomBody = await roomResponse.text();
              const sessionBody = await sessionResponse.text();
              let provenance = null;
              if (provenanceResponse.ok) {
                try { provenance = await provenanceResponse.json(); } catch {}
              }

              last = {
                contractStatus: contractResponse.status,
                roomStatus: roomResponse.status,
                sessionStatus: sessionResponse.status,
                provenanceStatus: provenanceResponse.status,
                ui: contractBody.includes(WORLD_V0_BROWSER_UI_REVISION),
                sim: contractBody.includes(WORLD_V0_EXPECTED_SIM_BUILD_ID),
                publicRoomEntry: roomBody.includes(WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION),
                publicRoomDirectory: roomBody.includes(WORLD_V0_PUBLIC_ROOM_DIRECTORY_REVISION),
                sessionContinuity: sessionBody.includes(WORLD_V0_SESSION_CONTINUITY_REVISION),
                validatedProductSha: provenance?.validatedProductSha,
                deliverySha: provenance?.deliverySha,
                worker: provenance?.worker,
                workflowTouchesHumanDurableObjects: provenance?.workflowTouchesHumanDurableObjects,
              };

              if (
                contractResponse.ok && roomResponse.ok && sessionResponse.ok && provenanceResponse.ok &&
                last.ui && last.sim && last.publicRoomEntry && last.publicRoomDirectory && last.sessionContinuity &&
                provenance?.validatedProductSha === process.env.VALIDATED_PRODUCT_SHA &&
                provenance?.deliverySha === process.env.GITHUB_SHA &&
                provenance?.worker === process.env.EXPECTED_WORKER &&
                provenance?.workflowTouchesHumanDurableObjects === false
              ) {
                console.log("STABILIZATION_STATIC_IDENTITY_PASS", JSON.stringify(last));
                console.log("HUMAN_DURABLE_OBJECTS_UNTOUCHED_BY_WORKFLOW");
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }

            console.log("STABILIZATION_STATIC_IDENTITY_WAIT", JSON.stringify(last));
            await new Promise((resolve) => setTimeout(resolve, 1500));
          }

          throw new Error(`stabilization static identity did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: Upload stabilization delivery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-foundation-stabilization-delivery-${{ github.run_attempt }}
          path: |
            .wrangler/stabilization-dry-run
            public/world-v0/deploy-provenance.json
          if-no-files-found: warn
          retention-days: 30
