name: World V0 Join Failure Clarity Repair

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-join-failure-clarity-repair.yml
      - scripts/apply-world-v0-join-failure-clarity.mjs
      - scripts/world-v0-join-failure-clarity-smoke.mjs
      - scripts/world-v0-join-failure-clarity-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Apply candidate clarity repair
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-join-failure-clarity.mjs
          git diff --check
          node --check public/world-v0/app.js
          node --check public/world-v0/join-failure-clarity.js
          node --check scripts/world-v0-join-failure-clarity-smoke.mjs
          node --check scripts/world-v0-join-failure-clarity-browser-audit.mjs
          node scripts/world-v0-join-failure-clarity-smoke.mjs
          npm run check

      - name: Start isolated local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > join-failure-clarity-wrangler.log 2>&1 &
          echo $! > /tmp/join-failure-clarity.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo WORLD_V0_JOIN_FAILURE_CLARITY_WORKER_READY
              exit 0
            fi
            sleep 1
          done
          cat join-failure-clarity-wrangler.log
          exit 1

      - name: Prove capacity and transport failures separate in real Chromium
        env:
          MW_WORLD_V0_JOIN_CLARITY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_JOIN_CLARITY_FULL_ROOM: yard-1
          MW_WORLD_V0_JOIN_CLARITY_TRANSPORT_ROOM: yard-2
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-join-failure-clarity-browser-audit.mjs | tee join-failure-clarity-browser.log
          grep -q WORLD_V0_JOIN_FAILURE_CLARITY_BROWSER_PASS join-failure-clarity-browser.log

      - name: Reprove normal direct-link Resume
        env:
          MW_WORLD_V0_DIRECT_RESUME_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DIRECT_RESUME_ROOM: yard-3
          MW_WORLD_V0_DIRECT_RESUME_OUTPUT: join-failure-clarity-direct-resume.json
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-direct-link-resume-browser-audit.mjs | tee join-failure-clarity-direct-resume.log
          grep -q WORLD_V0_DIRECT_LINK_RESUME_PASS join-failure-clarity-direct-resume.log

      - name: Reprove fail-closed Resume during directory outage
        env:
          MW_WORLD_V0_DIRECT_OUTAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DIRECT_OUTAGE_ROOM: yard-2
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-direct-resume-directory-outage-browser-audit.mjs | tee join-failure-clarity-outage-resume.log
          grep -q WORLD_V0_DIRECT_RESUME_DIRECTORY_OUTAGE_PASS join-failure-clarity-outage-resume.log

      - name: Commit qualified product repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/app.js public/world-v0/join-failure-clarity.js
          git diff --cached --quiet && { echo "No qualified product change"; exit 1; }
          git commit -m "Clarify Yard admission failures"
          git push origin HEAD:world-v0-foundation-stabilization-closure

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-join-failure-clarity-${{ github.run_id }}
          path: |
            join-failure-clarity-browser.log
            join-failure-clarity-direct-resume.json
            join-failure-clarity-direct-resume.log
            join-failure-clarity-outage-resume.log
            join-failure-clarity-wrangler.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/join-failure-clarity.pid ]; then
            kill "$(cat /tmp/join-failure-clarity.pid)" 2>/dev/null || true
          fi
