name: World V0 Jump Reliability R1 Materialize

on:
  push:
    branches: [world-v0-jump-reliability-r1]
    paths:
      - .github/workflows/world-v0-jump-reliability-r1-materialize.yml
      - scripts/materialize-world-v0-jump-reliability-r1.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-jump-reliability-r1-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: world-v0-jump-reliability-r1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Materialize narrow jump reliability repair
        run: node scripts/materialize-world-v0-jump-reliability-r1.mjs

      - name: Prove bounded runtime diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files
          printf '%s\n' \
            public/world-v0/app.js \
            public/world-v0/build-contract.js \
            src/world-v0-contract.ts \
            src/world-v0-shared-yard.ts | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --stat

      - name: Validate materialized repository
        run: npm run check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jozzpoly"
          git config user.email "100104127+Jozzpoly@users.noreply.github.com"
          git add public/world-v0/app.js public/world-v0/build-contract.js src/world-v0-contract.ts src/world-v0-shared-yard.ts
          git commit -m "fix(world-v0): make jump intent transport durable"
          git push origin HEAD:world-v0-jump-reliability-r1
