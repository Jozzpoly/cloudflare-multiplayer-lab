name: World V0 Jump Reliability R1

on:
  push:
    branches: [world-v0-jump-reliability-r1]
    paths:
      - .github/workflows/world-v0-jump-reliability-r1.yml
      - scripts/world-v0-jump-window-repair-audit.mjs
      - public/world-v0/app.js
      - public/world-v0/build-contract.js
      - src/world-v0-contract.ts
      - src/world-v0-shared-yard.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-jump-reliability-r1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove validator did not mutate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 803cae3dce75a97739ba4ede31d3e08a4a5c55b8 -- \
            public/world-v0 \
            src/world-v0-contract.ts \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts
          echo WORLD_V0_JUMP_REPAIR_RUNTIME_PIN_PASS

      - name: Current repository checks
        run: npm run check

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-jump-repair-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-jump-repair-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "jump repair Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-jump-repair-wrangler.log
          exit 1

      - name: Real Chromium jump-window transport durability
        env:
          MW_WORLD_V0_JUMP_REPAIR_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_REPAIR_DELAY_MS: 45
          MW_WORLD_V0_JUMP_REPAIR_OUTPUT: world-v0-jump-window-repair.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-jump-window-repair-audit.mjs | tee world-v0-jump-window-repair.log
          grep -q 'WORLD_V0_JUMP_WINDOW_REPAIR_PASS' world-v0-jump-window-repair.log

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-jump-repair-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-jump-repair-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload jump repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-jump-reliability-r1-${{ github.run_attempt }}
          path: |
            world-v0-jump-window-repair.log
            world-v0-jump-window-repair.json
            world-v0-jump-repair-wrangler.log
          if-no-files-found: warn
          retention-days: 14
