name: World V0 Jump Reliability R2 Materialize

on:
  push:
    branches: [world-v0-jump-reliability-r2]
    paths:
      - .github/workflows/world-v0-jump-reliability-r2-materialize.yml
      - scripts/materialize-world-v0-jump-reliability-r2.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-jump-reliability-r2-materialize
  cancel-in-progress: true

jobs:
  materialize-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Materialize R2 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-world-v0-jump-reliability-r2.mjs | tee world-v0-jump-r2-materialize.log
          node --check public/world-v0/app.js
          node --check scripts/world-v0-jump-delivery-persistence-audit.mjs
          grep -q 'world-v0-jump-delivery-persistence-v1' public/world-v0/app.js
          grep -q 'shared-yard-v0-logical-input-scheduler-v3-jump-delivery-persistence' public/world-v0/app.js
          grep -q 'shared-yard-v0-contract-v14-jump-delivery-persistence' src/world-v0-contract.ts
          grep -q 'shared-yard-v0-browser-sim-v10-jump-delivery-persistence' public/world-v0/build-contract.js
          ! grep -q 'jumpIntentWindowTicks' src/world-v0-contract.ts
          ! grep -q 'jumpQueued' public/world-v0/app.js
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' public/world-v0/app.js public/world-v0/build-contract.js src/world-v0-contract.ts | sort)"
          test "$actual" = "$expected"
          git diff --check
          echo WORLD_V0_JUMP_R2_MATERIALIZED_DIFF_PASS

      - name: Full repository checks
        run: npm run check

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-jump-r2-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-jump-r2-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "World V0 R2 Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-jump-r2-wrangler.log
          exit 1

      - name: Real Chromium delivery persistence falsifier
        env:
          MW_WORLD_V0_JUMP_DELIVERY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_DELIVERY_LOSS_DELAY_MS: 180
          MW_WORLD_V0_JUMP_DELIVERY_RECOVERY_DELAY_MS: 45
          MW_WORLD_V0_JUMP_DELIVERY_OUTPUT: world-v0-jump-r2.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node --experimental-strip-types scripts/world-v0-jump-delivery-persistence-audit.mjs | tee world-v0-jump-r2.log
          grep -q 'WORLD_V0_JUMP_DELIVERY_PERSISTENCE_PASS' world-v0-jump-r2.log

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-jump-r2-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-jump-r2-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Commit qualified runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jozzpoly"
          git config user.email "100104127+Jozzpoly@users.noreply.github.com"
          git add public/world-v0/app.js public/world-v0/build-contract.js src/world-v0-contract.ts
          git diff --cached --check
          git commit -m "fix(world-v0): persist jump until canonical delivery"
          git push origin HEAD:world-v0-jump-reliability-r2

      - name: Upload R2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-jump-reliability-r2-${{ github.run_attempt }}
          path: |
            world-v0-jump-r2-materialize.log
            world-v0-jump-r2.log
            world-v0-jump-r2.json
            world-v0-jump-r2-wrangler.log
          if-no-files-found: warn
          retention-days: 14
