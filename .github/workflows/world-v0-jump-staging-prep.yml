name: World V0 Jump Staging Prep

on:
  push:
    branches: [world-v0-jump-staging-prep]
    paths: [.github/workflows/world-v0-jump-staging-prep.yml]

permissions:
  contents: write

env:
  EXPECTED_STAGING_BASE: a91a5e5b53adcebf65a2207e963fb2bc46379151
  PRODUCT_SOURCE_BRANCH: world-v0-jump-candidate
  PRODUCT_SOURCE_SHA: 206edf730f7b5f506e413118acdca71ee2da0e66

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout staging-derived prep branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable promotion inputs
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_STAGING_BASE^{commit}"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          test "$(git rev-parse "origin/$PRODUCT_SOURCE_BRANCH")" = "$PRODUCT_SOURCE_SHA"
          test "$(git merge-base HEAD "$EXPECTED_STAGING_BASE")" = "$EXPECTED_STAGING_BASE"

      - name: Materialize exact jump product bytes
        run: |
          set -euo pipefail
          protected=(
            public/world-v0
            src/world-v0-contract.ts
            src/world-v0-protocol.ts
            src/world-v0-shared-yard.ts
            src/box3d-runtime.ts
            src/world-slice-entry.ts
            wrangler.jsonc
            package.json
            package-lock.json
          )
          git checkout "$PRODUCT_SOURCE_SHA" -- "${protected[@]}"
          git checkout "$PRODUCT_SOURCE_SHA" -- scripts/world-v0-protocol-smoke.ts
          if ! git diff --quiet "$PRODUCT_SOURCE_SHA" -- "${protected[@]}"; then
            echo "Prepared staging product does not exactly match jump candidate."
            git diff --stat "$PRODUCT_SOURCE_SHA" -- "${protected[@]}"
            git diff --name-status "$PRODUCT_SOURCE_SHA" -- "${protected[@]}"
            exit 1
          fi
          echo "JUMP_PROMOTION_PRODUCT_BYTES_EXACT source=$PRODUCT_SOURCE_BRANCH@$PRODUCT_SOURCE_SHA"

      - name: Bind delivery product-source marker
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(".github/world-v0-product-source.json", `${JSON.stringify({
            productBranch: process.env.PRODUCT_SOURCE_BRANCH,
            productSourceSha: process.env.PRODUCT_SOURCE_SHA,
          }, null, 2)}\n`);
          NODE

      - name: Validate exact prepared staging tree
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:staging-deploy-guard
          npm run validate:staging-contract
          npx wrangler deploy --dry-run --env staging --outdir .wrangler/jump-staging-prep
          git diff --check

      - name: Commit prepared specimen only on prep branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/world-v0 \
            src/world-v0-contract.ts \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts \
            src/box3d-runtime.ts \
            src/world-slice-entry.ts \
            wrangler.jsonc package.json package-lock.json \
            scripts/world-v0-protocol-smoke.ts \
            .github/world-v0-product-source.json
          git diff --cached --check
          git commit -m "chore(world-v0): prepare qualified jump staging delivery"
          git push origin HEAD:world-v0-jump-staging-prep
