name: World V0 Jump Support V0

on:
  push:
    branches: [world-v0-jump-support-v0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-jump-support-v0
  cancel-in-progress: true

env:
  FRIEND_READY_BASE: 5dd28a899c4f60c9227f1eb93026f571ced733e3
  JUMP_RUNTIME: 4a5f375dc148632914418c1b19f92e977d5dfb57

jobs:
  qualify-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact jump branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove candidate lineage and static boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FRIEND_READY_BASE" HEAD
          git merge-base --is-ancestor "$JUMP_RUNTIME" HEAD
          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-jump-authority-smoke.mjs
          node --check scripts/world-v0-jump-browser-smoke.mjs
          node --check scripts/world-v0-jump-browser-rollback-smoke.mjs
          node --check scripts/world-v0-solo-inspection-browser-smoke.mjs
          node --experimental-strip-types scripts/world-v0-protocol-smoke.ts
          git diff --check

      - name: Preserve full repository regression envelope
        run: npm run check

  qualify-authority-jump:
    needs: qualify-repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact jump branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Start jump candidate Worker in local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-jump-authority-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-jump-authority-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "jump authority Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-jump-authority-wrangler.log
          exit 1

      - name: Falsify grounded-airborne-landed jump semantics
        env:
          MW_WORLD_V0_JUMP_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_AUTHORITY_OUTPUT: world-v0-jump-authority-evidence.json
        run: node scripts/world-v0-jump-authority-smoke.mjs

      - name: Stop authority Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-jump-authority-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-jump-authority-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload authority jump evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-jump-authority-attempt-${{ github.run_attempt }}
          path: |
            world-v0-jump-authority-evidence.json
            world-v0-jump-authority-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  qualify-browser-jump:
    needs: qualify-authority-jump
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact jump branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Start browser jump Worker in local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-jump-browser-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-jump-browser-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "jump browser Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-jump-browser-wrangler.log
          exit 1

      - name: Preserve real-authority Inspect solo baseline on jump runtime
        env:
          MW_WORLD_V0_SOLO_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SOLO_OUTPUT: world-v0-jump-solo-baseline.json
        run: node scripts/world-v0-solo-inspection-browser-smoke.mjs

      - name: Falsify browser prediction and exact-state jump path
        env:
          MW_WORLD_V0_JUMP_BROWSER_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_BROWSER_OUTPUT: world-v0-jump-browser-evidence.json
        run: node scripts/world-v0-jump-browser-smoke.mjs

      - name: Stop browser Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-jump-browser-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-jump-browser-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload browser jump evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-jump-browser-attempt-${{ github.run_attempt }}
          path: |
            world-v0-jump-solo-baseline.json
            world-v0-jump-browser-evidence.json
            world-v0-jump-browser-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  qualify-browser-jump-rollback:
    needs: qualify-browser-jump
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact jump branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Start rollback Worker in local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-jump-rollback-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-jump-rollback-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "jump rollback Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-jump-rollback-wrangler.log
          exit 1

      - name: Force canonical contradiction across predicted jump
        env:
          MW_WORLD_V0_JUMP_ROLLBACK_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_ROLLBACK_OUTPUT: world-v0-jump-browser-rollback-evidence.json
        run: node scripts/world-v0-jump-browser-rollback-smoke.mjs

      - name: Stop rollback Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-jump-rollback-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-jump-rollback-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload jump rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-jump-browser-rollback-attempt-${{ github.run_attempt }}
          path: |
            world-v0-jump-browser-rollback-evidence.json
            world-v0-jump-rollback-wrangler.log
          if-no-files-found: warn
          retention-days: 14
