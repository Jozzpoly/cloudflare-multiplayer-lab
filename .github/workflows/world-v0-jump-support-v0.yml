name: World V0 Jump Support V0

on:
  push:
    branches: [world-v0-jump-support-v0]

permissions:
  contents: write

concurrency:
  group: world-v0-jump-support-v0
  cancel-in-progress: false

env:
  JUMP_BASE: 5dd28a899c4f60c9227f1eb93026f571ced733e3

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[jump-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact jump branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove bounded pre-materialization delta
        run: |
          set -euo pipefail
          git cat-file -e "$JUMP_BASE^{commit}"
          unexpected="$(git diff --name-only "$JUMP_BASE"...HEAD | grep -Ev '^(scripts/materialize-world-v0-jump-support-v0\.mjs|\.github/workflows/world-v0-jump-support-v0\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pre-materialization files:"
            echo "$unexpected"
            exit 1
          fi
          node --check scripts/materialize-world-v0-jump-support-v0.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Materialize exact jump-support delta
        run: node scripts/materialize-world-v0-jump-support-v0.mjs

      - name: Prove generated file boundary
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            public/world-v0/app.js \
            public/world-v0/build-contract.js \
            public/world-v0/index.html \
            public/world-v0/styles.css \
            src/world-v0-contract.ts \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts | sort)"
          test "$changed" = "$expected" || {
            echo "Generated boundary mismatch"
            echo "Changed:"; echo "$changed"
            echo "Expected:"; echo "$expected"
            exit 1
          }

      - name: Falsify generated runtime before commit
        run: |
          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          npm run check

      - name: Commit only validated generated runtime
        run: |
          set -euo pipefail
          git config user.name "Jozzpoly"
          git config user.email "100104127+Jozzpoly@users.noreply.github.com"
          git add \
            public/world-v0/app.js \
            public/world-v0/build-contract.js \
            public/world-v0/index.html \
            public/world-v0/styles.css \
            src/world-v0-contract.ts \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts
          git commit -m "feat(world-v0): materialize bounded jump support [jump-materialized]"
          git push origin HEAD:world-v0-jump-support-v0

  materialized-checkpoint:
    if: ${{ contains(github.event.head_commit.message, '[jump-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Preserve post-materialization repository checks
        run: |
          git diff --check
          npm run check
