name: World V0 Mobile Input Release Candidate

on:
  push:
    branches: [world-v0-mobile-input-release-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-mobile-input-release-candidate
  cancel-in-progress: true

env:
  FR_A_SOURCE: f9686b6bb7e3414fbc9c2bc0bf981e14c65d09c6
  TRANSFORM: scripts/world-v0-mobile-input-release-transform.mjs

jobs:
  candidate-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact FR-A product and apply bounded transform
        run: |
          set -euo pipefail
          git cat-file -e "$FR_A_SOURCE^{commit}"
          protected=(public/world-v0 src wrangler.jsonc package.json package-lock.json scripts/world-v0-playable-interaction-smoke.mjs)
          if ! git diff --quiet "$FR_A_SOURCE" -- "${protected[@]}"; then
            echo "Candidate branch already changed qualified product/apparatus before applying the bounded transform."
            git diff --stat "$FR_A_SOURCE" -- "${protected[@]}"
            exit 1
          fi
          node --check "$TRANSFORM"
          node "$TRANSFORM"
          git diff --check
          mapfile -t changed < <(git diff --name-only "$FR_A_SOURCE" -- public/world-v0 src wrangler.jsonc package.json package-lock.json scripts/world-v0-playable-interaction-smoke.mjs)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "public/world-v0/app.js"
          test "${changed[1]}" = "scripts/world-v0-playable-interaction-smoke.mjs"
          node --check public/world-v0/app.js
          node --check scripts/world-v0-playable-interaction-smoke.mjs
          node --check scripts/world-v0-lostpointercapture-spec-probe.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install qualified dependency graph
        run: npm ci

      - name: Preserve pure and repository falsifiers
        run: |
          node scripts/world-v0-friend-entry-core-smoke.mjs
          node scripts/world-v0-playable-control-smoke.mjs
          node scripts/world-v0-solo-inspection-core-smoke.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
          npm run check

      - name: Start core Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-mobile-release-core-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-mobile-release-core.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-mobile-release-core-wrangler.log
          exit 1

      - name: Preserve frozen authority baseline
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-mobile-release-authority.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Stop core Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-mobile-release-core.pid ]; then kill "$(cat /tmp/world-v0-mobile-release-core.pid)" 2>/dev/null || true; fi

      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-mobile-release-core-attempt-${{ github.run_attempt }}
          path: |
            world-v0-mobile-release-authority.json
            world-v0-mobile-release-core-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  candidate-presentation:
    needs: candidate-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@v4
      - name: Apply exact-anchor candidate transform
        run: |
          set -euo pipefail
          node "$TRANSFORM"
          git diff --check
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install qualified dependency graph
        run: npm ci
      - name: Start presentation Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-mobile-release-presentation-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-mobile-release-presentation.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-mobile-release-presentation-wrangler.log
          exit 1
      - name: Require spec-processed capture loss to be safe
        env:
          MW_WORLD_V0_CAPTURE_SPEC_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_CAPTURE_SPEC_OUTPUT: world-v0-mobile-release-spec-safe.json
        run: |
          set +e
          node scripts/world-v0-lostpointercapture-spec-probe.mjs
          echo "spec_probe_exit=$?" >> "$GITHUB_ENV"
          set -e
          test -f world-v0-mobile-release-spec-safe.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("world-v0-mobile-release-spec-safe.json", "utf8"));
          for (const name of ["joystick", "gimbal"]) {
            const sample = evidence[name];
            if (!sample || sample.lostPointerCaptureEvents < 1) throw new Error(`${name} lostpointercapture not observed: ${JSON.stringify(sample)}`);
            if (sample.staleAfterProcessedLoss !== false) throw new Error(`${name} still stale after processed loss: ${JSON.stringify(sample)}`);
          }
          const result = {
            verdict: "WORLD_V0_MOBILE_INPUT_RELEASE_SAFE",
            generatedAt: new Date().toISOString(),
            source: process.env.FR_A_SOURCE,
            probeScriptExit: process.env.spec_probe_exit ?? null,
            joystick: evidence.joystick,
            gimbal: evidence.gimbal,
            note: "The witness-oriented probe is expected to exit nonzero once the candidate is safe; this classifier requires actual lostpointercapture plus zeroed input for both controls."
          };
          fs.writeFileSync("world-v0-mobile-release-safe-classification.json", JSON.stringify(result, null, 2));
          console.log(result.verdict);
          NODE
      - name: Preserve host-to-friend entry
        env:
          MW_WORLD_V0_FRIEND_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_FRIEND_ENTRY_OUTPUT: world-v0-mobile-release-entry.json
        run: node scripts/world-v0-friend-entry-browser-smoke.mjs
      - name: Preserve controls with truthful gimbal release assertion
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-mobile-release-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs
      - name: Preserve manual fresh-epoch lifecycle
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-mobile-release-session.json
        run: node scripts/world-v0-session-friction-smoke.mjs
      - name: Preserve desktop and portrait shell
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-mobile-release-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs
      - name: Stop presentation Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-mobile-release-presentation.pid ]; then kill "$(cat /tmp/world-v0-mobile-release-presentation.pid)" 2>/dev/null || true; fi
      - name: Upload presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-mobile-release-presentation-attempt-${{ github.run_attempt }}
          path: |
            world-v0-mobile-release-spec-safe.json
            world-v0-mobile-release-safe-classification.json
            world-v0-mobile-release-entry.json
            world-v0-mobile-release-interaction.json
            world-v0-mobile-release-session.json
            world-v0-mobile-release-shell.json
            world-v0-runtime-shell-*.png
            world-v0-mobile-release-presentation-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  candidate-solo:
    needs: candidate-core
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-anchor candidate transform
        run: node "$TRANSFORM"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start solo Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-mobile-release-solo-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-mobile-release-solo.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-mobile-release-solo-wrangler.log
          exit 1
      - name: Preserve real-authority Inspect solo
        env:
          MW_WORLD_V0_SOLO_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SOLO_OUTPUT: world-v0-mobile-release-solo.json
        run: node scripts/world-v0-solo-inspection-browser-smoke.mjs
      - name: Stop solo Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-mobile-release-solo.pid ]; then kill "$(cat /tmp/world-v0-mobile-release-solo.pid)" 2>/dev/null || true; fi
      - name: Upload solo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-mobile-release-solo-attempt-${{ github.run_attempt }}
          path: |
            world-v0-mobile-release-solo.json
            world-v0-mobile-release-solo-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  candidate-exact-state:
    needs: candidate-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-anchor candidate transform
        run: node "$TRANSFORM"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify exact-state apparatus
        run: |
          node --check scripts/world-v0-chromium-cloud-smoke.mjs
          node --check scripts/world-v0-exact-failure-classifier.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
      - name: Start exact Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-mobile-release-exact-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-mobile-release-exact.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-mobile-release-exact-wrangler.log
          exit 1
      - name: Prepare local exact-state target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          let chromium = readFileSync("scripts/world-v0-chromium-cloud-smoke.mjs", "utf8");
          const remote = 'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";';
          const local = 'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";';
          if (!chromium.includes(remote)) throw new Error("mobile release exact-state local-target anchor drift");
          chromium = chromium.replace(remote, local);
          writeFileSync("scripts/.world-v0-mobile-release-exact.mjs", chromium);
          NODE
      - name: Preserve exact-state causal envelope
        id: exact
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-mobile-release-exact.json
        run: node scripts/.world-v0-mobile-release-exact.mjs
      - name: Classify exact failure
        if: steps.exact.outcome == 'failure'
        run: node scripts/world-v0-exact-failure-classifier.mjs world-v0-mobile-release-exact.json
      - name: Require exact-state qualification
        env:
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: test "$EXACT_OUTCOME" = success
      - name: Stop exact Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-mobile-release-exact.pid ]; then kill "$(cat /tmp/world-v0-mobile-release-exact.pid)" 2>/dev/null || true; fi
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-mobile-release-exact-attempt-${{ github.run_attempt }}
          path: |
            world-v0-mobile-release-exact.json
            world-v0-mobile-release-exact-wrangler.log
          if-no-files-found: warn
          retention-days: 14
