name: World V0 Multiplayer Foundation I4a

on:
  push:
    branches:
      - world-v0-multiplayer-foundation-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  i4a-pinned-rebase-runtime-seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify committed pinned Box3D artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/world-v0/box3d-i4/box3d.inline.mjs
          test -s public/world-v0/box3d-i4/box3d.wasm
          grep -q 'i4-raw-seed-bindings-box3djs-5d5a3af-emsdk-6.0.2' src/world-v0-contract.ts
          MODULE_SHA="$(sha256sum public/world-v0/box3d-i4/box3d.inline.mjs | awk '{print $1}')"
          WASM_SHA="$(sha256sum public/world-v0/box3d-i4/box3d.wasm | awk '{print $1}')"
          test "$MODULE_SHA" = "5f7f2aea85b4ad39bb87c5362e219db1773f1ca85e616f33760781e3ca03708a"
          test "$WASM_SHA" = "4ded44b9caff36ef1eaa5a40be542225b62225be48c21ff1478a61e7c6dfb95c"
          printf '%s  %s\n%s  %s\n' "$MODULE_SHA" public/world-v0/box3d-i4/box3d.inline.mjs "$WASM_SHA" public/world-v0/box3d-i4/box3d.wasm | tee world-v0-i4a-box3d-sha256.log
          echo "WORLD_V0_I4A_PINNED_BOX3D committed and fingerprint-exact"

      - name: Apply I4a only on the original I4a contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'shared-yard-v0-contract-v5-i4-rebase-runtime-seam' src/world-v0-contract.ts; then
            node scripts/world-v0-integration-i4a-apply.mjs
            NEW_SIM_BUILD_ID="$(node --experimental-strip-types -e 'import("./src/world-v0-contract.ts").then((m) => process.stdout.write(m.WORLD_V0_SIM_BUILD_ID))')"
            node scripts/world-v0-integration-i4a-build-contract-apply.mjs "$NEW_SIM_BUILD_ID"
            echo "I4a computed SimBuildId: $NEW_SIM_BUILD_ID" | tee world-v0-i4a-sim-build.log
          else
            NEW_SIM_BUILD_ID="$(node --experimental-strip-types -e 'import("./src/world-v0-contract.ts").then((m) => process.stdout.write(m.WORLD_V0_SIM_BUILD_ID))')"
            echo "I4a seam carried forward by later contract · $NEW_SIM_BUILD_ID" | tee world-v0-i4a-sim-build.log
          fi
          git diff --check

      - name: Run focused I4a seam falsifier
        run: node --experimental-strip-types scripts/world-v0-integration-i4a-seam-probe.mjs | tee world-v0-i4a-seam-probe.log

      - name: Run full repository validation
        run: npm run check

      - name: Prove I1-I3 behavior still survives custom runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8795 --log-level warn > world-v0-i4a-candidate-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          cleanup() {
            kill "$WRANGLER_PID" 2>/dev/null || true
            wait "$WRANGLER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              cat world-v0-i4a-candidate-wrangler.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8795/world-v0/ >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8795/world-v0/ >/dev/null

          MW_WORLD_V0_I3_BASE=http://127.0.0.1:8795 \
          MW_WORLD_V0_I3_FREEZE_MS=1200 \
          MW_WORLD_V0_I3B_CLEAN_REQUIRED=1 \
          MW_WORLD_V0_I3B_MAX_ATTEMPTS=4 \
          MW_WORLD_V0_I3B_PREFIX=world-v0-i4a-i3 \
            node scripts/world-v0-integration-i3b-clean-campaign.mjs | tee world-v0-i4a-i3-campaign.log
          MW_WORLD_V0_I2_BASE=http://127.0.0.1:8795 \
            node scripts/world-v0-integration-i2-lifecycle-probe.mjs | tee world-v0-i4a-i2-regression.log
          MW_WORLD_V0_I1_BASE=http://127.0.0.1:8795 \
            node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-i4a-i1-regression.log
          MW_WORLD_V0_I1_BASE=http://127.0.0.1:8795 \
            node scripts/world-v0-integration-i1-prestart-probe.mjs | tee world-v0-i4a-i1-prestart-regression.log

      - name: Commit original I4a seam only after every gate PASS
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_FILES=(
            public/world-v0/box3d-i4/box3d.inline.mjs
            public/world-v0/box3d-i4/box3d.wasm
            src/box3d-runtime.ts
            src/world-v0-contract.ts
            src/world-v0-shared-yard.ts
            public/world-v0/app.js
            public/world-v0/build-contract.js
          )
          if test -z "$(git status --porcelain -- "${RUNTIME_FILES[@]}")"; then
            echo "I4a runtime seam already committed; nothing to push"
            exit 0
          fi
          if ! grep -q 'shared-yard-v0-contract-v5-i4-rebase-runtime-seam' src/world-v0-contract.ts; then
            echo "later contract present; I4a may not write runtime"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${RUNTIME_FILES[@]}"
          git commit -m "feat(world-v0): integrate I4a pinned rebase runtime seam"
          git push origin HEAD:world-v0-multiplayer-foundation-integration

      - name: Upload I4a evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v0-integration-i4a
          path: |
            world-v0-i4a-box3d-sha256.log
            world-v0-i4a-sim-build.log
            world-v0-i4a-seam-probe.log
            world-v0-i4a-i3-campaign.log
            world-v0-i4a-i3-campaign-summary.json
            world-v0-i4a-i3-attempt-*.json
            world-v0-i4a-i3-attempt-*.log
            world-v0-i4a-i2-regression.log
            world-v0-i4a-i1-regression.log
            world-v0-i4a-i1-prestart-regression.log
            world-v0-i4a-candidate-wrangler.log
          if-no-files-found: warn
          retention-days: 14
