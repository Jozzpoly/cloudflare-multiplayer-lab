name: World V0 ongoing Yard product flow

on:
  push:
    branches:
      - world-v0-ongoing-yard
    paths:
      - .github/workflows/world-v0-ongoing-yard-product.yml
      - scripts/world-v0-ongoing-yard-product-chromium.mjs
      - public/world-v0/**
      - src/world-v0-protocol.ts
      - src/world-v0-shared-yard.ts
      - src/world-slice-entry.ts
      - scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-ongoing-yard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Keep fixed protocol control
        run: npm run test:world-v0-protocol

      - name: Validate Worker bundle
        run: npm run validate:worker

      - name: Start local Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-ongoing-wrangler.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "ongoing Yard Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-ongoing-wrangler.log
          exit 1

      - name: Prove public-room solo to friend join in real Chromium
        env:
          MW_WORLD_V0_ONGOING_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ONGOING_OUTPUT: world-v0-ongoing-yard-product.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s node scripts/world-v0-ongoing-yard-product-chromium.mjs | tee world-v0-ongoing-yard-product.log
          grep -q 'WORLD_V0_ONGOING_YARD_PUBLIC_FLOW_PASS' world-v0-ongoing-yard-product.log

      - name: Keep fixed-2P I4B browser recovery as control
        env:
          MW_WORLD_V0_I4B_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I4B_OFFLINE_MS: 1500
          MW_WORLD_V0_I4B_OUTPUT: world-v0-ongoing-fixed-i4b.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-ongoing-fixed-i4b.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' world-v0-ongoing-fixed-i4b.log

      - name: Prove tests did not mutate tracked source
        run: git diff --exit-code

      - name: Upload product-flow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-ongoing-yard-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-ongoing-yard-product.json
            world-v0-ongoing-yard-product.log
            world-v0-ongoing-fixed-i4b.json
            world-v0-ongoing-fixed-i4b.log
            world-v0-ongoing-wrangler.log
