name: World V0 Playability Lead2 Materialize

on:
  push:
    branches: [world-v0-playability-lead2-candidate]
    paths:
      - scripts/materialize-world-v0-playability-lead2.mjs
      - .github/workflows/world-v0-playability-lead2-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-playability-lead2-materialize
  cancel-in-progress: false

env:
  BASE_SHA: 6f4abd4dd17c59078ab99530e64ef6cf752ab5ce
  EXPECTED_SIM_BUILD: shared-yard-v0-sim-85ac7ad492b61610

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: world-v0-playability-lead2-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Prove clean materialization source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          pre="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$pre"
          bad="$(printf '%s\n' "$pre" | grep -Ev '^(scripts/materialize-world-v0-playability-lead2\.mjs|\.github/workflows/world-v0-playability-lead2-materialize\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected pre-materialization diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          node --check scripts/materialize-world-v0-playability-lead2.mjs

      - name: Materialize exact lead2 candidate
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/materialize-world-v0-playability-lead2.mjs | tee lead2-materialize.log
          grep -q 'WORLD_V0_PLAYABILITY_LEAD2_MATERIALIZED' lead2-materialize.log
          grep -q "$EXPECTED_SIM_BUILD" lead2-materialize.log
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/world-v0-contract\.ts|public/world-v0/(app\.js|build-contract\.js))$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected materialized file:" >&2
            echo "$bad" >&2
            exit 1
          fi
          for expected in src/world-v0-contract.ts public/world-v0/app.js public/world-v0/build-contract.js; do
            printf '%s\n' "$changed" | grep -qx "$expected" || { echo "Missing expected materialized file $expected" >&2; exit 1; }
          done

      - name: Full candidate regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee lead2-check.log

      - name: Prove exact materialized contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          const c = await import(`./src/world-v0-contract.ts?check=${Date.now()}`);
          const b = await import(`./public/world-v0/build-contract.js?check=${Date.now()}`);
          if (c.WORLD_V0_TIMING.predictionLeadTicks !== 8) throw new Error("input lead drift");
          if (c.WORLD_V0_TIMING.clientSimulationLeadTicks !== 2) throw new Error("simulation lead drift");
          if (c.WORLD_V0_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error(`SimBuild drift ${c.WORLD_V0_SIM_BUILD_ID}`);
          if (b.WORLD_V0_EXPECTED_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error("browser SimBuild drift");
          if (c.WORLD_V0_CLIENT_SIM_REVISION !== "shared-yard-v0-browser-sim-v8-playability-split-lead") throw new Error("client revision drift");
          console.log("WORLD_V0_PLAYABILITY_LEAD2_CONTRACT_PASS", c.WORLD_V0_SIM_BUILD_ID);
          NODE

      - name: Commit clean candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world-v0-contract.ts public/world-v0/app.js public/world-v0/build-contract.js
          git diff --cached --quiet && { echo "No candidate runtime changes to commit"; exit 0; }
          git commit -m "feat(world-v0): materialize lead2 playability candidate"
          git push origin HEAD:world-v0-playability-lead2-candidate
