name: World V0 Playability Lead2 Owner Feel Delivery

on:
  push:
    branches: [world-v0-playability-lead2-owner-feel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-playability-lead2-owner-feel
  cancel-in-progress: false

env:
  CLEAN_CANDIDATE_SHA: eb26d060904bebd9acc1b8e1c8fc446f20a60599
  BASELINE_SHA: 6f4abd4dd17c59078ab99530e64ef6cf752ab5ce
  EXPECTED_SIM_BUILD: shared-yard-v0-sim-85ac7ad492b61610
  EXPECTED_CLIENT_SIM: shared-yard-v0-browser-sim-v8-playability-split-lead
  OWNER_WORKER: cloudflare-multiplayer-lab-playability-owner-l2-85ac7ad4
  OWNER_BASE_URL: https://cloudflare-multiplayer-lab-playability-owner-l2-85ac7ad4.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Prove clean Owner candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CLEAN_CANDIDATE_SHA^{commit}"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$CLEAN_CANDIDATE_SHA" HEAD
          test -z "$(git diff --name-only "$CLEAN_CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"

          candidate_runtime="$(git diff --name-only "$BASELINE_SHA" "$CLEAN_CANDIDATE_SHA" -- src public/world-v0/app.js public/world-v0/build-contract.js)"
          printf '%s\n' "$candidate_runtime"
          for expected in src/world-v0-contract.ts public/world-v0/app.js public/world-v0/build-contract.js; do
            printf '%s\n' "$candidate_runtime" | grep -qx "$expected" || { echo "Missing clean candidate runtime file $expected" >&2; exit 1; }
          done
          test "$(printf '%s\n' "$candidate_runtime" | sed '/^$/d' | wc -l)" -eq 3

          node --experimental-strip-types --input-type=module <<'NODE'
          const c = await import(`./src/world-v0-contract.ts?owner=${Date.now()}`);
          const b = await import(`./public/world-v0/build-contract.js?owner=${Date.now()}`);
          if (c.WORLD_V0_TIMING.predictionLeadTicks !== 8) throw new Error("canonical input lead drift");
          if (c.WORLD_V0_TIMING.clientSimulationLeadTicks !== 2) throw new Error("client simulation lead drift");
          if (c.WORLD_V0_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error("contract SimBuild drift");
          if (b.WORLD_V0_EXPECTED_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error("browser SimBuild drift");
          if (c.WORLD_V0_CLIENT_SIM_REVISION !== process.env.EXPECTED_CLIENT_SIM) throw new Error("client sim revision drift");
          if (b.WORLD_V0_CLIENT_SIM_REVISION !== process.env.EXPECTED_CLIENT_SIM) throw new Error("browser client sim revision drift");
          console.log("WORLD_V0_PLAYABILITY_OWNER_CLEAN_CANDIDATE_PASS", JSON.stringify({
            inputLeadTicks: c.WORLD_V0_TIMING.predictionLeadTicks,
            simulationLeadTicks: c.WORLD_V0_TIMING.clientSimulationLeadTicks,
            simBuildId: c.WORLD_V0_SIM_BUILD_ID,
            clientSimRevision: c.WORLD_V0_CLIENT_SIM_REVISION,
          }));
          NODE

      - name: Full clean candidate regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee owner-check.log

      - name: Prepare isolated clean Worker and provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const env = config.env?.reliability_play;
          if (!env) throw new Error("reliability_play template missing");
          const forbidden = new Set([
            config.name,
            config.env?.staging?.name,
            env.name,
            "cloudflare-multiplayer-lab-playability-l2-85ac7ad4",
          ]);
          if (forbidden.has(process.env.OWNER_WORKER)) throw new Error("Owner candidate Worker is not isolated");
          env.name = process.env.OWNER_WORKER;
          writeFileSync("wrangler.playability-owner.jsonc", JSON.stringify(config, null, 2) + "\n");

          const sha256 = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          const provenance = {
            purpose: "world-v0-playability-lead2-owner-feel-clean-delivery",
            cleanCandidateSha: process.env.CLEAN_CANDIDATE_SHA,
            deliveryBranchSha: process.env.GITHUB_SHA,
            worker: process.env.OWNER_WORKER,
            simBuildId: process.env.EXPECTED_SIM_BUILD,
            clientSimRevision: process.env.EXPECTED_CLIENT_SIM,
            inputLeadTicks: 8,
            simulationLeadTicks: 2,
            instrumentedApp: false,
            appSha256: sha256("public/world-v0/app.js"),
            buildContractSha256: sha256("public/world-v0/build-contract.js"),
            serverContractSha256: sha256("src/world-v0-contract.ts"),
          };
          writeFileSync("public/world-v0/playability-owner-provenance.json", JSON.stringify(provenance, null, 2) + "\n");
          console.log("WORLD_V0_PLAYABILITY_OWNER_TARGET_PASS", JSON.stringify(provenance));
          NODE
          npx wrangler deploy --dry-run --env reliability_play --config wrangler.playability-owner.jsonc --outdir .wrangler-playability-owner-dry-run

      - name: Deploy clean fingerprinted Owner Worker only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
          npx wrangler deploy --env reliability_play --config wrangler.playability-owner.jsonc | tee owner-deploy.log

      - name: Verify live provenance and exact clean static bytes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const sha = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const local = {
            app: sha(readFileSync("public/world-v0/app.js")),
            build: sha(readFileSync("public/world-v0/build-contract.js")),
          };
          const deadline = Date.now() + 120000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const suffix = `?r=${Date.now()}`;
              const [pRes, appRes, buildRes] = await Promise.all([
                fetch(`${process.env.OWNER_BASE_URL}/world-v0/playability-owner-provenance.json${suffix}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${process.env.OWNER_BASE_URL}/world-v0/app.js${suffix}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${process.env.OWNER_BASE_URL}/world-v0/build-contract.js${suffix}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
              ]);
              const p = pRes.ok ? await pRes.json() : null;
              const app = appRes.ok ? new Uint8Array(await appRes.arrayBuffer()) : null;
              const build = buildRes.ok ? new Uint8Array(await buildRes.arrayBuffer()) : null;
              last = { p, statuses: [pRes.status, appRes.status, buildRes.status] };
              if (
                p?.cleanCandidateSha === process.env.CLEAN_CANDIDATE_SHA &&
                p?.deliveryBranchSha === process.env.GITHUB_SHA &&
                p?.worker === process.env.OWNER_WORKER &&
                p?.simBuildId === process.env.EXPECTED_SIM_BUILD &&
                p?.clientSimRevision === process.env.EXPECTED_CLIENT_SIM &&
                p?.inputLeadTicks === 8 && p?.simulationLeadTicks === 2 &&
                p?.instrumentedApp === false &&
                app && build && sha(app) === local.app && sha(build) === local.build &&
                p.appSha256 === local.app && p.buildContractSha256 === local.build
              ) {
                console.log("WORLD_V0_PLAYABILITY_OWNER_LIVE_PROVENANCE_PASS", JSON.stringify(p));
                process.exit(0);
              }
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`clean Owner delivery provenance not visible: ${JSON.stringify(last)}`);
          NODE

      - name: Remote ActorSession continuity control on clean Owner Worker
        shell: bash
        env:
          MW_WORLD_V0_I1_BASE: ${{ env.OWNER_BASE_URL }}
          MW_WORLD_V0_I1_RUN: own-${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee owner-i1.log

      - name: Prove repository runtime remained exact candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm -f wrangler.playability-owner.jsonc public/world-v0/playability-owner-provenance.json
          test -z "$(git diff --name-only "$CLEAN_CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"
          echo "WORLD_V0_PLAYABILITY_OWNER_NO_RUNTIME_MUTATION_PASS"

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playability-lead2-owner-feel-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            owner-check.log
            owner-deploy.log
            owner-i1.log
          if-no-files-found: warn
          retention-days: 14
