name: World V0 Lead2 Prestart Forensics

on:
  push:
    branches: [world-v0-playability-lead2-prestart-forensics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-playability-lead2-prestart-forensics
  cancel-in-progress: false

env:
  CANDIDATE_SHA: eb26d060904bebd9acc1b8e1c8fc446f20a60599
  CANDIDATE_SIM_BUILD: shared-yard-v0-sim-85ac7ad492b61610
  WORKER: cloudflare-multiplayer-lab-l2-prestart-forensics
  BASE_URL: https://cloudflare-multiplayer-lab-l2-prestart-forensics.jozzpoly.workers.dev

jobs:
  forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Ground clean lead2 + apparatus-only branch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          changed="$(git diff --name-only "$CANDIDATE_SHA" HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/apply-world-v0-lead2-prestart-forensics\.mjs|\.github/workflows/world-v0-playability-lead2-prestart-forensics\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected forensic branch diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          test -z "$(git diff --name-only "$CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"
          node --check scripts/apply-world-v0-lead2-prestart-forensics.mjs
          git diff --check "$CANDIDATE_SHA" HEAD
          echo "WORLD_V0_LEAD2_PRESTART_FORENSICS_GROUNDING_PASS"

      - name: Apply forensic instrumentation in workspace only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-lead2-prestart-forensics.mjs | tee prestart-instrumentation.log
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(public/world-v0/app\.js|src/world-v0-shared-yard\.ts|src/world-slice-entry\.ts)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected instrumentation diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          test -z "$(git diff --name-only -- src/world-v0-contract.ts src/world-v0-protocol.ts src/box3d-runtime.ts public/world-v0/build-contract.js public/world-v0/friend-ready.js public/world-v0/friend-entry.js)"
          grep -q 'clientSimulationLeadTicks: 2' src/world-v0-contract.ts
          grep -q "$CANDIDATE_SIM_BUILD" public/world-v0/build-contract.js
          echo "WORLD_V0_LEAD2_PRESTART_FORENSICS_BOUNDED_DIFF_PASS"

      - name: Full repository regression with instrumentation
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee prestart-check.log

      - name: Prepare isolated forensic Worker
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$CANDIDATE_SHA" WORKER="$WORKER" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const c = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const template = c.env?.reliability_play;
          if (!template) throw new Error("reliability_play template missing");
          const forbidden = new Set([c.name, c.env?.staging?.name, template.name]);
          if (forbidden.has(process.env.WORKER)) throw new Error("forensic worker is not isolated");
          template.name = process.env.WORKER;
          writeFileSync("wrangler.prestart-forensics.jsonc", JSON.stringify(c, null, 2) + "\n");
          writeFileSync("public/world-v0/prestart-forensics-provenance.json", JSON.stringify({
            purpose: "world-v0-lead2-prestart-actor-resume-forensics",
            cleanCandidateSha: process.env.CANDIDATE_SHA,
            forensicBranchSha: process.env.GITHUB_SHA,
            simBuildId: process.env.CANDIDATE_SIM_BUILD,
            inputLeadTicks: 8,
            simulationLeadTicks: 2,
            noWebGlDraw: true,
            serverResumeInstrumentation: true,
            worker: process.env.WORKER,
          }, null, 2) + "\n");
          NODE
          npx wrangler deploy --dry-run --env reliability_play --config wrangler.prestart-forensics.jsonc --outdir .wrangler-prestart-dry-run

      - name: Deploy isolated forensic Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env reliability_play --config wrangler.prestart-forensics.jsonc | tee prestart-deploy.log

      - name: Verify forensic provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee prestart-provenance.log
          const url = `${process.env.BASE_URL}/world-v0/prestart-forensics-provenance.json?r=${Date.now()}`;
          const deadline = Date.now() + 120000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
              const p = r.ok ? await r.json() : null;
              last = p;
              if (p?.cleanCandidateSha === process.env.CANDIDATE_SHA && p?.forensicBranchSha === process.env.GITHUB_SHA &&
                  p?.simBuildId === process.env.CANDIDATE_SIM_BUILD && p?.inputLeadTicks === 8 && p?.simulationLeadTicks === 2 &&
                  p?.noWebGlDraw === true && p?.serverResumeInstrumentation === true && p?.worker === process.env.WORKER) {
                console.log("WORLD_V0_LEAD2_PRESTART_FORENSICS_PROVENANCE_PASS", JSON.stringify(p));
                process.exit(0);
              }
            } catch (error) { last = error instanceof Error ? error.message : String(error); }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`forensic provenance unavailable ${JSON.stringify(last)}`);
          NODE

      - name: Run three fresh no-draw lifecycle specimens
        shell: bash
        run: |
          set -euo pipefail
          : > prestart-run-status.tsv
          for attempt in 1 2 3; do
            echo "===== PRESTART FORENSICS ATTEMPT $attempt ====="
            set +e
            MW_WORLD_V0_HUMAN_ENTRY_BASE_URL="$BASE_URL" \
            MW_WORLD_V0_HUMAN_ENTRY_OUTPUT="prestart-${attempt}.json" \
            node scripts/world-v0-human-entry-browser-smoke.mjs 2>&1 | tee "prestart-${attempt}.log"
            rc=${PIPESTATUS[0]}
            set -e
            test -f "prestart-${attempt}.json"
            room="$(node -e 'const v=require("./prestart-'"$attempt"'.json"); process.stdout.write(v.roomKey || "")')"
            if [ -z "$room" ]; then
              echo "attempt $attempt missing room key" >&2
              exit 1
            fi
            node --input-type=module - "$attempt" "$room" <<'NODE'
            import { writeFileSync } from "node:fs";
            const attempt = process.argv[2];
            const room = process.argv[3];
            const url = `${process.env.BASE_URL}/api/world-v0/forensics?run=${encodeURIComponent(room)}&r=${Date.now()}`;
            const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(10000) });
            if (!response.ok) throw new Error(`forensics status HTTP ${response.status}`);
            const value = await response.json();
            writeFileSync(`prestart-${attempt}-server.json`, JSON.stringify(value, null, 2));
            console.log("WORLD_V0_LEAD2_PRESTART_SERVER_STATUS", JSON.stringify({ attempt, room, boundaryTick: value.boundaryTick, protocolStartTick: value.protocolStartTick, resumeForensics: value.resumeForensics }));
            NODE
            printf '%s\t%s\t%s\n' "$attempt" "$rc" "$room" >> prestart-run-status.tsv
          done
          echo "WORLD_V0_LEAD2_PRESTART_THREE_SPECIMENS_COLLECTED"

      - name: Classify first recovery trigger and resume handshake
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee prestart-summary.log
          import { readFileSync, writeFileSync } from "node:fs";
          const rows = [];
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const client = JSON.parse(readFileSync(`prestart-${attempt}.json`, "utf8"));
            const server = JSON.parse(readFileSync(`prestart-${attempt}-server.json`, "utf8"));
            const diagnostics = [
              ["owner", client.ownerDiagnostic?.evidence],
              ["peer", client.peerDiagnostic?.evidence],
            ];
            const firstResumeEvents = [];
            for (const [side, evidence] of diagnostics) {
              const events = evidence?.lifecycleEvents || [];
              const first = events.find((event) => event.type === "actor-resume-pending") || null;
              if (first) firstResumeEvents.push({ side, ...first });
            }
            const rf = server.resumeForensics || {};
            let handshakeClass = "no-resume-request";
            if ((rf.requests || 0) > 0) {
              if (rf.lastFailure) handshakeClass = "rebase-seed-build-failure";
              else if ((rf.sendFailures || 0) > 0) handshakeClass = "websocket-send-failure";
              else if ((rf.seedSuccesses || 0) > 0) handshakeClass = "seed-built-and-send-did-not-throw";
              else handshakeClass = "resume-request-before-seed";
            }
            rows.push({
              attempt,
              clientVerdict: client.verdict,
              clientError: client.error || null,
              firstResumeEvents,
              runtimeFailures: diagnostics.map(([side,e]) => ({ side, runtimeFailed: e?.runtimeFailed ?? null, reason: e?.runtimeFailureReason ?? null, localBoundaryTick: e?.localBoundaryTick ?? null, latestAuthorityBoundary: e?.metrics?.latestAuthorityBoundary ?? null, maxAuthoritySilenceTicks: e?.metrics?.maxAuthoritySilenceTicks ?? null, authoritySilenceResumes: e?.metrics?.authoritySilenceResumes ?? null, guardMatches: e?.metrics?.guardMatches ?? null, guardMismatches: e?.metrics?.guardMismatches ?? null, frameP95Ms: e?.frame?.p95Ms ?? null })),
              server: {
                boundaryTick: server.boundaryTick,
                protocolStartTick: server.protocolStartTick,
                connectedPlayers: server.connectedPlayers,
                failure: server.failure,
                resumeForensics: rf,
              },
              handshakeClass,
            });
          }
          const triggerReasons = rows.flatMap((row) => row.firstResumeEvents.map((event) => event.reason || (event.code === 1006 ? "transport-1006" : "unknown")));
          const handshakeClasses = rows.map((row) => row.handshakeClass);
          const out = {
            verdict: "WORLD_V0_LEAD2_PRESTART_FORENSICS_COMPLETE",
            rows,
            triggerReasons,
            handshakeClasses,
            allExactGuardsClean: rows.every((row) => row.runtimeFailures.every((r) => r.guardMismatches === 0 || r.guardMismatches === null)),
            nonClaim: "This isolated Worker intentionally instruments server/client observability and skips WebGL draw. It diagnoses the machine-only lead2 startup failure; it is not a playable candidate or Owner-feel result.",
          };
          writeFileSync("prestart-summary.json", JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Prove no clean candidate materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm -f wrangler.prestart-forensics.jsonc public/world-v0/prestart-forensics-provenance.json
          test -z "$(git diff --name-only "$CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"
          echo "WORLD_V0_LEAD2_PRESTART_NO_CANDIDATE_MUTATION_PASS"

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-lead2-prestart-forensics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            prestart-*.json
            prestart-*.log
            prestart-run-status.tsv
            prestart-summary.json
            prestart-summary.log
          if-no-files-found: warn
          retention-days: 14
