name: World V0 Playability Lead2 Remote Probe

on:
  push:
    branches: [world-v0-playability-lead2-remote-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-playability-lead2-remote-probe
  cancel-in-progress: false

env:
  CLEAN_CANDIDATE_SHA: eb26d060904bebd9acc1b8e1c8fc446f20a60599
  BASELINE_SHA: 6f4abd4dd17c59078ab99530e64ef6cf752ab5ce
  APPARATUS_SHA: 2021d5648c265b17395608e3cc8588edbac79d2f
  EXPECTED_SIM_BUILD: shared-yard-v0-sim-85ac7ad492b61610
  PLAYABILITY_WORKER: cloudflare-multiplayer-lab-playability-l2-85ac7ad4
  PLAYABILITY_BASE_URL: https://cloudflare-multiplayer-lab-playability-l2-85ac7ad4.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  remote-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Prove clean candidate ancestry and isolated apparatus branch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CLEAN_CANDIDATE_SHA^{commit}"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git cat-file -e "$APPARATUS_SHA^{commit}"
          git merge-base --is-ancestor "$CLEAN_CANDIDATE_SHA" HEAD
          test -z "$(git diff --name-only "$CLEAN_CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"
          candidate_runtime="$(git diff --name-only "$BASELINE_SHA" "$CLEAN_CANDIDATE_SHA" -- src public/world-v0/app.js public/world-v0/build-contract.js)"
          printf '%s\n' "$candidate_runtime"
          for expected in src/world-v0-contract.ts public/world-v0/app.js public/world-v0/build-contract.js; do
            printf '%s\n' "$candidate_runtime" | grep -qx "$expected" || { echo "Missing clean candidate runtime file $expected" >&2; exit 1; }
          done
          count="$(printf '%s\n' "$candidate_runtime" | sed '/^$/d' | wc -l)"
          test "$count" -eq 3
          node --experimental-strip-types --input-type=module <<'NODE'
          const c = await import(`./src/world-v0-contract.ts?remote=${Date.now()}`);
          const b = await import(`./public/world-v0/build-contract.js?remote=${Date.now()}`);
          if (c.WORLD_V0_TIMING.predictionLeadTicks !== 8 || c.WORLD_V0_TIMING.clientSimulationLeadTicks !== 2) throw new Error("clean lead2 timing drift");
          if (c.WORLD_V0_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD || b.WORLD_V0_EXPECTED_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error("clean lead2 SimBuild drift");
          console.log("WORLD_V0_PLAYABILITY_REMOTE_CLEAN_CANDIDATE_PASS", c.WORLD_V0_SIM_BUILD_ID);
          NODE

      - name: Recover qualified test apparatus into workspace only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/world-v0-playability-pressure-probe.mjs
            scripts/prepare-world-v0-playability-input-shape-probe.mjs
            scripts/prepare-world-v0-playability-input-shape-probe-v2.mjs
            scripts/apply-world-v0-playability-observability.mjs
            scripts/apply-world-v0-presentation-shock-observability.mjs
            scripts/prepare-world-v0-presentation-shock-probe.mjs
          )
          for file in "${files[@]}"; do
            git show "$APPARATUS_SHA:$file" > "$file"
            node --check "$file"
          done
          node --check scripts/prepare-world-v0-remote-playability-probe.mjs
          echo "WORLD_V0_PLAYABILITY_REMOTE_APPARATUS_RECOVERY_PASS"

      - name: Instrument deployed specimen without changing simulation contract
        shell: bash
        run: |
          set -euo pipefail
          before_contract="$(sha256sum src/world-v0-contract.ts public/world-v0/build-contract.js)"
          node scripts/apply-world-v0-playability-observability.mjs | tee remote-observability.log
          node scripts/apply-world-v0-presentation-shock-observability.mjs | tee remote-shock-observability.log
          node scripts/prepare-world-v0-playability-input-shape-probe-v2.mjs | tee remote-prepare-input.log
          node scripts/prepare-world-v0-presentation-shock-probe.mjs | tee remote-prepare-shock.log
          node scripts/prepare-world-v0-remote-playability-probe.mjs | tee remote-prepare-semantic.log
          node --check scripts/.world-v0-playability-input-shape-probe.mjs
          after_contract="$(sha256sum src/world-v0-contract.ts public/world-v0/build-contract.js)"
          test "$before_contract" = "$after_contract"
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "public/world-v0/app.js"
          grep -q 'world-v0-presentation-shock-v1' public/world-v0/app.js
          echo "WORLD_V0_PLAYABILITY_REMOTE_INSTRUMENTATION_PASS"

      - name: Full instrumented regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee remote-check.log

      - name: Prepare isolated Worker config and provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const env = config.env?.reliability_play;
          if (!env) throw new Error("reliability_play template missing");
          const forbidden = new Set([config.name, config.env?.staging?.name, env.name]);
          if (forbidden.has(process.env.PLAYABILITY_WORKER)) throw new Error("playability worker is not isolated");
          env.name = process.env.PLAYABILITY_WORKER;
          mkdirSync(".wrangler-playability", { recursive: true });
          writeFileSync("wrangler.playability-probe.jsonc", JSON.stringify(config, null, 2) + "\n");
          const provenance = {
            purpose: "world-v0-playability-lead2-remote-instrumented-probe",
            cleanCandidateSha: process.env.CLEAN_CANDIDATE_SHA,
            probeBranchSha: process.env.GITHUB_SHA,
            apparatusSha: process.env.APPARATUS_SHA,
            worker: process.env.PLAYABILITY_WORKER,
            simBuildId: process.env.EXPECTED_SIM_BUILD,
            inputLeadTicks: 8,
            simulationLeadTicks: 2,
            instrumentedPresentationShock: true,
          };
          writeFileSync("public/world-v0/playability-probe-provenance.json", JSON.stringify(provenance, null, 2) + "\n");
          console.log("WORLD_V0_PLAYABILITY_REMOTE_TARGET_PASS", JSON.stringify(provenance));
          NODE
          npx wrangler deploy --dry-run --env reliability_play --config wrangler.playability-probe.jsonc --outdir .wrangler-playability/dry-run

      - name: Deploy fingerprinted playability Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
          npx wrangler deploy --env reliability_play --config wrangler.playability-probe.jsonc | tee remote-deploy.log

      - name: Verify exact deployed provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = `${process.env.PLAYABILITY_BASE_URL}/world-v0/playability-probe-provenance.json?r=${Date.now()}`;
          const deadline = Date.now() + 120000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
              const value = response.ok ? await response.json() : null;
              last = value;
              if (
                value?.cleanCandidateSha === process.env.CLEAN_CANDIDATE_SHA &&
                value?.probeBranchSha === process.env.GITHUB_SHA &&
                value?.apparatusSha === process.env.APPARATUS_SHA &&
                value?.worker === process.env.PLAYABILITY_WORKER &&
                value?.simBuildId === process.env.EXPECTED_SIM_BUILD &&
                value?.inputLeadTicks === 8 && value?.simulationLeadTicks === 2 &&
                value?.instrumentedPresentationShock === true
              ) {
                console.log("WORLD_V0_PLAYABILITY_REMOTE_PROVENANCE_PASS", JSON.stringify(value));
                process.exit(0);
              }
            } catch (error) { last = error instanceof Error ? error.message : String(error); }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`playability provenance not visible: ${JSON.stringify(last)}`);
          NODE

      - name: Remote ActorSession continuity control
        shell: bash
        env:
          MW_WORLD_V0_I1_BASE: ${{ env.PLAYABILITY_BASE_URL }}
          MW_WORLD_V0_I1_RUN: l2p-${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee remote-i1.log

      - name: Remote continuous-input presentation shock attempts
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "===== REMOTE PLAYABILITY ATTEMPT $attempt ====="
            MW_WORLD_V0_PLAYABILITY_BASE_URL="$PLAYABILITY_BASE_URL" \
            MW_WORLD_V0_PLAYABILITY_OUTPUT="remote-playability-${attempt}.json" \
            MW_WORLD_V0_INPUT_SHAPE_DRIVE_MS=6000 \
            MW_WORLD_V0_INPUT_SHAPE_INTERVAL_MS=16 \
            node scripts/.world-v0-playability-input-shape-probe.mjs | tee "remote-playability-${attempt}.log"
          done

      - name: Validate remote exactness and reduce playability evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee remote-playability-summary.log
          import { readFileSync, writeFileSync } from "node:fs";
          const attempts = [];
          for (let attempt = 1; attempt <= 2; attempt += 1) {
            const v = JSON.parse(readFileSync(`remote-playability-${attempt}.json`, "utf8"));
            if (v.verdict !== "WORLD_V0_PLAYABILITY_INPUT_SHAPE_PASS") throw new Error(`attempt ${attempt}: ${v.verdict}`);
            const clients = [];
            for (const [index, c] of v.clients.entries()) {
              if (c.inputLeadTicks !== 8 || c.simulationLeadTicks !== 2) throw new Error(`attempt ${attempt} client ${index}: timing drift`);
              if (c.guardMismatches !== 0 || c.firstStateMismatch !== null) throw new Error(`attempt ${attempt} client ${index}: exact-state mismatch`);
              if (c.guardPending !== c.pendingStateGuardBoundaries.length) throw new Error(`attempt ${attempt} client ${index}: pending accounting drift`);
              const stale = c.pendingStateGuardBoundaries.filter((tick) => Number.isInteger(tick) && tick <= c.localBoundaryTick);
              if (stale.length) throw new Error(`attempt ${attempt} client ${index}: stale pending guards ${JSON.stringify(stale)} at B(${c.localBoundaryTick})`);
              const shock = c.presentationShock;
              if (!shock || shock.revision !== "world-v0-presentation-shock-v1") throw new Error(`attempt ${attempt} client ${index}: shock evidence missing`);
              if (shock.renderedFrames !== shock.correctedFrames + shock.uncorrectedFrames) throw new Error(`attempt ${attempt} client ${index}: frame accounting drift`);
              if (shock.correctionEventsObserved !== c.corrections) throw new Error(`attempt ${attempt} client ${index}: correction accounting drift`);
              clients.push({
                localBoundaryTick: c.localBoundaryTick,
                corrections: c.corrections,
                correctionsPer1000Ticks: c.correctionsPer1000Ticks,
                guardMatches: c.guardMatches,
                guardPending: c.guardPending,
                pendingStateGuardBoundaries: c.pendingStateGuardBoundaries,
                correctedFrames: shock.correctedFrames,
                maxCorrectionsInFrame: shock.maxCorrectionsInFrame,
                netSelfTotal: shock.netCorrection.self.total,
                netRemoteTotal: shock.netCorrection.remote.total,
                netSelfOver005: shock.netCorrection.self.over005,
                netSelfOver010: shock.netCorrection.self.over010,
                netRemoteOver005: shock.netCorrection.remote.over005,
                netRemoteOver010: shock.netCorrection.remote.over010,
                maxNetSelfShock: shock.netCorrection.self.max,
                maxNetRemoteShock: shock.netCorrection.remote.max,
              });
            }
            attempts.push({
              attempt,
              simBuildId: v.simBuildId,
              clients,
              aggregate: v.aggregate,
            });
          }
          const out = {
            verdict: "WORLD_V0_PLAYABILITY_LEAD2_REMOTE_PROBE_COMPLETE",
            cleanCandidateSha: process.env.CLEAN_CANDIDATE_SHA,
            probeBranchSha: process.env.GITHUB_SHA,
            worker: process.env.PLAYABILITY_WORKER,
            simBuildId: process.env.EXPECTED_SIM_BUILD,
            attempts,
            nonClaim: "This is an instrumented GitHub-runner-to-Cloudflare network specimen. It proves real-Worker behavior on that path, not Poland Owner RTT or final human feel.",
          };
          writeFileSync("remote-playability-summary.json", JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Prove repository candidate remained clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm -f \
            scripts/world-v0-playability-pressure-probe.mjs \
            scripts/prepare-world-v0-playability-input-shape-probe.mjs \
            scripts/prepare-world-v0-playability-input-shape-probe-v2.mjs \
            scripts/apply-world-v0-playability-observability.mjs \
            scripts/apply-world-v0-presentation-shock-observability.mjs \
            scripts/prepare-world-v0-presentation-shock-probe.mjs \
            scripts/.prepare-world-v0-playability-input-shape-probe-fixed.mjs \
            scripts/.world-v0-playability-input-shape-probe.mjs \
            wrangler.playability-probe.jsonc \
            public/world-v0/playability-probe-provenance.json
          test -z "$(git diff --name-only "$CLEAN_CANDIDATE_SHA" HEAD -- src public/world-v0 wrangler.jsonc package.json package-lock.json)"
          echo "WORLD_V0_PLAYABILITY_REMOTE_NO_CANDIDATE_MUTATION_PASS"

      - name: Upload remote playability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playability-lead2-remote-probe-${{ github.run_attempt }}
          path: |
            remote-deploy.log
            remote-i1.log
            remote-playability-*.json
            remote-playability-*.log
            remote-check.log
          if-no-files-found: warn
          retention-days: 14
