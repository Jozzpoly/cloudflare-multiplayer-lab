name: World V0 Playable Refinement V6

on:
  push:
    branches: [world-v0-playable-refinement-v6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-playable-refinement-v6
  cancel-in-progress: true

jobs:
  qualify-materialized-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout materialized v6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify materialized v6 contract and protected baseline
        run: |
          set -euo pipefail
          BASE=460e47c4053ad53d13632dc75734e57e570c0657
          git cat-file -e "$BASE^{commit}"
          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          node --check public/world-v0/playable-control.js
          node --check scripts/world-v0-playable-control-smoke.mjs
          node --check scripts/world-v0-playable-interaction-smoke.mjs
          node --check scripts/world-v0-session-friction-smoke.mjs
          node --check scripts/world-v0-runtime-shell-smoke.mjs
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import {
            WORLD_V0_BROWSER_UI_REVISION,
            WORLD_V0_CLIENT_SIM_REVISION,
            WORLD_V0_EXPECTED_SERVER_REVISION,
            WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
          } from "./public/world-v0/build-contract.js";
          import { WORLD_V0_PLAYABLE_CONTROL_REVISION } from "./public/world-v0/playable-control.js";

          const expected = {
            ui: "shared-yard-v0-browser-ui-v6-camera-evidence-refinement",
            clientSim: "shared-yard-v0-browser-sim-v1",
            server: "shared-yard-v0-authority-v1",
            protocol: "shared-yard-v0-scheduled-input-v1",
            guard: "shared-yard-v0-f32-state-v1",
            sim: "shared-yard-v0-sim-579c7aa172198390",
            control: "shared-yard-v0-playable-control-v2",
          };
          const actual = {
            ui: WORLD_V0_BROWSER_UI_REVISION,
            clientSim: WORLD_V0_CLIENT_SIM_REVISION,
            server: WORLD_V0_EXPECTED_SERVER_REVISION,
            protocol: WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            guard: WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
            sim: WORLD_V0_EXPECTED_SIM_BUILD_ID,
            control: WORLD_V0_PLAYABLE_CONTROL_REVISION,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (actual[key] !== value) throw new Error(`materialized v6 ${key} drift: ${actual[key]} != ${value}`);
          }
          console.log("WORLD_V0_MATERIALIZED_V6_CONTRACT_PASS", JSON.stringify(actual));
          NODE
          if ! git diff --quiet "$BASE" -- src/world-v0-shared-yard.ts src/world-v0-contract.ts src/world-v0-protocol.ts; then
            echo "V6 changed protected authority/simulation files relative to playable v5 baseline."
            git diff --stat "$BASE" -- src/world-v0-shared-yard.ts src/world-v0-contract.ts src/world-v0-protocol.ts
            exit 1
          fi

      - name: Falsify permissive camera math
        run: node scripts/world-v0-playable-control-smoke.mjs

      - name: Preserve full repository regression suite
        run: npm run check

      - name: Start candidate Worker/assets in local Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-refinement-v6-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-refinement-v6-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "local Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-refinement-v6-wrangler.log
          exit 1

      - name: Prove authority and simulation baseline unchanged
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-refinement-v6-authority.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Prove refined camera interactions and evidence surface
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-refinement-v6-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs

      - name: Prove normal epoch end stays non-failure and restartable
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-refinement-v6-session.json
        run: node scripts/world-v0-session-friction-smoke.mjs

      - name: Preserve runtime-shell desktop and portrait regression
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-refinement-v6-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Prepare local exact-state Chromium falsifier
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          let chromium = readFileSync("scripts/world-v0-chromium-cloud-smoke.mjs", "utf8");
          const remote = 'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";';
          const local = 'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";';
          if (!chromium.includes(remote)) throw new Error("exact-state local-target anchor drift");
          chromium = chromium.replace(remote, local);
          writeFileSync("scripts/.world-v0-refinement-v6-exact.mjs", chromium);
          NODE

      - name: Preserve exact-state causal envelope
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-refinement-v6-exact.json
        run: node scripts/.world-v0-refinement-v6-exact.mjs

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-refinement-v6-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-refinement-v6-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload refinement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playable-refinement-v6-evidence-attempt-${{ github.run_attempt }}
          path: |
            world-v0-refinement-v6-authority.json
            world-v0-refinement-v6-interaction.json
            world-v0-refinement-v6-session.json
            world-v0-refinement-v6-shell.json
            world-v0-runtime-shell-*.png
            world-v0-refinement-v6-exact.json
            world-v0-refinement-v6-wrangler.log
          if-no-files-found: warn
          retention-days: 14
