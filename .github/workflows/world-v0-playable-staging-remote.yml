name: World V0 Playable Staging Delivery + Remote

on:
  push:
    branches: [world-v0-staging-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-playable-staging-delivery
  cancel-in-progress: false

env:
  EXPECTED_STAGING_WORKER: cloudflare-multiplayer-lab-staging
  STAGING_BASE_URL: https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Exact delivery specimen: $actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prove staging target cannot alias production
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const staging = config.env?.staging;
          if (!staging) throw new Error("wrangler env.staging missing");
          if (staging.name !== process.env.EXPECTED_STAGING_WORKER) {
            throw new Error(`staging target drift ${staging.name}`);
          }
          if (config.name === staging.name) {
            throw new Error(`staging aliases root worker ${config.name}`);
          }
          if (staging.workers_dev !== true) throw new Error("staging workers_dev must stay enabled");
          const bindings = staging.durable_objects?.bindings || [];
          if (!bindings.some((binding) => binding.name === "SHARED_YARD_V0" && binding.class_name === "SharedYardV0")) {
            throw new Error("staging SharedYardV0 Durable Object binding missing");
          }
          const workerFirst = staging.assets?.run_worker_first || [];
          if (!workerFirst.includes("/world-v0/ws")) throw new Error("staging /world-v0/ws worker-first route missing");
          console.log(`STAGING_TARGET_GUARD_PASS root=${config.name} staging=${staging.name}`);
          NODE
          npm run test:staging-deploy-guard
          npm run validate:staging-contract

      - name: Dry-run exact staging deployment
        run: npx wrangler deploy --dry-run --env staging --outdir .wrangler/staging-delivery-dry-run

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub Actions secret is absent; refusing deployment."
            exit 2
          fi
          echo "Cloudflare deployment credential is available."

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy only the isolated staging environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:staging

      - name: Require exact UI and SimBuild to become public
        env:
          MW_WORLD_V0_STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import {
            WORLD_V0_BROWSER_UI_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
          } from "./public/world-v0/build-contract.js";

          const base = process.env.MW_WORLD_V0_STAGING_BASE_URL.replace(/\/$/, "");
          const deadline = Date.now() + 120_000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${base}/world-v0/build-contract.js`, {
                cache: "no-store",
                signal: AbortSignal.timeout(8000),
              });
              const body = await response.text();
              last = {
                status: response.status,
                ui: body.includes(WORLD_V0_BROWSER_UI_REVISION),
                sim: body.includes(WORLD_V0_EXPECTED_SIM_BUILD_ID),
              };
              if (response.ok && last.ui && last.sim) {
                console.log("STAGING_EXACT_BUILD_VISIBLE", JSON.stringify({
                  uiRevision: WORLD_V0_BROWSER_UI_REVISION,
                  simBuildId: WORLD_V0_EXPECTED_SIM_BUILD_ID,
                }));
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`staging did not expose exact delivery build: ${JSON.stringify(last)}`);
          NODE

      - name: Upload deployment dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playable-staging-deploy-attempt-${{ github.run_attempt }}
          path: .wrangler/staging-delivery-dry-run
          if-no-files-found: warn
          retention-days: 14

  remote-authority:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify remote-gate apparatus syntax
        run: |
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-authority-stimulus.mjs
          node --check scripts/world-v0-authority-runtime-smoke.mjs
          node --check scripts/world-v0-playable-interaction-smoke.mjs
          node --check scripts/world-v0-session-friction-smoke.mjs
          node --check scripts/world-v0-runtime-shell-smoke.mjs
          node --check scripts/world-v0-chromium-cloud-smoke.mjs

      - name: Prove remote authority and production isolation
        env:
          MW_WORLD_V0_POLL_TIMEOUT_MS: "60000"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-playable-staging-authority.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Upload remote authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playable-staging-authority-attempt-${{ github.run_attempt }}
          path: world-v0-playable-staging-authority.json
          if-no-files-found: warn
          retention-days: 14

  remote-presentation:
    needs: remote-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prove remote camera / controller interactions
        id: interaction
        continue-on-error: true
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-playable-staging-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs

      - name: Prove remote epoch-end / fresh-restart lifecycle
        id: session
        continue-on-error: true
        env:
          MW_WORLD_V0_SESSION_BASE_URL: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-playable-staging-session.json
        run: node scripts/world-v0-session-friction-smoke.mjs

      - name: Prove remote desktop and portrait shell
        id: shell
        continue-on-error: true
        env:
          MW_WORLD_V0_SHELL_BASE_URL: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-playable-staging-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Preserve all presentation falsifiers as required gates
        env:
          INTERACTION: ${{ steps.interaction.outcome }}
          SESSION: ${{ steps.session.outcome }}
          SHELL: ${{ steps.shell.outcome }}
        run: |
          echo "interaction=${INTERACTION} session=${SESSION} shell=${SHELL}"
          test "${INTERACTION}" = success
          test "${SESSION}" = success
          test "${SHELL}" = success

      - name: Upload remote presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playable-staging-presentation-attempt-${{ github.run_attempt }}
          path: |
            world-v0-playable-staging-interaction.json
            world-v0-playable-staging-session.json
            world-v0-playable-staging-shell.json
            world-v0-runtime-shell-*.png
          if-no-files-found: warn
          retention-days: 14

  remote-exact-state:
    needs: remote-presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run remote exact-state attempt 1
        id: exact1
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-playable-staging-exact-attempt1.json
        run: node scripts/world-v0-chromium-cloud-smoke.mjs

      - name: Classify attempt 1 before any retry
        if: steps.exact1.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("world-v0-playable-staging-exact-attempt1.json", "utf8"));
          const fail = (message) => { throw new Error(message); };
          if (evidence.verdict !== "WORLD_V0_FAIL_REAL_CHROMIUM") fail(`unexpected first-attempt verdict ${evidence.verdict}`);
          if (!String(evidence.error || "").includes("exact-state qualification timeout")) fail(`non-starvation exact failure: ${evidence.error}`);
          if (!Array.isArray(evidence.clients) || evidence.clients.length !== 2) fail("exact failure missing both client evidence records");
          for (const client of evidence.clients) {
            const run = client.evidence;
            if (!run) fail(`client ${client.index} missing browser evidence`);
            const metrics = run.metrics || {};
            if (run.runtimeFailed !== false) fail(`client ${client.index} runtimeFailed=${run.runtimeFailed} reason=${run.runtimeFailureReason}`);
            if ((metrics.guardMismatches || 0) !== 0) fail(`client ${client.index} guard mismatches=${metrics.guardMismatches}`);
            if ((metrics.guardPending || 0) !== 0) fail(`client ${client.index} pending guards=${metrics.guardPending}`);
            if ((metrics.remapFailures || 0) !== 0) fail(`client ${client.index} remap failures=${metrics.remapFailures}`);
            if (metrics.firstStateMismatch != null) fail(`client ${client.index} first state mismatch present`);
            if ((metrics.serverRejected || 0) !== 0) fail(`client ${client.index} rejected records=${metrics.serverRejected}`);
          }
          console.log("WORLD_V0_EXACT_CLEAN_STARVATION_RETRY_AUTHORIZED");
          NODE

      - name: Run one same-SHA clean-starvation retry
        if: steps.exact1.outcome == 'failure'
        id: exact2
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-playable-staging-exact-attempt2.json
        run: node scripts/world-v0-chromium-cloud-smoke.mjs

      - name: Require exact-state qualification
        env:
          FIRST: ${{ steps.exact1.outcome }}
          SECOND: ${{ steps.exact2.outcome }}
        run: |
          echo "remote exact-state attempt1=${FIRST} attempt2=${SECOND}"
          if [ "${FIRST}" = success ]; then
            exit 0
          fi
          test "${SECOND}" = success

      - name: Upload remote exact-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-playable-staging-exact-attempt-${{ github.run_attempt }}
          path: |
            world-v0-playable-staging-exact-attempt1.json
            world-v0-playable-staging-exact-attempt2.json
          if-no-files-found: warn
          retention-days: 14
