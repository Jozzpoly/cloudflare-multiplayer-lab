name: World V0 post-Owner V28 breadth

on:
  push:
    branches:
      - world-v0-post-owner-v28-hardening
    paths:
      - .github/workflows/world-v0-post-owner-v28-breadth.yml
      - public/world-v0/**
      - src/world-slice-entry.ts
      - src/world-v0-contract.ts
      - src/world-v0-protocol.ts
      - src/world-v0-shared-yard.ts
      - scripts/world-v0-ongoing-yard-product-chromium.mjs
      - scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs
      - scripts/world-v0-smoothness-hidden-integrated-v25-transform.mjs
      - scripts/world-v0-smoothness-hidden-catchup-v21.mjs
      - scripts/world-v0-smoothness-v20-silent-outage-recovery.mjs
      - scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs
      - scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs
      - scripts/world-v0-owner-ui-focus-browser-audit.mjs
      - scripts/world-v0-mobile-input-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-player-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Start runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9240 > breadth-2p-wrangler.log 2>&1 &
          echo $! > breadth-2p.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat breadth-2p-wrangler.log; exit 1
      - name: Solo to friend live product
        run: |
          set -euo pipefail
          MW_WORLD_V0_ONGOING_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_ONGOING_OUTPUT=breadth-ongoing.json \
            timeout 120s node scripts/world-v0-ongoing-yard-product-chromium.mjs | tee breadth-ongoing.log
          grep -q WORLD_V0_ONGOING_YARD_PUBLIC_FLOW_PASS breadth-ongoing.log
      - name: Resumed stayer and soft reservation handoff
        run: |
          set -euo pipefail
          MW_WORLD_V0_RSH_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_RSH_ROOM=yard-2 \
          MW_WORLD_V0_RSH_OUTPUT=breadth-stayer.json \
            timeout 150s node scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs | tee breadth-stayer.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_PASS breadth-stayer.log
      - if: always()
        run: |
          if [ -f breadth-2p.pid ]; then pid="$(cat breadth-2p.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v28-breadth-2p-${{ github.run_id }}
          path: |
            breadth-ongoing.json
            breadth-ongoing.log
            breadth-stayer.json
            breadth-stayer.log
            breadth-2p-wrangler.log

  hidden-and-silence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Build production hidden lifecycle probe
        run: |
          set -euo pipefail
          MW_WORLD_V0_V25_HIDDEN_PROBE=/tmp/v28-hidden-probe.mjs node scripts/world-v0-smoothness-hidden-integrated-v25-transform.mjs
          node --check /tmp/v28-hidden-probe.mjs
      - name: Start runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9241 > breadth-hidden-wrangler.log 2>&1 &
          echo $! > breadth-hidden.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat breadth-hidden-wrangler.log; exit 1
      - name: Hidden tab production presentation
        run: |
          set -euo pipefail
          MW_WORLD_V0_V21_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_V21_ALT_BASE=http://localhost:8787 \
          MW_WORLD_V0_V21_HIDDEN_MS=5000 \
          MW_WORLD_V0_V21_OUTPUT=breadth-hidden.json \
            timeout 120s node /tmp/v28-hidden-probe.mjs | tee breadth-hidden.log
          grep -q WORLD_V0_V25_HIDDEN_LIFECYCLE_PASS breadth-hidden.log
      - name: Long traffic-only silence
        run: |
          set -euo pipefail
          MW_WORLD_V0_V20_SILENT_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_V20_SILENT_OFFLINE_MS=14000 \
          MW_WORLD_V0_V20_SILENT_OUTPUT=breadth-silence.json \
            timeout 120s node --experimental-strip-types scripts/world-v0-smoothness-v20-silent-outage-recovery.mjs | tee breadth-silence.log
          grep -q WORLD_V0_V20_SILENT_OUTAGE_EXACT_RECOVERY_PASS breadth-silence.log
      - if: always()
        run: |
          if [ -f breadth-hidden.pid ]; then pid="$(cat breadth-hidden.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v28-breadth-hidden-${{ github.run_id }}
          path: |
            breadth-hidden.json
            breadth-hidden.log
            breadth-silence.json
            breadth-silence.log
            breadth-hidden-wrangler.log

  exact-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9242 > breadth-rebase-wrangler.log 2>&1 &
          echo $! > breadth-rebase.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat breadth-rebase-wrangler.log; exit 1
      - name: Peer causal authority and browser rebase
        run: |
          set -euo pipefail
          MW_WORLD_V0_V28_PARITY_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_V28_PARITY_OUTPUT=breadth-peer-rebase.json \
            timeout 90s node scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs | tee breadth-peer-rebase.log
          grep -q WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS breadth-peer-rebase.log
          MW_WORLD_V0_I4B_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_I4B_PROXY_PORT=8797 \
          MW_WORLD_V0_I4B_OUTPUT=breadth-i4b.json \
            timeout 120s node scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee breadth-i4b.log
          grep -q WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS breadth-i4b.log
      - if: always()
        run: |
          if [ -f breadth-rebase.pid ]; then pid="$(cat breadth-rebase.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v28-breadth-rebase-${{ github.run_id }}
          path: |
            breadth-peer-rebase.json
            breadth-peer-rebase.log
            breadth-i4b.json
            breadth-i4b.log
            breadth-rebase-wrangler.log

  owner-ui-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Start runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9243 > breadth-ui-wrangler.log 2>&1 &
          echo $! > breadth-ui.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat breadth-ui-wrangler.log; exit 1
      - name: Desktop focus and mobile control surface
        run: |
          set -euo pipefail
          MW_WORLD_V0_OWNER_UI_BASE=http://127.0.0.1:8787 \
            timeout 100s node scripts/world-v0-owner-ui-focus-browser-audit.mjs | tee breadth-owner-ui.log
          grep -q WORLD_V0_OWNER_UI_FOCUS_BROWSER_PASS breadth-owner-ui.log
      - name: Real mobile touch gameplay
        run: |
          set -euo pipefail
          MW_WORLD_V0_MOBILE_INPUT_BASE=http://127.0.0.1:8787           MW_WORLD_V0_MOBILE_INPUT_OUTPUT=breadth-mobile-input.json             timeout 120s node scripts/world-v0-mobile-input-browser-audit.mjs | tee breadth-mobile-input.log
          grep -q WORLD_V0_MOBILE_INPUT_PASS breadth-mobile-input.log
      - if: always()
        run: |
          if [ -f breadth-ui.pid ]; then pid="$(cat breadth-ui.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v28-breadth-ui-${{ github.run_id }}
          path: |
            breadth-owner-ui.log
            breadth-mobile-input.json
            breadth-mobile-input.log
            breadth-ui-wrangler.log
