name: World V0 post-Owner V28 gap audit

on:
  push:
    branches:
      - world-v0-post-owner-v28-hardening
    paths:
      - .github/workflows/world-v0-post-owner-v28-gap-audit.yml
      - public/world-v0/**
      - src/world-slice-entry.ts
      - src/world-v0-shared-yard.ts
      - scripts/world-v0-join-failure-clarity-browser-audit.mjs
      - scripts/world-v0-join-failure-clarity-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join-failure-clarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Start runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9270 > gap-clarity-wrangler.log 2>&1 &
          echo $! > gap-clarity.pid
          for i in {1..120}; do curl -fsS http://127.0.0.1:8787/api/ping >/dev/null && exit 0; sleep 0.25; done
          cat gap-clarity-wrangler.log
          exit 1
      - name: Distinguish capacity from transport failure
        run: |
          set -euo pipefail
          node scripts/world-v0-join-failure-clarity-smoke.mjs | tee gap-clarity-smoke.log
          MW_WORLD_V0_JOIN_CLARITY_BASE=http://127.0.0.1:8787 \
            timeout 120s node scripts/world-v0-join-failure-clarity-browser-audit.mjs | tee gap-clarity-browser.log
          grep -q WORLD_V0_JOIN_FAILURE_CLARITY_BROWSER_PASS gap-clarity-browser.log
      - if: always()
        run: |
          if [ -f gap-clarity.pid ]; then pid="$(cat gap-clarity.pid)"; kill -TERM -- "-$pid" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v28-gap-clarity-${{ github.run_id }}
          path: |
            gap-clarity-smoke.log
            gap-clarity-browser.log
            gap-clarity-wrangler.log
