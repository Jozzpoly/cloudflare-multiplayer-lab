name: World V0 Public Room R0b Apply

on:
  push:
    branches:
      - world-v0-public-room-r0
    paths:
      - scripts/world-v0-apply-room-recovery-r0b.py
      - .github/workflows/world-v0-public-room-r0b-apply.yml

permissions:
  contents: write

jobs:
  apply-r0b:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Apply bounded room-recovery patch
        run: python3 scripts/world-v0-apply-room-recovery-r0b.py

      - name: Guard product scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'public/world-v0/app.js\npublic/world-v0/build-contract.js'
          grep -F 'shared-yard-v0-browser-ui-v10-room-recovery' public/world-v0/build-contract.js
          grep -F 'input_lease_expired:' public/world-v0/app.js
          grep -F 'room-recovered' public/world-v0/app.js
          grep -F 'preserveRoomRecovery' public/world-v0/app.js

      - name: Full repository check
        run: npm run check

      - name: Diff integrity
        run: git diff --check

      - name: Commit R0b product candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-v0/app.js public/world-v0/build-contract.js
          git commit -m "feat(world-v0): recover stable room across epoch restart"
          git push origin HEAD:world-v0-public-room-r0
