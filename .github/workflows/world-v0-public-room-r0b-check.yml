name: World V0 Public Room R0b Check

# R0b models a stable social room across multiple strict simulation epochs.
# Real freeze proves the lease-expiry boundary; an explicit visibility bridge separately proves foreground recovery semantics.
on:
  push:
    branches:
      - world-v0-public-room-r0
    paths:
      - public/world-v0/app.js
      - public/world-v0/build-contract.js
      - scripts/world-v0-public-room-r0b-browser-smoke.mjs
      - scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
      - scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs
      - .github/workflows/world-v0-public-room-r0b-check.yml

permissions:
  contents: read

jobs:
  r0b:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Validate R0b apparatus syntax
        run: |
          node --check scripts/world-v0-public-room-r0b-browser-smoke.mjs
          node --check scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          node --check scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs

      - name: Full repository check
        run: npm run check

      - name: Start local staging worker
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-public-room-r0b-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-public-room-r0b.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/world-v0/rooms >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-public-room-r0b-wrangler.log
          exit 1

      - name: Prove room survives peer departure and returns to live
        run: node scripts/world-v0-public-room-r0b-browser-smoke.mjs

      - name: Prove real freeze causes lease expiry without reconnect loop
        run: node scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs

      - name: Prove hidden lease expiry recovers same room after visible
        run: node scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs

      - name: Stop local worker
        if: always()
        run: |
          if [ -f /tmp/world-v0-public-room-r0b.pid ]; then kill "$(cat /tmp/world-v0-public-room-r0b.pid)" 2>/dev/null || true; fi

      - name: Show worker log on failure
        if: failure()
        run: tail -n 350 world-v0-public-room-r0b-wrangler.log || true
