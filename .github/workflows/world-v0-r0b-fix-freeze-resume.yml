name: World V0 R0b Fix Freeze Resume Apparatus

on:
  push:
    branches:
      - world-v0-public-room-r0
    paths:
      - .github/workflows/world-v0-r0b-fix-freeze-resume.yml

permissions:
  contents: write

jobs:
  patch-apparatus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix visibility bridge syntax and prove script parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs')
          text = path.read_text()
          old = '        return `bridge-error:${error?.message || error}`;'
          new = '        return "bridge-error:" + (error?.message || error);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one nested-template seam, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          node --check scripts/world-v0-public-room-r0b-browser-smoke.mjs
          git diff --check
          git diff -- scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
      - name: Commit apparatus-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          test "$(git diff --cached --name-only)" = "scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs"
          git commit -m "test(world-v0): fix R0b visibility bridge syntax"
          git push origin HEAD:world-v0-public-room-r0
