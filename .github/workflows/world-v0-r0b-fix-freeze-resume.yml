name: World V0 R0b Fix Freeze Resume Apparatus

on:
  push:
    branches:
      - world-v0-public-room-r0
    paths:
      - .github/workflows/world-v0-r0b-fix-freeze-resume.yml

permissions:
  contents: write

jobs:
  patch-apparatus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch real return-to-front semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs')
          text = path.read_text()
          old = '''  await cdp.call("Page.setWebLifecycleState", { state: "active" }, sessionId);\n\n  const recovered = await waitForBrowser'''
          new = '''  await cdp.call("Page.setWebLifecycleState", { state: "active" }, sessionId);\n  await cdp.call("Page.bringToFront", {}, sessionId);\n  await waitForBrowser(cdp, sessionId, `document.visibilityState === "visible" ? true : null`, "page visible after return", 5000);\n\n  const recovered = await waitForBrowser'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one freeze-resume seam, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
      - name: Commit apparatus-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          test "$(git diff --cached --name-only)" = "scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs"
          git commit -m "test(world-v0): model foreground return in R0b freeze gate"
          git push origin HEAD:world-v0-public-room-r0
