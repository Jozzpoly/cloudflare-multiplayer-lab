name: World V0 R0b Fix Freeze Resume Apparatus

on:
  push:
    branches:
      - world-v0-public-room-r0
    paths:
      - .github/workflows/world-v0-r0b-fix-freeze-resume.yml

permissions:
  contents: write

jobs:
  patch-apparatus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Order resume after queued epoch-close delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs')
          text = path.read_text()
          old = '''  await cdp.call("Page.setWebLifecycleState", { state: "active" }, sessionId);\n  await cdp.call("Page.bringToFront", {}, sessionId);\n  let returnVisibility = await cdp.evaluate(sessionId, `document.visibilityState`);'''
          new = '''  await cdp.call("Page.setWebLifecycleState", { state: "active" }, sessionId);\n  await cdp.call("Page.bringToFront", {}, sessionId);\n  const pendingAfterResume = await waitForBrowser(cdp, sessionId, `(() => {\n    const e = window.__sharedYardV0Evidence?.();\n    return e?.session?.roomRecovery?.pending ? e.session.roomRecovery : null;\n  })()`, "queued epoch close reaches room recovery", 5000);\n  assert(String(pendingAfterResume.reason || "").startsWith("input_lease_expired:"), `unexpected pending recovery ${JSON.stringify(pendingAfterResume)}`);\n  let returnVisibility = await cdp.evaluate(sessionId, `document.visibilityState`);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one resume-order seam, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          git diff --check
          git diff -- scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
      - name: Commit apparatus-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          test "$(git diff --cached --name-only)" = "scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs"
          git commit -m "test(world-v0): order R0b resume after queued epoch close"
          git push origin HEAD:world-v0-public-room-r0
