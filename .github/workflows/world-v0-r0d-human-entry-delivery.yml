name: World V0 R0d Human Entry Delivery

on:
  push:
    branches: [world-v0-r0d-human-entry-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-r0d-human-entry-delivery
  cancel-in-progress: false

env:
  QUALIFIED_RUNTIME_SHA: a2e821afbbc88371b033af311cc6882d46aa6916
  BASE_R0D_DELIVERY_SHA: 7da9ddd4ad37221f63a3cd418a140824783480ec
  HUMAN_ENTRY_QUALIFIED_SHA: 3e03e8228f665bef32a4ba97058d69c2e27a9e48
  RELIABILITY_WORKER: cloudflare-multiplayer-lab-reliability-play
  RELIABILITY_BASE_URL: https://cloudflare-multiplayer-lab-reliability-play.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact delivery
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prove qualified human-entry candidate and frozen authority bytes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$QUALIFIED_RUNTIME_SHA^{commit}"
          git cat-file -e "$BASE_R0D_DELIVERY_SHA^{commit}"
          git cat-file -e "$HUMAN_ENTRY_QUALIFIED_SHA^{commit}"
          git merge-base --is-ancestor "$HUMAN_ENTRY_QUALIFIED_SHA" HEAD
          test -z "$(git diff --name-only "$BASE_R0D_DELIVERY_SHA" HEAD -- src public/world-v0/app.js public/world-v0/build-contract.js public/world-v0/state-guard.js package-lock.json)"
          delivery_diff="$(git diff --name-only "$HUMAN_ENTRY_QUALIFIED_SHA" HEAD)"
          printf '%s\n' "$delivery_diff"
          bad="$(printf '%s\n' "$delivery_diff" | grep -Ev '^\.github/workflows/world-v0-r0d-human-entry-delivery\.yml$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected post-qualification delivery diff:"
            echo "$bad"
            exit 1
          fi
          echo "WORLD_V0_HUMAN_ENTRY_DELIVERY_ISOLATION_PASS"

      - name: Full repo check
        run: npm run check

      - name: Reliability target dry-run
        run: npx wrangler deploy --dry-run --env reliability_play --outdir .wrangler/r0d-human-entry-dry-run

      - name: Prepare exact deployed provenance
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { WORLD_V0_EXPECTED_SIM_BUILD_ID } from "./public/world-v0/build-contract.js";
          writeFileSync("public/world-v0/r0d-human-entry-provenance.json", JSON.stringify({
            purpose: "r0d-human-entry-repair",
            qualifiedRuntimeSha: process.env.QUALIFIED_RUNTIME_SHA,
            baseR0dDeliverySha: process.env.BASE_R0D_DELIVERY_SHA,
            humanEntryQualifiedSha: process.env.HUMAN_ENTRY_QUALIFIED_SHA,
            deliverySha: process.env.GITHUB_SHA,
            worker: process.env.RELIABILITY_WORKER,
            simBuildId: WORLD_V0_EXPECTED_SIM_BUILD_ID,
          }, null, 2) + "\n");
          NODE

      - name: Deploy isolated reliability Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
          npx wrangler deploy --env reliability_play

      - name: Verify exact deployed provenance
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.RELIABILITY_BASE_URL}/world-v0/r0d-human-entry-provenance.json?r=${Date.now()}`;
          const deadline = Date.now() + 120000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
              const value = response.ok ? await response.json() : null;
              last = value;
              if (
                value?.qualifiedRuntimeSha === process.env.QUALIFIED_RUNTIME_SHA &&
                value?.baseR0dDeliverySha === process.env.BASE_R0D_DELIVERY_SHA &&
                value?.humanEntryQualifiedSha === process.env.HUMAN_ENTRY_QUALIFIED_SHA &&
                value?.deliverySha === process.env.GITHUB_SHA &&
                value?.worker === process.env.RELIABILITY_WORKER
              ) {
                console.log("WORLD_V0_HUMAN_ENTRY_EXACT_DEPLOYMENT_PASS", JSON.stringify(value));
                process.exit(0);
              }
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`human-entry provenance not visible: ${JSON.stringify(last)}`);
          NODE

      - name: Public real-human cold direct-link gate
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-human-entry-public.json
        run: node scripts/world-v0-human-entry-browser-smoke.mjs

      - name: Public current I1 ActorSession continuity control
        env:
          MW_WORLD_V0_I1_BASE: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_I1_RUN: he-pub-${{ github.run_id }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-human-entry-public-i1.log

      - name: Upload public human-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-r0d-human-entry-public-${{ github.run_attempt }}
          path: |
            public/world-v0/r0d-human-entry-provenance.json
            world-v0-human-entry-public.json
            world-v0-human-entry-public-i1.log
          if-no-files-found: warn
          retention-days: 14
