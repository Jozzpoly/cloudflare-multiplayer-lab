name: World V0 R0d Human Entry Readiness

on:
  push:
    branches: [world-v0-r0d-human-entry-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-r0d-human-entry-readiness
  cancel-in-progress: true

jobs:
  human-entry-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prove bounded human-entry-only diff
        shell: bash
        run: |
          set -euo pipefail
          base=7da9ddd4ad37221f63a3cd418a140824783480ec
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(public/world-v0/(friend-entry\.js|friend-ready\.css|friend-ready\.js|human-entry-core\.js|index\.html)|scripts/world-v0-human-entry-(core|browser)-smoke\.mjs|package\.json|\.github/workflows/world-v0-r0d-human-entry-readiness\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected human-entry diff:"
            echo "$bad"
            exit 1
          fi
          test -z "$(git diff --name-only "$base" HEAD -- src public/world-v0/app.js public/world-v0/build-contract.js public/world-v0/state-guard.js)"
          echo "WORLD_V0_HUMAN_ENTRY_BOUNDED_DIFF_PASS"

      - name: Full standard repo check
        run: npm run check

      - name: Start unchanged authority in local Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-human-entry-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-human-entry-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "local Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-human-entry-wrangler.log
          exit 1

      - name: Real-human cold direct-link gate
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-human-entry-evidence.json
        run: node scripts/world-v0-human-entry-browser-smoke.mjs

      - name: Preserve existing session waiting and restart behavior
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-human-entry-session-control.json
        run: node scripts/world-v0-session-friction-smoke.mjs

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-human-entry-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-human-entry-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload human-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-r0d-human-entry-${{ github.run_attempt }}
          path: |
            world-v0-human-entry-evidence.json
            world-v0-human-entry-session-control.json
            world-v0-human-entry-wrangler.log
          if-no-files-found: warn
          retention-days: 14
