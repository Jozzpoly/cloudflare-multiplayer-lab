name: World V0 R0d Reliability Retest

on:
  push:
    branches:
      - world-v0-r0d-reliability-retest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-r0d-reliability-retest
  cancel-in-progress: false

env:
  QUALIFIED_SOURCE_SHA: a2e821afbbc88371b033af311cc6882d46aa6916
  RELIABILITY_WORKER: cloudflare-multiplayer-lab-reliability-play
  RELIABILITY_BASE_URL: https://cloudflare-multiplayer-lab-reliability-play.jozzpoly.workers.dev
  PRODUCTION_BASE_URL: https://cloudflare-multiplayer-lab.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  isolated-r0d-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove qualified runtime bytes are untouched
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$QUALIFIED_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$QUALIFIED_SOURCE_SHA" HEAD
          protected_paths=(
            public/world-v0
            src/box3d-runtime.ts
            src/world-v0-contract.ts
            src/world-v0-protocol.ts
            src/world-v0-shared-yard.ts
            src/world-slice-entry.ts
            package.json
            package-lock.json
          )
          if ! git diff --quiet "$QUALIFIED_SOURCE_SHA" HEAD -- "${protected_paths[@]}"; then
            echo "R0d delivery branch changed qualified product/runtime bytes."
            git diff --name-status "$QUALIFIED_SOURCE_SHA" HEAD -- "${protected_paths[@]}"
            exit 1
          fi
          echo "R0D_QUALIFIED_RUNTIME_BYTES_PASS source=$QUALIFIED_SOURCE_SHA delivery=$GITHUB_SHA"

      - name: Verify isolated Cloudflare target contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const target = config.env?.reliability_play;
          const publicStaging = config.env?.staging;
          if (!target) throw new Error("wrangler env.reliability_play missing");
          if (target.name !== process.env.RELIABILITY_WORKER) throw new Error(`reliability worker drift: ${target.name}`);
          if (target.workers_dev !== true) throw new Error("reliability worker must use isolated workers.dev delivery");
          if (!publicStaging || publicStaging.name !== "cloudflare-multiplayer-lab-staging") throw new Error("public staging contract drifted");
          if (target.name === publicStaging.name || target.name === config.name) throw new Error("reliability target aliases an existing worker");
          const bindings = target.durable_objects?.bindings || [];
          if (!bindings.some((binding) => binding.name === "SHARED_YARD_V0" && binding.class_name === "SharedYardV0")) {
            throw new Error("reliability SHARED_YARD_V0 binding missing");
          }
          const workerFirst = target.assets?.run_worker_first || [];
          if (!workerFirst.includes("/world-v0/ws")) throw new Error("reliability /world-v0/ws worker-first route missing");
          console.log("R0D_ISOLATED_TARGET_PASS", JSON.stringify({
            root: config.name,
            publicStaging: publicStaging.name,
            reliability: target.name,
          }));
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run complete qualified-source regression suite
        run: npm run check

      - name: Dry-run isolated reliability deployment
        run: npx wrangler deploy --dry-run --env reliability_play --outdir .wrangler/r0d-reliability-dry-run

      - name: Generate delivery-only provenance asset
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import {
            WORLD_V0_BROWSER_UI_REVISION,
            WORLD_V0_CLIENT_SIM_REVISION,
            WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            WORLD_V0_EXPECTED_SERVER_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
            WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
          } from "./public/world-v0/build-contract.js";
          const provenance = {
            purpose: "r0d-reliability-retest",
            qualifiedSourceSha: process.env.QUALIFIED_SOURCE_SHA,
            deliveryBranch: process.env.GITHUB_REF_NAME,
            deliverySha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0),
            worker: process.env.RELIABILITY_WORKER,
            uiRevision: WORLD_V0_BROWSER_UI_REVISION,
            clientSimRevision: WORLD_V0_CLIENT_SIM_REVISION,
            serverRevision: WORLD_V0_EXPECTED_SERVER_REVISION,
            protocolRevision: WORLD_V0_EXPECTED_PROTOCOL_REVISION,
            stateGuardRevision: WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
            simBuildId: WORLD_V0_EXPECTED_SIM_BUILD_ID,
          };
          writeFileSync("public/world-v0/r0d-reliability-provenance.json", `${JSON.stringify(provenance, null, 2)}\n`);
          console.log("R0D_RELIABILITY_PROVENANCE_PREPARED", JSON.stringify(provenance));
          NODE

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN absent; refusing deployment"; exit 2; }

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy only isolated reliability worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env reliability_play

      - name: Require exact qualified source to become visible
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.RELIABILITY_BASE_URL.replace(/\/$/, "");
          const deadline = Date.now() + 120_000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const cacheBust = `${process.env.GITHUB_SHA}-${Date.now()}`;
              const [buildResponse, provenanceResponse] = await Promise.all([
                fetch(`${base}/world-v0/build-contract.js?r0d=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
                fetch(`${base}/world-v0/r0d-reliability-provenance.json?r0d=${cacheBust}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }),
              ]);
              const build = await buildResponse.text();
              const provenance = provenanceResponse.ok ? await provenanceResponse.json() : null;
              last = {
                buildStatus: buildResponse.status,
                provenanceStatus: provenanceResponse.status,
                qualifiedSourceSha: provenance?.qualifiedSourceSha,
                deliverySha: provenance?.deliverySha,
                worker: provenance?.worker,
              };
              if (
                buildResponse.ok && provenanceResponse.ok &&
                provenance?.qualifiedSourceSha === process.env.QUALIFIED_SOURCE_SHA &&
                provenance?.deliverySha === process.env.GITHUB_SHA &&
                provenance?.worker === process.env.RELIABILITY_WORKER
              ) {
                console.log("R0D_RELIABILITY_EXACT_SOURCE_VISIBLE", JSON.stringify(last));
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`isolated reliability worker did not expose exact delivery: ${JSON.stringify(last)}`);
          NODE

      - name: Prove remote authority on CI-only unique run
        env:
          MW_WORLD_V0_BASE_URL: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_PRODUCTION_URL: ${{ env.PRODUCTION_BASE_URL }}
          MW_WORLD_V0_POLL_TIMEOUT_MS: "60000"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-r0d-remote-authority.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Prove remote I1 ActorSession continuity on unique run
        env:
          MW_WORLD_V0_I1_BASE: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_I1_RUN: r0d-ci-i1-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-r0d-remote-i1.log

      - name: Prove remote I2 future-intent supersession on unique run
        env:
          MW_WORLD_V0_I2_BASE: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_I2_RUN: r0d-ci-i2-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/world-v0-integration-i2-lifecycle-probe.mjs | tee world-v0-r0d-remote-i2.log

      - name: Prove one clean remote rAF-independent browser run
        env:
          MW_WORLD_V0_I3_BASE: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_I3_FREEZE_MS: "1200"
          MW_WORLD_V0_I3B_CLEAN_REQUIRED: "1"
          MW_WORLD_V0_I3B_MAX_ATTEMPTS: "4"
          MW_WORLD_V0_I3B_PREFIX: world-v0-r0d-remote-i3
        run: node scripts/world-v0-integration-i3b-clean-campaign.mjs

      - name: Prove remote I4b exact authority seed and browser rebase
        env:
          MW_WORLD_V0_I4B_BASE: ${{ env.RELIABILITY_BASE_URL }}
          MW_WORLD_V0_I4B_OUTPUT: world-v0-r0d-remote-i4b-browser.json
        run: |
          node --experimental-strip-types scripts/world-v0-integration-i4b-authority-probe.mjs | tee world-v0-r0d-remote-i4b-authority.log
          node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-r0d-remote-i4b-browser.log

      - name: Upload isolated R0d remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-r0d-reliability-retest-${{ github.run_attempt }}
          path: |
            .wrangler/r0d-reliability-dry-run
            public/world-v0/r0d-reliability-provenance.json
            world-v0-r0d-remote-authority.json
            world-v0-r0d-remote-i1.log
            world-v0-r0d-remote-i2.log
            world-v0-r0d-remote-i3-*.json
            world-v0-r0d-remote-i3-*.log
            world-v0-r0d-remote-i4b-authority.log
            world-v0-r0d-remote-i4b-browser.json
            world-v0-r0d-remote-i4b-browser.log
          if-no-files-found: warn
          retention-days: 14
