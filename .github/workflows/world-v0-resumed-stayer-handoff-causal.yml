name: World V0 Resumed-Stayer Handoff Causal

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-resumed-stayer-handoff-causal.yml
      - scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-resumed-stayer-handoff-causal
  cancel-in-progress: true

jobs:
  local-causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Static checks
        run: |
          set -euo pipefail
          node --check scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs
          npm run check
      - name: Start isolated local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-rsh-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-rsh.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-rsh-wrangler.log
          exit 1
      - name: Reproduce Owner resumed-stayer handoff locally
        env:
          MW_WORLD_V0_RSH_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RSH_ROOM: yard-2
          MW_WORLD_V0_RSH_OBSERVE_MS: 10000
          MW_WORLD_V0_RSH_OUTPUT: world-v0-resumed-stayer-handoff-local.json
        run: |
          set -euo pipefail
          timeout 150s node scripts/world-v0-resumed-stayer-handoff-browser-audit.mjs | tee world-v0-resumed-stayer-handoff-local.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_PASS world-v0-resumed-stayer-handoff-local.log
      - name: Upload causal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-resumed-stayer-handoff-${{ github.run_id }}
          path: |
            world-v0-resumed-stayer-handoff-local.json
            world-v0-resumed-stayer-handoff-local.log
            world-v0-rsh-wrangler.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-rsh.pid ]; then kill "$(cat /tmp/world-v0-rsh.pid)" 2>/dev/null || true; fi
