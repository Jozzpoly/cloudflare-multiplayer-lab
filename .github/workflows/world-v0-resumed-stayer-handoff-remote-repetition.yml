name: World V0 Resumed-Stayer Remote Repetition

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-resumed-stayer-handoff-remote-repetition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run exact remote sequence on fresh random Durable Object
        env:
          MW_WORLD_V0_RSH_REMOTE_BASE: https://cloudflare-multiplayer-lab-qualified-play.jozzpoly.workers.dev
          MW_WORLD_V0_RSH_REMOTE_RUN: rr${{ matrix.replica }}-${{ github.run_id }}
          MW_WORLD_V0_RSH_REMOTE_SOFT_WAIT_MS: 22000
          MW_WORLD_V0_RSH_REMOTE_OBSERVE_MS: 12000
          MW_WORLD_V0_RSH_REMOTE_OUTPUT: rsh-remote-${{ matrix.replica }}.json
        run: |
          set -euo pipefail
          echo "REPLICA=${{ matrix.replica }} RUN=$MW_WORLD_V0_RSH_REMOTE_RUN"
          echo "PUBLIC_YARDS_UNTOUCHED=yard-1,yard-2,yard-3"
          timeout 180s node scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs | tee rsh-remote-${{ matrix.replica }}.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_REMOTE_PASS rsh-remote-${{ matrix.replica }}.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rsh-remote-replica-${{ matrix.replica }}-${{ github.run_id }}
          path: |
            rsh-remote-${{ matrix.replica }}.json
            rsh-remote-${{ matrix.replica }}.log
          if-no-files-found: warn
          retention-days: 30
