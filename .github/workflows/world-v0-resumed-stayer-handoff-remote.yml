name: World V0 Resumed-Stayer Handoff Remote

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - .github/workflows/world-v0-resumed-stayer-handoff-remote.yml
      - scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-resumed-stayer-handoff-remote
  cancel-in-progress: true

jobs:
  remote-random-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs
      - name: Prove qualified-play random-run resumed-stayer handoff
        env:
          MW_WORLD_V0_RSH_REMOTE_BASE: https://cloudflare-multiplayer-lab-qualified-play.jozzpoly.workers.dev
          MW_WORLD_V0_RSH_REMOTE_RUN: rsh-${{ github.run_id }}
          MW_WORLD_V0_RSH_REMOTE_SOFT_WAIT_MS: 22000
          MW_WORLD_V0_RSH_REMOTE_OBSERVE_MS: 12000
          MW_WORLD_V0_RSH_REMOTE_OUTPUT: world-v0-resumed-stayer-handoff-remote.json
        run: |
          set -euo pipefail
          echo "REMOTE_RANDOM_RUN=$MW_WORLD_V0_RSH_REMOTE_RUN"
          echo "PUBLIC_YARDS_UNTOUCHED=yard-1,yard-2,yard-3"
          timeout 180s node scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs | tee world-v0-resumed-stayer-handoff-remote.log
          grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_REMOTE_PASS world-v0-resumed-stayer-handoff-remote.log
      - name: Upload remote causal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-resumed-stayer-handoff-remote-${{ github.run_id }}
          path: |
            world-v0-resumed-stayer-handoff-remote.json
            world-v0-resumed-stayer-handoff-remote.log
          if-no-files-found: warn
          retention-days: 30
