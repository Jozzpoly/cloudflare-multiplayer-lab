name: World V0 Resumed-Stayer Same-DO Churn

on:
  push:
    branches:
      - world-v0-foundation-stabilization-closure
    paths:
      - ".github/workflows/world-v0-resumed-stayer-same-do-churn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-do-churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Static guard
        run: node --check scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs
      - name: Repeat exact resumed-stayer handoff on one remote Durable Object
        env:
          MW_WORLD_V0_RSH_REMOTE_BASE: https://cloudflare-multiplayer-lab-qualified-play.jozzpoly.workers.dev
          MW_WORLD_V0_RSH_REMOTE_RUN: rch-${{ github.run_id }}
          MW_WORLD_V0_RSH_REMOTE_SOFT_WAIT_MS: "22000"
          MW_WORLD_V0_RSH_REMOTE_OBSERVE_MS: "10000"
        run: |
          set -euo pipefail
          echo "REMOTE_SAME_DO_RUN=$MW_WORLD_V0_RSH_REMOTE_RUN"
          echo "PUBLIC_YARDS_UNTOUCHED=yard-1,yard-2,yard-3"
          for cycle in 1 2 3 4; do
            echo "=== SAME_DO_CYCLE_${cycle}_BEGIN ==="
            export MW_WORLD_V0_RSH_REMOTE_OUTPUT="world-v0-resumed-stayer-same-do-cycle-${cycle}.json"
            timeout 180s node scripts/world-v0-resumed-stayer-handoff-remote-audit.mjs | tee "world-v0-resumed-stayer-same-do-cycle-${cycle}.log"
            grep -q WORLD_V0_RESUMED_STAYER_HANDOFF_REMOTE_PASS "world-v0-resumed-stayer-same-do-cycle-${cycle}.log"
            echo "=== SAME_DO_CYCLE_${cycle}_PASS ==="
            sleep 1
          done
          echo "WORLD_V0_RESUMED_STAYER_SAME_DO_CHURN_PASS cycles=4 run=$MW_WORLD_V0_RSH_REMOTE_RUN"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-resumed-stayer-same-do-churn-${{ github.run_id }}
          path: |
            world-v0-resumed-stayer-same-do-cycle-*.json
            world-v0-resumed-stayer-same-do-cycle-*.log
          retention-days: 30
