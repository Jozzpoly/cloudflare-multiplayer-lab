name: world-v0-session-continuity-r1-materialize

on:
  push:
    branches: [world-v0-session-continuity-r1-exec]
    paths:
      - .github/workflows/world-v0-session-continuity-r1-materialize.yml
      - scripts/materialize-world-v0-session-continuity-app.mjs
      - public/world-v0/session-continuity.js
      - public/world-v0/public-room-entry.js
      - public/world-v0/friend-ready.js
      - src/world-slice-entry.ts
      - public/world-v0/build-contract.js
      - scripts/world-v0-session-continuity-smoke.mjs

permissions:
  contents: write

concurrency:
  group: world-v0-session-continuity-r1-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize app integration
        run: node scripts/materialize-world-v0-session-continuity-app.mjs
      - name: Targeted syntax and continuity smoke
        run: |
          node --check public/world-v0/app.js
          node --check public/world-v0/session-continuity.js
          node --check public/world-v0/public-room-entry.js
          node --check public/world-v0/friend-ready.js
          node scripts/world-v0-session-continuity-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Exact materialized diff gate
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "public/world-v0/app.js"
          git diff --check
      - name: Commit qualified materialization
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/world-v0/app.js
          git commit -m "feat(world-v0): resume ActorSession across page reopen"
          git push origin HEAD:world-v0-session-continuity-r1-exec
