name: World V0 Session Friction

on:
  push:
    branches: [world-v0-session-friction]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v0-session-friction
  cancel-in-progress: true

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout session candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax-check session apparatus
        run: |
          node --check scripts/apply-world-v0-session-friction.mjs
          node --check scripts/world-v0-session-friction-smoke.mjs
          node --check public/world-v0/playable-control.js
          node --check scripts/world-v0-playable-interaction-smoke.mjs

      - name: Apply guarded Session Friction patch in working tree
        run: node scripts/apply-world-v0-session-friction.mjs

      - name: Verify generated syntax and bounded diff
        run: |
          node --check public/world-v0/app.js
          node --check public/world-v0/build-contract.js
          node --check scripts/world-v0-session-friction-smoke.mjs
          node --check scripts/world-v0-playable-interaction-smoke.mjs
          node --check scripts/world-v0-runtime-shell-smoke.mjs
          node --check scripts/apply-world-v0-playable-regression.mjs
          git diff --check
          git diff --name-only
          bad="$(git diff --name-only | grep -Ev '^(public/world-v0/app.js|public/world-v0/index.html|public/world-v0/styles.css|public/world-v0/build-contract.js|scripts/world-v0-runtime-shell-smoke.mjs|scripts/world-v0-playable-interaction-smoke.mjs|scripts/world-v0-playable-a1-smoke.mjs|scripts/apply-world-v0-playable-regression.mjs|.github/workflows/world-v0-playable-a1.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected Session Friction diff:"
            echo "$bad"
            exit 1
          fi
          test -z "$(git diff --name-only -- src/world-v0-shared-yard.ts src/world-v0-contract.ts src/world-v0-protocol.ts)"

      - name: Re-run control math after presentation patch
        run: node scripts/world-v0-playable-control-smoke.mjs

      - name: Start candidate Worker/assets in local Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-session-friction-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-session-friction-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "local Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-session-friction-wrangler.log
          exit 1

      - name: Prove authority and simulation baseline unchanged
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-session-authority.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Prove invite and fresh-epoch restart path
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-session-friction-evidence.json
        run: node scripts/world-v0-session-friction-smoke.mjs

      - name: Preserve isolated control interaction contract
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-session-control-evidence.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs

      - name: Preserve runtime-shell desktop and portrait regression
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-session-shell-evidence.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Prepare local exact-state Chromium falsifier
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          let chromium = readFileSync("scripts/world-v0-chromium-cloud-smoke.mjs", "utf8");
          chromium = chromium.replace(
            'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";',
            'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";',
          );
          writeFileSync("scripts/.world-v0-session-exact.mjs", chromium);
          NODE

      - name: Preserve exact-state causal envelope
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-session-exact.json
        run: node scripts/.world-v0-session-exact.mjs

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-session-friction-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-session-friction-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload Session Friction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-session-friction-evidence-attempt-${{ github.run_attempt }}
          path: |
            world-v0-session-authority.json
            world-v0-session-friction-evidence.json
            world-v0-session-control-evidence.json
            world-v0-session-shell-evidence.json
            world-v0-runtime-shell-*.png
            world-v0-session-exact.json
            world-v0-session-friction-wrangler.log
          if-no-files-found: warn
          retention-days: 14

      - name: Materialize qualified Session Friction patch
        if: success()
        run: |
          git config user.name "Jozzpoly"
          git config user.email "100104127+Jozzpoly@users.noreply.github.com"
          git add \
            public/world-v0/app.js \
            public/world-v0/index.html \
            public/world-v0/styles.css \
            public/world-v0/build-contract.js \
            scripts/world-v0-runtime-shell-smoke.mjs \
            scripts/world-v0-playable-interaction-smoke.mjs \
            scripts/world-v0-playable-a1-smoke.mjs \
            scripts/apply-world-v0-playable-regression.mjs \
            .github/workflows/world-v0-playable-a1.yml
          if git diff --cached --quiet; then
            echo "Session Friction patch already materialized"
            exit 0
          fi
          git commit -m "feat(world-v0): reduce friend-session restart friction [runtime-qualify]"
          git push origin HEAD:world-v0-session-friction
