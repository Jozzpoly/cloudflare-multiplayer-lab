name: World V0 Shared Consequence Geometry Lab

on:
  push:
    branches: [world-v0-shared-consequence-geometry-lab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-shared-consequence-geometry-lab
  cancel-in-progress: true

env:
  BASELINE_SHA: 23e9254d082cd7a4707ece88655eb7ad0fede0e0

jobs:
  geometry-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact lab head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install qualified dependency graph
        run: npm ci

      - name: Prove lab isolation
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA" "$GITHUB_SHA")
          printf 'geometry lab delta:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/world-v0-shared-consequence-geometry-lab.yml"
          test "${changed[1]}" = "scripts/world-v0-shared-consequence-geometry-lab.mjs"
          git diff --quiet "$BASELINE_SHA" "$GITHUB_SHA" -- \
            src public wrangler.jsonc package.json package-lock.json \
            .github/workflows/world-v0-shared-consequence-v0.yml

      - name: Validate lab apparatus
        run: |
          node --check scripts/world-v0-shared-consequence-geometry-lab.mjs
          node --experimental-strip-types --input-type=module <<'NODE'
          const contract = await import('./src/world-v0-contract.ts');
          if (contract.WORLD_V0_SCENE_REVISION !== 'shared-yard-v0-seed-c-shared-consequence-v0') throw new Error('unexpected source scene');
          console.log('GEOMETRY_LAB_SOURCE_CONTRACT_PASS', JSON.stringify({
            sceneRevision: contract.WORLD_V0_SCENE_REVISION,
            simBuildId: contract.WORLD_V0_SIM_BUILD_ID,
            propDensity: contract.WORLD_V0_PROP_PHYSICS.density,
            propFriction: contract.WORLD_V0_PROP_PHYSICS.friction,
            playerSpeed: contract.WORLD_V0_MOVEMENT.playerSpeed,
            playerAcceleration: contract.WORLD_V0_MOVEMENT.playerAcceleration,
          }));
          NODE

      - name: Run near-contact geometry matrix
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-geometry-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/world-v0-shared-consequence-geometry-lab.mjs | tee world-v0-shared-consequence-geometry-lab.log

      - name: Prepare product-calibrated impact matrix
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const sourcePath = 'scripts/world-v0-shared-consequence-geometry-lab.mjs';
          const outputPath = 'scripts/.world-v0-shared-consequence-product-impact-lab.mjs';
          let source = readFileSync(sourcePath, 'utf8');
          const replacements = [
            ['const PUSH_TICKS = 180;', 'const PUSH_TICKS = 150;'],
            ['const SETTLE_TICKS = 120;', 'const SETTLE_TICKS = 60;'],
            [
              'const playerX = layout.firstX - (HALF[0] + WORLD_V0_PLAYER_PHYSICS.capsuleRadius + PLAYER_SURFACE_GAP);',
              'const playerX = layout.firstX - 1.375510215759277;'
            ],
            [
              'const player = addPlayer(b3, world, [playerX, 0.82, TRAIN_Z]);',
              'const player = addPlayer(b3, world, [playerX, 0.799859344959259, TRAIN_Z - 0.634566116333008]);'
            ],
          ];
          for (const [from, to] of replacements) {
            const matches = source.split(from).length - 1;
            if (matches !== 1) throw new Error(`product calibration anchor drift: ${from} matches=${matches}`);
            source = source.replace(from, to);
          }
          writeFileSync(outputPath, source);
          console.log('PRODUCT_IMPACT_CALIBRATION_PREP_PASS', JSON.stringify({
            sourcePath,
            outputPath,
            prePushRelative: { dx: -1.375510215759277, dy: 0.339859344959259, dz: -0.634566116333008 },
            pushTicks: 150,
            settleTicks: 60,
          }));
          NODE
          node --check scripts/.world-v0-shared-consequence-product-impact-lab.mjs

      - name: Run product-calibrated impact matrix
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-product-impact-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/.world-v0-shared-consequence-product-impact-lab.mjs | tee world-v0-shared-consequence-product-impact-lab.log

      - name: Prepare short-train split and column matrices
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const sourcePath = 'scripts/.world-v0-shared-consequence-product-impact-lab.mjs';
          let source = readFileSync(sourcePath, 'utf8');
          const oldVariants = `const VARIANTS = [
            { id: "train3-wide4x2", trainLength: 3, wall: "wide4x2" },
            { id: "train4-wide4x2", trainLength: 4, wall: "wide4x2" },
            { id: "train6-wide4x2", trainLength: 6, wall: "wide4x2" },
            { id: "train3-tall2x4", trainLength: 3, wall: "tall2x4" },
            { id: "train4-tall2x4", trainLength: 4, wall: "tall2x4" },
            { id: "train6-tall2x4", trainLength: 6, wall: "tall2x4" },
          ];`.replace(/^          /gm, '');
          const shortVariants = `const VARIANTS = [
            { id: "train1-wide4x2", trainLength: 1, wall: "wide4x2" },
            { id: "train2-wide4x2", trainLength: 2, wall: "wide4x2" },
            { id: "train3-wide4x2", trainLength: 3, wall: "wide4x2" },
          ];`.replace(/^          /gm, '');
          const matches = source.split(oldVariants).length - 1;
          if (matches !== 1) throw new Error(`short train variants anchor drift matches=${matches}`);
          source = source.replace(oldVariants, shortVariants);
          const splitPath = 'scripts/.world-v0-shared-consequence-short-split-lab.mjs';
          writeFileSync(splitPath, source);

          const trainZAnchor = 'const TRAIN_Z = 3.3;';
          if (source.split(trainZAnchor).length - 1 !== 1) throw new Error('TRAIN_Z anchor drift');
          const columnSource = source.replace(trainZAnchor, 'const TRAIN_Z = 2.83;');
          const columnPath = 'scripts/.world-v0-shared-consequence-short-column-lab.mjs';
          writeFileSync(columnPath, columnSource);
          console.log('SHORT_TRAIN_ALIGNMENT_PREP_PASS', JSON.stringify({
            splitPath,
            columnPath,
            trainLengths: [1, 2, 3],
            splitAxisZ: 3.3,
            columnAxisZ: 2.83,
          }));
          NODE
          node --check scripts/.world-v0-shared-consequence-short-split-lab.mjs
          node --check scripts/.world-v0-shared-consequence-short-column-lab.mjs

      - name: Run short-train split-hit matrix
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-short-split-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/.world-v0-shared-consequence-short-split-lab.mjs | tee world-v0-shared-consequence-short-split-lab.log

      - name: Run short-train single-column matrix
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-short-column-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/.world-v0-shared-consequence-short-column-lab.mjs | tee world-v0-shared-consequence-short-column-lab.log

      - name: Prepare support-topology matrices
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let source = readFileSync('scripts/.world-v0-shared-consequence-product-impact-lab.mjs', 'utf8');
          const oldVariants = `const VARIANTS = [
            { id: "train3-wide4x2", trainLength: 3, wall: "wide4x2" },
            { id: "train4-wide4x2", trainLength: 4, wall: "wide4x2" },
            { id: "train6-wide4x2", trainLength: 6, wall: "wide4x2" },
            { id: "train3-tall2x4", trainLength: 3, wall: "tall2x4" },
            { id: "train4-tall2x4", trainLength: 4, wall: "tall2x4" },
            { id: "train6-tall2x4", trainLength: 6, wall: "tall2x4" },
          ];`.replace(/^          /gm, '');
          const topologyVariants = `const VARIANTS = [
            { id: "train1-wide4x2", trainLength: 1, wall: "wide4x2" },
            { id: "train1-stagger4x3x1", trainLength: 1, wall: "stagger4x3x1" },
            { id: "train1-compact3x3x2", trainLength: 1, wall: "compact3x3x2" },
          ];`.replace(/^          /gm, '');
          if (source.split(oldVariants).length - 1 !== 1) throw new Error('topology variant anchor drift');
          source = source.replace(oldVariants, topologyVariants);

          const oldWallPositions = `function wallPositions(shape) {
            if (shape === "wide4x2") {
              const columns = [1.89, 2.83, 3.77, 4.71];
              const rows = [0.46, 1.38];
              return rows.flatMap((y) => columns.map((z) => [WALL_X, y, z]));
            }
            if (shape === "tall2x4") {
              const columns = [2.83, 3.77];
              const rows = [0.46, 1.38, 2.30, 3.22];
              return rows.flatMap((y) => columns.map((z) => [WALL_X, y, z]));
            }
            throw new Error(\`unknown wall shape \${shape}\`);
          }`.replace(/^          /gm, '');
          const topologyWallPositions = `function wallPositions(shape) {
            if (shape === "wide4x2") {
              const columns = [1.89, 2.83, 3.77, 4.71];
              const rows = [0.46, 1.38];
              return rows.flatMap((y) => columns.map((z) => [WALL_X, y, z]));
            }
            if (shape === "tall2x4") {
              const columns = [2.83, 3.77];
              const rows = [0.46, 1.38, 2.30, 3.22];
              return rows.flatMap((y) => columns.map((z) => [WALL_X, y, z]));
            }
            if (shape === "stagger4x3x1") {
              return [
                ...[1.89, 2.83, 3.77, 4.71].map((z) => [WALL_X, 0.46, z]),
                ...[2.36, 3.30, 4.24].map((z) => [WALL_X, 1.38, z]),
                [WALL_X, 2.30, 3.30],
              ];
            }
            if (shape === "compact3x3x2") {
              return [
                ...[2.36, 3.30, 4.24].map((z) => [WALL_X, 0.46, z]),
                ...[2.36, 3.30, 4.24].map((z) => [WALL_X, 1.38, z]),
                ...[2.83, 3.77].map((z) => [WALL_X, 2.30, z]),
              ];
            }
            throw new Error(\`unknown wall shape \${shape}\`);
          }`.replace(/^          /gm, '');
          if (source.split(oldWallPositions).length - 1 !== 1) throw new Error('topology wallPositions anchor drift');
          source = source.replace(oldWallPositions, topologyWallPositions);

          const impactPath = 'scripts/.world-v0-shared-consequence-topology-impact-lab.mjs';
          writeFileSync(impactPath, source);
          const neutralAnchor = 'const NEUTRAL_TICKS = 120;';
          if (source.split(neutralAnchor).length - 1 !== 1) throw new Error('neutral ticks anchor drift');
          const stabilitySource = source.replace(neutralAnchor, 'const NEUTRAL_TICKS = 0;');
          const stabilityPath = 'scripts/.world-v0-shared-consequence-topology-stability-lab.mjs';
          writeFileSync(stabilityPath, stabilitySource);
          console.log('SUPPORT_TOPOLOGY_PREP_PASS', JSON.stringify({
            shapes: ['wide4x2', 'stagger4x3x1', 'compact3x3x2'],
            trainLength: 1,
            impactAxisZ: 3.3,
            impactPath,
            stabilityPath,
          }));
          NODE
          node --check scripts/.world-v0-shared-consequence-topology-impact-lab.mjs
          node --check scripts/.world-v0-shared-consequence-topology-stability-lab.mjs

      - name: Run support-topology neutral stability
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-topology-stability-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/.world-v0-shared-consequence-topology-stability-lab.mjs | tee world-v0-shared-consequence-topology-stability-lab.log

      - name: Run support-topology impact matrix
        env:
          MW_WORLD_V0_GEOMETRY_LAB_OUTPUT: world-v0-shared-consequence-topology-impact-lab.json
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/.world-v0-shared-consequence-topology-impact-lab.mjs | tee world-v0-shared-consequence-topology-impact-lab.log

      - name: Upload geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-geometry-lab-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-geometry-lab.json
            world-v0-shared-consequence-geometry-lab.log
            world-v0-shared-consequence-product-impact-lab.json
            world-v0-shared-consequence-product-impact-lab.log
            world-v0-shared-consequence-short-split-lab.json
            world-v0-shared-consequence-short-split-lab.log
            world-v0-shared-consequence-short-column-lab.json
            world-v0-shared-consequence-short-column-lab.log
            world-v0-shared-consequence-topology-stability-lab.json
            world-v0-shared-consequence-topology-stability-lab.log
            world-v0-shared-consequence-topology-impact-lab.json
            world-v0-shared-consequence-topology-impact-lab.log
          if-no-files-found: warn
          retention-days: 14
