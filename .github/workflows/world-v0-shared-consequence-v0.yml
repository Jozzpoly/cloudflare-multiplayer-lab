name: World V0 Shared Consequence V0

on:
  push:
    branches: [world-v0-shared-consequence-v0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-shared-consequence-v0
  cancel-in-progress: true

env:
  CONTROL_SHA: 5dd28a899c4f60c9227f1eb93026f571ced733e3
  EXPECTED_SIM_BUILD: shared-yard-v0-sim-d87e85d773898e80

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install qualified dependency graph
        run: npm ci
      - name: Prove bounded experiment delta
        run: |
          set -euo pipefail
          git cat-file -e "$CONTROL_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$CONTROL_SHA" "$GITHUB_SHA" -- ':!/.github/workflows/world-v0-shared-consequence-v0.yml')
          printf 'candidate delta:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = "public/world-v0/build-contract.js"
          test "${changed[1]}" = "scripts/world-v0-shared-consequence-authority-adapter.mjs"
          test "${changed[2]}" = "scripts/world-v0-shared-consequence-browser-adapter.mjs"
          test "${changed[3]}" = "scripts/world-v0-shared-consequence-protocol-adapter.mjs"
          test "${changed[4]}" = "src/world-v0-contract.ts"
          git diff --quiet "$CONTROL_SHA" "$GITHUB_SHA" -- \
            src/world-v0-shared-yard.ts src/world-v0-protocol.ts src/world-slice-entry.ts \
            public/world-v0/app.js public/world-v0/friend-entry.js public/world-v0/friend-ready.js \
            public/world-v0/playable-control.js public/world-v0/solo-inspection-core.js public/world-v0/solo-inspection.js \
            scripts/world-v0-protocol-smoke.ts scripts/world-v0-authority-runtime-smoke.mjs \
            scripts/world-v0-playable-interaction-smoke.mjs \
            wrangler.jsonc package.json package-lock.json
      - name: Derive and validate Shared Consequence contract
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          const m = await import('./src/world-v0-contract.ts');
          const b = await import('./public/world-v0/build-contract.js');
          const layout = m.WORLD_V0_PROP_LAYOUT;
          const counts = layout.reduce((map, prop) => {
            map[prop.cluster] = (map[prop.cluster] || 0) + 1;
            return map;
          }, {});
          if (m.WORLD_V0_SCENE_REVISION !== 'shared-yard-v0-seed-c-shared-consequence-v0') throw new Error('scene revision drift');
          if (m.WORLD_V0_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error(`derived SimBuild drift ${m.WORLD_V0_SIM_BUILD_ID}`);
          if (b.WORLD_V0_EXPECTED_SIM_BUILD_ID !== m.WORLD_V0_SIM_BUILD_ID) throw new Error('browser/contract SimBuild drift');
          if (layout.length !== 23 || m.WORLD_V0_NET_ENTITY_ORDER.length !== 25) throw new Error('bounded entity count drift');
          if (new Set(layout.map((prop) => prop.id)).size !== layout.length) throw new Error('duplicate prop id');
          if (counts.barricade !== 6 || counts.tower !== 3 || counts['impact-train'] !== 6 || counts.breakwall !== 8) throw new Error(`cluster drift ${JSON.stringify(counts)}`);
          const train = layout.filter((p) => p.cluster === 'impact-train');
          const wall = layout.filter((p) => p.cluster === 'breakwall');
          const half = m.WORLD_V0_PROP_PHYSICS.halfExtents[0];
          const surfaceGap = wall[0].position[0] - half - (train.at(-1).position[0] + half);
          if (Math.abs(surfaceGap - 0.04) > 1e-9) throw new Error(`train/wall gap ${surfaceGap}`);
          const wallColumns = [...new Set(wall.map((p) => p.position[2]))].sort((a,b) => a-b);
          const axis = train[0].position[2];
          if (!(wallColumns[1] < axis && axis < wallColumns[2])) throw new Error('train axis does not split middle wall columns');
          const minSeparation = 2 * half;
          for (let i = 0; i < layout.length; i++) for (let j = i + 1; j < layout.length; j++) {
            const a = layout[i].position, c = layout[j].position;
            const overlap = Math.abs(a[0]-c[0]) < minSeparation - 1e-9 && Math.abs(a[1]-c[1]) < minSeparation - 1e-9 && Math.abs(a[2]-c[2]) < minSeparation - 1e-9;
            if (overlap) throw new Error(`authored overlap ${layout[i].id}/${layout[j].id}`);
          }
          console.log('SHARED_CONSEQUENCE_CONTRACT_PASS', JSON.stringify({ simBuildId:m.WORLD_V0_SIM_BUILD_ID, propCount:layout.length, counts, surfaceGap, wallColumns, trainAxis:axis }));
          NODE
      - name: Preserve repository falsifiers with experiment-scoped width adapters
        run: |
          set -euo pipefail
          node scripts/world-v0-friend-entry-core-smoke.mjs
          node scripts/world-v0-playable-control-smoke.mjs
          node scripts/world-v0-solo-inspection-core-smoke.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
          node --check scripts/world-v0-shared-consequence-protocol-adapter.mjs
          node --check scripts/world-v0-shared-consequence-authority-adapter.mjs
          node --check scripts/world-v0-shared-consequence-browser-adapter.mjs
          node scripts/world-v0-shared-consequence-protocol-adapter.mjs
          node --experimental-strip-types scripts/.world-v0-shared-consequence-protocol-smoke.ts
          MW_WORLD_V0_SHARED_CONSEQUENCE_APP_OUTPUT=scripts/.world-v0-shared-consequence-app.js node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check scripts/.world-v0-shared-consequence-app.js
          npm run validate:staging-contract
          npm run test:staging-deploy-guard
          npm run test:f5-protocol
          npm run test:world-v0-browser
          npm run check:client
          npm run check:a2r
          npm run typecheck
          npm run validate:worker
      - name: Start core Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-core-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-core.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-shared-consequence-core-wrangler.log
          exit 1
      - name: Preserve authority and changed SimBuild identity
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-shared-consequence-authority.json
        run: |
          set -euo pipefail
          node scripts/world-v0-shared-consequence-authority-adapter.mjs
          node --check scripts/.world-v0-shared-consequence-authority-runtime-smoke.mjs
          node scripts/.world-v0-shared-consequence-authority-runtime-smoke.mjs
      - name: Stop core Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-core.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-core.pid)" 2>/dev/null || true; fi
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-core-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-authority.json
            world-v0-shared-consequence-core-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  presentation:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to experiment width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Start presentation Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-presentation-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-presentation.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-presentation-wrangler.log; exit 1
      - name: Preserve host-to-friend entry
        env:
          MW_WORLD_V0_FRIEND_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_FRIEND_ENTRY_OUTPUT: world-v0-shared-consequence-entry.json
        run: node scripts/world-v0-friend-entry-browser-smoke.mjs
      - name: Preserve mobile-hardened controls
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-shared-consequence-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs
      - name: Preserve manual fresh-epoch lifecycle
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-shared-consequence-session.json
        run: node scripts/world-v0-session-friction-smoke.mjs
      - name: Preserve desktop and portrait shell
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-shared-consequence-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs
      - name: Stop presentation Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-presentation.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-presentation.pid)" 2>/dev/null || true; fi
      - name: Upload presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-presentation-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-entry.json
            world-v0-shared-consequence-interaction.json
            world-v0-shared-consequence-session.json
            world-v0-shared-consequence-shell.json
            world-v0-runtime-shell-*.png
            world-v0-shared-consequence-presentation-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  solo:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to experiment width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Start solo Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-solo-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-solo.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-solo-wrangler.log; exit 1
      - name: Preserve real-authority Inspect solo
        env:
          MW_WORLD_V0_SOLO_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SOLO_OUTPUT: world-v0-shared-consequence-solo.json
        run: node scripts/world-v0-solo-inspection-browser-smoke.mjs
      - name: Stop solo Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-solo.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-solo.pid)" 2>/dev/null || true; fi
      - name: Upload solo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-solo-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-solo.json
            world-v0-shared-consequence-solo-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  exact-state:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to experiment width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Verify exact-state apparatus
        run: |
          node --check scripts/world-v0-chromium-cloud-smoke.mjs
          node --check scripts/world-v0-exact-failure-classifier.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
      - name: Start exact Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-exact-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-exact.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-exact-wrangler.log; exit 1
      - name: Prepare local exact-state target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let chromium = readFileSync('scripts/world-v0-chromium-cloud-smoke.mjs', 'utf8');
          const remote = 'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";';
          const local = 'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";';
          if (!chromium.includes(remote)) throw new Error('Shared Consequence exact-state local-target anchor drift');
          writeFileSync('scripts/.world-v0-shared-consequence-exact.mjs', chromium.replace(remote, local));
          NODE
      - name: Preserve exact-state causal envelope
        id: exact
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-shared-consequence-exact.json
        run: node scripts/.world-v0-shared-consequence-exact.mjs
      - name: Classify exact failure
        if: steps.exact.outcome == 'failure'
        run: node scripts/world-v0-exact-failure-classifier.mjs world-v0-shared-consequence-exact.json
      - name: Require exact-state qualification
        env:
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: test "$EXACT_OUTCOME" = success
      - name: Stop exact Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-exact.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-exact.pid)" 2>/dev/null || true; fi
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-exact-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-exact.json
            world-v0-shared-consequence-exact-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  phenomenon-measurement:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Start phenomenon Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-phenomenon-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-phenomenon.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-phenomenon-wrangler.log; exit 1
      - name: Measure matched neutral and train-to-breakwall runs
        env:
          MW_WORLD_V0_PHENOMENON_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PHENOMENON_OUTPUT: world-v0-shared-consequence-phenomenon.json
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import {
            WORLD_V0_CLIENT_SIM_REVISION,
            WORLD_V0_EXPECTED_SERVER_REVISION,
            WORLD_V0_EXPECTED_SIM_BUILD_ID,
            WORLD_V0_EXPECTED_STATE_GUARD_REVISION,
          } from './public/world-v0/build-contract.js';

          const BASE = process.env.MW_WORLD_V0_PHENOMENON_BASE_URL.replace(/\/$/, '');
          const wsBase = new URL(BASE);
          wsBase.protocol = wsBase.protocol === 'https:' ? 'wss:' : 'ws:';
          const WS_URL = `${wsBase.origin}/world-v0/ws`;
          const OUTPUT = process.env.MW_WORLD_V0_PHENOMENON_OUTPUT;
          const EXPECTED_PROPS = 23;
          const EXPECTED_GUARD_LENGTH = 25 * 13 * 8;
          const SAFE_FORWARD_TICKS = 24;
          const PHASE = { neutral: 30, approach: 58, brake: 24, push: 150, settle: 60 };
          const PUSH_OFFSET = PHASE.neutral + PHASE.approach + PHASE.brake;
          const PUSH_END_OFFSET = PUSH_OFFSET + PHASE.push;
          const TOTAL_TICKS = PUSH_END_OFFSET + PHASE.settle;
          const STAGING_TARGET = [-5.2, 3.3];
          const TRAIN_IDS = ['prop-9','prop-10','prop-11','prop-12','prop-13','prop-14'];
          const WALL_IDS = ['prop-15','prop-16','prop-17','prop-18','prop-19','prop-20','prop-21','prop-22'];
          const TIMEOUT_MS = 20_000;

          function assert(condition, message) { if (!condition) throw new Error(message); }
          function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
          function identityFrom(message) {
            return { worldId:message.worldId, worldEpoch:message.worldEpoch, simBuildId:message.simBuildId, clientSimRevision:message.clientSimRevision };
          }
          function assertIdentity(message, identity, label) {
            for (const key of ['worldId','worldEpoch','simBuildId','clientSimRevision']) assert(message[key] === identity[key], `${label}: ${key} drift`);
          }
          function finiteVector(value, length) { return Array.isArray(value) && value.length === length && value.every(Number.isFinite); }
          function assertSnapshot(message, label) {
            assert(message?.finite === true, `${label}: non-finite snapshot`);
            assert(Array.isArray(message.players) && message.players.length === 2, `${label}: player count`);
            assert(Array.isArray(message.props) && message.props.length === EXPECTED_PROPS, `${label}: prop count ${message.props?.length}`);
            for (const entity of [...message.players, ...message.props]) {
              assert(finiteVector(entity.position,3) && finiteVector(entity.rotation,4) && finiteVector(entity.linearVelocity,3) && finiteVector(entity.angularVelocity,3), `${label}: invalid dynamic state ${entity.netEntityId}`);
            }
            assert(message.stateGuard?.revision === WORLD_V0_EXPECTED_STATE_GUARD_REVISION, `${label}: guard revision`);
            assert(typeof message.stateGuard?.packed === 'string' && message.stateGuard.packed.length === EXPECTED_GUARD_LENGTH, `${label}: guard width ${message.stateGuard?.packed?.length}`);
          }
          function stateMaps(message) {
            return {
              props: new Map((message.props || []).map((p) => [p.id, [...p.position]])),
              players: new Map((message.players || []).map((p) => [p.sessionId, [...p.position]])),
            };
          }
          function distance(a,b) { return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]); }
          function distanceXZ(a,b) { return Math.hypot(a[0]-b[0],a[2]-b[2]); }
          function groupStats(current, baseline, ids, epsilon = 0.02) {
            const perEntity = ids.map((id) => {
              const a = baseline.get(id), b = current.get(id);
              assert(a && b, `missing group entity ${id}`);
              return { id, displacement: distance(a,b) };
            });
            const values = perEntity.map((x) => x.displacement);
            return {
              max: Math.max(...values),
              mean: values.reduce((a,b)=>a+b,0)/values.length,
              movedOver20mm: values.filter((v)=>v>epsilon).length,
              perEntity,
            };
          }
          function createPeer(playerId, runKey) {
            return {
              playerId,
              ws:new WebSocket(`${WS_URL}?player=${encodeURIComponent(playerId)}&run=${encodeURIComponent(runKey)}`),
              welcome:null, identity:null, start:null, latestBoundary:0, batchSeq:0,
              accepted:0, late:0, rejected:0, freshSelf:0, freshRemote:0,
              initial:null, prePush:null, final:null,
            };
          }
          function sendBatch(peer, firstTick, records) {
            peer.batchSeq += 1;
            peer.ws.send(JSON.stringify({ type:'world_v0_input_batch', ...peer.identity, batchSeq:peer.batchSeq, records }));
          }

          async function runScenario(mode) {
            const suffix = `${mode}-${Date.now().toString(36)}`;
            const runKey = `sc-${suffix}`.slice(0,20);
            const peers = [createPeer(`scA-${Date.now()}`,runKey), createPeer(`scB-${Date.now()}`,runKey)];
            const guards = new Map();
            let sharedGuards = 0;
            let nextTick = null;
            let scheduledTicks = 0;
            let activePeer = null;
            let approachInput = null;
            let pushStartTick = null;
            let measureEndTick = null;
            let timer = null;
            let settled = false;

            const cleanup = () => {
              if (timer) clearTimeout(timer);
              for (const p of peers) try { p.ws.close(1000,'phenomenon_measurement_complete'); } catch {}
            };
            const inputAt = (peer, tick) => {
              if (mode === 'control' || peer !== activePeer) return {x:0,z:0};
              const offset = tick - activePeer.start.protocolStartTick;
              if (offset < PHASE.neutral) return {x:0,z:0};
              if (offset < PHASE.neutral + PHASE.approach) return approachInput;
              if (offset < PUSH_OFFSET) return {x:0,z:0};
              if (offset < PUSH_END_OFFSET) return {x:1,z:0};
              return {x:0,z:0};
            };
            const feed = () => {
              if (peers.some((p)=>!p.start || !p.identity) || !activePeer || !approachInput) return;
              if (nextTick === null) nextTick = activePeer.start.protocolStartTick;
              const horizon = Math.min(...peers.map((p)=>p.latestBoundary)) + SAFE_FORWARD_TICKS;
              const endTick = activePeer.start.protocolStartTick + TOTAL_TICKS;
              while (nextTick < endTick && nextTick + 1 <= horizon) {
                for (const peer of peers) sendBatch(peer,nextTick,[
                  {targetTick:nextTick,...inputAt(peer,nextTick)},
                  {targetTick:nextTick+1,...inputAt(peer,nextTick+1)},
                ]);
                nextTick += 2;
                scheduledTicks += 2;
              }
            };

            return await new Promise((resolve,reject) => {
              const fail = (error) => {
                if (settled) return;
                settled = true; cleanup(); reject(error instanceof Error ? error : new Error(String(error)));
              };
              const maybeFinish = () => {
                if (settled || !activePeer?.final) return;
                try {
                  assert(scheduledTicks === TOTAL_TICKS, `${mode}: scheduled ${scheduledTicks}/${TOTAL_TICKS}`);
                  for (const p of peers) {
                    assert(p.accepted === TOTAL_TICKS, `${mode}:${p.playerId} accepted ${p.accepted}/${TOTAL_TICKS}`);
                    assert(p.late === 0, `${mode}:${p.playerId} late ${p.late}`);
                    assert(p.rejected === 0, `${mode}:${p.playerId} rejected ${p.rejected}`);
                    assert(p.freshSelf >= TOTAL_TICKS - 2, `${mode}:${p.playerId} fresh self ${p.freshSelf}`);
                    assert(p.freshRemote >= TOTAL_TICKS - 2, `${mode}:${p.playerId} fresh remote ${p.freshRemote}`);
                  }
                  assert(sharedGuards >= 40, `${mode}: only ${sharedGuards} shared guard samples`);
                  assert(activePeer.prePush, `${mode}: missing pre-push sample`);
                  const initial = activePeer.initial;
                  const pre = activePeer.prePush.state;
                  const final = activePeer.final.state;
                  const lead = pre.props.get('prop-9');
                  const actorPre = pre.players.get(activePeer.welcome.selfSessionId);
                  const metrics = {
                    runKey,
                    worldEpoch:activePeer.identity.worldEpoch,
                    simBuildId:activePeer.identity.simBuildId,
                    activeSlot:activePeer.welcome.slot,
                    protocolStartTick:activePeer.start.protocolStartTick,
                    pushStartTick,
                    prePushBoundary:activePeer.prePush.boundary,
                    finalBoundary:activePeer.final.boundary,
                    scheduledTicks,
                    sharedGuards,
                    approachInput,
                    prePushActorPosition:actorPre,
                    prePushActorToLeadCenterXZ:distanceXZ(actorPre,lead),
                    prePushFromB0:{ train:groupStats(pre.props,initial.props,TRAIN_IDS), breakwall:groupStats(pre.props,initial.props,WALL_IDS) },
                    finalFromB0:{ train:groupStats(final.props,initial.props,TRAIN_IDS), breakwall:groupStats(final.props,initial.props,WALL_IDS) },
                    finalFromPrePush:{ train:groupStats(final.props,pre.props,TRAIN_IDS), breakwall:groupStats(final.props,pre.props,WALL_IDS) },
                    peers:peers.map((p)=>({slot:p.welcome.slot,accepted:p.accepted,late:p.late,rejected:p.rejected,freshSelf:p.freshSelf,freshRemote:p.freshRemote,latestBoundary:p.latestBoundary})),
                  };
                  settled = true; cleanup(); resolve(metrics);
                } catch (error) { fail(error); }
              };

              timer = setTimeout(()=>fail(new Error(`${mode}: phenomenon timeout`)),TIMEOUT_MS);
              peers.forEach((peer,index)=>{
                peer.ws.addEventListener('error',()=>fail(new Error(`${mode}:${peer.playerId} websocket error`)));
                peer.ws.addEventListener('close',(event)=>{ if(!settled) fail(new Error(`${mode}:${peer.playerId} closed early ${event.code}:${event.reason}`)); });
                peer.ws.addEventListener('message',async(event)=>{
                  try {
                    const raw = typeof event.data === 'string' ? event.data : await event.data.text();
                    const message = JSON.parse(raw);
                    if (message.type === 'world_v0_error') throw new Error(`${mode}: server ${message.error}`);
                    if (message.type === 'world_v0_epoch_ended') throw new Error(`${mode}: epoch ended early ${message.reason}`);
                    if (message.type === 'world_v0_welcome') {
                      assert(message.revision === WORLD_V0_EXPECTED_SERVER_REVISION, `${mode}: server revision`);
                      assert(message.simBuildId === WORLD_V0_EXPECTED_SIM_BUILD_ID, `${mode}: SimBuild ${message.simBuildId}`);
                      assert(message.clientSimRevision === WORLD_V0_CLIENT_SIM_REVISION, `${mode}: client sim`);
                      peer.welcome=message; peer.identity=identityFrom(message); peer.latestBoundary=message.state?.boundaryTick ?? 0;
                      peer.ws.send(JSON.stringify({type:'world_v0_ready',...peer.identity}));
                      return;
                    }
                    if (!peer.identity) throw new Error(`${mode}: message before welcome`);
                    if (message.worldEpoch) assertIdentity(message,peer.identity,`${mode}:${message.type}`);
                    if (message.type === 'world_v0_start') {
                      assert(message.boundaryTick===0 && message.state?.boundaryTick===0, `${mode}: nonzero start`);
                      assertSnapshot(message.state,`${mode}:B0`);
                      peer.start=message; peer.latestBoundary=0; peer.initial=stateMaps(message.state);
                      if (peers.every((p)=>p.start)) {
                        activePeer=peers.find((p)=>p.welcome.slot===0);
                        assert(activePeer,`${mode}: slot0 missing`);
                        const actor0=activePeer.initial.players.get(activePeer.welcome.selfSessionId);
                        const dx=STAGING_TARGET[0]-actor0[0], dz=STAGING_TARGET[1]-actor0[2];
                        const length=Math.hypot(dx,dz);
                        approachInput={x:dx/length,z:dz/length};
                        pushStartTick=activePeer.start.protocolStartTick+PUSH_OFFSET;
                        measureEndTick=activePeer.start.protocolStartTick+TOTAL_TICKS;
                        feed();
                      }
                      return;
                    }
                    if (message.type === 'world_v0_snapshot') {
                      assertSnapshot(message,`${mode}:B${message.boundaryTick}`);
                      peer.latestBoundary=Math.max(peer.latestBoundary,message.boundaryTick ?? 0);
                      const guard=guards.get(message.boundaryTick) || new Map();
                      guard.set(index,message.stateGuard.packed); guards.set(message.boundaryTick,guard);
                      if (guard.size===2) {
                        assert(guard.get(0)===guard.get(1),`${mode}: guard disagreement B${message.boundaryTick}`);
                        sharedGuards += 1; guards.delete(message.boundaryTick);
                      }
                      if (peer===activePeer) {
                        const state=stateMaps(message);
                        if (message.boundaryTick<=pushStartTick && (!peer.prePush || message.boundaryTick>peer.prePush.boundary)) peer.prePush={boundary:message.boundaryTick,state};
                        if (message.boundaryTick>=measureEndTick && !peer.final) peer.final={boundary:message.boundaryTick,state};
                      }
                      feed(); maybeFinish(); return;
                    }
                    if (message.type === 'world_v0_batch_ack') {
                      peer.latestBoundary=Math.max(peer.latestBoundary,message.boundaryTick ?? 0);
                      for (const record of message.records || []) {
                        if (record.status==='accepted') peer.accepted += 1;
                        else if (record.status==='late') peer.late += 1;
                        else if (record.status!=='duplicate_same') peer.rejected += 1;
                      }
                      feed(); maybeFinish(); return;
                    }
                    if (message.type === 'world_v0_peer_records') { peer.latestBoundary=Math.max(peer.latestBoundary,message.relayBoundaryTick ?? 0); feed(); return; }
                    if (message.type === 'world_v0_consumed') {
                      peer.latestBoundary=Math.max(peer.latestBoundary,message.boundaryTick ?? 0);
                      const self=(message.players || []).find((p)=>p.sessionId===peer.welcome.selfSessionId);
                      const remote=(message.players || []).find((p)=>p.sessionId!==peer.welcome.selfSessionId);
                      if(self?.fresh) peer.freshSelf += 1;
                      if(remote?.fresh) peer.freshRemote += 1;
                      feed(); maybeFinish(); return;
                    }
                  } catch(error) { fail(error); }
                });
              });
            });
          }

          const evidence={
            verdict:'WORLD_V0_SHARED_CONSEQUENCE_MEASUREMENT_INCOMPLETE',
            generatedAt:new Date().toISOString(),
            provenance:{githubSha:process.env.GITHUB_SHA || null,githubRunId:process.env.GITHUB_RUN_ID || null,githubRunAttempt:process.env.GITHUB_RUN_ATTEMPT || null},
            phaseTicks:{...PHASE,total:TOTAL_TICKS,pushOffset:PUSH_OFFSET},
            stagingTarget:STAGING_TARGET,
            control:null,
            active:null,
            comparison:null,
            error:null,
          };
          try {
            evidence.control=await runScenario('control');
            await sleep(250);
            evidence.active=await runScenario('active');
            const controlWall=evidence.control.finalFromB0.breakwall.max;
            const activePostWall=evidence.active.finalFromPrePush.breakwall.max;
            const controlTrain=evidence.control.finalFromB0.train.max;
            const activePostTrain=evidence.active.finalFromPrePush.train.max;
            evidence.comparison={
              breakwallMaxDelta:activePostWall-controlWall,
              breakwallMaxRatio:activePostWall/Math.max(controlWall,1e-9),
              trainMaxDelta:activePostTrain-controlTrain,
              trainMaxRatio:activePostTrain/Math.max(controlTrain,1e-9),
              activePrePushBreakwallDrift:evidence.active.prePushFromB0.breakwall.max,
              activePrePushTrainDrift:evidence.active.prePushFromB0.train.max,
            };
            evidence.verdict='WORLD_V0_SHARED_CONSEQUENCE_MEASUREMENT_COMPLETE';
            writeFileSync(OUTPUT,JSON.stringify(evidence,null,2));
            console.log('SHARED_CONSEQUENCE_MEASUREMENT_COMPLETE',JSON.stringify({control:evidence.control.finalFromB0,activePost:evidence.active.finalFromPrePush,comparison:evidence.comparison,stagingDistance:evidence.active.prePushActorToLeadCenterXZ}));
          } catch(error) {
            evidence.error=error instanceof Error ? error.stack || error.message : String(error);
            writeFileSync(OUTPUT,JSON.stringify(evidence,null,2));
            throw error;
          }
          NODE
      - name: Stop phenomenon Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-phenomenon.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-phenomenon.pid)" 2>/dev/null || true; fi
      - name: Upload phenomenon measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-phenomenon-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-phenomenon.json
            world-v0-shared-consequence-phenomenon-wrangler.log
          if-no-files-found: warn
          retention-days: 14