name: World V0 Shared Consequence V1

on:
  push:
    branches: [world-v0-shared-consequence-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-shared-consequence-v1
  cancel-in-progress: true

env:
  BASELINE_SHA: 23e9254d082cd7a4707ece88655eb7ad0fede0e0
  EXPECTED_SIM_BUILD: shared-yard-v0-sim-3f61a8e5d03fe65d

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install qualified dependency graph
        run: npm ci
      - name: Prove bounded V1 delta from V0 specimen
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA" "$GITHUB_SHA" -- ':!/.github/workflows/world-v0-shared-consequence-v1.yml')
          printf 'candidate delta:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = "public/world-v0/build-contract.js"
          test "${changed[1]}" = "scripts/world-v0-shared-consequence-authority-adapter.mjs"
          test "${changed[2]}" = "scripts/world-v0-shared-consequence-browser-adapter.mjs"
          test "${changed[3]}" = "scripts/world-v0-shared-consequence-protocol-adapter.mjs"
          test "${changed[4]}" = "src/world-v0-contract.ts"
          git diff --quiet "$BASELINE_SHA" "$GITHUB_SHA" -- \
            src/world-v0-shared-yard.ts src/world-v0-protocol.ts src/world-slice-entry.ts \
            public/world-v0/app.js public/world-v0/friend-entry.js public/world-v0/friend-ready.js \
            public/world-v0/playable-control.js public/world-v0/solo-inspection-core.js public/world-v0/solo-inspection.js \
            scripts/world-v0-protocol-smoke.ts scripts/world-v0-authority-runtime-smoke.mjs \
            scripts/world-v0-playable-interaction-smoke.mjs \
            wrangler.jsonc package.json package-lock.json \
            .github/workflows/world-v0-shared-consequence-v0.yml
      - name: Derive and validate Shared Consequence V1 contract
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          const m = await import('./src/world-v0-contract.ts');
          const b = await import('./public/world-v0/build-contract.js');
          const layout = m.WORLD_V0_PROP_LAYOUT;
          const counts = layout.reduce((map, prop) => {
            map[prop.cluster] = (map[prop.cluster] || 0) + 1;
            return map;
          }, {});
          if (m.WORLD_V0_SCENE_REVISION !== 'shared-yard-v0-seed-c-shared-consequence-v1') throw new Error('scene revision drift');
          if (m.WORLD_V0_SIM_BUILD_ID !== process.env.EXPECTED_SIM_BUILD) throw new Error(`derived SimBuild drift ${m.WORLD_V0_SIM_BUILD_ID}`);
          if (b.WORLD_V0_EXPECTED_SIM_BUILD_ID !== m.WORLD_V0_SIM_BUILD_ID) throw new Error('browser/contract SimBuild drift');
          if (layout.length !== 18 || m.WORLD_V0_NET_ENTITY_ORDER.length !== 20) throw new Error('bounded entity count drift');
          if (new Set(layout.map((prop) => prop.id)).size !== layout.length) throw new Error('duplicate prop id');
          if (counts.barricade !== 6 || counts.tower !== 3 || counts['impact-train'] !== 1 || counts.breakwall !== 8) throw new Error(`cluster drift ${JSON.stringify(counts)}`);
          const train = layout.filter((p) => p.cluster === 'impact-train');
          const wall = layout.filter((p) => p.cluster === 'breakwall');
          if (train.length !== 1 || train[0].id !== 'prop-9') throw new Error('V1 mediator identity drift');
          const half = m.WORLD_V0_PROP_PHYSICS.halfExtents[0];
          const surfaceGap = wall[0].position[0] - half - (train[0].position[0] + half);
          if (Math.abs(surfaceGap - 0.04) > 1e-9) throw new Error(`mediator/wall gap ${surfaceGap}`);
          const wallColumns = [...new Set(wall.map((p) => p.position[2]))].sort((a,b) => a-b);
          const axis = train[0].position[2];
          if (!(wallColumns[1] < axis && axis < wallColumns[2])) throw new Error('mediator axis does not split middle wall columns');
          const minSeparation = 2 * half;
          for (let i = 0; i < layout.length; i++) for (let j = i + 1; j < layout.length; j++) {
            const a = layout[i].position, c = layout[j].position;
            const overlap = Math.abs(a[0]-c[0]) < minSeparation - 1e-9 && Math.abs(a[1]-c[1]) < minSeparation - 1e-9 && Math.abs(a[2]-c[2]) < minSeparation - 1e-9;
            if (overlap) throw new Error(`authored overlap ${layout[i].id}/${layout[j].id}`);
          }
          console.log('SHARED_CONSEQUENCE_V1_CONTRACT_PASS', JSON.stringify({ simBuildId:m.WORLD_V0_SIM_BUILD_ID, propCount:layout.length, entityCount:m.WORLD_V0_NET_ENTITY_ORDER.length, counts, surfaceGap, wallColumns, mediatorAxis:axis }));
          NODE
      - name: Preserve repository falsifiers with V1-scoped width adapters
        run: |
          set -euo pipefail
          node scripts/world-v0-friend-entry-core-smoke.mjs
          node scripts/world-v0-playable-control-smoke.mjs
          node scripts/world-v0-solo-inspection-core-smoke.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
          node --check scripts/world-v0-shared-consequence-protocol-adapter.mjs
          node --check scripts/world-v0-shared-consequence-authority-adapter.mjs
          node --check scripts/world-v0-shared-consequence-browser-adapter.mjs
          node scripts/world-v0-shared-consequence-protocol-adapter.mjs
          node --experimental-strip-types scripts/.world-v0-shared-consequence-protocol-smoke.ts
          MW_WORLD_V0_SHARED_CONSEQUENCE_APP_OUTPUT=scripts/.world-v0-shared-consequence-app.js node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check scripts/.world-v0-shared-consequence-app.js
          npm run validate:staging-contract
          npm run test:staging-deploy-guard
          npm run test:f5-protocol
          npm run test:world-v0-browser
          npm run check:client
          npm run check:a2r
          npm run typecheck
          npm run validate:worker
      - name: Start core Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-v1-core-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-v1-core.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          cat world-v0-shared-consequence-v1-core-wrangler.log
          exit 1
      - name: Preserve authority and changed SimBuild identity
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-shared-consequence-v1-authority.json
        run: |
          set -euo pipefail
          node scripts/world-v0-shared-consequence-authority-adapter.mjs
          node --check scripts/.world-v0-shared-consequence-authority-runtime-smoke.mjs
          node scripts/.world-v0-shared-consequence-authority-runtime-smoke.mjs
      - name: Stop core Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-v1-core.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-v1-core.pid)" 2>/dev/null || true; fi
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-v1-core-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-v1-authority.json
            world-v0-shared-consequence-v1-core-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  presentation:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to V1 width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Start presentation Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-v1-presentation-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-v1-presentation.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-v1-presentation-wrangler.log; exit 1
      - name: Preserve host-to-friend entry
        env:
          MW_WORLD_V0_FRIEND_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_FRIEND_ENTRY_OUTPUT: world-v0-shared-consequence-v1-entry.json
        run: node scripts/world-v0-friend-entry-browser-smoke.mjs
      - name: Preserve mobile-hardened controls
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-shared-consequence-v1-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs
      - name: Preserve manual fresh-epoch lifecycle
        env:
          MW_WORLD_V0_SESSION_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-shared-consequence-v1-session.json
        run: node scripts/world-v0-session-friction-smoke.mjs
      - name: Preserve desktop and portrait shell
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-shared-consequence-v1-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs
      - name: Stop presentation Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-v1-presentation.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-v1-presentation.pid)" 2>/dev/null || true; fi
      - name: Upload presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-v1-presentation-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-v1-entry.json
            world-v0-shared-consequence-v1-interaction.json
            world-v0-shared-consequence-v1-session.json
            world-v0-shared-consequence-v1-shell.json
            world-v0-runtime-shell-*.png
            world-v0-shared-consequence-v1-presentation-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  solo:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to V1 width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Start solo Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-v1-solo-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-v1-solo.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-v1-solo-wrangler.log; exit 1
      - name: Preserve real-authority Inspect solo
        env:
          MW_WORLD_V0_SOLO_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SOLO_OUTPUT: world-v0-shared-consequence-v1-solo.json
        run: node scripts/world-v0-solo-inspection-browser-smoke.mjs
      - name: Stop solo Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-v1-solo.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-v1-solo.pid)" 2>/dev/null || true; fi
      - name: Upload solo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-v1-solo-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-v1-solo.json
            world-v0-shared-consequence-v1-solo-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  exact-state:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Adapt browser contract to V1 width
        run: |
          node scripts/world-v0-shared-consequence-browser-adapter.mjs
          node --check public/world-v0/app.js
      - name: Verify exact-state apparatus
        run: |
          node --check scripts/world-v0-chromium-cloud-smoke.mjs
          node --check scripts/world-v0-exact-failure-classifier.mjs
          node scripts/world-v0-exact-failure-classifier-smoke.mjs
      - name: Start exact Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-shared-consequence-v1-exact-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-shared-consequence-v1-exact.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi; sleep 1; done
          cat world-v0-shared-consequence-v1-exact-wrangler.log; exit 1
      - name: Prepare local exact-state target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let chromium = readFileSync('scripts/world-v0-chromium-cloud-smoke.mjs', 'utf8');
          const remote = 'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";';
          const local = 'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";';
          if (!chromium.includes(remote)) throw new Error('Shared Consequence V1 exact-state local-target anchor drift');
          writeFileSync('scripts/.world-v0-shared-consequence-v1-exact.mjs', chromium.replace(remote, local));
          NODE
      - name: Preserve exact-state causal envelope
        id: exact
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-shared-consequence-v1-exact.json
        run: node scripts/.world-v0-shared-consequence-v1-exact.mjs
      - name: Classify exact failure
        if: steps.exact.outcome == 'failure'
        run: node scripts/world-v0-exact-failure-classifier.mjs world-v0-shared-consequence-v1-exact.json
      - name: Require exact-state qualification
        env:
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: test "$EXACT_OUTCOME" = success
      - name: Stop exact Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-shared-consequence-v1-exact.pid ]; then kill "$(cat /tmp/world-v0-shared-consequence-v1-exact.pid)" 2>/dev/null || true; fi
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-shared-consequence-v1-exact-attempt-${{ github.run_attempt }}
          path: |
            world-v0-shared-consequence-v1-exact.json
            world-v0-shared-consequence-v1-exact-wrangler.log
          if-no-files-found: warn
          retention-days: 14
