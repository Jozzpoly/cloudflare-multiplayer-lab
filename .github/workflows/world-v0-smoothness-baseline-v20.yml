name: World V0 smoothness V20 canonical baseline check

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-baseline-v20.yml
      - scripts/world-v0-session-continuity-r3-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Prove unmodified canonical repository check
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-v20-canonical-check.log
          grep -q 'WORLD_V0_SESSION_CONTINUITY_R3_SMOKE_PASS' world-v0-v20-canonical-check.log
          grep -q 'WORLD_V0_AUTHORITY_EPOCH_LOSS_CLASSIFIER_PASS' world-v0-v20-canonical-check.log
          grep -q 'WORLD_V0_JOIN_FAILURE_CLARITY_SMOKE_PASS' world-v0-v20-canonical-check.log
      - name: Prove source untouched
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-v20-canonical-baseline-${{ github.run_id }}
          if-no-files-found: ignore
          path: world-v0-v20-canonical-check.log
