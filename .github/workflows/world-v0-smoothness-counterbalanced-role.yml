name: World V0 smoothness counterbalanced correction role diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-counterbalanced-role.yml
      - scripts/world-v0-smoothness-counterbalanced-role-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterbalanced-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start unchanged local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-role-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-role-wrangler.log
          exit 1
      - name: Measure correction asymmetry under swapped join roles
        shell: bash
        env:
          MW_WORLD_V0_ROLE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ROLE_LATENCY_MS: 90
          MW_WORLD_V0_ROLE_STRESS_MS: 4000
          MW_WORLD_V0_ROLE_OUTPUT: world-v0-smoothness-counterbalanced-role.json
        run: |
          set -euo pipefail
          timeout 180s node scripts/world-v0-smoothness-counterbalanced-role-probe.mjs | tee world-v0-smoothness-counterbalanced-role.log
          grep -q 'COUNTERBALANCED_CORRECTION_ASYMMETRY_MEASURED' world-v0-smoothness-counterbalanced-role.log
      - name: Prove diagnostic did not modify runtime
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-counterbalanced-role-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-smoothness-counterbalanced-role.json
            world-v0-smoothness-counterbalanced-role.log
            world-v0-role-wrangler.log
