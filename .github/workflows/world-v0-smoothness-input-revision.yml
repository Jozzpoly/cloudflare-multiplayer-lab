name: World V0 smoothness input revision diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-input-revision.yml
      - scripts/world-v0-smoothness-input-revision-probe.mjs
      - public/world-v0/playable-control.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-revision-causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove camera-relative future revision pressure
        env:
          MW_WORLD_V0_REVISION_OUTPUT: world-v0-smoothness-input-revision.json
        run: node scripts/world-v0-smoothness-input-revision-probe.mjs | tee world-v0-smoothness-input-revision.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-input-revision-${{ github.run_id }}
          path: |
            world-v0-smoothness-input-revision.json
            world-v0-smoothness-input-revision.log
