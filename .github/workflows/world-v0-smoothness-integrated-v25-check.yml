name: World V0 smoothness integrated V25 check

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-integrated-v25-check.yml
      - scripts/world-v0-smoothness-materialize-integrated-v25.mjs
      - scripts/world-v0-smoothness-materialize-substrate-v20.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize clean integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-materialize-integrated-v25.mjs
          node --check public/world-v0/app.js
          grep -q 'WORLD_V0_INTEGRATED_SMOOTHNESS_V25' public/world-v0/app.js
          if grep -q '__mwV' public/world-v0/app.js; then echo 'experimental hook leaked into V25' >&2; exit 1; fi
      - name: Run full repository check
        run: npm run check
      - name: Restore canonical runtime
        if: always()
        run: git checkout -- public/world-v0/app.js
      - name: Prove tracked source clean
        if: always()
        run: git diff --exit-code
