name: World V0 smoothness jump causal dedupe V28 GREEN

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-causal-dedupe-v28-green.yml
      - scripts/world-v0-jump-causal-dedupe-v28-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install V27 provenance substrate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v28-v27-install.log
          grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' v28-v27-install.log

      - name: Install V28 authority causal dedupe
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs | tee v28-install.log
          grep -q 'WORLD_V0_JUMP_CAUSAL_DEDUPE_V28_INSTALLED' v28-install.log

      - name: Build candidate
        run: npm run build

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > v28-green-wrangler.log 2>&1 &
          echo $! > v28-green-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-green-wrangler.log
          exit 1

      - name: Verify V28 causal event contract
        shell: bash
        run: |
          set -euo pipefail
          MW_WORLD_V0_V28_OUTPUT=v28-green.json \
            timeout 120s node scripts/world-v0-jump-causal-dedupe-v28-audit.mjs | tee v28-green.log
          grep -q 'WORLD_V0_JUMP_CAUSAL_DEDUPE_V28_PASS' v28-green.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('v28-green.json','utf8'));
          if (r.verdict !== 'WORLD_V0_JUMP_CAUSAL_DEDUPE_V28_PASS') throw new Error(`bad verdict ${r.verdict}`);
          if (r.first?.jumpApplied !== true || r.first?.jumpSequence !== 1) throw new Error(`first event invalid ${JSON.stringify(r.first)}`);
          if (r.replaySameSequence?.jumpApplied !== false || r.replaySameSequence?.jumpSequence !== 1) throw new Error(`duplicate not suppressed ${JSON.stringify(r.replaySameSequence)}`);
          if (r.freshNextSequence?.jumpApplied !== true || r.freshNextSequence?.jumpSequence !== 2) throw new Error(`fresh next event suppressed ${JSON.stringify(r.freshNextSequence)}`);
          console.log('V28_GREEN_QUALIFIED', JSON.stringify({
            first:r.first,
            replay:r.replaySameSequence,
            fresh:r.freshNextSequence,
            landedBoundaryTick:r.landedBoundaryTick,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f v28-green-wrangler.pid ]; then
            pid=$(cat v28-green-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-green-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-green.json
            v28-green.log
            v28-green-wrangler.log
            v28-v27-install.log
            v28-install.log
