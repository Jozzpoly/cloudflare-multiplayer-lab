name: World V0 smoothness jump causal replay

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-causal-replay.yml
      - scripts/world-v0-jump-causal-replay-authority-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-replay:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, v27]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install V27 explicit provenance when selected
        if: matrix.variant == 'v27'
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee causal-v27-install.log
          grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' causal-v27-install.log

      - name: Record baseline selection
        if: matrix.variant == 'baseline'
        run: echo 'BASELINE_V25_PRODUCT_UNMODIFIED' | tee causal-v27-install.log

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > causal-${{ matrix.variant }}-wrangler.log 2>&1 &
          echo $! > causal-${{ matrix.variant }}-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat causal-${{ matrix.variant }}-wrangler.log
          exit 1

      - name: Run deterministic same-press replay probe
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.variant }}' = 'v27' ]; then
            export MW_WORLD_V0_CAUSAL_EXPECT_PROVENANCE=1
            expected='WORLD_V0_SAME_CAUSAL_SEQUENCE_DOUBLE_APPLY_REPRODUCED'
          else
            export MW_WORLD_V0_CAUSAL_EXPECT_PROVENANCE=0
            expected='WORLD_V0_BOOLEAN_EDGE_DOUBLE_APPLY_REPRODUCED'
          fi
          export MW_WORLD_V0_CAUSAL_REPLAY_OUTPUT=causal-${{ matrix.variant }}.json
          timeout 120s node scripts/world-v0-jump-causal-replay-authority-audit.mjs | tee causal-${{ matrix.variant }}.log
          grep -q "$expected" causal-${{ matrix.variant }}.log
          node - <<'NODE'
          const fs = require('fs');
          const variant = '${{ matrix.variant }}';
          const r = JSON.parse(fs.readFileSync(`causal-${variant}.json`, 'utf8'));
          if (r.firstTrue?.jumpApplied !== true) throw new Error('first grounded impulse missing');
          if (r.firstFalse?.jump !== false) throw new Error('intervening canonical false missing');
          if (r.replayTrue?.jumpApplied !== true) throw new Error('replayed delayed landing impulse missing');
          if (!(r.airbornePeakY > r.baselineY + 0.3)) throw new Error('physical airborne phase not proven');
          if (variant === 'v27') {
            if (r.firstTrue?.jumpSequence !== 1 || r.replayTrue?.jumpSequence !== 1) {
              throw new Error(`same causal identity not preserved ${JSON.stringify({first:r.firstTrue,replay:r.replayTrue})}`);
            }
          } else if (r.firstTrue?.jumpSequence !== null || r.replayTrue?.jumpSequence !== null) {
            throw new Error('baseline unexpectedly preserved provenance');
          }
          console.log('CAUSAL_REPLAY_QUALIFIED', JSON.stringify({
            variant,
            verdict:r.verdict,
            first:r.firstTrue,
            landed:r.landed,
            replay:r.replayTrue,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f causal-${{ matrix.variant }}-wrangler.pid ]; then
            pid=$(cat causal-${{ matrix.variant }}-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-causal-replay-${{ matrix.variant }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            causal-${{ matrix.variant }}.json
            causal-${{ matrix.variant }}.log
            causal-${{ matrix.variant }}-wrangler.log
            causal-v27-install.log
