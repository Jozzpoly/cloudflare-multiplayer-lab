name: World V0 smoothness V26 rapid re-press qualification

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-drain-v26-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapid-ab:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, v26]
        rep: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Prepare isolated runtime and wire witness
        shell: bash
        run: |
          set -euo pipefail
          cp public/world-v0/app.js /tmp/world-v0-app.js
          cp scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs /tmp/rapid-probe.mjs
          if [ "${{ matrix.mode }}" = "v26" ]; then
            node scripts/world-v0-smoothness-install-jump-drain-v26.mjs
          fi
          node scripts/world-v0-smoothness-install-rapid-wiretrace.mjs
      - name: Start local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}-wrangler.log
          exit 1
      - name: Run identical rapid re-press stress
        env:
          MW_WORLD_V0_RAPID_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RAPID_MODE: ${{ matrix.mode }}
          MW_WORLD_V0_RAPID_OUTPUT: world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}.json
          MW_WORLD_V0_RAPID_DELAY_MS: 90
          MW_WORLD_V0_RAPID_STRESS_MS: 4000
        shell: bash
        run: |
          set -o pipefail
          timeout 180s node scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs 2>&1 | tee world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}.log
          test ${PIPESTATUS[0]} -eq 0
          node - <<'NODE'
          const fs = require('fs');
          const file = fs.readdirSync('.').find((name) => name.startsWith('world-v0-v26q-') && name.endsWith('.json'));
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!p.wireDiagnostics || p.wireDiagnostics.invalidCount !== 0) throw new Error(`wire witness failed: ${JSON.stringify(p.wireDiagnostics)}`);
          console.log('QUALIFICATION_SUMMARY', JSON.stringify({
            verdict:p.verdict, presses:p.presses, deliveries:p.deliveries,
            unsafeOverlapCount:p.unsafeOverlapCount, falseBeforeAuthorshipCount:p.falseBeforeAuthorshipCount,
            correctionDelta:p.correctionDelta, serverLateDelta:p.serverLateDelta,
            supersededDelta:p.supersededDelta, appliedDelta:p.appliedDelta,
            maxCorrection:p.maxCorrection, maxRewind:p.maxRewind,
            wire:p.wireDiagnostics
          }));
          NODE
      - name: Restore canonical files and prove isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/world-v0-app.js public/world-v0/app.js
          cp /tmp/rapid-probe.mjs scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
          git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-v26q-${{ matrix.mode }}-r${{ matrix.rep }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}.json
            world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}.log
            world-v0-v26q-${{ matrix.mode }}-r${{ matrix.rep }}-wrangler.log
