name: World V0 smoothness V26 jump drain qualification

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-drain-v26.yml
      - scripts/world-v0-smoothness-install-jump-drain-v26.mjs
      - scripts/world-v0-jump-delivery-persistence-audit.mjs
      - public/world-v0/app.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jump-drain-v26:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install V26 test-only jump drain semantics
        shell: bash
        run: |
          set -euo pipefail
          cp public/world-v0/app.js /tmp/world-v0-app.js
          node scripts/world-v0-smoothness-install-jump-drain-v26.mjs | tee world-v0-jump-drain-install.log
          grep -q 'WORLD_V0_JUMP_REARM_DRAIN_V26_INSTALLED' world-v0-jump-drain-install.log
          grep -q 'WORLD_V0_JUMP_REARM_DRAIN_V26' public/world-v0/app.js
      - name: Start transformed local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-jump-drain-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-jump-drain-wrangler.log
          exit 1
      - name: Re-run canonical jump persistence and airborne semantics
        env:
          MW_WORLD_V0_JUMP_DELIVERY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_JUMP_DELIVERY_OUTPUT: world-v0-jump-drain-v26-persistence.json
          MW_WORLD_V0_JUMP_DELIVERY_LOSS_DELAY_MS: 180
          MW_WORLD_V0_JUMP_DELIVERY_RECOVERY_DELAY_MS: 45
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node scripts/world-v0-jump-delivery-persistence-audit.mjs | tee world-v0-jump-drain-v26-persistence.log
          grep -q 'WORLD_V0_JUMP_DELIVERY_PERSISTENCE_PASS' world-v0-jump-drain-v26-persistence.log
      - name: Restore canonical runtime and prove experiment isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/world-v0-app.js public/world-v0/app.js
          git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-jump-drain-v26-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-jump-drain-install.log
            world-v0-jump-drain-v26-persistence.json
            world-v0-jump-drain-v26-persistence.log
            world-v0-jump-drain-wrangler.log
