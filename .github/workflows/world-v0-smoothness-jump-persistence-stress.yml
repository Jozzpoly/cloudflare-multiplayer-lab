name: World V0 smoothness jump persistence stress

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-persistence-stress.yml
      - scripts/world-v0-jump-delivery-persistence-stress.mjs
      - scripts/world-v0-jump-delivery-persistence-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-stress:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, v27]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install V27 explicit provenance when selected
        if: matrix.variant == 'v27'
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v27-install.log
          grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' v27-install.log

      - name: Record baseline product selection
        if: matrix.variant == 'baseline'
        run: echo 'BASELINE_V25_PRODUCT_UNMODIFIED' | tee v27-install.log

      - name: Install qualified strict FIFO transport into persistence audit
        run: |
          set -euo pipefail
          MW_WORLD_V0_STRICT_FIFO_TARGET=world-v0-jump-delivery-persistence-audit.mjs \
            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs | tee fifo-install.log
          grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' fifo-install.log
          grep -q 'transportRevision: "strict-fifo-single-drain-v1"' scripts/world-v0-jump-delivery-persistence-audit.mjs

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > persistence-stress-${{ matrix.variant }}-wrangler.log 2>&1 &
          echo $! > persistence-stress-${{ matrix.variant }}-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat persistence-stress-${{ matrix.variant }}-wrangler.log
          exit 1

      - name: Run repeated persistence airborne campaign
        shell: bash
        run: |
          set -euo pipefail
          MW_WORLD_V0_PERSISTENCE_STRESS_VARIANT=${{ matrix.variant }} \
          MW_WORLD_V0_PERSISTENCE_STRESS_ITERATIONS=12 \
          MW_WORLD_V0_PERSISTENCE_STRESS_OUTPUT=persistence-stress-${{ matrix.variant }}.json \
            timeout 600s node scripts/world-v0-jump-delivery-persistence-stress.mjs | tee persistence-stress-${{ matrix.variant }}.log
          node - <<'NODE'
          const fs = require('fs');
          const variant = '${{ matrix.variant }}';
          const r = JSON.parse(fs.readFileSync(`persistence-stress-${variant}.json`, 'utf8'));
          if (r.iterations !== 12) throw new Error(`incomplete campaign ${r.iterations}`);
          if (r.infrastructureFailures !== 0) throw new Error(`infrastructure failures ${r.infrastructureFailures}`);
          console.log('PERSISTENCE_STRESS_CAMPAIGN_COMPLETED', JSON.stringify({
            variant,
            passes:r.passes,
            semanticDelayedLandingFailures:r.semanticDelayedLandingFailures,
            verdict:r.campaignVerdict,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f persistence-stress-${{ matrix.variant }}-wrangler.pid ]; then
            pid=$(cat persistence-stress-${{ matrix.variant }}-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product and apparatus targets
        if: always()
        shell: bash
        run: |
          git checkout -- \
            public/world-v0/app.js \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts \
            scripts/world-v0-jump-delivery-persistence-audit.mjs
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-persistence-stress-${{ matrix.variant }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            persistence-stress-${{ matrix.variant }}.json
            persistence-stress-${{ matrix.variant }}.log
            persistence-stress-${{ matrix.variant }}-*.json
            persistence-stress-${{ matrix.variant }}-*.log
            persistence-stress-${{ matrix.variant }}-wrangler.log
            v27-install.log
            fifo-install.log
