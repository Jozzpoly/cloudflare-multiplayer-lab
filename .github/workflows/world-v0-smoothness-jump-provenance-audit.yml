name: World V0 smoothness explicit jump provenance audit

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-provenance-audit.yml
      - scripts/world-v0-smoothness-jump-provenance-audit.mjs
      - src/world-v0-protocol.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jump-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove explicit provenance resolves both stale-true shapes without drain
        env:
          MW_WORLD_V0_JUMP_PROVENANCE_OUTPUT: world-v0-smoothness-jump-provenance.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-jump-provenance-audit.mjs | tee world-v0-smoothness-jump-provenance.log
          grep -q 'EXPLICIT_JUMP_PROVENANCE_RESOLVES_STALE_TRUE_ASSOCIATION_WITHOUT_DRAIN_BARRIER' world-v0-smoothness-jump-provenance.log
      - name: Prove audit is read-only
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-jump-provenance-${{ github.run_id }}
          path: |
            world-v0-smoothness-jump-provenance.json
            world-v0-smoothness-jump-provenance.log
