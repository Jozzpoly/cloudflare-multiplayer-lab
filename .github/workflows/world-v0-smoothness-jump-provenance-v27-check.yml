name: World V0 smoothness V27 jump provenance structural check

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-provenance-v27-check.yml
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - src/world-v0-protocol.ts
      - public/world-v0/app.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v27-structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install test-only V27 provenance path
        run: node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - name: Verify markers and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'world-v0-jump-explicit-provenance-v27' public/world-v0/app.js
          grep -q 'jumpSequence?: number' src/world-v0-protocol.ts
          node --check public/world-v0/app.js
      - name: Full repository check under V27
        run: npm run check
      - name: Restore canonical runtime/protocol
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts
          git diff --exit-code
