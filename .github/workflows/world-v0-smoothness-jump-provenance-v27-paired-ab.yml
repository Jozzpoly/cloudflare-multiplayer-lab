name: World V0 smoothness jump provenance V27 paired A-B

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-provenance-v27-paired-ab.yml
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27-rapid-witness.mjs
      - scripts/world-v0-smoothness-install-invalid-message-witness.mjs
      - scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs
      - scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-rapid-provenance:
    strategy:
      fail-fast: false
      matrix:
        specimen: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare same-runner isolated worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../mw-v27-paired-baseline HEAD
          git worktree add --detach ../mw-v27-paired-v27 HEAD
          (cd ../mw-v27-paired-baseline && npm ci)
          (cd ../mw-v27-paired-v27 && npm ci)
          mkdir -p paired-evidence

      - name: Run baseline then V27 on the same runner
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"
          EVIDENCE="$ROOT/paired-evidence"

          stop_runtime() {
            local pid="${1:-}"
            if [ -n "$pid" ]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              sleep 0.5
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }

          run_variant() {
            local mode="$1"
            local dir="$2"
            local port="$3"
            local prefix="v27-paired-${{ matrix.specimen }}-${mode}"
            local runtime_pid=""

            cd "$dir"
            if [ "$mode" = "v27" ]; then
              node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs \
                2>&1 | tee "$EVIDENCE/${prefix}-install.log"
              test ${PIPESTATUS[0]} -eq 0 || return 90
              grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' "$EVIDENCE/${prefix}-install.log" || return 91
            fi

            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-strict-fifo.log"
            test ${PIPESTATUS[0]} -eq 0 || return 92
            grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' "$EVIDENCE/${prefix}-strict-fifo.log" || return 93

            node scripts/world-v0-smoothness-install-jump-provenance-v27-rapid-witness.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-rapid-witness.log"
            test ${PIPESTATUS[0]} -eq 0 || return 94
            grep -q 'WORLD_V0_JUMP_PROVENANCE_V27_RAPID_WITNESS_INSTALLED' "$EVIDENCE/${prefix}-rapid-witness.log" || return 95

            node scripts/world-v0-smoothness-install-invalid-message-witness.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-server-witness.log"
            test ${PIPESTATUS[0]} -eq 0 || return 96
            grep -q 'WORLD_V0_INVALID_MESSAGE_WITNESS_INSTALLED' "$EVIDENCE/${prefix}-server-witness.log" || return 97

            setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port "$port" \
              > "$EVIDENCE/${prefix}-wrangler.log" 2>&1 &
            runtime_pid=$!

            local live=0
            for i in {1..100}; do
              if curl -fsS "http://127.0.0.1:${port}/api/ping" >/dev/null; then
                live=1
                break
              fi
              sleep 0.25
            done
            if [ "$live" -ne 1 ]; then
              stop_runtime "$runtime_pid"
              echo "runtime did not become ready" >> "$EVIDENCE/${prefix}-runner.log"
              return 98
            fi

            set +e
            MW_WORLD_V0_RAPID_BASE="http://127.0.0.1:${port}" \
            MW_WORLD_V0_RAPID_MODE="$mode" \
            MW_WORLD_V0_RAPID_OUTPUT="$EVIDENCE/${prefix}.json" \
            MW_WORLD_V0_RAPID_DELAY_MS=90 \
            MW_WORLD_V0_RAPID_STRESS_MS=4000 \
              timeout 180s node scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}.log"
            local probe_status=${PIPESTATUS[0]}
            set -e

            stop_runtime "$runtime_pid"
            runtime_pid=""

            printf '%s\n' "$probe_status" > "$EVIDENCE/${prefix}.status"
            grep 'WORLD_V0_INVALID_MESSAGE_WITNESS' "$EVIDENCE/${prefix}-wrangler.log" \
              > "$EVIDENCE/${prefix}-invalid-message-witness.log" || true

            git checkout -- \
              public/world-v0/app.js \
              src/world-v0-protocol.ts \
              src/world-v0-shared-yard.ts \
              scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
            git diff --exit-code > "$EVIDENCE/${prefix}-restore-diff.log" 2>&1 || return 99
            return 0
          }

          set +e
          run_variant baseline "$ROOT/../mw-v27-paired-baseline" 8787
          baseline_runner_status=$?
          run_variant v27 "$ROOT/../mw-v27-paired-v27" 8788
          v27_runner_status=$?
          set -e

          printf '%s\n' "$baseline_runner_status" > "$EVIDENCE/v27-paired-${{ matrix.specimen }}-baseline.runner-status"
          printf '%s\n' "$v27_runner_status" > "$EVIDENCE/v27-paired-${{ matrix.specimen }}-v27.runner-status"
          exit 0

      - name: Evaluate paired specimen without inventing a throughput threshold
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const specimen = '${{ matrix.specimen }}';
          const dir = 'paired-evidence';
          const prefix = (mode) => `${dir}/v27-paired-${specimen}-${mode}`;
          const readInt = (path) => fs.existsSync(path) ? Number(fs.readFileSync(path, 'utf8').trim()) : 999;
          const readJson = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          const readText = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';

          const baselineRunner = readInt(`${prefix('baseline')}.runner-status`);
          const v27Runner = readInt(`${prefix('v27')}.runner-status`);
          const baselineProbe = readInt(`${prefix('baseline')}.status`);
          const v27Probe = readInt(`${prefix('v27')}.status`);
          const baseline = readJson(`${prefix('baseline')}.json`);
          const v27 = readJson(`${prefix('v27')}.json`);

          const serverWitness = {
            baseline: readText(`${prefix('baseline')}-invalid-message-witness.log`).trim().split('\n').filter(Boolean).slice(-4),
            v27: readText(`${prefix('v27')}-invalid-message-witness.log`).trim().split('\n').filter(Boolean).slice(-4),
          };

          if (baselineRunner !== 0 || v27Runner !== 0 || baselineProbe !== 0 || v27Probe !== 0 || !baseline || !v27) {
            console.error('V27_PAIRED_NOT_COMPARABLE', JSON.stringify({
              specimen, baselineRunner, v27Runner, baselineProbe, v27Probe,
              baselineVerdict: baseline?.verdict ?? null,
              v27Verdict: v27?.verdict ?? null,
              baselineWire: baseline?.wireDiagnostics ?? null,
              v27Wire: v27?.wireDiagnostics ?? null,
              serverWitness,
            }));
            process.exit(1);
          }

          if (baseline.proxy?.transportRevision !== 'strict-fifo-single-drain-v1' ||
              v27.proxy?.transportRevision !== 'strict-fifo-single-drain-v1') {
            console.error('V27_PAIRED_TRANSPORT_NOT_QUALIFIED', JSON.stringify({ specimen, baselineProxy: baseline.proxy, v27Proxy: v27.proxy }));
            process.exit(1);
          }

          const baselineAmbiguity = (baseline.falseBeforeAuthorshipCount || 0) + (baseline.outsideAuthoredRangeCount || 0);
          if (baselineAmbiguity <= 0) {
            console.error('V27_PAIRED_BASELINE_DID_NOT_REPRODUCE_AMBIGUITY', JSON.stringify({ specimen, baseline }));
            process.exit(1);
          }
          if ((v27.falseBeforeAuthorshipCount || 0) !== 0 || (v27.outsideAuthoredRangeCount || 0) !== 0 ||
              (v27.canonicalProvenanceMismatchCount || 0) !== 0 || (v27.provenancePressureCount || 0) <= 0) {
            console.error('V27_PAIRED_CAUSAL_SEMANTICS_FAILED', JSON.stringify({ specimen, v27 }));
            process.exit(1);
          }

          const safeRatio = (a, b) => Number.isFinite(a) && Number.isFinite(b) && b > 0 ? a / b : null;
          const result = {
            specimen,
            status: 'V27_PAIRED_MEASUREMENT_VALID_NOT_PROMOTED',
            baseline: {
              presses: baseline.presses,
              deliveries: baseline.deliveries,
              falseBeforeAuthorship: baseline.falseBeforeAuthorshipCount,
              outsideAuthoredRange: baseline.outsideAuthoredRangeCount,
              corrections: baseline.correctionDelta,
              serverLate: baseline.serverLateDelta,
              maxSelfCorrection: baseline.correctionMaxSelf,
              maxRewind: baseline.maxRewind,
              rewindP95: baseline.rewindP95,
              deliveryP50Ms: baseline.deliveryLatencyP50Ms,
              deliveryP95Ms: baseline.deliveryLatencyP95Ms,
              secondPressDeliveryMs: baseline.secondPressDeliveryMs,
              selfJumpFlips: baseline.selfJumpFlips,
              proxy: baseline.proxy,
            },
            v27: {
              presses: v27.presses,
              deliveries: v27.deliveries,
              falseBeforeAuthorship: v27.falseBeforeAuthorshipCount,
              outsideAuthoredRange: v27.outsideAuthoredRangeCount,
              staleProvenanceRejections: v27.staleProvenanceRejections,
              provenanceOnlySupersessions: v27.provenanceOnlySupersessions,
              provenancePressure: v27.provenancePressureCount,
              corrections: v27.correctionDelta,
              serverLate: v27.serverLateDelta,
              maxSelfCorrection: v27.correctionMaxSelf,
              maxRewind: v27.maxRewind,
              rewindP95: v27.rewindP95,
              deliveryP50Ms: v27.deliveryLatencyP50Ms,
              deliveryP95Ms: v27.deliveryLatencyP95Ms,
              secondPressDeliveryMs: v27.secondPressDeliveryMs,
              selfJumpFlips: v27.selfJumpFlips,
              proxy: v27.proxy,
            },
            ratios: {
              presses: safeRatio(v27.presses, baseline.presses),
              deliveries: safeRatio(v27.deliveries, baseline.deliveries),
              correctionsPerPress: safeRatio(
                safeRatio(v27.correctionDelta, v27.presses),
                safeRatio(baseline.correctionDelta, baseline.presses),
              ),
              serverLatePerPress: safeRatio(
                safeRatio(v27.serverLateDelta, v27.presses),
                safeRatio(baseline.serverLateDelta, baseline.presses),
              ),
            },
          };
          console.log('V27_PAIRED_MEASUREMENT', JSON.stringify(result));
          NODE

      - name: Prove root checkout stayed canonical
        if: always()
        shell: bash
        run: git diff --exit-code

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-jump-v27-paired-${{ matrix.specimen }}-${{ github.run_id }}
          if-no-files-found: error
          path: paired-evidence/

      - name: Remove temporary worktrees
        if: always()
        shell: bash
        run: |
          git worktree remove --force ../mw-v27-paired-baseline || true
          git worktree remove --force ../mw-v27-paired-v27 || true
          git worktree prune
