name: World V0 smoothness rapid re-press wire trace

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-rapid-wiretrace.yml
      - scripts/world-v0-smoothness-install-rapid-wiretrace.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapid-wiretrace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install test-only wire witness into rapid probe
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs /tmp/rapid-probe.mjs
          node scripts/world-v0-smoothness-install-rapid-wiretrace.mjs | tee world-v0-rapid-wiretrace-install.log
          grep -q 'WORLD_V0_RAPID_WIRETRACE_INSTALLED' world-v0-rapid-wiretrace-install.log
      - name: Start local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-rapid-wiretrace-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-rapid-wiretrace-wrangler.log
          exit 1
      - name: Reproduce baseline rapid stress and validate every outgoing frame locally
        env:
          MW_WORLD_V0_RAPID_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RAPID_MODE: baseline
          MW_WORLD_V0_RAPID_OUTPUT: world-v0-rapid-wiretrace.json
          MW_WORLD_V0_RAPID_DELAY_MS: 90
          MW_WORLD_V0_RAPID_STRESS_MS: 4000
        shell: bash
        run: |
          set +e
          timeout 180s node scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs 2>&1 | tee world-v0-rapid-wiretrace.log
          probe_status=${PIPESTATUS[0]}
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('world-v0-rapid-wiretrace.json', 'utf8'));
          console.log('WIRETRACE_SUMMARY', JSON.stringify(p.wireDiagnostics || null));
          if (!p.wireDiagnostics) process.exit(2);
          NODE
          echo "PROBE_EXIT=$probe_status"
      - name: Restore probe and prove repository isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rapid-probe.mjs scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
          git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-jump-rapid-wiretrace-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-rapid-wiretrace.json
            world-v0-rapid-wiretrace.log
            world-v0-rapid-wiretrace-install.log
            world-v0-rapid-wiretrace-wrangler.log
