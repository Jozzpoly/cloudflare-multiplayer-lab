name: World V0 smoothness jump resume highwater V28 RED

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-resume-highwater-v28-red.yml
      - scripts/world-v0-jump-resume-highwater-v28-audit.mjs
      - scripts/world-v0-jump-provenance-v27-resume-collision-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install V27 provenance substrate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v28-resume-red-install.log
          grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' v28-resume-red-install.log
          node --check scripts/world-v0-jump-resume-highwater-v28-audit.mjs

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > v28-resume-red-wrangler.log 2>&1 &
          echo $! > v28-resume-red-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-resume-red-wrangler.log
          exit 1

      - name: Verify desired ActorSession high-water contract is RED on V27
        shell: bash
        run: |
          set -uo pipefail
          set +e
          MW_WORLD_V0_JUMP_RESUME_HIGHWATER_OUTPUT=v28-resume-red.json \
            timeout 180s node scripts/world-v0-jump-resume-highwater-v28-audit.mjs > v28-resume-red.log 2>&1
          status=$?
          set -e
          cat v28-resume-red.log
          if [ "$status" -eq 0 ]; then
            echo 'V28 resume high-water contract unexpectedly passed on V27'
            exit 1
          fi
          grep -q 'fresh page did not restore jump sequence high-water' v28-resume-red.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('v28-resume-red.json','utf8'));
          if (r.verdict !== 'WORLD_V0_JUMP_RESUME_HIGHWATER_V28_FAIL') throw new Error(`unexpected verdict ${r.verdict}`);
          if (!String(r.error || '').includes('fresh page did not restore jump sequence high-water')) throw new Error(`wrong RED ${r.error}`);
          console.log('V28_RESUME_HIGHWATER_RED_PROVEN', JSON.stringify({
            verdict:r.verdict,
            error:String(r.error).split('\n')[0],
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f v28-resume-red-wrangler.pid ]; then
            pid=$(cat v28-resume-red-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          git diff --exit-code

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-resume-highwater-red-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-resume-red.json
            v28-resume-red.log
            v28-resume-red-wrangler.log
            v28-resume-red-install.log
