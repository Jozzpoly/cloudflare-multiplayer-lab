name: World V0 jump V28 fixed-attempt counterbalanced

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-fixed-attempt-counterbalanced.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterbalanced-pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - specimen: 1
            order: v27-v28
          - specimen: 2
            order: v28-v27
          - specimen: 3
            order: v27-v28
          - specimen: 4
            order: v28-v27
          - specimen: 5
            order: v27-v28
          - specimen: 6
            order: v28-v27
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare V27 and complete V28 worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../mw-cb-v27 HEAD
          git worktree add --detach ../mw-cb-v28 HEAD
          (cd ../mw-cb-v27 && npm ci)
          (cd ../mw-cb-v28 && npm ci)
          mkdir -p pair-evidence

      - name: Run counterbalanced pair
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"
          EVIDENCE="$ROOT/pair-evidence"
          SPECIMEN='${{ matrix.specimen }}'
          ORDER='${{ matrix.order }}'

          stop_runtime() {
            local pid="${1:-}"
            if [ -n "$pid" ]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              sleep 0.5
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }

          run_variant() {
            local variant="$1"
            local dir="$2"
            local port="$3"
            local position="$4"
            local prefix="cb-${SPECIMEN}-${ORDER}-${position}-${variant}"
            local runtime_pid=""

            cd "$dir"
            node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-v27-install.log"
            test ${PIPESTATUS[0]} -eq 0 || return 90

            if [ "$variant" = "v28" ]; then
              node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs \
                2>&1 | tee "$EVIDENCE/${prefix}-authority-install.log"
              test ${PIPESTATUS[0]} -eq 0 || return 91
              node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs \
                2>&1 | tee "$EVIDENCE/${prefix}-resume-install.log"
              test ${PIPESTATUS[0]} -eq 0 || return 92
              node scripts/world-v0-smoothness-install-jump-client-parity-v28.mjs \
                2>&1 | tee "$EVIDENCE/${prefix}-parity-install.log"
              test ${PIPESTATUS[0]} -eq 0 || return 93
              grep -q 'WORLD_V0_JUMP_CLIENT_CAUSAL_PARITY_V28_INSTALLED' "$EVIDENCE/${prefix}-parity-install.log" || return 94
              npm run typecheck > "$EVIDENCE/${prefix}-typecheck.log" 2>&1 || return 95
            fi

            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-fifo-install.log"
            test ${PIPESTATUS[0]} -eq 0 || return 96
            grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' "$EVIDENCE/${prefix}-fifo-install.log" || return 97

            node scripts/world-v0-smoothness-install-jump-provenance-v27-rapid-witness.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-witness-install.log"
            test ${PIPESTATUS[0]} -eq 0 || return 98
            node scripts/world-v0-smoothness-install-jump-fixed-attempt-v28.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-fixed-install.log"
            test ${PIPESTATUS[0]} -eq 0 || return 99
            node scripts/world-v0-smoothness-install-jump-wire-authorship-v28.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}-wire-install.log"
            test ${PIPESTATUS[0]} -eq 0 || return 100
            node --check scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs || return 101

            setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port "$port" \
              > "$EVIDENCE/${prefix}-wrangler.log" 2>&1 &
            runtime_pid=$!
            local live=0
            for i in {1..100}; do
              if curl -fsS "http://127.0.0.1:${port}/api/ping" >/dev/null; then live=1; break; fi
              sleep 0.25
            done
            if [ "$live" -ne 1 ]; then stop_runtime "$runtime_pid"; return 102; fi

            set +e
            MW_WORLD_V0_RAPID_BASE="http://127.0.0.1:${port}" \
            MW_WORLD_V0_RAPID_MODE=v27 \
            MW_WORLD_V0_RAPID_OUTPUT="$EVIDENCE/cb-${SPECIMEN}-${variant}.json" \
            MW_WORLD_V0_RAPID_DELAY_MS=90 \
            MW_WORLD_V0_RAPID_STRESS_MS=6000 \
            MW_WORLD_V0_RAPID_ATTEMPT_MS=200 \
              timeout 180s node scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs \
              2>&1 | tee "$EVIDENCE/${prefix}.log"
            local probe_status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$probe_status" > "$EVIDENCE/cb-${SPECIMEN}-${variant}.status"

            stop_runtime "$runtime_pid"
            runtime_pid=""
            git checkout -- \
              public/world-v0/app.js \
              src/world-v0-protocol.ts \
              src/world-v0-shared-yard.ts \
              scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
            rm -f worker-configuration.d.ts
            git diff --exit-code > "$EVIDENCE/${prefix}-restore-diff.log" 2>&1 || return 103
            return 0
          }

          if [ "$ORDER" = "v27-v28" ]; then
            first=v27; second=v28
          else
            first=v28; second=v27
          fi

          set +e
          run_variant "$first" "$ROOT/../mw-cb-$first" 8787 first
          first_runner=$?
          run_variant "$second" "$ROOT/../mw-cb-$second" 8788 second
          second_runner=$?
          set -e
          printf '%s\n' "$first_runner" > "$EVIDENCE/cb-${SPECIMEN}-${first}.runner-status"
          printf '%s\n' "$second_runner" > "$EVIDENCE/cb-${SPECIMEN}-${second}.runner-status"

      - name: Qualify and normalize pair
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const specimen = '${{ matrix.specimen }}';
          const order = '${{ matrix.order }}';
          const dir = 'pair-evidence';
          const readInt = (p) => fs.existsSync(p) ? Number(fs.readFileSync(p,'utf8').trim()) : 999;
          const readJson = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : null;
          const load = (variant) => ({
            runner: readInt(`${dir}/cb-${specimen}-${variant}.runner-status`),
            probe: readInt(`${dir}/cb-${specimen}-${variant}.status`),
            data: readJson(`${dir}/cb-${specimen}-${variant}.json`),
          });
          const states = { v27: load('v27'), v28: load('v28') };
          for (const [variant, state] of Object.entries(states)) {
            if (state.runner !== 0 || state.probe !== 0 || !state.data) {
              throw new Error(`${variant} invalid execution ${JSON.stringify({runner:state.runner,probe:state.probe,error:state.data?.error})}`);
            }
            const r = state.data;
            if (r.proxy?.transportRevision !== 'strict-fifo-single-drain-v1') throw new Error(`${variant} transport unqualified`);
            if (r.attemptIntervalMs !== 200 || r.attempts < 25) throw new Error(`${variant} attempt apparatus incomplete`);
            if ((r.falseBeforeAuthorshipCount||0)!==0 || (r.outsideAuthoredRangeCount||0)!==0 || (r.canonicalProvenanceMismatchCount||0)!==0) {
              throw new Error(`${variant} causal semantics failed`);
            }
            if ((r.wireInvalidCount||0)!==0) throw new Error(`${variant} invalid outbound wire frames`);
          }
          const a = states.v27.data;
          const b = states.v28.data;
          if (Math.abs(a.attempts - b.attempts) > 1) throw new Error(`attempt schedule diverged ${a.attempts} vs ${b.attempts}`);
          const ratio = (x,y) => Number.isFinite(x)&&Number.isFinite(y)&&y>0 ? x/y : null;
          const summary = {
            specimen, order,
            status:'V28_COUNTERBALANCED_PAIR_QUALIFIED_NOT_PROMOTED',
            v27:{attempts:a.attempts,accepted:a.acceptedAttempts,acceptance:a.acceptanceRatio,deliveries:a.deliveries,p50:a.deliveryLatencyP50Ms,p95:a.deliveryLatencyP95Ms,corrections:a.correctionDelta,serverLate:a.serverLateDelta,applied:a.appliedDelta,pressure:a.provenancePressureCount,snapshotRangeMismatches:a.authorshipSnapshotMismatchCount},
            v28:{attempts:b.attempts,accepted:b.acceptedAttempts,acceptance:b.acceptanceRatio,deliveries:b.deliveries,p50:b.deliveryLatencyP50Ms,p95:b.deliveryLatencyP95Ms,corrections:b.correctionDelta,serverLate:b.serverLateDelta,applied:b.appliedDelta,pressure:b.provenancePressureCount,snapshotRangeMismatches:b.authorshipSnapshotMismatchCount},
            v28OverV27:{accepted:ratio(b.acceptedAttempts,a.acceptedAttempts),deliveries:ratio(b.deliveries,a.deliveries),p50:ratio(b.deliveryLatencyP50Ms,a.deliveryLatencyP50Ms),p95:ratio(b.deliveryLatencyP95Ms,a.deliveryLatencyP95Ms)},
          };
          fs.writeFileSync(`${dir}/cb-${specimen}-summary.json`, JSON.stringify(summary,null,2));
          console.log('V28_COUNTERBALANCED_PAIR', JSON.stringify(summary));
          NODE

      - name: Prove root checkout stayed canonical
        if: always()
        run: git diff --exit-code

      - name: Upload pair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-counterbalanced-${{ matrix.specimen }}-${{ matrix.order }}-${{ github.run_id }}
          if-no-files-found: error
          path: pair-evidence/

      - name: Remove worktrees
        if: always()
        run: |
          git worktree remove --force ../mw-cb-v27 || true
          git worktree remove --force ../mw-cb-v28 || true
          git worktree prune
