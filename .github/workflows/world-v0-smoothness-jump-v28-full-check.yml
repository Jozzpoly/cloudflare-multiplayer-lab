name: World V0 smoothness jump V28 full check

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-full-check.yml
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
      - scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install integrated V28 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v28-full-v27-install.log
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs | tee v28-full-authority-install.log
          node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs | tee v28-full-browser-install.log
          grep -q 'WORLD_V0_JUMP_EXPLICIT_PROVENANCE_V27_INSTALLED' v28-full-v27-install.log
          grep -q 'WORLD_V0_JUMP_CAUSAL_DEDUPE_V28_INSTALLED' v28-full-authority-install.log
          grep -q 'WORLD_V0_JUMP_RESUME_HIGHWATER_V28_INSTALLED' v28-full-browser-install.log

      - name: Run complete repository gate
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee v28-full-check.log

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts worker-configuration.d.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-full-check-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-full-check.log
            v28-full-v27-install.log
            v28-full-authority-install.log
            v28-full-browser-install.log
