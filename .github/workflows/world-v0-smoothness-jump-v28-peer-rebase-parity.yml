name: World V0 jump V28 peer rebase parity

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-peer-rebase-parity.yml
      - scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-rebase-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install complete V28 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
          node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
          node scripts/world-v0-smoothness-install-jump-client-parity-v28.mjs
          npm run typecheck
          node --check scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs
          node --check scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs

      - name: Start local authority runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8796 --inspector-port 9230 \
            > v28-peer-rebase-wrangler.log 2>&1 &
          echo $! > v28-peer-rebase-wrangler.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8796/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-peer-rebase-wrangler.log
          exit 1

      - name: Prove peer provenance and authority rebase watermark
        run: |
          set -euo pipefail
          MW_WORLD_V0_V28_PARITY_BASE=http://127.0.0.1:8796 \
          MW_WORLD_V0_V28_PARITY_OUTPUT=v28-peer-rebase-parity.json \
            timeout 90s node scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs | tee v28-peer-rebase-parity.log
          grep -q 'WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS' v28-peer-rebase-parity.log

      - name: Prove full V28 real Chromium rebase continuation
        run: |
          set -euo pipefail
          MW_WORLD_V0_I4B_BASE=http://127.0.0.1:8796 \
          MW_WORLD_V0_I4B_OUTPUT=v28-i4b-rebase.json \
            timeout 120s node scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee v28-i4b-rebase.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' v28-i4b-rebase.log

      - name: Qualify parity boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const parity = JSON.parse(fs.readFileSync('v28-peer-rebase-parity.json','utf8'));
          const i4b = JSON.parse(fs.readFileSync('v28-i4b-rebase.json','utf8'));
          if (parity.verdict !== 'WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS') throw new Error(parity.verdict);
          if (parity.relayed?.jumpSequence !== parity.sequence) throw new Error('peer relay provenance missing');
          if ((parity.resumed?.selfLastConsumedJumpSequence ?? -1) < parity.sequence) throw new Error('rebase causal watermark missing');
          if (i4b.verdict !== 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS') throw new Error(i4b.verdict);
          console.log('V28_PEER_REBASE_PARITY_QUALIFIED', JSON.stringify({
            sequence: parity.sequence,
            relay: parity.relayed,
            rebase: parity.resumed,
            i4b: { verdict: i4b.verdict }
          }));
          NODE

      - name: Stop runtime and restore canonical checkout
        if: always()
        run: |
          set +e
          if [ -f v28-peer-rebase-wrangler.pid ]; then
            pid="$(cat v28-peer-rebase-wrangler.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          rm -f worker-configuration.d.ts
          git diff --exit-code

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-peer-rebase-parity-${{ github.run_id }}
          if-no-files-found: error
          path: |
            v28-peer-rebase-parity.json
            v28-peer-rebase-parity.log
            v28-i4b-rebase.json
            v28-i4b-rebase.log
            v28-peer-rebase-wrangler.log
