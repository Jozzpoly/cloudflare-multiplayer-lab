name: World V0 smoothness jump V28 pending resume

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-pending-resume.yml
      - scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
      - scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install integrated V28 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
          node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
          node --check scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs
          npm run typecheck

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > v28-pending-wrangler.log 2>&1 &
          echo $! > v28-pending-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-pending-wrangler.log
          exit 1

      - name: Prove accepted pending identity is reserved before consumption
        shell: bash
        run: |
          set -euo pipefail
          MW_WORLD_V0_PENDING_RESUME_OUTPUT=v28-pending.json \
            timeout 120s node scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs | tee v28-pending.log
          grep -q 'WORLD_V0_JUMP_PENDING_RESUME_HIGHWATER_V28_PASS' v28-pending.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('v28-pending.json','utf8'));
          if (r.verdict !== 'WORLD_V0_JUMP_PENDING_RESUME_HIGHWATER_V28_PASS') throw new Error(`bad verdict ${r.verdict}`);
          if (!(r.acceptedAtBoundary < r.targetTick && r.resumeBoundary < r.targetTick)) throw new Error(`event was not pending at resume ${JSON.stringify(r)}`);
          if (r.resumeLastJumpSequence < 7) throw new Error(`seen high-water missing ${r.resumeLastJumpSequence}`);
          if (r.canonical?.jumpSequence !== 7 || r.canonical?.jump !== true) throw new Error(`pending canonical event lost ${JSON.stringify(r.canonical)}`);
          console.log('V28_PENDING_RESUME_QUALIFIED', JSON.stringify({
            acceptedAt:r.acceptedAtBoundary,
            resumedAt:r.resumeBoundary,
            target:r.targetTick,
            highWater:r.resumeLastJumpSequence,
            canonical:r.canonical,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f v28-pending-wrangler.pid ]; then
            pid=$(cat v28-pending-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-pending-resume-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-pending.json
            v28-pending.log
            v28-pending-wrangler.log
