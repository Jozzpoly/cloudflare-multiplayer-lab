name: World V0 smoothness jump V28 persistence stress

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-persistence-stress.yml
      - scripts/world-v0-jump-delivery-persistence-stress.mjs
      - scripts/world-v0-jump-delivery-persistence-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
      - scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
      - scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v28-persistence-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install integrated V28 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v28-stress-v27-install.log
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs | tee v28-stress-authority-install.log
          node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs | tee v28-stress-browser-install.log
          npm run typecheck

      - name: Install qualified strict FIFO transport apparatus
        run: |
          set -euo pipefail
          MW_WORLD_V0_STRICT_FIFO_TARGET=world-v0-jump-delivery-persistence-audit.mjs \
            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs | tee v28-stress-fifo-install.log
          grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' v28-stress-fifo-install.log
          grep -q 'transportRevision: "strict-fifo-single-drain-v1"' scripts/world-v0-jump-delivery-persistence-audit.mjs

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > v28-stress-wrangler.log 2>&1 &
          echo $! > v28-stress-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-stress-wrangler.log
          exit 1

      - name: Run repeated forced-late persistence campaign
        shell: bash
        run: |
          set -euo pipefail
          # 700 ms exceeds the protocol's entire 32-tick (~533 ms) accepted future horizon.
          # Therefore a jump record authored only after this delay is enabled cannot arrive
          # on time by construction; unlike the old 180 ms setting, forced lateness is a
          # test precondition rather than a timing assumption.
          MW_WORLD_V0_JUMP_DELIVERY_LOSS_DELAY_MS=700 \
          MW_WORLD_V0_JUMP_DELIVERY_RECOVERY_DELAY_MS=45 \
          MW_WORLD_V0_PERSISTENCE_STRESS_VARIANT=v28 \
          MW_WORLD_V0_PERSISTENCE_STRESS_ITERATIONS=12 \
          MW_WORLD_V0_PERSISTENCE_STRESS_OUTPUT=v28-persistence-stress.json \
            timeout 900s node scripts/world-v0-jump-delivery-persistence-stress.mjs | tee v28-persistence-stress.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('v28-persistence-stress.json','utf8'));
          if (r.iterations !== 12) throw new Error(`incomplete campaign ${r.iterations}`);
          if (r.infrastructureFailures !== 0) throw new Error(`apparatus/infrastructure failures ${r.infrastructureFailures}`);
          if (r.semanticDelayedLandingFailures !== 0) throw new Error(`delayed landing reproduced ${r.semanticDelayedLandingFailures} times`);
          if (r.passes !== 12) throw new Error(`not all iterations passed: ${r.passes}/12`);
          console.log('V28_PERSISTENCE_STRESS_QUALIFIED', JSON.stringify({
            iterations:r.iterations,
            passes:r.passes,
            delayedLanding:r.semanticDelayedLandingFailures,
            infrastructure:r.infrastructureFailures,
            verdict:r.campaignVerdict,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f v28-stress-wrangler.pid ]; then
            pid=$(cat v28-stress-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product and apparatus targets
        if: always()
        shell: bash
        run: |
          git checkout -- \
            public/world-v0/app.js \
            src/world-v0-protocol.ts \
            src/world-v0-shared-yard.ts \
            scripts/world-v0-jump-delivery-persistence-audit.mjs \
            worker-configuration.d.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-persistence-stress-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-persistence-stress.json
            v28-persistence-stress.log
            persistence-stress-v28-*.json
            persistence-stress-v28-*.log
            v28-stress-wrangler.log
            v28-stress-v27-install.log
            v28-stress-authority-install.log
            v28-stress-browser-install.log
            v28-stress-fifo-install.log
