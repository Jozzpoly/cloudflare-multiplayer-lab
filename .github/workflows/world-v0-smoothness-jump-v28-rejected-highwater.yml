name: World V0 smoothness jump V28 rejected high-water

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-rejected-highwater.yml
      - scripts/world-v0-jump-resume-highwater-rejected-record-v28-audit.mjs
      - scripts/world-v0-smoothness-install-jump-provenance-v27.mjs
      - scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs
      - scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rejected-highwater:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Install integrated V28 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs | tee v28-rejected-v27-install.log
          node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs | tee v28-rejected-authority-install.log
          node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs | tee v28-rejected-browser-install.log
          node --check scripts/world-v0-jump-resume-highwater-rejected-record-v28-audit.mjs
          npm run typecheck

      - name: Start local authority runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > v28-rejected-wrangler.log 2>&1 &
          echo $! > v28-rejected-wrangler.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat v28-rejected-wrangler.log
          exit 1

      - name: Prove rejected records cannot reserve causal high-water
        shell: bash
        run: |
          set -euo pipefail
          MW_WORLD_V0_REJECTED_HIGHWATER_OUTPUT=v28-rejected-highwater.json \
            timeout 120s node scripts/world-v0-jump-resume-highwater-rejected-record-v28-audit.mjs | tee v28-rejected-highwater.log
          grep -q 'WORLD_V0_JUMP_REJECTED_HIGHWATER_V28_PASS' v28-rejected-highwater.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('v28-rejected-highwater.json','utf8'));
          if (r.verdict !== 'WORLD_V0_JUMP_REJECTED_HIGHWATER_V28_PASS') throw new Error(`bad verdict ${r.verdict}`);
          if (r.acceptance?.records?.[0]?.status !== 'accepted' || r.acceptance.records[0].jumpSequence !== 1) {
            throw new Error(`accepted record contract missing ${JSON.stringify(r.acceptance)}`);
          }
          if (r.acceptance?.records?.[1]?.status !== 'too_future' || r.acceptance.records[1].jumpSequence !== 999) {
            throw new Error(`rejected record contract missing ${JSON.stringify(r.acceptance)}`);
          }
          if (r.resumeLastJumpSequence !== 1) throw new Error(`rejected record poisoned high-water ${r.resumeLastJumpSequence}`);
          console.log('V28_REJECTED_HIGHWATER_QUALIFIED', JSON.stringify({
            accepted:r.acceptance.records[0],
            rejected:r.acceptance.records[1],
            resumeLastJumpSequence:r.resumeLastJumpSequence,
          }));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f v28-rejected-wrangler.pid ]; then
            pid=$(cat v28-rejected-wrangler.pid)
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Restore canonical product targets
        if: always()
        shell: bash
        run: |
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts
          rm -f worker-configuration.d.ts
          git diff --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-rejected-highwater-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-rejected-highwater.json
            v28-rejected-highwater.log
            v28-rejected-wrangler.log
            v28-rejected-v27-install.log
            v28-rejected-authority-install.log
            v28-rejected-browser-install.log
