name: World V0 jump V28 warmed crossover

on:
  push:
    branches:
      - world-v0-smoothness-owner-forensics-v25
    paths:
      - .github/workflows/world-v0-smoothness-jump-v28-warm-crossover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmed-crossover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - specimen: 1
            pattern: ABBA
          - specimen: 2
            pattern: BAAB
          - specimen: 3
            pattern: ABBA
          - specimen: 4
            pattern: BAAB
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare V27 and complete V28 worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../mw-warm-v27 HEAD
          git worktree add --detach ../mw-warm-v28 HEAD
          (cd ../mw-warm-v27 && npm ci)
          (cd ../mw-warm-v28 && npm ci)
          mkdir -p crossover-evidence

      - name: Run equal-warmup crossover
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          V27="$ROOT/../mw-warm-v27"
          V28="$ROOT/../mw-warm-v28"
          EVIDENCE="$ROOT/crossover-evidence"
          SPEC='${{ matrix.specimen }}'
          PATTERN='${{ matrix.pattern }}'
          V27_PID=""
          V28_PID=""

          stop_runtime() {
            local pid="${1:-}"
            if [ -n "$pid" ]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              sleep 0.5
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }

          cleanup() {
            set +e
            stop_runtime "$V27_PID"
            stop_runtime "$V28_PID"
          }
          trap cleanup EXIT

          prepare_variant() {
            local variant="$1"
            local dir="$2"
            cd "$dir"
            node scripts/world-v0-smoothness-install-jump-provenance-v27.mjs \
              2>&1 | tee "$EVIDENCE/${variant}-v27-install.log"
            if [ "$variant" = "v28" ]; then
              node scripts/world-v0-smoothness-install-jump-causal-dedupe-v28.mjs \
                2>&1 | tee "$EVIDENCE/${variant}-authority-install.log"
              node scripts/world-v0-smoothness-install-jump-resume-highwater-v28.mjs \
                2>&1 | tee "$EVIDENCE/${variant}-resume-install.log"
              node scripts/world-v0-smoothness-install-jump-client-parity-v28.mjs \
                2>&1 | tee "$EVIDENCE/${variant}-parity-install.log"
              grep -q 'WORLD_V0_JUMP_CLIENT_CAUSAL_PARITY_V28_INSTALLED' "$EVIDENCE/${variant}-parity-install.log"
              npm run typecheck > "$EVIDENCE/${variant}-typecheck.log" 2>&1
            fi
            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs \
              2>&1 | tee "$EVIDENCE/${variant}-fifo-install.log"
            grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' "$EVIDENCE/${variant}-fifo-install.log"
            node scripts/world-v0-smoothness-install-jump-provenance-v27-rapid-witness.mjs \
              2>&1 | tee "$EVIDENCE/${variant}-witness-install.log"
            node scripts/world-v0-smoothness-install-jump-fixed-attempt-v28.mjs \
              2>&1 | tee "$EVIDENCE/${variant}-fixed-install.log"
            node scripts/world-v0-smoothness-install-jump-wire-authorship-v28.mjs \
              2>&1 | tee "$EVIDENCE/${variant}-wire-install.log"
            node --check scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
            cd "$ROOT"
          }

          prepare_variant v27 "$V27"
          prepare_variant v28 "$V28"

          cd "$V27"
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9230 \
            > "$EVIDENCE/v27-wrangler.log" 2>&1 &
          V27_PID=$!
          cd "$V28"
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8788 --inspector-port 9231 \
            > "$EVIDENCE/v28-wrangler.log" 2>&1 &
          V28_PID=$!
          cd "$ROOT"

          wait_live() {
            local port="$1"
            for i in {1..120}; do
              if curl -fsS "http://127.0.0.1:${port}/api/ping" >/dev/null; then return 0; fi
              sleep 0.25
            done
            return 1
          }
          wait_live 8787
          wait_live 8788

          run_probe() {
            local variant="$1"
            local dir="$2"
            local port="$3"
            local label="$4"
            local stress="$5"
            cd "$dir"
            MW_WORLD_V0_RAPID_BASE="http://127.0.0.1:${port}" \
            MW_WORLD_V0_RAPID_MODE=v27 \
            MW_WORLD_V0_RAPID_PROXY_PORT=8796 \
            MW_WORLD_V0_RAPID_OUTPUT="$EVIDENCE/${label}-${variant}.json" \
            MW_WORLD_V0_RAPID_DELAY_MS=90 \
            MW_WORLD_V0_RAPID_STRESS_MS="$stress" \
            MW_WORLD_V0_RAPID_ATTEMPT_MS=200 \
              timeout 180s node scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs \
              2>&1 | tee "$EVIDENCE/${label}-${variant}.log"
            cd "$ROOT"
            sleep 0.6
          }

          if [ "$PATTERN" = "ABBA" ]; then
            run_probe v27 "$V27" 8787 "warm-${SPEC}-1" 3500
            run_probe v28 "$V28" 8788 "warm-${SPEC}-2" 3500
            sequence=(v27 v28 v28 v27)
          else
            run_probe v28 "$V28" 8788 "warm-${SPEC}-1" 3500
            run_probe v27 "$V27" 8787 "warm-${SPEC}-2" 3500
            sequence=(v28 v27 v27 v28)
          fi

          index=0
          for variant in "${sequence[@]}"; do
            index=$((index + 1))
            if [ "$variant" = "v27" ]; then
              run_probe v27 "$V27" 8787 "measure-${SPEC}-${index}" 6000
            else
              run_probe v28 "$V28" 8788 "measure-${SPEC}-${index}" 6000
            fi
          done

          cleanup
          trap - EXIT
          V27_PID=""
          V28_PID=""

          cd "$V27"
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
          rm -f worker-configuration.d.ts
          git diff --exit-code > "$EVIDENCE/v27-restore-diff.log"
          cd "$V28"
          git checkout -- public/world-v0/app.js src/world-v0-protocol.ts src/world-v0-shared-yard.ts scripts/world-v0-smoothness-jump-rapid-repress-probe.mjs
          rm -f worker-configuration.d.ts
          git diff --exit-code > "$EVIDENCE/v28-restore-diff.log"
          cd "$ROOT"

      - name: Qualify warmed crossover
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const spec = '${{ matrix.specimen }}';
          const pattern = '${{ matrix.pattern }}';
          const dir = 'crossover-evidence';
          const sequence = pattern === 'ABBA' ? ['v27','v28','v28','v27'] : ['v28','v27','v27','v28'];
          const runs = sequence.map((variant, index) => {
            const path = `${dir}/measure-${spec}-${index + 1}-${variant}.json`;
            if (!fs.existsSync(path)) throw new Error(`missing measured specimen ${path}`);
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (r.error) throw new Error(`${variant} measured run failed: ${r.error}`);
            if (r.proxy?.transportRevision !== 'strict-fifo-single-drain-v1') throw new Error(`${variant} transport unqualified`);
            if (r.attemptIntervalMs !== 200 || r.attempts < 25) throw new Error(`${variant} fixed attempt apparatus incomplete`);
            if ((r.falseBeforeAuthorshipCount||0)!==0 || (r.outsideAuthoredRangeCount||0)!==0 || (r.canonicalProvenanceMismatchCount||0)!==0) {
              throw new Error(`${variant} causal/wire qualification failed`);
            }
            if ((r.wireInvalidCount||0)!==0) throw new Error(`${variant} invalid outbound frames`);
            return { variant, position:index + 1, r };
          });
          const median = (values) => {
            const s = values.filter(Number.isFinite).sort((a,b)=>a-b);
            if (!s.length) return null;
            const m = Math.floor(s.length/2);
            return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
          };
          const aggregate = (variant) => {
            const items = runs.filter((entry) => entry.variant === variant).map((entry) => entry.r);
            const attempts = items.reduce((sum,r)=>sum+r.attempts,0);
            const accepted = items.reduce((sum,r)=>sum+r.acceptedAttempts,0);
            const deliveries = items.reduce((sum,r)=>sum+r.deliveries,0);
            const corrections = items.reduce((sum,r)=>sum+r.correctionDelta,0);
            const serverLate = items.reduce((sum,r)=>sum+r.serverLateDelta,0);
            return {
              attempts, accepted, deliveries,
              acceptanceRate: accepted / attempts,
              deliveryRate: deliveries / attempts,
              p50Ms: median(items.map((r)=>r.deliveryLatencyP50Ms)),
              p95Ms: median(items.map((r)=>r.deliveryLatencyP95Ms)),
              correctionsPerAttempt: corrections / attempts,
              serverLatePerAttempt: serverLate / attempts,
              applied: items.reduce((sum,r)=>sum+r.appliedDelta,0),
              snapshotRangeMismatches: items.reduce((sum,r)=>sum+(r.authorshipSnapshotMismatchCount||0),0),
            };
          };
          const v27 = aggregate('v27');
          const v28 = aggregate('v28');
          const ratio = (a,b) => Number.isFinite(a)&&Number.isFinite(b)&&b>0 ? a/b : null;
          const summary = {
            specimen:spec,
            pattern,
            status:'V28_WARMED_CROSSOVER_QUALIFIED_NOT_PROMOTED',
            v27,
            v28,
            v28OverV27:{
              acceptanceRate:ratio(v28.acceptanceRate,v27.acceptanceRate),
              deliveryRate:ratio(v28.deliveryRate,v27.deliveryRate),
              p50:ratio(v28.p50Ms,v27.p50Ms),
              p95:ratio(v28.p95Ms,v27.p95Ms),
              correctionsPerAttempt:ratio(v28.correctionsPerAttempt,v27.correctionsPerAttempt),
              serverLatePerAttempt:ratio(v28.serverLatePerAttempt,v27.serverLatePerAttempt),
            },
            measuredPositions:runs.map(({variant,position,r})=>({variant,position,attempts:r.attempts,accepted:r.acceptedAttempts,deliveries:r.deliveries,p50:r.deliveryLatencyP50Ms,p95:r.deliveryLatencyP95Ms,corrections:r.correctionDelta,serverLate:r.serverLateDelta})),
          };
          fs.writeFileSync(`${dir}/warm-cross-${spec}-summary.json`, JSON.stringify(summary,null,2));
          console.log('V28_WARMED_CROSSOVER', JSON.stringify(summary));
          NODE

      - name: Prove root checkout stayed canonical
        if: always()
        run: git diff --exit-code

      - name: Upload crossover evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-warm-crossover-${{ matrix.specimen }}-${{ matrix.pattern }}-${{ github.run_id }}
          if-no-files-found: error
          path: crossover-evidence/

      - name: Remove worktrees
        if: always()
        run: |
          git worktree remove --force ../mw-warm-v27 || true
          git worktree remove --force ../mw-warm-v28 || true
          git worktree prune
