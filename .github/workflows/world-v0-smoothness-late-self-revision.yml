name: World V0 smoothness late self revision diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-late-self-revision.yml
      - scripts/world-v0-smoothness-late-self-revision-probe.mjs
      - src/world-v0-protocol.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  late-self-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove late self revision correction path
        env:
          MW_WORLD_V0_LATE_SELF_OUTPUT: world-v0-smoothness-late-self-revision.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-smoothness-late-self-revision-probe.mjs | tee world-v0-smoothness-late-self-revision.log
          grep -q 'LATE_SELF_REVISION_CAUSES_AUTHORITY_CONSUMED_CORRECTION' world-v0-smoothness-late-self-revision.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-late-self-revision-${{ github.run_id }}
          path: |
            world-v0-smoothness-late-self-revision.json
            world-v0-smoothness-late-self-revision.log
