name: World V0 smoothness latency camera matrix

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-latency-camera-matrix.yml
      - scripts/world-v0-smoothness-latency-camera-matrix-probe.mjs
      - public/world-v0/app.js
      - public/world-v0/playable-control.js
      - src/world-v0-protocol.ts
      - src/world-v0-contract.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency-camera-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start unchanged local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-matrix-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-matrix-wrangler.log
          exit 1
      - name: Measure camera x latency correction interaction
        env:
          MW_WORLD_V0_MATRIX_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_MATRIX_PHASE_MS: 2500
          MW_WORLD_V0_MATRIX_OUTPUT: world-v0-smoothness-latency-camera-matrix.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node scripts/world-v0-smoothness-latency-camera-matrix-probe.mjs | tee world-v0-smoothness-latency-camera-matrix.log
          grep -q 'CAMERA_LATENCY_INTERACTION_CORRECTION_PRESSURE_MEASURED' world-v0-smoothness-latency-camera-matrix.log
      - name: Prove diagnostic did not modify runtime
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-latency-camera-matrix-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-smoothness-latency-camera-matrix.json
            world-v0-smoothness-latency-camera-matrix.log
            world-v0-matrix-wrangler.log
