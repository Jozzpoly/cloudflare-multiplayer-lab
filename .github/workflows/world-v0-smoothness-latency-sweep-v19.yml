name: World V0 smoothness latency sweep v19

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-latency-sweep-v19.yml
      - scripts/world-v0-smoothness-render-latency-sweep-v19-transform.mjs
      - scripts/world-v0-smoothness-render-latency-sweep-v19-analyze.mjs
      - scripts/world-v0-smoothness-install-correction-batching-v18.mjs
      - scripts/world-v0-smoothness-render-correction-batching-v18-transform.mjs
      - scripts/world-v0-smoothness-install-prediction-ceiling-v15.mjs
      - scripts/world-v0-smoothness-install-ordered-inbound-delay-v17.mjs
      - scripts/world-v0-smoothness-render-ordered-ceiling-v17-transform.mjs
      - scripts/world-v0-smoothness-render-active-peer-v6-transform.mjs
      - scripts/world-v0-smoothness-render-discontinuity-v4-probe.mjs
      - scripts/world-v0-smoothness-install-render-probe-v3.mjs
      - scripts/world-v0-smoothness-install-render-probe-v5.mjs
      - scripts/world-v0-smoothness-install-render-probe-v6.mjs
      - public/world-v0/app.js
      - public/world-v0/playable-control.js
      - public/world-v0/build-contract.js
      - src/world-v0-contract.ts
      - src/world-v0-protocol.ts
      - src/world-v0-shared-yard.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency-sweep-v19:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: immediate-90
            mode: immediate
            delay: 90
          - label: coalesced-90
            mode: coalesced
            delay: 90
          - label: immediate-180
            mode: immediate
            delay: 180
          - label: coalesced-180
            mode: coalesced
            delay: 180
          - label: immediate-300
            mode: immediate
            delay: 300
          - label: coalesced-300
            mode: coalesced
            delay: 300
          - label: immediate-550
            mode: immediate
            delay: 550
          - label: coalesced-550
            mode: coalesced
            delay: 550
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Prepare V19 latency sweep apparatus
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-install-render-probe-v3.mjs
          node scripts/world-v0-smoothness-install-render-probe-v5.mjs
          node scripts/world-v0-smoothness-install-render-probe-v6.mjs
          node scripts/world-v0-smoothness-install-prediction-ceiling-v15.mjs ceiling
          node scripts/world-v0-smoothness-install-ordered-inbound-delay-v17.mjs
          node scripts/world-v0-smoothness-install-correction-batching-v18.mjs "${{ matrix.mode }}"
          node scripts/world-v0-smoothness-render-active-peer-v6-transform.mjs /tmp/world-v0-smoothness-render-active-peer-v6-probe.mjs
          node scripts/world-v0-smoothness-render-ordered-ceiling-v17-transform.mjs \
            /tmp/world-v0-smoothness-render-active-peer-v6-probe.mjs \
            /tmp/world-v0-smoothness-render-ordered-ceiling-v17-probe.mjs
          node scripts/world-v0-smoothness-render-correction-batching-v18-transform.mjs \
            /tmp/world-v0-smoothness-render-ordered-ceiling-v17-probe.mjs \
            /tmp/world-v0-smoothness-render-correction-batching-v18-probe.mjs
          node scripts/world-v0-smoothness-render-latency-sweep-v19-transform.mjs \
            /tmp/world-v0-smoothness-render-correction-batching-v18-probe.mjs \
            /tmp/world-v0-smoothness-render-latency-sweep-v19-probe.mjs
          node --check public/world-v0/app.js
          node --check /tmp/world-v0-smoothness-render-latency-sweep-v19-probe.mjs
          node --check scripts/world-v0-smoothness-render-latency-sweep-v19-analyze.mjs
      - name: Start instrumented local Workerd copy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-latency-sweep-v19-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-latency-sweep-v19-wrangler.log
          exit 1
      - name: Capture latency sweep evidence
        env:
          MW_WORLD_V0_RENDER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RENDER_LATENCY_MS: ${{ matrix.delay }}
          MW_WORLD_V0_RENDER_STRESS_MS: 10000
          MW_WORLD_V0_RENDER_OUTPUT: world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s node /tmp/world-v0-smoothness-render-latency-sweep-v19-probe.mjs \
            | tee world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.log
          test -s world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.json
      - name: Analyze latency sweep semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.json ]]; then
            node scripts/world-v0-smoothness-render-latency-sweep-v19-analyze.mjs \
              world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.json \
              world-v0-smoothness-latency-sweep-v19-analysis-${{ matrix.label }}.json \
              | tee world-v0-smoothness-latency-sweep-v19-analysis-${{ matrix.label }}.log
          else
            echo "V19 source evidence unavailable"
            exit 1
          fi
      - name: Restore canonical runtime source
        if: always()
        run: git checkout -- public/world-v0/app.js
      - name: Prove repository source is unchanged
        if: always()
        run: git diff --exit-code
      - name: Upload V19 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.json
            world-v0-smoothness-latency-sweep-v19-${{ matrix.label }}.log
            world-v0-smoothness-latency-sweep-v19-analysis-${{ matrix.label }}.json
            world-v0-smoothness-latency-sweep-v19-analysis-${{ matrix.label }}.log
            world-v0-latency-sweep-v19-wrangler.log
