name: World V0 smoothness owner candidate V25 materialize

on:
  push:
    branches:
      - world-v0-smoothness-owner-candidate-v25
    paths:
      - .github/workflows/world-v0-smoothness-owner-candidate-v25-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-owner-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: world-v0-smoothness-owner-candidate-v25
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize clean V25 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-materialize-integrated-v25.mjs
          node --check public/world-v0/app.js
          grep -q 'WORLD_V0_INTEGRATED_SMOOTHNESS_V25' public/world-v0/app.js
          if grep -q '__mwV' public/world-v0/app.js; then
            echo 'experimental hook leaked into owner candidate' >&2
            exit 1
          fi
          git diff --check
          if git diff --quiet -- public/world-v0/app.js; then
            echo 'V25 materialization unexpectedly produced no runtime diff' >&2
            exit 1
          fi
      - name: Run full repository check on materialized runtime
        run: npm run check
      - name: Commit only materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jozzpoly'
          git config user.email '100104127+Jozzpoly@users.noreply.github.com'
          git add public/world-v0/app.js
          git diff --cached --check
          git commit -m 'Materialize qualified V25 owner-test runtime'
          git push origin HEAD:world-v0-smoothness-owner-candidate-v25
