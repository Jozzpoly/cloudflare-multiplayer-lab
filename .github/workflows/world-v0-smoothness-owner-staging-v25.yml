name: World V0 smoothness owner staging V25

on:
  push:
    branches:
      - world-v0-smoothness-owner-staging-v25
    paths:
      - .github/workflows/world-v0-smoothness-owner-staging-v25.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-smoothness-owner-staging-v25
  cancel-in-progress: false

env:
  OWNER_RUNTIME_SHA: 704c4bcb4479882caf8c7e8d3f6b4ac9db25d460
  EXPECTED_STAGING_WORKER: cloudflare-multiplayer-lab-staging
  STAGING_BASE_URL: https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deliver-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove frozen Owner runtime identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$OWNER_RUNTIME_SHA" HEAD
          git diff --exit-code "$OWNER_RUNTIME_SHA" -- public/world-v0/app.js
          grep -q 'WORLD_V0_INTEGRATED_SMOOTHNESS_V25' public/world-v0/app.js
          if grep -q '__mwV' public/world-v0/app.js; then
            echo 'experimental hook leaked into frozen Owner runtime' >&2
            exit 1
          fi
          echo "WORLD_V0_V25_FROZEN_RUNTIME_IDENTITY_PASS runtime=$OWNER_RUNTIME_SHA delivery=$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Re-run repository gate on delivery copy
        run: npm run check

      - name: Prove isolated staging target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const staging = config.env?.staging;
          if (!staging) throw new Error("wrangler env.staging missing");
          if (staging.name !== process.env.EXPECTED_STAGING_WORKER) throw new Error(`staging target drift ${staging.name}`);
          if (config.name === staging.name) throw new Error(`staging aliases production/root worker ${config.name}`);
          if (staging.workers_dev !== true) throw new Error("staging workers_dev must stay enabled");
          const bindings = staging.durable_objects?.bindings || [];
          if (!bindings.some((binding) => binding.name === "SHARED_YARD_V0" && binding.class_name === "SharedYardV0")) {
            throw new Error("staging SharedYardV0 binding missing");
          }
          const workerFirst = staging.assets?.run_worker_first || [];
          if (!workerFirst.includes("/world-v0/ws")) throw new Error("staging world-v0 websocket route missing");
          console.log(`WORLD_V0_V25_STAGING_TARGET_PASS root=${config.name} staging=${staging.name}`);
          NODE
          npm run test:staging-deploy-guard
          npm run validate:staging-contract

      - name: Dry-run exact staging delivery
        run: npx wrangler deploy --dry-run --env staging --outdir .wrangler/v25-owner-staging-dry-run

      - name: Require Cloudflare deploy credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare staging credential present"

      - name: Deploy only isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:staging

      - name: Prove V25 runtime is public on staging
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_BASE_URL.replace(/\/$/, "");
          const deadline = Date.now() + 120_000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${base}/world-v0/app.js?runtime=${process.env.OWNER_RUNTIME_SHA}`, {
                cache: "no-store",
                signal: AbortSignal.timeout(8000),
              });
              const body = await response.text();
              last = {
                status: response.status,
                v25: body.includes("WORLD_V0_INTEGRATED_SMOOTHNESS_V25"),
                leakedHook: body.includes("__mwV"),
              };
              if (response.ok && last.v25 && !last.leakedHook) {
                console.log("WORLD_V0_V25_STAGING_RUNTIME_VISIBLE", JSON.stringify({
                  runtime: process.env.OWNER_RUNTIME_SHA,
                  delivery: process.env.GITHUB_SHA,
                }));
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error(`V25 staging runtime not visible: ${JSON.stringify(last)}`);
          NODE

      - name: Prove remote public Yard flow in real Chromium
        env:
          MW_WORLD_V0_ONGOING_BASE: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_ONGOING_OUTPUT: world-v0-v25-owner-staging.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s node scripts/world-v0-ongoing-yard-product-chromium.mjs | tee world-v0-v25-owner-staging.log
          grep -q 'WORLD_V0_ONGOING_YARD_PUBLIC_FLOW_PASS' world-v0-v25-owner-staging.log

      - name: Upload remote evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-v25-owner-staging-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            world-v0-v25-owner-staging.json
            world-v0-v25-owner-staging.log
            .wrangler/v25-owner-staging-dry-run
