name: World V0 smoothness presentation directness diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-presentation-directness.yml
      - scripts/world-v0-smoothness-presentation-directness-probe.mjs
      - public/world-v0/app.js
      - docs/WORLD_V0_SMOOTHNESS_REGRESSION_CAUSAL_AUDIT_2026-09-15.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-directness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove exact corrections are exposed directly to rendered transforms
        env:
          MW_WORLD_V0_PRESENTATION_OUTPUT: world-v0-smoothness-presentation-directness.json
        run: node scripts/world-v0-smoothness-presentation-directness-probe.mjs | tee world-v0-smoothness-presentation-directness.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-presentation-directness-${{ github.run_id }}
          path: |
            world-v0-smoothness-presentation-directness.json
            world-v0-smoothness-presentation-directness.log
