name: World V0 smoothness reconciliation amplification diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-reconciliation-amplification.yml
      - scripts/world-v0-smoothness-reconciliation-amplification-probe.mjs
      - src/world-v0-contract.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-amplification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove per-message reconciliation amplification
        env:
          MW_WORLD_V0_RECON_OUTPUT: world-v0-smoothness-reconciliation-amplification.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-smoothness-reconciliation-amplification-probe.mjs | tee world-v0-smoothness-reconciliation-amplification.log
          grep -q 'PER_MESSAGE_RECONCILIATION_AMPLIFICATION_PROVEN' world-v0-smoothness-reconciliation-amplification.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-reconciliation-amplification-${{ github.run_id }}
          path: |
            world-v0-smoothness-reconciliation-amplification.json
            world-v0-smoothness-reconciliation-amplification.log
