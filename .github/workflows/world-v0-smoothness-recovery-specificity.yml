name: World V0 smoothness recovery specificity diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-recovery-specificity.yml
      - scripts/world-v0-smoothness-recovery-specificity-probe.mjs
      - public/world-v0/app.js
      - src/world-v0-contract.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-specificity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove history-safety detector can escalate while socket is open
        env:
          MW_WORLD_V0_RECOVERY_SPECIFICITY_OUTPUT: world-v0-smoothness-recovery-specificity.json
        run: node --experimental-strip-types scripts/world-v0-smoothness-recovery-specificity-probe.mjs | tee world-v0-smoothness-recovery-specificity.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-recovery-specificity-${{ github.run_id }}
          path: |
            world-v0-smoothness-recovery-specificity.json
            world-v0-smoothness-recovery-specificity.log
