name: World V0 smoothness render discontinuity diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-render-discontinuity.yml
      - scripts/world-v0-smoothness-render-discontinuity-probe.mjs
      - public/world-v0/app.js
      - public/world-v0/playable-control.js
      - src/world-v0-contract.ts
      - src/world-v0-protocol.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-discontinuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Start unchanged local Workerd runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-render-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-render-wrangler.log
          exit 1
      - name: Measure render-cadence correction discontinuity
        env:
          MW_WORLD_V0_RENDER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RENDER_LATENCY_MS: 90
          MW_WORLD_V0_RENDER_STRESS_MS: 4500
          MW_WORLD_V0_RENDER_OUTPUT: world-v0-smoothness-render-discontinuity.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node scripts/world-v0-smoothness-render-discontinuity-probe.mjs | tee world-v0-smoothness-render-discontinuity.log
          grep -Eq 'RENDER_CADENCE_CORRECTION_DISCONTINUITY_REPRODUCED|NO_TELEPORT_LIKE_RENDER_INTERVAL_REPRODUCED' world-v0-smoothness-render-discontinuity.log
      - name: Prove diagnostic did not modify runtime source
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-render-discontinuity-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-smoothness-render-discontinuity.json
            world-v0-smoothness-render-discontinuity.log
            world-v0-render-wrangler.log
