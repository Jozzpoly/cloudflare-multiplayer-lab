name: World V0 smoothness render residual v5

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-render-residual-v5.yml
      - scripts/world-v0-smoothness-render-discontinuity-v4-probe.mjs
      - scripts/world-v0-smoothness-install-render-probe-v3.mjs
      - scripts/world-v0-smoothness-install-render-probe-v5.mjs
      - scripts/world-v0-smoothness-render-residual-analyze.mjs
      - public/world-v0/app.js
      - public/world-v0/playable-control.js
      - public/world-v0/build-contract.js
      - src/world-v0-contract.ts
      - src/world-v0-protocol.ts
      - src/world-v0-shared-yard.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-residual-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install test-only render hooks
        run: |
          node scripts/world-v0-smoothness-install-render-probe-v3.mjs
          node scripts/world-v0-smoothness-install-render-probe-v5.mjs
      - name: Start instrumented local Workerd copy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-render-v5-wrangler.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-render-v5-wrangler.log
          exit 1
      - name: Capture raw render samples from the qualified single-renderer topology
        env:
          MW_WORLD_V0_RENDER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_RENDER_LATENCY_MS: 90
          MW_WORLD_V0_RENDER_STRESS_MS: 9000
          MW_WORLD_V0_RENDER_OUTPUT: world-v0-smoothness-render-discontinuity-v5.json
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/world-v0-smoothness-render-discontinuity-v4-probe.mjs /tmp/world-v0-smoothness-render-discontinuity-v5-probe.mjs
          sed -i 's/await sleep(1500);/await sleep(3000);/' /tmp/world-v0-smoothness-render-discontinuity-v5-probe.mjs
          sed -i 's/assert(result.stressInfo.steps >= STRESS_MS \/ 20, "continuous-input stress did not run often enough");/assert(result.stressInfo.steps > 0, "continuous-input stress did not run");/' /tmp/world-v0-smoothness-render-discontinuity-v5-probe.mjs
          sed -i 's/sampleCount: samples.length,/sampleCount: samples.length, samples,/' /tmp/world-v0-smoothness-render-discontinuity-v5-probe.mjs
          timeout 240s node /tmp/world-v0-smoothness-render-discontinuity-v5-probe.mjs | tee world-v0-smoothness-render-discontinuity-v5.log
          grep -Eq 'SINGLE_RENDERER_NEGATIVE_CONTROL_DISCONTINUITY_REPRODUCED|SINGLE_RENDERER_NEGATIVE_CONTROL_NOT_REPRODUCED' world-v0-smoothness-render-discontinuity-v5.log
      - name: Characterize render-vs-physical trajectory residual
        env:
          MW_WORLD_V0_RENDER_INPUT: world-v0-smoothness-render-discontinuity-v5.json
          MW_WORLD_V0_RESIDUAL_OUTPUT: world-v0-smoothness-render-residual-v5.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-render-residual-analyze.mjs | tee world-v0-smoothness-render-residual-v5.log
          grep -Eq 'CORRECTION_ASSOCIATED_TRAJECTORY_RESIDUAL_OBSERVED|TRAJECTORY_RESIDUAL_NOT_SEPARATED' world-v0-smoothness-render-residual-v5.log
      - name: Restore canonical runtime source
        if: always()
        run: git checkout -- public/world-v0/app.js
      - name: Prove repository source is unchanged
        if: always()
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-render-residual-v5-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            world-v0-smoothness-render-discontinuity-v5.json
            world-v0-smoothness-render-discontinuity-v5.log
            world-v0-smoothness-render-residual-v5.json
            world-v0-smoothness-render-residual-v5.log
            world-v0-render-v5-wrangler.log
