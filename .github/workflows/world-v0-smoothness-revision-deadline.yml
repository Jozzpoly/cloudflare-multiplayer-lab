name: World V0 smoothness revision deadline diagnosis

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-revision-deadline.yml
      - scripts/world-v0-smoothness-revision-deadline-probe.mjs
      - src/world-v0-contract.ts
      - public/world-v0/app.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove mutable revision deadline margin collapse
        env:
          MW_WORLD_V0_REVISION_DEADLINE_OUTPUT: world-v0-smoothness-revision-deadline.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-smoothness-revision-deadline-probe.mjs | tee world-v0-smoothness-revision-deadline.log
          grep -q 'FUTURE_REVISION_DEADLINE_MARGIN_COLLAPSE_PROVEN' world-v0-smoothness-revision-deadline.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-revision-deadline-${{ github.run_id }}
          path: |
            world-v0-smoothness-revision-deadline.json
            world-v0-smoothness-revision-deadline.log
