name: World V0 smoothness substrate V20 qualification

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-substrate-v20.yml
      - scripts/world-v0-smoothness-materialize-substrate-v20.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-smoothness-substrate-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-integrated-substrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Materialize clean V20 candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-materialize-substrate-v20.mjs | tee world-v0-v20-materialize.log
          grep -q 'WORLD_V0_SMOOTHNESS_SUBSTRATE_V20_MATERIALIZED' world-v0-v20-materialize.log
          node --check public/world-v0/app.js
          grep -q 'WORLD_V0_SMOOTHNESS_SUBSTRATE_V20' public/world-v0/app.js
          grep -q 'predictionCeilingBoundary' public/world-v0/app.js
          grep -q 'flushQueuedCorrections("snapshot")' public/world-v0/app.js
          grep -q 'flushQueuedCorrections("frame")' public/world-v0/app.js
          ! grep -q '__mwV15' public/world-v0/app.js
          ! grep -q '__mwV18' public/world-v0/app.js
          ! grep -q 'WORLD_V0_PREDICTION_CEILING_V15' public/world-v0/app.js
          ! grep -q 'WORLD_V0_CORRECTION_BATCHING_V18' public/world-v0/app.js
          git diff --check

      - name: Run current repository checks against candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee world-v0-v20-check.log
          grep -q 'WORLD_V0_AUTHORITY_EPOCH_LOSS_CLASSIFIER_PASS' world-v0-v20-check.log
          grep -q 'WORLD_V0_JOIN_FAILURE_CLARITY_SMOKE_PASS' world-v0-v20-check.log

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-v20-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-v20-wrangler.pid
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "V20 Workerd ready"
              exit 0
            fi
            sleep 0.25
          done
          cat world-v0-v20-wrangler.log
          exit 1

      - name: Prove public-room solo to friend join product flow
        env:
          MW_WORLD_V0_ONGOING_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ONGOING_OUTPUT: world-v0-v20-product.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s node scripts/world-v0-ongoing-yard-product-chromium.mjs | tee world-v0-v20-product.log
          grep -q 'WORLD_V0_ONGOING_YARD_PUBLIC_FLOW_PASS' world-v0-v20-product.log

      - name: Requalify I1 ActorSession lifecycle
        env:
          MW_WORLD_V0_I1_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I1_RUN: v20-i1-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-integration-i1-lifecycle-probe.mjs | tee world-v0-v20-i1.log
          grep -q 'WORLD_V0_INTEGRATION_I1_SERVER_SESSION_PASS' world-v0-v20-i1.log
          grep -q '"oldEpochPreservedAt1800msAllDisconnected": true' world-v0-v20-i1.log
          grep -q '"oldEpochRetiredAfterGrace": true' world-v0-v20-i1.log

      - name: Requalify waiting-room fail-closed boundary
        env:
          MW_WORLD_V0_WAITING_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_WAITING_DROP_OUTPUT: world-v0-v20-waiting-room.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node scripts/world-v0-closure-waiting-room-drop-audit.mjs | tee world-v0-v20-waiting-room.log
          grep -q 'WORLD_V0_CLOSURE_WAITING_ROOM_FAIL_CLOSED_PASS' world-v0-v20-waiting-room.log

      - name: Requalify uncommitted-ready ambiguity recovery
        env:
          MW_WORLD_V0_UNCOMMITTED_READY_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_UNCOMMITTED_READY_OUTPUT: world-v0-v20-uncommitted-ready.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-uncommitted-ready-audit.mjs | tee world-v0-v20-uncommitted-ready.log
          grep -q 'WORLD_V0_CLOSURE_UNCOMMITTED_READY_RECOVERY_PASS' world-v0-v20-uncommitted-ready.log

      - name: Requalify partial prestart resume live-start gate
        env:
          MW_WORLD_V0_PRESTART_PARTIAL_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_PARTIAL_OUTPUT: world-v0-v20-prestart-partial.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-partial-resume-audit.mjs | tee world-v0-v20-prestart-partial.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_PARTIAL_RESUME_GATE_PASS' world-v0-v20-prestart-partial.log

      - name: Requalify bounded two-player prestart ambiguity grace
        env:
          MW_WORLD_V0_PRESTART_GRACE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_PRESTART_GRACE_OUTPUT: world-v0-v20-prestart-grace.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node scripts/world-v0-closure-prestart-grace-probe.mjs | tee world-v0-v20-prestart-grace.log
          grep -q 'WORLD_V0_CLOSURE_PRESTART_AMBIGUITY_GRACE_PASS' world-v0-v20-prestart-grace.log

      - name: Requalify committed-start ActorSession recovery window
        env:
          MW_WORLD_V0_START_WINDOW_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_START_WINDOW_OUTPUT: world-v0-v20-start-window.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-closure-start-window-audit.mjs | tee world-v0-v20-start-window.log
          grep -q 'WORLD_V0_CLOSURE_START_WINDOW_BROWSER_RECOVERY_PASS' world-v0-v20-start-window.log

      - name: Requalify cross-page ActorSession resume and exactness
        env:
          MW_WORLD_V0_CROSS_PAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_CROSS_PAGE_ROOM: yard-3
          MW_WORLD_V0_CROSS_PAGE_OUTPUT: world-v0-v20-cross-page.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-cross-page-resume-browser-audit.mjs | tee world-v0-v20-cross-page.log
          grep -q 'WORLD_V0_CROSS_PAGE_RESUME_PASS' world-v0-v20-cross-page.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e = JSON.parse(readFileSync("world-v0-v20-cross-page.json", "utf8"));
          if (e.original?.worldEpoch !== e.peerAfter?.worldEpoch) throw new Error("cross-page WorldEpoch drift");
          if (e.original?.actorSessionId !== e.peerAfter?.actorSessionId) throw new Error("cross-page ActorSession drift");
          if (e.original?.netEntityId !== e.peerAfter?.netEntityId) throw new Error("cross-page NetEntity drift");
          if (e.peerAfter?.guardMismatches !== 0 || e.ownerAfter?.guardMismatches !== 0) throw new Error("cross-page exact-state regression");
          console.log("WORLD_V0_V20_CROSS_PAGE_PASS");
          NODE

      - name: Requalify bounded all-transport-loss window
        env:
          MW_WORLD_V0_ALL_DROP_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_ALL_DROP_DELAYS: 500,1500,5000,11000,14500,19000,21000
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-closure-all-drop-window-probe.mjs | tee world-v0-v20-all-drop.log
          grep -q 'WORLD_V0_CLOSURE_ALL_DROP_WINDOW_MAPPED' world-v0-v20-all-drop.log
          for delay in 500 1500 5000 11000 14500 19000; do
            grep -E "WORLD_V0_ALL_DROP_CASE .*\"delayMs\":${delay}.*\"classification\":\"preserved\"" world-v0-v20-all-drop.log >/dev/null
          done
          grep -E 'WORLD_V0_ALL_DROP_CASE .*"delayMs":21000.*"classification":"retired"' world-v0-v20-all-drop.log >/dev/null

      - name: Requalify automatic ActorSession exact-rebase recovery
        env:
          MW_WORLD_V0_I4B_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_I4B_OFFLINE_MS: 14000
          MW_WORLD_V0_I4B_OUTPUT: world-v0-v20-i4b-chromium.json
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/world-v0-integration-i4b-authority-probe.mjs | tee world-v0-v20-i4b-authority.log
          node --experimental-strip-types scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee world-v0-v20-i4b-chromium.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_AUTHORITY_EXACT_REBASE_PASS' world-v0-v20-i4b-authority.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' world-v0-v20-i4b-chromium.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e = JSON.parse(readFileSync("world-v0-v20-i4b-chromium.json", "utf8"));
          if (e.actorSession?.preserved !== true || e.actorSession?.netEntityPreserved !== true) throw new Error("ActorSession identity regression");
          if (e.exactness?.guardMismatches !== 0) throw new Error("exact-state guard regression");
          console.log("WORLD_V0_V20_14S_ACTOR_RESUME_PASS");
          NODE

      - name: Requalify dual-browser hard-drop recovery edge
        env:
          MW_WORLD_V0_DUAL_BROWSER_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_DUAL_BROWSER_OFFLINE_MS: 14500
          MW_WORLD_V0_DUAL_BROWSER_OUTPUT: world-v0-v20-dual-browser.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node --experimental-strip-types scripts/world-v0-closure-dual-browser-grace-audit.mjs | tee world-v0-v20-dual-browser.log
          grep -q 'WORLD_V0_CLOSURE_DUAL_BROWSER_GRACE_PASS' world-v0-v20-dual-browser.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e = JSON.parse(readFileSync("world-v0-v20-dual-browser.json", "utf8"));
          if (!Array.isArray(e.clients) || e.clients.length !== 2) throw new Error("dual recovery missing clients");
          if (e.clients.some((client) => client.guardMismatches !== 0)) throw new Error("dual recovery exact-state regression");
          console.log("WORLD_V0_V20_DUAL_BROWSER_PASS");
          NODE

      - name: Requalify real Chromium human-entry truth
        env:
          MW_WORLD_V0_HUMAN_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_HUMAN_ENTRY_OUTPUT: world-v0-v20-human-entry.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-human-entry-browser-smoke.mjs | tee world-v0-v20-human-entry.log
          grep -q 'WORLD_V0_HUMAN_ENTRY_PASS' world-v0-v20-human-entry.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const e = JSON.parse(readFileSync("world-v0-v20-human-entry.json", "utf8"));
          if (e.peerTabCloseFreshReopenRejectedTruthfully !== true) throw new Error("foreign-profile reopen truth regression");
          if (e.healthyOwnerWorldEpochPreservedAcrossPeerReopen !== true) throw new Error("healthy owner continuity regression");
          console.log("WORLD_V0_V20_HUMAN_ENTRY_PASS");
          NODE

      - name: Restore canonical runtime source
        if: always()
        run: git checkout -- public/world-v0/app.js

      - name: Prove repository source is unchanged
        if: always()
        run: git diff --exit-code

      - name: Stop local Workerd
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/world-v0-v20-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-v20-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload V20 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-smoothness-substrate-v20-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            world-v0-v20-*.log
            world-v0-v20-*.json
