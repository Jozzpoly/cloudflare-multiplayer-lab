name: World V0 smoothness temporal policy tradeoff

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-temporal-policy-tradeoff.yml
      - scripts/world-v0-smoothness-temporal-policy-tradeoff-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-policy-tradeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Make split-lead tradeoff explicit
        env:
          MW_WORLD_V0_POLICY_OUTPUT: world-v0-smoothness-temporal-policy-tradeoff.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-temporal-policy-tradeoff-probe.mjs | tee world-v0-smoothness-temporal-policy-tradeoff.log
          grep -q 'SPLIT_LEAD_TEMPORAL_TRADEOFF_MADE_EXPLICIT' world-v0-smoothness-temporal-policy-tradeoff.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-smoothness-temporal-policy-tradeoff-${{ github.run_id }}
          path: |
            world-v0-smoothness-temporal-policy-tradeoff.json
            world-v0-smoothness-temporal-policy-tradeoff.log
