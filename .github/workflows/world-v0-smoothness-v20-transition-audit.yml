name: World V0 smoothness V20 transition audit

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-smoothness-v20-transition-audit.yml
      - scripts/world-v0-cross-page-resume-browser-audit.mjs
      - scripts/world-v0-smoothness-v20-silent-outage-recovery.mjs
      - scripts/world-v0-smoothness-materialize-substrate-v20.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-page-ab:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
        rep: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize candidate only
        if: matrix.mode == 'candidate'
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-materialize-substrate-v20.mjs
          node --check public/world-v0/app.js
      - name: Start fresh Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}-wrangler.log 2>&1 &
          echo $! > /tmp/v20-transition-wrangler.pid
          for i in {1..80}; do
            if curl -fsS "$BASE/api/ping" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}-wrangler.log
          exit 1
      - name: Run exact same cross-page audit
        env:
          MW_WORLD_V0_CROSS_PAGE_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_CROSS_PAGE_ROOM: yard-3
          MW_WORLD_V0_CROSS_PAGE_OUTPUT: world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/world-v0-cross-page-resume-browser-audit.mjs | tee world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}.log
          grep -q 'WORLD_V0_CROSS_PAGE_RESUME_PASS' world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}.log
      - name: Restore canonical runtime
        if: always() && matrix.mode == 'candidate'
        run: git checkout -- public/world-v0/app.js
      - name: Prove tracked source clean
        if: always()
        run: git diff --exit-code
      - name: Stop Workerd
        if: always()
        run: |
          if [ -f /tmp/v20-transition-wrangler.pid ]; then kill "$(cat /tmp/v20-transition-wrangler.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}.json
            world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}.log
            world-v0-v20-cross-page-${{ matrix.mode }}-${{ matrix.rep }}-wrangler.log

  silent-outage-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Materialize V20 candidate
        run: |
          set -euo pipefail
          node scripts/world-v0-smoothness-materialize-substrate-v20.mjs
          node --check public/world-v0/app.js
      - name: Start fresh Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-v20-silent-wrangler.log 2>&1 &
          echo $! > /tmp/v20-silent-wrangler.pid
          for i in {1..80}; do
            if curl -fsS "$BASE/api/ping" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat world-v0-v20-silent-wrangler.log
          exit 1
      - name: Prove traffic-only outage recovers exactly without false session loss
        env:
          MW_WORLD_V0_V20_SILENT_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_V20_SILENT_OFFLINE_MS: 14000
          MW_WORLD_V0_V20_SILENT_OUTPUT: world-v0-v20-silent-outage.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s node scripts/world-v0-smoothness-v20-silent-outage-recovery.mjs | tee world-v0-v20-silent-outage.log
          grep -q 'WORLD_V0_V20_SILENT_OUTAGE_EXACT_RECOVERY_PASS' world-v0-v20-silent-outage.log
      - name: Restore canonical runtime
        if: always()
        run: git checkout -- public/world-v0/app.js
      - name: Prove tracked source clean
        if: always()
        run: git diff --exit-code
      - name: Stop Workerd
        if: always()
        run: |
          if [ -f /tmp/v20-silent-wrangler.pid ]; then kill "$(cat /tmp/v20-silent-wrangler.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-v0-v20-silent-outage-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            world-v0-v20-silent-outage.json
            world-v0-v20-silent-outage.log
            world-v0-v20-silent-wrangler.log
