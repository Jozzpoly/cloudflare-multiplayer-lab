name: World V0 Validation

on:
  push:
    branches: [world-v0-shared-yard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-validation
  cancel-in-progress: true

jobs:
  local-regression:
    # Stable, causal default gate for ordinary product/presentation iteration.
    # It exercises the real Workerd authority contract and rendered browser
    # surfaces without making pass/fail depend on two requestAnimationFrame loops
    # surviving an arbitrarily starved hosted runner for ~150 active ticks.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Falsify peer-order authority stimulus coupling
        run: node scripts/world-v0-authority-stimulus-smoke.mjs

      - name: Start Shared Yard Worker/assets in local Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-local-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "local Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-local-wrangler.log
          exit 1

      - name: Exercise real Workerd authority, identity and canonical dead-man
        env:
          MW_WORLD_V0_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SKIP_PRODUCTION_ISOLATION: "1"
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-authority-local-evidence.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Render Shared Yard Product Lab decision matrix
        env:
          MW_WORLD_V0_LAB_BASE_URL: http://127.0.0.1:8787
        run: node scripts/world-v0-product-lab-smoke.mjs

      - name: Render real Shared Yard runtime shell at desktop and mobile viewports
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload local regression / visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-local-regression-evidence
          path: |
            world-v0-authority-local-evidence.json
            world-v0-product-lab-evidence.json
            world-v0-product-lab-*.png
            world-v0-runtime-shell-evidence.json
            world-v0-runtime-shell-*.png
            world-v0-local-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  local-workerd-chromium:
    # This remains the exact two-browser qualification gate. Its criteria are
    # intentionally unchanged. During VQ-H1 it also records a bounded same-SHA
    # launcher A/B; the current launcher remains the gating baseline until
    # evidence explicitly earns a default change.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[runtime-qualify]') || contains(github.event.head_commit.message, '[remote-staging]')
    needs: local-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Start exact Shared Yard Worker in local Workerd
        run: |
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-local-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "local Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-local-wrangler.log
          exit 1

      - name: Prepare local target variant of exact Chromium falsifier
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          let chromium = readFileSync("scripts/world-v0-chromium-cloud-smoke.mjs", "utf8");
          chromium = chromium.replace(
            'const STAGING_PAGE = "https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev/world-v0/";',
            'const STAGING_PAGE = "http://127.0.0.1:8787/world-v0/";',
          );
          writeFileSync("scripts/.world-v0-local-chromium-smoke.mjs", chromium);
          NODE

      - name: Run current Chromium launcher baseline
        id: chromium_current
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: current
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-chromium-local-current-evidence.json
        run: node scripts/.world-v0-local-chromium-smoke.mjs

      - name: Run explicit documented SwANGLE WebGL candidate
        id: chromium_swangle
        continue-on-error: true
        env:
          MW_WORLD_V0_CHROME_MODE: swangle-webgl
          MW_WORLD_V0_CHROMIUM_OUTPUT: world-v0-chromium-local-swangle-evidence.json
        run: node scripts/.world-v0-local-chromium-smoke.mjs

      - name: Preserve canonical local exact-state gate while recording A/B
        env:
          CURRENT_OUTCOME: ${{ steps.chromium_current.outcome }}
          SWANGLE_OUTCOME: ${{ steps.chromium_swangle.outcome }}
        run: |
          echo "current launcher: ${CURRENT_OUTCOME}"
          echo "swangle-webgl candidate: ${SWANGLE_OUTCOME}"
          if [ "${CURRENT_OUTCOME}" != "success" ]; then
            echo "Current canonical launcher did not pass; VQ-H1 must inspect evidence before changing defaults."
            exit 1
          fi

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Upload local exact-state qualification and launcher A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-local-workerd-chromium-evidence-attempt-${{ github.run_attempt }}
          path: |
            world-v0-chromium-local-current-evidence.json
            world-v0-chromium-local-swangle-evidence.json
            world-v0-local-wrangler.log
          if-no-files-found: warn
          retention-days: 14

  staging-cloud-smoke:
    # Remote staging qualification is explicit. [remote-staging] both deploys
    # through Workers Builds and requests the remote machine gate.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[remote-staging]')
    needs: local-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check Shared Yard staging authority smoke
        run: |
          node --check scripts/world-v0-authority-stimulus.mjs
          node scripts/world-v0-authority-stimulus-smoke.mjs
          node --check scripts/world-v0-authority-runtime-smoke.mjs

      - name: Verify staging authority, identity, dead-man and production isolation
        env:
          MW_WORLD_V0_AUTHORITY_OUTPUT: world-v0-authority-staging-evidence.json
        run: node scripts/world-v0-authority-runtime-smoke.mjs

      - name: Upload staging authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-authority-staging-evidence-attempt-${{ github.run_attempt }}
          path: world-v0-authority-staging-evidence.json
          if-no-files-found: warn
          retention-days: 14

  chromium-exact-state:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[remote-staging]')
    needs: staging-cloud-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check real Chromium falsifier
        run: node --check scripts/world-v0-chromium-cloud-smoke.mjs

      - name: Run two real Chromium Shared Yard clients with exact-state guard
        run: node scripts/world-v0-chromium-cloud-smoke.mjs

      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-chromium-cloud-evidence-attempt-${{ github.run_attempt }}
          path: world-v0-chromium-cloud-evidence.json
          if-no-files-found: warn
          retention-days: 14
