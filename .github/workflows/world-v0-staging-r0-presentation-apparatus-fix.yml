name: World V0 Staging R0 Presentation Apparatus Fix

on:
  push:
    branches:
      - world-v0-staging-r0-presentation-apparatus
    paths:
      - .github/workflows/world-v0-staging-r0-presentation-apparatus-fix.yml

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_BASE_URL: https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Update stale presentation expectations to R0 semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path('scripts/world-v0-session-friction-smoke.mjs')
          text = session.read_text()
          old = '''  rawPeer.close(1000, "session-smoke-peer-leave");
          await waitFor(cdp, sessionId, `(() => {
            const s = window.__sharedYardV0Session?.();
            return s?.restartAvailable === true && s?.networkState?.startsWith("closed") && !document.querySelector("#restart-round")?.classList.contains("hidden");
          })()`, "restart available after peer leaves");
          const ended = await cdp.evaluate(sessionId, `({ session: window.__sharedYardV0Session(), evidence: window.__sharedYardV0Evidence(), restartText: document.querySelector("#restart-round").textContent })`);
          assert(ended.evidence.runtimeFailed === false, `ended runtime failed ${ended.evidence.runtimeFailureReason}`);
          assert(ended.evidence.session?.end?.kind === "epoch-ended", `expected normal epoch-end classification ${JSON.stringify(ended.evidence.session?.end)}`);
          assert(ended.evidence.lifecycleEvents?.some((event) => event.type === "epoch-ended"), "epoch-ended lifecycle evidence missing");
          assert(ended.evidence.lifecycleEvents?.some((event) => event.type === "socket-close" && event.expectedAfterEpochEnd === true), "expected socket-close lifecycle classification missing");
          assert(ended.session.restartAvailable === true, "restart helper not available");
          assert(ended.restartText.includes("Restart"), `restart action label ${ended.restartText}`);

          await cdp.evaluate(sessionId, `document.querySelector("#restart-round").click(); true`);
          await waitFor(cdp, sessionId, `(() => {
            const s = window.__sharedYardV0Session?.();
            const e = window.__sharedYardV0Evidence?.();
            return s?.networkState === "waiting for peer" && e?.identity?.worldEpoch && e.identity.worldEpoch !== ${JSON.stringify(firstEpoch)};
          })()`, "fresh epoch restart");

          const restarted = await cdp.evaluate(sessionId, `({ session: window.__sharedYardV0Session(), evidence: window.__sharedYardV0Evidence(), inviteHidden: document.querySelector("#copy-invite").classList.contains("hidden"), restartHidden: document.querySelector("#restart-round").classList.contains("hidden") })`);
          assert(restarted.evidence.runtimeFailed === false, `restart runtime failed ${restarted.evidence.runtimeFailureReason}`);
          assert(restarted.evidence.identity.worldEpoch !== firstEpoch, "restart reused old world epoch");
          assert(restarted.evidence.protocolStartTick === null, `fresh waiting round unexpectedly active ${restarted.evidence.protocolStartTick}`);
          assert(restarted.session.runKey === run, `restart changed Run key ${restarted.session.runKey}`);
          assert(restarted.inviteHidden === false, "invite action missing after restart");
          assert(restarted.restartHidden === true, "restart should hide once new round is waiting");
'''
          new = '''  rawPeer.close(1000, "session-smoke-peer-leave");
          rawPeer = null;
          await waitFor(cdp, sessionId, `(() => {
            const s = window.__sharedYardV0Session?.();
            const e = window.__sharedYardV0Evidence?.();
            return s?.networkState === "waiting for peer" &&
              e?.identity?.worldEpoch && e.identity.worldEpoch !== ${JSON.stringify(firstEpoch)} &&
              e?.session?.roomRecovery?.pending === false &&
              e?.lifecycleEvents?.some((event) => event.type === "room-recovered" && event.sourceEpoch === ${JSON.stringify(firstEpoch)});
          })()`, "automatic same-room recovery after peer leaves");

          const recovered = await cdp.evaluate(sessionId, `({ session: window.__sharedYardV0Session(), evidence: window.__sharedYardV0Evidence(), inviteHidden: document.querySelector("#copy-invite").classList.contains("hidden"), restartHidden: document.querySelector("#restart-round").classList.contains("hidden") })`);
          assert(recovered.evidence.runtimeFailed === false, `recovery runtime failed ${recovered.evidence.runtimeFailureReason}`);
          assert(recovered.evidence.identity.worldEpoch !== firstEpoch, "room recovery reused old world epoch");
          assert(recovered.evidence.protocolStartTick === null, `recovered waiting epoch unexpectedly active ${recovered.evidence.protocolStartTick}`);
          assert(recovered.session.runKey === run, `room recovery changed Run key ${recovered.session.runKey}`);
          assert(recovered.session.restartAvailable === false, "manual restart remained primary after automatic recovery");
          assert(recovered.inviteHidden === false, "invite action missing after room recovery");
          assert(recovered.restartHidden === true, "restart action should stay hidden after automatic room recovery");
          assert(recovered.evidence.session?.roomRecovery?.lastRecoveredEpoch === recovered.evidence.identity.worldEpoch, `recovery provenance drift ${JSON.stringify(recovered.evidence.session?.roomRecovery)}`);
          assert(recovered.evidence.lifecycleEvents?.some((event) => event.type === "epoch-ended"), "epoch-ended lifecycle evidence missing");
          assert(recovered.evidence.lifecycleEvents?.some((event) => event.type === "room-recovered" && event.sourceEpoch === firstEpoch && event.recoveredEpoch === recovered.evidence.identity.worldEpoch), "room-recovered lifecycle evidence missing");
'''
          if text.count(old) != 1:
              raise SystemExit(f'session lifecycle seam count={text.count(old)}')
          text = text.replace(old, new, 1)

          old_result = '''    secondEpoch: restarted.evidence.identity.worldEpoch,
            inviteUrl: waiting.session.inviteUrl,
            waiting: {
              networkState: waiting.session.networkState,
              protocolStartTick: waiting.evidence.protocolStartTick,
            },
            ended: {
              networkState: ended.session.networkState,
              restartAvailable: ended.session.restartAvailable,
            },
            restarted: {
              networkState: restarted.session.networkState,
              protocolStartTick: restarted.evidence.protocolStartTick,
              runtimeFailed: restarted.evidence.runtimeFailed,
            },
          });
          writeFileSync(OUTPUT, JSON.stringify(result, null, 2));
          console.log("WORLD_V0_SESSION_FRICTION_PASS", JSON.stringify({ run, firstEpoch, secondEpoch: restarted.evidence.identity.worldEpoch }));'''
          new_result = '''    secondEpoch: recovered.evidence.identity.worldEpoch,
            inviteUrl: waiting.session.inviteUrl,
            waiting: {
              networkState: waiting.session.networkState,
              protocolStartTick: waiting.evidence.protocolStartTick,
            },
            recovery: {
              networkState: recovered.session.networkState,
              protocolStartTick: recovered.evidence.protocolStartTick,
              restartAvailable: recovered.session.restartAvailable,
              runtimeFailed: recovered.evidence.runtimeFailed,
              roomRecovery: recovered.evidence.session?.roomRecovery,
            },
          });
          writeFileSync(OUTPUT, JSON.stringify(result, null, 2));
          console.log("WORLD_V0_SESSION_FRICTION_PASS", JSON.stringify({ run, firstEpoch, secondEpoch: recovered.evidence.identity.worldEpoch, automaticRoomRecovery: true }));'''
          if text.count(old_result) != 1:
              raise SystemExit(f'session result seam count={text.count(old_result)}')
          session.write_text(text.replace(old_result, new_result, 1))

          shell = Path('scripts/world-v0-runtime-shell-smoke.mjs')
          text = shell.read_text()
          import_old = 'import { WORLD_V0_FRIEND_ENTRY_REVISION } from "../public/world-v0/friend-entry.js";\n'
          import_new = import_old + 'import { WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION } from "../public/world-v0/public-room-entry.js";\n'
          if text.count(import_old) != 1:
              raise SystemExit('shell import seam missing')
          text = text.replace(import_old, import_new, 1)

          text = text.replace(
            'claimBoundary: "Friend-Ready entry/session shell only; two-client shared-world correctness is covered by the dedicated friend-entry and exact-state falsifiers",',
            'claimBoundary: "Public-Room R0c entry/session shell only; shared-world correctness is covered by dedicated public-room, lifecycle and exact-state falsifiers",\n  publicRoomEntryRevision: WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION,',
            1,
          )

          wait_old = 'await waitFor(cdp, sessionId, `document.readyState === "complete" && document.querySelector("#enter")?.disabled === false && typeof window.__sharedYardV0FriendEntry === "function"`, "Friend-Ready desktop boot");'
          wait_new = 'await waitFor(cdp, sessionId, `(() => { const p=window.__sharedYardV0PublicRoomEntry?.(); return document.readyState === "complete" && document.querySelector("#enter")?.disabled === false && typeof window.__sharedYardV0FriendEntry === "function" && p?.revision === "world-v0-public-room-entry-r0c-v1" && p?.rooms?.length === 3 && p.loading === false; })()`, "Public Room desktop boot");'
          if text.count(wait_old) != 1:
              raise SystemExit('shell desktop boot wait seam missing')
          text = text.replace(wait_old, wait_new, 1)

          boot_fields_old = '''      diagnosticsOpen: document.querySelector("#hud")?.open,
                boot: rect("#boot"),
                name: rect("#callsign"),
                enterRect: rect("#enter"),'''
          boot_fields_new = '''      diagnosticsOpen: document.querySelector("#hud")?.open,
                publicRoom: window.__sharedYardV0PublicRoomEntry?.(),
                legacyEntryDisplay: getComputedStyle(document.querySelector("#boot .entry-actions")).display,
                boot: rect("#boot"),
                name: rect("#callsign"),
                firstYard: rect('[data-room-id="yard-1"]'),'''
          if text.count(boot_fields_old) != 1:
              raise SystemExit('shell desktop field seam missing')
          text = text.replace(boot_fields_old, boot_fields_new, 1)

          assertions_old = '''  assert(desktopBoot.status.includes("Enter your name"), `desktop friend-facing status drift ${desktopBoot.status}`);
          assert(desktopBoot.enter === "Enter world", `desktop primary action drift ${desktopBoot.enter}`);
          assert(desktopBoot.advancedOpen === false, "advanced/inspection should be closed by default");
          assert(desktopBoot.inspectInsideAdvanced === true, "Inspect solo escaped advanced entry surface");
          assert(/^yard-[A-Za-z0-9_-]{14}$/.test(desktopBoot.roomKey), `strong room key missing ${desktopBoot.roomKey}`);
          assert(desktopBoot.diagnosticsOpen === false, "diagnostics should be collapsed by default");
          assertRect(desktopBoot.boot, 1440, 900, "desktop boot");
          assertRect(desktopBoot.name, 1440, 900, "desktop name input");
          assertRect(desktopBoot.enterRect, 1440, 900, "desktop enter action");'''
          assertions_new = '''  assert(desktopBoot.status.includes("Choose a shared Yard"), `desktop public-room status drift ${desktopBoot.status}`);
          assert(desktopBoot.enter === "Enter world", `advanced compatibility action drift ${desktopBoot.enter}`);
          assert(desktopBoot.advancedOpen === false, "advanced/inspection should be closed by default");
          assert(desktopBoot.inspectInsideAdvanced === true, "Inspect solo escaped advanced entry surface");
          assert(/^yard-[A-Za-z0-9_-]{14}$/.test(desktopBoot.roomKey), `strong generated-room fallback missing ${desktopBoot.roomKey}`);
          assert(desktopBoot.publicRoom?.revision === WORLD_V0_PUBLIC_ROOM_ENTRY_REVISION, `public room revision drift ${JSON.stringify(desktopBoot.publicRoom)}`);
          assert(desktopBoot.publicRoom?.mode === "directory" && desktopBoot.publicRoom?.visible === true && desktopBoot.publicRoom?.rooms?.length === 3, `public room directory shell drift ${JSON.stringify(desktopBoot.publicRoom)}`);
          assert(desktopBoot.legacyEntryDisplay === "none", `legacy generated-room action remained primary ${desktopBoot.legacyEntryDisplay}`);
          assert(desktopBoot.diagnosticsOpen === false, "diagnostics should be collapsed by default");
          assertRect(desktopBoot.boot, 1440, 900, "desktop boot");
          assertRect(desktopBoot.name, 1440, 900, "desktop name input");
          assertRect(desktopBoot.firstYard, 1440, 900, "desktop first Yard action");'''
          if text.count(assertions_old) != 1:
              raise SystemExit('shell desktop assertions seam missing')
          text = text.replace(assertions_old, assertions_new, 1)

          click_old = '''  const suffix = Date.now().toString(36).slice(-7);
          await cdp.evaluate(sessionId, `(() => {
            const callsign = document.querySelector("#callsign");
            callsign.value = ${JSON.stringify(`shell-${suffix}`)};
            callsign.dispatchEvent(new Event("input", { bubbles: true }));
            document.querySelector("#enter").click();
            return true;
          })()`);'''
          click_new = '''  const suffix = Date.now().toString(36).slice(-7);
          const selectedRoom = await cdp.evaluate(sessionId, `(() => {
            const callsign = document.querySelector("#callsign");
            callsign.value = ${JSON.stringify(`shell-${suffix}`)};
            callsign.dispatchEvent(new Event("input", { bubbles: true }));
            const snapshot = window.__sharedYardV0PublicRoomEntry?.();
            const room = snapshot?.rooms?.find((item) => item.occupancy === 0 && item.joinable === true);
            if (!room) return null;
            document.querySelector(`[data-room-id="${room.id}"]`)?.click();
            return room.id;
          })()`);
          assert(selectedRoom, "no empty shared Yard available for shell entry");'''
          if text.count(click_old) != 1:
              raise SystemExit('shell click seam missing')
          text = text.replace(click_old, click_new, 1)

          waiting_fields_old = '''    uiRevision: window.__sharedYardV0Evidence?.().uiRevision,
            friendEntry: window.__sharedYardV0FriendEntry?.(),'''
          waiting_fields_new = '''    uiRevision: window.__sharedYardV0Evidence?.().uiRevision,
            friendEntry: window.__sharedYardV0FriendEntry?.(),
            publicRoomEntry: window.__sharedYardV0PublicRoomEntry?.(),'''
          if text.count(waiting_fields_old) != 1:
              raise SystemExit('shell waiting field seam missing')
          text = text.replace(waiting_fields_old, waiting_fields_new, 1)

          waiting_assert_old = '''  assert(desktopWaiting.status.includes("Waiting for friend"), `compact friend status drift ${desktopWaiting.status}`);
          assert(desktopWaiting.compact === true && desktopWaiting.inputsDisplay === "none", `compact entry shell failed ${JSON.stringify(desktopWaiting)}`);
          assert(desktopWaiting.inviteVisible === true && desktopWaiting.inviteText === "Invite friend", `invite action unavailable ${JSON.stringify(desktopWaiting)}`);
          assert(desktopWaiting.uiRevision === WORLD_V0_BROWSER_UI_REVISION, `UI revision drift ${desktopWaiting.uiRevision}`);
          assert(desktopWaiting.friendEntry?.mode === "host" && desktopWaiting.friendEntry?.roomKeyValid === true, `friend entry evidence drift ${JSON.stringify(desktopWaiting.friendEntry)}`);
          assert(new URL(desktopWaiting.inviteUrl).searchParams.get("run") === desktopWaiting.friendEntry.roomKey, `invite URL room drift ${desktopWaiting.inviteUrl}`);'''
          waiting_assert_new = '''  assert(desktopWaiting.status.includes("Waiting in this Yard"), `compact public-room status drift ${desktopWaiting.status}`);
          assert(desktopWaiting.compact === true && desktopWaiting.inputsDisplay === "none", `compact entry shell failed ${JSON.stringify(desktopWaiting)}`);
          assert(desktopWaiting.inviteVisible === true && desktopWaiting.inviteText === "Invite friend", `invite action unavailable ${JSON.stringify(desktopWaiting)}`);
          assert(desktopWaiting.uiRevision === WORLD_V0_BROWSER_UI_REVISION, `UI revision drift ${desktopWaiting.uiRevision}`);
          assert(desktopWaiting.friendEntry?.mode === "host" && desktopWaiting.friendEntry?.roomKey === selectedRoom, `friend entry room drift ${JSON.stringify(desktopWaiting.friendEntry)}`);
          assert(desktopWaiting.publicRoomEntry?.selectedRoom === selectedRoom, `public-room selection drift ${JSON.stringify(desktopWaiting.publicRoomEntry)}`);
          assert(new URL(desktopWaiting.inviteUrl).searchParams.get("run") === selectedRoom, `invite URL room drift ${desktopWaiting.inviteUrl}`);'''
          if text.count(waiting_assert_old) != 1:
              raise SystemExit('shell waiting assertion seam missing')
          shell.write_text(text.replace(waiting_assert_old, waiting_assert_new, 1))
          PY

          node --check scripts/world-v0-session-friction-smoke.mjs
          node --check scripts/world-v0-runtime-shell-smoke.mjs
          git diff --check
          git diff -- scripts/world-v0-session-friction-smoke.mjs scripts/world-v0-runtime-shell-smoke.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove corrected session lifecycle expectation against current R0 staging
        env:
          MW_WORLD_V0_SESSION_BASE_URL: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_SESSION_OUTPUT: world-v0-r0-session-apparatus.json
        run: node scripts/world-v0-session-friction-smoke.mjs

      - name: Prove corrected entry/shell expectation against current R0 staging
        env:
          MW_WORLD_V0_SHELL_BASE_URL: ${{ env.STAGING_BASE_URL }}
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-r0-shell-apparatus.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Commit apparatus-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world-v0-session-friction-smoke.mjs scripts/world-v0-runtime-shell-smoke.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "scripts/world-v0-runtime-shell-smoke.mjs scripts/world-v0-session-friction-smoke.mjs "
          git commit -m "test(world-v0): align staging presentation gates with R0"
          git push origin HEAD:world-v0-staging-r0-presentation-apparatus
