name: World V0 Staging R0 Promotion Prep

on:
  push:
    branches:
      - world-v0-staging-r0-promotion-prep
    paths:
      - .github/workflows/world-v0-staging-r0-promotion-prep.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_BRANCH: world-v0-public-room-r0
      SOURCE_SHA: 0c1aa4da68049b72b1c1f632a5a343d22675b27b
    steps:
      - name: Checkout prep branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact qualified R0 product and durable remote apparatus
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"

          git checkout "$SOURCE_SHA" -- \
            public/world-v0 \
            src/world-slice-entry.ts \
            scripts/world-v0-public-room-r0b-browser-smoke.mjs \
            scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs \
            scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs \
            scripts/world-v0-public-room-r0c-browser-smoke.mjs

          cat > .github/world-v0-product-source.json <<EOF
          {
            "productBranch": "$SOURCE_BRANCH",
            "productSourceSha": "$SOURCE_SHA"
          }
          EOF

          protected_paths=(
            public/world-v0
            src/world-v0-contract.ts
            src/world-v0-protocol.ts
            src/world-v0-shared-yard.ts
            src/box3d-runtime.ts
            src/world-slice-entry.ts
            wrangler.jsonc
            package.json
            package-lock.json
          )

          if ! git diff --quiet "$SOURCE_SHA" -- "${protected_paths[@]}"; then
            echo "Prep specimen does not exactly match qualified source on protected product/runtime paths."
            git diff --stat "$SOURCE_SHA" -- "${protected_paths[@]}"
            git diff --name-status "$SOURCE_SHA" -- "${protected_paths[@]}"
            exit 1
          fi

          node --check public/world-v0/friend-ready.js
          node --check public/world-v0/public-room-entry.js
          node --check scripts/world-v0-public-room-r0b-browser-smoke.mjs
          node --check scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs
          node --check scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs
          node --check scripts/world-v0-public-room-r0c-browser-smoke.mjs
          git diff --check
          echo "R0_STAGING_PREP_EXACT_PRODUCT_PASS source=$SOURCE_BRANCH@$SOURCE_SHA"

      - name: Install exact dependency graph
        run: npm ci

      - name: Full repository preflight
        run: npm run check

      - name: Commit materialized specimen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/world-v0 \
            src/world-slice-entry.ts \
            scripts/world-v0-public-room-r0b-browser-smoke.mjs \
            scripts/world-v0-public-room-r0b-freeze-recovery-smoke.mjs \
            scripts/world-v0-public-room-r0b-visibility-recovery-smoke.mjs \
            scripts/world-v0-public-room-r0c-browser-smoke.mjs \
            .github/world-v0-product-source.json
          git commit -m "chore(world-v0): prepare qualified public-room R0 staging delivery"
          git push origin HEAD:world-v0-staging-r0-promotion-prep
