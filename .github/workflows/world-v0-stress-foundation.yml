name: World V0 Stress Foundation

on:
  push:
    branches: [world-v0-capacity-cartography]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-stress-foundation
  cancel-in-progress: true

jobs:
  manifest-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check pure stress manifest
        run: |
          node --check public/world-v0-stress/phenomenon-manifest.js
          node --check scripts/world-v0-stress-manifest-smoke.mjs

      - name: Falsify Chaos DNA reproducibility
        run: node scripts/world-v0-stress-manifest-smoke.mjs
