name: World V0 Two-Phone Readiness Candidate

on:
  push:
    branches: [world-v0-two-phone-readiness-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-two-phone-readiness-candidate
  cancel-in-progress: true

env:
  SOURCE_RUNTIME: 5dd28a899c4f60c9227f1eb93026f571ced733e3
  TRANSFORM: scripts/world-v0-two-phone-interruption-transform.mjs

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate apparatus head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove apparatus starts from exact public runtime
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_RUNTIME^{commit}"
          protected=(public/world-v0 src wrangler.jsonc package.json package-lock.json)
          if ! git diff --quiet "$SOURCE_RUNTIME" -- "${protected[@]}"; then
            echo "Candidate apparatus must start from exact public product bytes."
            git diff --stat "$SOURCE_RUNTIME" -- "${protected[@]}"
            exit 1
          fi
          node --check "$TRANSFORM"
          node --check scripts/world-v0-two-phone-interruption-probe.mjs
          git diff --check

      - name: Apply bounded interruption candidate in worktree only
        run: |
          set -euo pipefail
          node "$TRANSFORM"
          git diff --check
          mapfile -t changed < <(git diff --name-only "$SOURCE_RUNTIME" -- public/world-v0 src wrangler.jsonc package.json package-lock.json)
          printf 'candidate product diff:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "public/world-v0/app.js"
          git diff --stat "$SOURCE_RUNTIME" -- public/world-v0/app.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Start transformed candidate in local Workerd
        run: |
          set -euo pipefail
          npx wrangler dev --env staging --ip 127.0.0.1 --port 8787 > world-v0-two-phone-candidate-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-two-phone-candidate.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo "two-phone candidate Workerd ready"
              exit 0
            fi
            sleep 1
          done
          cat world-v0-two-phone-candidate-wrangler.log
          exit 1

      - name: Re-run exact interruption and orientation falsifier
        env:
          MW_WORLD_V0_TWO_PHONE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_TWO_PHONE_OUTPUT: world-v0-two-phone-candidate.json
        run: node scripts/world-v0-two-phone-interruption-probe.mjs

      - name: Require candidate to close the measured blocker set
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const e = JSON.parse(fs.readFileSync("world-v0-two-phone-candidate.json", "utf8"));
          if (e.blockers?.length) throw new Error(`candidate still has blockers: ${JSON.stringify(e.blockers)}`);
          if (e.landscapeSafe !== true || e.portraitReturnSafe !== true || e.postRotationControls?.safe !== true) {
            throw new Error(`candidate regressed orientation/control envelope: ${JSON.stringify({landscapeSafe:e.landscapeSafe,portraitReturnSafe:e.portraitReturnSafe,postRotation:e.postRotationControls?.safe})}`);
          }
          if (e.verdict !== "WORLD_V0_TWO_PHONE_CURRENT_RELEASE_SAFE_IN_EMULATED_ENVELOPE") throw new Error(`unexpected verdict ${e.verdict}`);
          console.log("WORLD_V0_TWO_PHONE_CANDIDATE_CLOSES_MEASURED_BLOCKERS");
          NODE

      - name: Preserve existing camera / joystick interaction contract
        env:
          MW_WORLD_V0_PLAYABLE_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_PLAYABLE_OUTPUT: world-v0-two-phone-candidate-interaction.json
        run: node scripts/world-v0-playable-interaction-smoke.mjs

      - name: Preserve Friend-Ready desktop / portrait shell
        env:
          MW_WORLD_V0_SHELL_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_SHELL_OUTPUT: world-v0-two-phone-candidate-shell.json
        run: node scripts/world-v0-runtime-shell-smoke.mjs

      - name: Preserve Friend Entry journey
        env:
          MW_WORLD_V0_FRIEND_ENTRY_BASE_URL: http://127.0.0.1:8787
          MW_WORLD_V0_FRIEND_ENTRY_OUTPUT: world-v0-two-phone-candidate-friend-entry.json
        run: node scripts/world-v0-friend-entry-browser-smoke.mjs

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-two-phone-candidate.pid ]; then
            kill "$(cat /tmp/world-v0-two-phone-candidate.pid)" 2>/dev/null || true
          fi

      - name: Upload candidate evidence and transformed product byte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v0-two-phone-readiness-candidate
          path: |
            public/world-v0/app.js
            world-v0-two-phone-candidate.json
            world-v0-two-phone-candidate-interaction.json
            world-v0-two-phone-candidate-shell.json
            world-v0-two-phone-candidate-friend-entry.json
            world-v0-two-phone-candidate-wrangler.log
          if-no-files-found: warn
          retention-days: 14
