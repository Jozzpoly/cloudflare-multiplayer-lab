name: World V0 V28 materialized candidate

on:
  push:
    branches:
      - world-v0-smoothness-owner-candidate-v28
    paths:
      - .github/workflows/world-v0-v28-materialized-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialized-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Prove materialized runtime markers
        run: |
          set -euo pipefail
          grep -q 'jumpSequence' src/world-v0-protocol.ts
          grep -q 'jumpCausalHighWater: this.sortedPlayers()' src/world-v0-shared-yard.ts
          grep -q 'function causalJumpStep(' public/world-v0/app.js
          grep -q 'adoptJumpCausalSeed(seed.jumpCausalHighWater, "authority-rebase")' public/world-v0/app.js
          node --check scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs
          node --check scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs
          node --check scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs

      - name: Full repository gate
        run: npm run check

      - name: Install persistence apparatus only
        run: |
          set -euo pipefail
          MW_WORLD_V0_STRICT_FIFO_TARGET=world-v0-jump-delivery-persistence-audit.mjs \
            node scripts/world-v0-smoothness-install-strict-fifo-delay-proxy.mjs | tee candidate-fifo-install.log
          grep -q 'WORLD_V0_STRICT_FIFO_DELAY_PROXY_INSTALLED' candidate-fifo-install.log
          node scripts/world-v0-smoothness-install-jump-persistence-precondition-v28.mjs | tee candidate-precondition-install.log
          grep -q 'WORLD_V0_JUMP_PERSISTENCE_PRECONDITION_V28_INSTALLED' candidate-precondition-install.log
          node --check scripts/world-v0-jump-delivery-persistence-audit.mjs
          node --check scripts/world-v0-jump-delivery-persistence-stress.mjs

      - name: Start materialized authority runtime
        run: |
          set -euo pipefail
          setsid npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 --inspector-port 9230 \
            > candidate-wrangler.log 2>&1 &
          echo $! > candidate-wrangler.pid
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat candidate-wrangler.log
          exit 1

      - name: Requalify materialized persistence
        run: |
          set -euo pipefail
          MW_WORLD_V0_JUMP_DELIVERY_LOSS_DELAY_MS=700 \
          MW_WORLD_V0_JUMP_DELIVERY_RECOVERY_DELAY_MS=45 \
          MW_WORLD_V0_PERSISTENCE_STRESS_VARIANT=materialized-v28 \
          MW_WORLD_V0_PERSISTENCE_STRESS_ITERATIONS=16 \
          MW_WORLD_V0_PERSISTENCE_STRESS_MIN_QUALIFIED=8 \
          MW_WORLD_V0_PERSISTENCE_STRESS_OUTPUT=candidate-persistence-stress.json \
            timeout 900s node scripts/world-v0-jump-delivery-persistence-stress.mjs | tee candidate-persistence-stress.log
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('candidate-persistence-stress.json','utf8'));
          if (r.infrastructureFailures !== 0) throw new Error('apparatus/exactness failures ' + r.infrastructureFailures);
          if (r.semanticDelayedLandingFailures !== 0) throw new Error('delayed landing ' + r.semanticDelayedLandingFailures);
          if (r.passes < 8) throw new Error('insufficient qualified specimens ' + r.passes);
          if (r.passes + r.preconditionMisses !== 16) throw new Error('unclassified specimens');
          if (r.campaignVerdict !== 'WORLD_V0_PERSISTENCE_STRESS_QUALIFIED_NO_DELAYED_LANDING') throw new Error(r.campaignVerdict);
          console.log('V28_MATERIALIZED_PERSISTENCE_PASS', JSON.stringify({
            qualified:r.passes,
            misses:r.preconditionMisses,
            delayed:r.semanticDelayedLandingFailures,
            failures:r.infrastructureFailures
          }));
          NODE

      - name: Prove pending resume on materialized runtime
        run: |
          set -euo pipefail
          MW_WORLD_V0_PENDING_RESUME_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_PENDING_RESUME_OUTPUT=candidate-pending-resume.json \
            timeout 120s node scripts/world-v0-jump-pending-resume-highwater-v28-audit.mjs | tee candidate-pending-resume.log
          grep -q 'WORLD_V0_JUMP_PENDING_RESUME_HIGHWATER_V28_PASS' candidate-pending-resume.log

      - name: Prove peer and rebase parity on materialized runtime
        run: |
          set -euo pipefail
          MW_WORLD_V0_V28_PARITY_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_V28_PARITY_OUTPUT=candidate-peer-rebase.json \
            timeout 90s node scripts/world-v0-jump-v28-peer-rebase-parity-audit.mjs | tee candidate-peer-rebase.log
          grep -q 'WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS' candidate-peer-rebase.log

          MW_WORLD_V0_I4B_BASE=http://127.0.0.1:8787 \
          MW_WORLD_V0_I4B_PROXY_PORT=8797 \
          MW_WORLD_V0_I4B_OUTPUT=candidate-i4b-rebase.json \
            timeout 120s node scripts/world-v0-integration-i4b-chromium-rebase-audit.mjs | tee candidate-i4b-rebase.log
          grep -q 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS' candidate-i4b-rebase.log

      - name: Final qualification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('candidate-persistence-stress.json','utf8'));
          const r = JSON.parse(fs.readFileSync('candidate-pending-resume.json','utf8'));
          const x = JSON.parse(fs.readFileSync('candidate-peer-rebase.json','utf8'));
          const b = JSON.parse(fs.readFileSync('candidate-i4b-rebase.json','utf8'));
          if (r.verdict !== 'WORLD_V0_JUMP_PENDING_RESUME_HIGHWATER_V28_PASS') throw new Error(r.verdict);
          if (x.verdict !== 'WORLD_V0_JUMP_V28_PEER_REBASE_PARITY_PASS') throw new Error(x.verdict);
          if (b.verdict !== 'WORLD_V0_INTEGRATION_I4B_REAL_CHROMIUM_EXACT_REBASE_PASS') throw new Error(b.verdict);
          console.log('WORLD_V0_V28_MATERIALIZED_CANDIDATE_PASS', JSON.stringify({
            persistence:{qualified:p.passes,misses:p.preconditionMisses},
            pendingResume:{sequence:r.canonical && r.canonical.jumpSequence,highWater:r.resumeLastJumpSequence},
            peerRebase:{sequence:x.sequence,watermark:x.resumed && x.resumed.selfLastConsumedJumpSequence},
            browserRebase:{gapTicks:b.gap && b.gap.gapTicks,guardMismatches:b.exactness && b.exactness.guardMismatches}
          }));
          NODE

      - name: Stop runtime and restore apparatus
        if: always()
        run: |
          set +e
          if [ -f candidate-wrangler.pid ]; then
            pid="$(cat candidate-wrangler.pid)"
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 0.5
            kill -KILL -- "-$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          git checkout -- scripts/world-v0-jump-delivery-persistence-audit.mjs
          rm -f worker-configuration.d.ts
          git diff --exit-code

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-materialized-candidate-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            candidate-persistence-stress.json
            candidate-persistence-stress.log
            persistence-stress-materialized-v28-*.json
            persistence-stress-materialized-v28-*.log
            candidate-pending-resume.json
            candidate-pending-resume.log
            candidate-peer-rebase.json
            candidate-peer-rebase.log
            candidate-i4b-rebase.json
            candidate-i4b-rebase.log
            candidate-wrangler.log
            candidate-fifo-install.log
            candidate-precondition-install.log
