name: World V0 V28 exact Owner staging delivery

on:
  push:
    branches:
      - world-v0-smoothness-owner-delivery-v28
    paths:
      - .github/workflows/world-v0-v28-owner-staging-delivery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v0-v28-owner-staging-delivery
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_SHA: 1e42dfd6bed9ea1df0451ae5e651e63be1615bf5
  EXPECTED_CANDIDATE_BRANCH: world-v0-smoothness-owner-candidate-v28
  EXPECTED_STAGING_WORKER: cloudflare-multiplayer-lab-staging
  STAGING_BASE_URL: https://cloudflare-multiplayer-lab-staging.jozzpoly.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 566456b8f2f4d9f85b3fa8173e190c1a

jobs:
  deliver-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualified candidate
        uses: actions/checkout@v7
        with:
          ref: 1e42dfd6bed9ea1df0451ae5e651e63be1615bf5
          fetch-depth: 1

      - name: Prove frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA"
          remote="$(git ls-remote origin "refs/heads/$EXPECTED_CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_CANDIDATE_SHA"
          echo "V28_OWNER_DELIVERY_EXACT_HEAD=$actual"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Prove isolated staging target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const staging = config.env?.staging;
          if (!staging) throw new Error("wrangler env.staging missing");
          if (staging.name !== process.env.EXPECTED_STAGING_WORKER) throw new Error("staging target drift " + staging.name);
          if (config.name === staging.name) throw new Error("staging aliases production/root worker " + config.name);
          if (staging.workers_dev !== true) throw new Error("staging workers_dev must stay enabled");
          const bindings = staging.durable_objects?.bindings || [];
          if (!bindings.some((binding) => binding.name === "SHARED_YARD_V0" && binding.class_name === "SharedYardV0")) {
            throw new Error("staging SharedYardV0 binding missing");
          }
          const workerFirst = staging.assets?.run_worker_first || [];
          if (!workerFirst.includes("/world-v0/ws")) throw new Error("staging world-v0 websocket route missing");
          console.log("V28_OWNER_STAGING_TARGET_PASS root=" + config.name + " staging=" + staging.name);
          NODE
          npm run test:staging-deploy-guard
          npm run validate:staging-contract

      - name: Dry-run exact staging candidate
        run: npx wrangler deploy --dry-run --env staging --outdir .wrangler/v28-owner-staging-dry-run

      - name: Require Cloudflare staging credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare isolated staging credential present"

      - name: Deploy only isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:staging

      - name: Prove public assets match exact candidate without touching a Yard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const base = process.env.STAGING_BASE_URL.replace(/\/$/, "");
          const expectedSha = process.env.EXPECTED_CANDIDATE_SHA;
          const assets = [
            "world-v0/app.js",
            "world-v0/entry.js",
            "world-v0/build-contract.js",
          ];
          const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const deadline = Date.now() + 120000;
          let last = null;

          while (Date.now() < deadline) {
            try {
              const comparisons = [];
              let allEqual = true;
              for (const asset of assets) {
                const local = await readFile("public/" + asset);
                const response = await fetch(base + "/" + asset + "?candidate=" + expectedSha + "&t=" + Date.now(), {
                  cache: "no-store",
                  signal: AbortSignal.timeout(8000),
                });
                const remote = Buffer.from(await response.arrayBuffer());
                const entry = {
                  asset,
                  status: response.status,
                  localBytes: local.length,
                  remoteBytes: remote.length,
                  localSha256: digest(local),
                  remoteSha256: digest(remote),
                };
                entry.equal = response.ok && entry.localBytes === entry.remoteBytes && entry.localSha256 === entry.remoteSha256;
                if (!entry.equal) allEqual = false;
                comparisons.push(entry);
              }

              const ping = await fetch(base + "/api/ping?candidate=" + expectedSha + "&t=" + Date.now(), {
                cache: "no-store",
                signal: AbortSignal.timeout(8000),
              });
              const pingText = await ping.text();
              last = { candidateSha: expectedSha, assets: comparisons, ping: { status: ping.status, body: pingText.slice(0, 300) } };
              if (allEqual && ping.ok) {
                last.verdict = "WORLD_V0_V28_OWNER_STAGING_EXACT_DELIVERY_PASS";
                await writeFile("v28-owner-staging-delivery.json", JSON.stringify(last, null, 2));
                console.log(last.verdict, JSON.stringify(last));
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          await writeFile("v28-owner-staging-delivery.json", JSON.stringify({ verdict: "WORLD_V0_V28_OWNER_STAGING_EXACT_DELIVERY_FAIL", last }, null, 2));
          throw new Error("exact V28 staging delivery not visible: " + JSON.stringify(last));
          NODE

      - name: Upload exact delivery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-v0-v28-owner-staging-delivery-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            v28-owner-staging-delivery.json
            .wrangler/v28-owner-staging-dry-run
