name: World V0 Vacant Capacity Refinement

on:
  push:
    branches: [world-v0-foundation-stabilization-closure]
    paths:
      - scripts/apply-world-v0-vacant-capacity-refinement-v3.mjs

permissions:
  contents: write

concurrency:
  group: world-v0-vacant-capacity-refinement
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: npm ci

      - name: Apply fail-closed refinement
        run: |
          set -euo pipefail
          node scripts/apply-world-v0-vacant-capacity-refinement-v3.mjs
          git diff --check
          node --check public/world-v0/public-room-entry.js
          node --check public/world-v0/friend-ready.js
          node --check scripts/world-v0-vacant-capacity-authority-probe.mjs
          node --check scripts/world-v0-presence-capacity-presentation-smoke.mjs

      - name: Static and historical local checks
        run: |
          set -euo pipefail
          npm run check
          node scripts/world-v0-presence-capacity-presentation-smoke.mjs

      - name: Start local reliability Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --env reliability_play --ip 127.0.0.1 --port 8787 > world-v0-vacant-capacity-wrangler.log 2>&1 &
          echo $! > /tmp/world-v0-vacant-capacity-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/ping >/dev/null; then
              echo WORLD_V0_VACANT_CAPACITY_LOCAL_WORKER_READY
              exit 0
            fi
            sleep 1
          done
          cat world-v0-vacant-capacity-wrangler.log
          exit 1

      - name: Prove vacant capacity race contract
        env:
          MW_WORLD_V0_VACANT_BASE: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-vacant-capacity-authority-probe.mjs | tee world-v0-vacant-capacity-authority.log
          grep -q WORLD_V0_VACANT_CAPACITY_AUTHORITY_PASS world-v0-vacant-capacity-authority.log

      - name: Preserve existing soft-reservation causal contract
        env:
          MW_WORLD_V0_SOFT_BASE: http://127.0.0.1:8787
          MW_WORLD_V0_SOFT_ROOM: yard-3
        run: |
          set -euo pipefail
          timeout 120s node scripts/world-v0-soft-reservation-authority-probe.mjs | tee world-v0-soft-reservation-authority.log
          grep -q WORLD_V0_SOFT_RESERVATION_AUTHORITY_PASS world-v0-soft-reservation-authority.log

      - name: Commit qualified source refinement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world-v0-shared-yard.ts src/world-slice-entry.ts public/world-v0/public-room-entry.js public/world-v0/friend-ready.js scripts/world-v0-soft-reservation-authority-probe.mjs scripts/world-v0-session-continuity-r3-smoke.mjs
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Refine vacant room capacity semantics"
          git push origin HEAD:world-v0-foundation-stabilization-closure

      - name: Upload refinement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-v0-vacant-capacity-${{ github.run_id }}
          path: |
            world-v0-vacant-capacity-authority.log
            world-v0-soft-reservation-authority.log
            world-v0-vacant-capacity-wrangler.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop local Workerd
        if: always()
        run: |
          if [ -f /tmp/world-v0-vacant-capacity-wrangler.pid ]; then
            kill "$(cat /tmp/world-v0-vacant-capacity-wrangler.pid)" 2>/dev/null || true
          fi
