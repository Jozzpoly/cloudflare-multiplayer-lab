name: World V0 validation topology gap audit

on:
  push:
    branches:
      - world-v0-smoothness-reliability-campaign
    paths:
      - .github/workflows/world-v0-validation-topology-audit.yml
      - scripts/world-v0-validation-topology-audit.mjs
      - package.json
      - .github/workflows/ci.yml
      - .github/workflows/world-v0-current-validation.yml
      - .github/workflows/world-v0-ongoing-yard-product.yml
      - .github/workflows/world-v0-ongoing-yard-staging.yml
      - .github/workflows/world-v0-foundation-stabilization-causal-gate.yml
      - .github/workflows/world-v0-owner-ui-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove current validation topology gaps
        shell: bash
        env:
          MW_WORLD_V0_VALIDATION_TOPOLOGY_OUTPUT: world-v0-validation-topology-audit.json
        run: |
          set -euo pipefail
          node scripts/world-v0-validation-topology-audit.mjs | tee world-v0-validation-topology-audit.log
          grep -q 'VALIDATION_TOPOLOGY_COVERAGE_GAPS_PROVEN' world-v0-validation-topology-audit.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: world-v0-validation-topology-${{ github.run_id }}
          path: |
            world-v0-validation-topology-audit.json
            world-v0-validation-topology-audit.log
