name: WS0 A1 Public Soak

on:
  push:
    branches: [world-slice-0-embodied-3d-place]

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact A1 runtime and soak
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://cloudflare-multiplayer-lab.jozzpoly.workers.dev/api/world0';
          const expectedRevision = 'ws0-a1-v1';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function call(action) {
            const url = new URL(base);
            url.searchParams.set('action', action);
            const response = await fetch(url);
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); }
            catch { payload = { parseError: true, text }; }
            return { response, payload };
          }

          let ready = false;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const { response, payload } = await call('status');
            console.log(`deploy-wait attempt=${attempt} http=${response.status} revision=${payload.revision ?? 'none'}`);
            if (response.ok && payload.revision === expectedRevision) {
              ready = true;
              break;
            }
            await sleep(5000);
          }
          if (!ready) throw new Error('WS0 A1 runtime did not deploy within retry window');

          await call('stop');
          const started = await call('start');
          if (!started.response.ok || started.payload.ok !== true || started.payload.active !== true) {
            throw new Error(`start failed: ${JSON.stringify(started.payload)}`);
          }
          const runId = started.payload.runId;
          const observations = [];

          for (let poll = 0; poll < 12; poll += 1) {
            await sleep(5000);
            const status = await call('status');
            const p = status.payload;
            if (!status.response.ok || p.ok !== true || p.runId !== runId) {
              throw new Error(`status failed: ${JSON.stringify(p)}`);
            }
            if (p.failure !== null || p.checks?.finite !== true) {
              throw new Error(`runtime failure: ${JSON.stringify(p)}`);
            }
            observations.push(p);
            console.log(
              `poll=${poll + 1} tick=${p.tick} expected=${Number(p.expectedTicks).toFixed(1)} ` +
              `ratio=${Number(p.tickRatio).toFixed(4)} dropped=${p.droppedTicks} catchup=${p.catchupSteps} ` +
              `p95=${p.pumpIntervalMsP95} propMoved=${p.checks?.propMoved} maxMove=${Number(p.maxPropDisplacement).toFixed(3)}`
            );
          }

          const stopped = await call('stop');
          const final = observations.at(-1);
          if (!stopped.response.ok || stopped.payload.ok !== true || stopped.payload.runId !== runId) {
            throw new Error(`stop failed: ${JSON.stringify(stopped.payload)}`);
          }
          if (!(final.durationMs >= 50000)) throw new Error(`insufficient duration: ${JSON.stringify(final)}`);
          if (final.checks?.propMoved !== true) throw new Error(`props never moved: ${JSON.stringify(final)}`);

          console.log('WS0_A1_FINAL');
          console.log(JSON.stringify(final, null, 2));
          NODE
