name: WS0 A2 Client Smoke

on:
  push:
    branches: [world-slice-0-embodied-3d-place]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for client deployment and verify routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = 'https://cloudflare-multiplayer-lab.jozzpoly.workers.dev';
          const expectedClient = 'ws0-a2-client-v2';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let deployed = false;
          for (let attempt = 1; attempt <= 36; attempt += 1) {
            const response = await fetch(`${origin}/world0/app.js`, { cache: 'no-store' });
            const text = await response.text();
            console.log(`deploy-wait attempt=${attempt} http=${response.status} client=${text.includes(expectedClient)}`);
            if (response.ok && text.includes(expectedClient)) {
              deployed = true;
              break;
            }
            await sleep(5000);
          }
          if (!deployed) throw new Error('A2 client revision did not deploy');

          const page = await fetch(`${origin}/world0/`, { cache: 'no-store' });
          const pageText = await page.text();
          if (!page.ok || !pageText.includes('Embodied contact baseline')) throw new Error(`world0 page failed: ${page.status}`);

          const three = await fetch('https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js');
          const threeText = await three.text();
          if (!three.ok || !threeText.includes('REVISION')) throw new Error(`Three.js module unavailable: ${three.status}`);

          const ws = new WebSocket('wss://cloudflare-multiplayer-lab.jozzpoly.workers.dev/world0/ws?player=ClientSmoke');
          let welcome = null;
          let snapshot = null;
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(String(event.data));
            if (message.type === 'welcome') welcome = message;
            if (message.type === 'snapshot') snapshot = message;
          });

          for (let attempt = 0; attempt < 50 && !welcome; attempt += 1) await sleep(100);
          if (!welcome) throw new Error('missing websocket welcome');

          for (let seq = 1; seq <= 20; seq += 1) {
            ws.send(JSON.stringify({ type: 'input', seq, x: 1, z: 0 }));
            await sleep(66);
          }
          for (let attempt = 0; attempt < 30 && !snapshot; attempt += 1) await sleep(100);
          if (!snapshot) throw new Error('missing authoritative snapshot');
          if (snapshot.telemetry?.finite !== true) throw new Error('non-finite world state');
          if (snapshot.telemetry?.droppedTicks !== 0) throw new Error(`dropped ticks: ${snapshot.telemetry?.droppedTicks}`);

          const self = snapshot.players.find((player) => player.sessionId === welcome.selfSessionId);
          if (!self) throw new Error('self missing from snapshot');
          if (!(self.ack > 0)) throw new Error(`input ack missing: ${self.ack}`);

          console.log('WS0_A2_CLIENT_SMOKE');
          console.log(JSON.stringify({
            clientRevision: expectedClient,
            serverRevision: welcome.revision,
            threeModuleBytes: threeText.length,
            tick: snapshot.tick,
            ack: self.ack,
            telemetry: snapshot.telemetry,
          }, null, 2));
          ws.close(1000, 'client_smoke_complete');
          NODE
