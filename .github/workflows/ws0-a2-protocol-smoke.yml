name: WS0 A2 Protocol Smoke

on:
  push:
    branches: [world-slice-0-embodied-3d-place]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for A2 revision and drive one physical actor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const http = 'https://cloudflare-multiplayer-lab.jozzpoly.workers.dev/api/world0?action=status';
          const wsUrl = 'wss://cloudflare-multiplayer-lab.jozzpoly.workers.dev/world0/ws?player=ProtocolSmoke';
          const expectedRevision = 'ws0-a2-protocol-v1';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const response = await fetch(http);
            const payload = await response.json().catch(() => ({}));
            console.log(`deploy-wait attempt=${attempt} http=${response.status} revision=${payload.revision ?? 'none'}`);
            if (response.ok && payload.revision === expectedRevision) break;
            if (attempt === 30) throw new Error('A2 revision did not deploy');
            await sleep(5000);
          }

          const ws = new WebSocket(wsUrl);
          const messages = [];
          let welcome = null;
          let firstSnapshot = null;
          let lastSnapshot = null;
          let opened = false;

          ws.addEventListener('open', () => { opened = true; });
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(String(event.data));
            messages.push(message);
            if (message.type === 'welcome') welcome = message;
            if (message.type === 'snapshot') {
              if (!firstSnapshot) firstSnapshot = message;
              lastSnapshot = message;
            }
          });

          for (let i = 0; i < 50 && !welcome; i += 1) await sleep(100);
          if (!opened || !welcome) throw new Error(`missing welcome: ${JSON.stringify(messages.slice(0, 3))}`);

          let seq = 0;
          for (let i = 0; i < 60; i += 1) {
            seq += 1;
            ws.send(JSON.stringify({ type: 'input', seq, x: 1, z: 0 }));
            await sleep(66);
          }
          for (let i = 0; i < 10; i += 1) {
            seq += 1;
            ws.send(JSON.stringify({ type: 'input', seq, x: 0, z: 0 }));
            await sleep(66);
          }
          await sleep(700);

          if (!firstSnapshot || !lastSnapshot) throw new Error('missing snapshots');
          const selfId = welcome.selfSessionId;
          const firstSelf = firstSnapshot.players.find((p) => p.sessionId === selfId);
          const lastSelf = lastSnapshot.players.find((p) => p.sessionId === selfId);
          if (!firstSelf || !lastSelf) throw new Error('self missing from snapshot');
          const moved = Math.hypot(lastSelf.position[0] - firstSelf.position[0], lastSelf.position[2] - firstSelf.position[2]);
          const firstProps = new Map(firstSnapshot.props.map((p) => [p.id, p.position]));
          let maxPropDelta = 0;
          for (const prop of lastSnapshot.props) {
            const first = firstProps.get(prop.id);
            if (!first) continue;
            maxPropDelta = Math.max(maxPropDelta, Math.hypot(prop.position[0] - first[0], prop.position[2] - first[2]));
          }
          if (!(moved > 2)) throw new Error(`actor did not move enough: ${moved}`);
          if (!(maxPropDelta > 0.25)) throw new Error(`actor did not physically move props: ${maxPropDelta}`);
          if (!(lastSelf.ack >= seq - 1)) throw new Error(`input ack lagged unexpectedly: ack=${lastSelf.ack} seq=${seq}`);
          if (lastSnapshot.telemetry?.finite !== true) throw new Error('non-finite state');
          if (lastSnapshot.telemetry?.droppedTicks !== 0) throw new Error(`dropped ticks: ${lastSnapshot.telemetry?.droppedTicks}`);

          console.log('WS0_A2_PROTOCOL_RESULT');
          console.log(JSON.stringify({
            selfSessionId: selfId,
            actorMoved: moved,
            maxPropDelta,
            ack: lastSelf.ack,
            sentSeq: seq,
            snapshotSequence: lastSnapshot.sequence,
            tick: lastSnapshot.tick,
            telemetry: lastSnapshot.telemetry,
          }, null, 2));
          ws.close(1000, 'smoke_complete');
          NODE
