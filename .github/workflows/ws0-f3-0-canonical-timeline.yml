name: WS0 F3.0 Canonical Timeline Discriminator

on:
  push:
    branches: [ws0-sync-timeline-f3-buffered-input]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f3-0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate repository
        run: npm run check

      - name: Run F3.0 timing discriminator
        run: node scripts/ws0-f3-0-canonical-timeline.mjs

      - name: Upload F3.0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws0-f3-0-canonical-timeline
          path: ws0-f3-0-canonical-timeline.json
          if-no-files-found: error
