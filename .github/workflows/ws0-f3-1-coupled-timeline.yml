name: WS0 F3.1 Coupled Timeline Discriminator

on:
  push:
    branches: [ws0-sync-f3-1-coupled-timeline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f3-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate repository
        run: npm run check

      - name: Run F3.1 coupled discriminator
        run: node scripts/ws0-f3-1-runner.mjs

      - name: Independently audit F3.1 evidence
        run: node scripts/ws0-f3-1-audit.mjs

      - name: Upload F3.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws0-f3-1-coupled-timeline
          path: ws0-f3-1-coupled-timeline.json
          if-no-files-found: error
