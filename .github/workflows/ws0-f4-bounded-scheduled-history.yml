name: WS0 F4 Bounded Scheduled History

on:
  push:
    branches: [ws0-sync-f4-bounded-scheduled-history]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate repository
        run: npm run check

      - name: Run F4 bounded scheduled history and overlap probes
        run: node scripts/ws0-f4-bounded-scheduled-history.mjs

      - name: Run F4 identity lifecycle probe
        run: node scripts/ws0-f4-identity-lifecycle.mjs

      - name: Independently audit F4 evidence
        run: node scripts/ws0-f4-audit.mjs

      - name: Upload F4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws0-f4-bounded-scheduled-history
          path: |
            ws0-f4-bounded-scheduled-history.json
            ws0-f4-identity-lifecycle.json
          if-no-files-found: error
