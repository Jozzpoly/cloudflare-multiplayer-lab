name: WS0 Player Contact Isolation

on:
  pull_request:
    paths:
      - "scripts/ws0-player-contact-isolation.mjs"
      - "scripts/rc1-integrated-causality-envelope.mjs"
      - "public/world0-rc1/**"
      - "src/world-slice-0-two-client.ts"
      - "src/world-slice-entry.ts"
      - ".github/workflows/ws0-player-contact-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-player-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate research wrapper and preserved browser runner
        run: |
          node --check scripts/ws0-player-contact-isolation.mjs
          node --check public/world0-rc1/runner.js

      - name: Run player contact causal isolation
        run: node scripts/ws0-player-contact-isolation.mjs

      - name: Preserve player-contact evidence
        if: always() && hashFiles('ws0-player-contact-isolation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ws0-player-contact-isolation
          path: ws0-player-contact-isolation.json
          if-no-files-found: error
