name: WS0 Tick Domain T0

on:
  pull_request:
    paths:
      - "scripts/ws0-tick-domain-t0.mjs"
      - ".github/workflows/ws0-tick-domain-t0.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  tick-domain-t0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate T0 apparatus
        run: node --check scripts/ws0-tick-domain-t0.mjs

      - name: Run deterministic tick-domain T0
        run: node scripts/ws0-tick-domain-t0.mjs

      - name: Preserve T0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws0-tick-domain-t0
          path: ws0-tick-domain-t0.json
          if-no-files-found: ignore
