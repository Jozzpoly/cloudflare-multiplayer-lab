name: WS0 Tick Domain T3 Velocity Convergence

on:
  pull_request:
    paths:
      - "scripts/ws0-tick-domain-t0.mjs"
      - "scripts/ws0-tick-domain-t1-actor-state.mjs"
      - "scripts/ws0-tick-domain-t2-snapshot-age.mjs"
      - "scripts/ws0-tick-domain-t3-velocity-convergence.mjs"
      - ".github/workflows/ws0-tick-domain-t3-velocity-convergence.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  tick-domain-t3-velocity-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate apparatus
        run: |
          node --check scripts/ws0-tick-domain-t0.mjs
          node --check scripts/ws0-tick-domain-t1-actor-state.mjs
          node --check scripts/ws0-tick-domain-t2-snapshot-age.mjs
          node --check scripts/ws0-tick-domain-t3-velocity-convergence.mjs
      - name: Re-run T2 controls
        run: WS0_TICK_T2_OUTPUT=ws0-tick-domain-t2-regression.json node scripts/ws0-tick-domain-t2-snapshot-age.mjs
      - name: Run T3 velocity-convergence envelope
        run: node scripts/ws0-tick-domain-t3-velocity-convergence.mjs
      - name: Preserve T2/T3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws0-tick-domain-t3-velocity-convergence
          path: |
            ws0-tick-domain-t2-regression.json
            ws0-tick-domain-t3-velocity-convergence.json
          if-no-files-found: ignore
