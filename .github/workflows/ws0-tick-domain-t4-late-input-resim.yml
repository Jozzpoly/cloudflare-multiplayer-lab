name: WS0 Tick Domain T4 Late Input Resim

on:
  pull_request:
    paths:
      - "scripts/ws0-tick-domain-t0.mjs"
      - "scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs"
      - ".github/workflows/ws0-tick-domain-t4-late-input-resim.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  tick-domain-t4-late-input-resim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate apparatus
        run: |
          node --check scripts/ws0-tick-domain-t0.mjs
          node --check scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs
      - name: Re-run qualified T0 control
        run: WS0_TICK_T0_OUTPUT=ws0-tick-domain-t0-regression.json node scripts/ws0-tick-domain-t0.mjs
      - name: Run T4 late-input resimulation oracle
        run: node scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs
      - name: Preserve T0/T4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws0-tick-domain-t4-late-input-resim
          path: |
            ws0-tick-domain-t0-regression.json
            ws0-tick-domain-t4-late-input-resim-oracle.json
          if-no-files-found: ignore
