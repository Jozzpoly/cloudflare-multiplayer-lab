name: WS0 Tick Domain T5 Prop Causal Relay

on:
  pull_request:
    paths:
      - "scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs"
      - "scripts/ws0-tick-domain-t5-prop-causal-relay.mjs"
      - ".github/workflows/ws0-tick-domain-t5-prop-causal-relay.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  tick-domain-t5-prop-causal-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate apparatus
        run: |
          node --check scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs
          node --check scripts/ws0-tick-domain-t5-prop-causal-relay.mjs
      - name: Re-run qualified T4 oracle
        run: WS0_TICK_T4_OUTPUT=ws0-tick-domain-t4-regression.json node scripts/ws0-tick-domain-t4-late-input-resim-oracle.mjs
      - name: Run T5 coupled prop relay
        run: node scripts/ws0-tick-domain-t5-prop-causal-relay.mjs
      - name: Preserve T4/T5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws0-tick-domain-t5-prop-causal-relay
          path: |
            ws0-tick-domain-t4-regression.json
            ws0-tick-domain-t5-prop-causal-relay.json
          if-no-files-found: ignore
