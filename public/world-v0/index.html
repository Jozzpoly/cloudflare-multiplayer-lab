<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Multi_World · Shared Yard V0</title>
  <link rel="stylesheet" href="/world-v0/styles.css">
  <link rel="stylesheet" href="/world-v0/friend-ready.css">
</head>
<body>
  <div id="viewport"></div>

  <section id="boot" class="panel">
    <div class="eyebrow">MULTI_WORLD · SHARED YARD</div>
    <h1>Enter Multi_World</h1>
    <p id="boot-status" aria-live="polite">Loading…</p>
    <div class="inputs">
      <label class="primary-name">Your name <input id="callsign" maxlength="24" autocomplete="nickname" placeholder="Jozz"></label>
      <div class="entry-actions">
        <button id="enter">Enter world</button>
      </div>
      <details id="entry-advanced" class="entry-advanced">
        <summary>Advanced / inspection</summary>
        <div class="entry-advanced-body">
          <label>Room ID <input id="run" maxlength="20" autocomplete="off"></label>
          <button id="inspect-solo" type="button" disabled>Inspect solo</button>
        </div>
      </details>
    </div>
  </section>

  <div id="session-actions" class="session-actions hidden" aria-label="session actions">
    <button id="copy-invite" type="button">Invite friend</button>
    <button id="restart-round" type="button" class="hidden">Restart round</button>
  </div>

  <details id="hud" class="panel hud">
    <summary><span>Diagnostics</span><span class="hud-chevron">⌄</span></summary>
    <div class="hud-body">
      <div><span>network</span><strong id="m-net">idle</strong></div>
      <div><span>ticks</span><strong id="m-ticks">—</strong></div>
      <div><span>exact guard</span><strong id="m-guard">—</strong></div>
      <div><span>corrections</span><strong id="m-corrections">0</strong></div>
      <div><span>rewind latest/max</span><strong id="m-rewind">0 / 0</strong></div>
      <div><span>replay latest/max</span><strong id="m-replay">0 / 0</strong></div>
      <div><span>RTT</span><strong id="m-rtt">—</strong></div>
      <div><span>input lease</span><strong id="m-lease">—</strong></div>
      <div><span>history memory</span><strong id="m-memory">—</strong></div>
      <div><span>frame</span><strong id="m-frame">—</strong></div>
      <button id="copy-evidence">Copy evidence</button>
    </div>
  </details>

  <div id="notice" class="notice hidden"></div>

  <div id="joystick" aria-label="movement joystick">
    <div id="joystick-knob"></div>
  </div>

  <button id="jump-button" type="button" aria-label="jump" disabled>JUMP</button>

  <div id="camera-gimbal" aria-label="camera orbit gimbal">
    <div id="camera-gimbal-knob"></div>
  </div>

  <script type="module" src="/world-v0/friend-ready.js"></script>
</body>
</html>
